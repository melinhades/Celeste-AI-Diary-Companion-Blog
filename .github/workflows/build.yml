name: Build Checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend-compile:
    name: Backend compile (blog-api)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Java 版本取自根 pom.xml 的 java.version（17）
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      # 联网拉依赖；application-local.properties 不参与编译，无需注入
      - name: Compile blog-api
        run: mvn -B -pl blog-api compile

  frontend-segmentation-invariants:
    name: Frontend segmentation invariants
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Run segmentation invariants
        run: node blog-ui/tests/madeline-segmentation-invariants.js
