<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" role="img" aria-label="Pixel-art night on Mount Celeste">
  <title>Mount Celeste · pixel night</title>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#070d24"/>
      <stop offset=".44" stop-color="#182148"/>
      <stop offset=".76" stop-color="#3a3a78"/>
      <stop offset="1" stop-color="#7d5f97"/>
    </linearGradient>
    <linearGradient id="snow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#adbae8"/>
    </linearGradient>
    <radialGradient id="moon" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#ffeece" stop-opacity=".95"/>
      <stop offset="1" stop-color="#ffeece" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="haze" cx=".5" cy="1" r=".85">
      <stop offset="0" stop-color="#d8b4fe" stop-opacity=".34"/>
      <stop offset="1" stop-color="#d8b4fe" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="vig" cx=".5" cy=".45" r=".78">
      <stop offset=".55" stop-color="#000000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000000" stop-opacity=".42"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="320" fill="url(#sky)"/>

  <!-- 星空：闪烁 -->
  <g fill="#ffffff">
    <circle cx="62" cy="38" r="1.5" opacity=".85">
      <animate attributeName="opacity" values=".85;.18;.85" dur="3.2s" begin="-1.1s" repeatCount="indefinite"/>
    </circle>
    <circle cx="140" cy="92" r="1.1" opacity=".55"/>
    <circle cx="196" cy="30" r="1.8" opacity=".9">
      <animate attributeName="opacity" values=".9;.25;.9" dur="2.6s" begin="-0.4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="254" cy="70" r="1" opacity=".45"/>
    <circle cx="308" cy="24" r="1.4" opacity=".8">
      <animate attributeName="opacity" values=".8;.2;.8" dur="4.1s" begin="-2.3s" repeatCount="indefinite"/>
    </circle>
    <circle cx="352" cy="106" r="1.1" opacity=".5"/>
    <circle cx="418" cy="46" r="1.7" opacity=".88">
      <animate attributeName="opacity" values=".88;.22;.88" dur="3.6s" begin="-1.7s" repeatCount="indefinite"/>
    </circle>
    <circle cx="470" cy="88" r="1" opacity=".42"/>
    <circle cx="528" cy="34" r="1.3" opacity=".72">
      <animate attributeName="opacity" values=".72;.16;.72" dur="2.9s" begin="-0.9s" repeatCount="indefinite"/>
    </circle>
    <circle cx="586" cy="72" r="1.1" opacity=".5"/>
    <circle cx="640" cy="20" r="1.6" opacity=".85">
      <animate attributeName="opacity" values=".85;.2;.85" dur="3.9s" begin="-2.8s" repeatCount="indefinite"/>
    </circle>
    <circle cx="692" cy="100" r="1" opacity=".4"/>
    <circle cx="748" cy="52" r="1.4" opacity=".78">
      <animate attributeName="opacity" values=".78;.18;.78" dur="3.4s" begin="-1.4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="806" cy="86" r="1.1" opacity=".48"/>
    <circle cx="856" cy="30" r="1.7" opacity=".88">
      <animate attributeName="opacity" values=".88;.24;.88" dur="2.7s" begin="-2.0s" repeatCount="indefinite"/>
    </circle>
    <circle cx="908" cy="108" r="1" opacity=".42"/>
    <circle cx="1108" cy="36" r="1.5" opacity=".82">
      <animate attributeName="opacity" values=".82;.2;.82" dur="4.4s" begin="-1.9s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1152" cy="96" r="1.1" opacity=".5"/>
    <circle cx="1176" cy="140" r="1.3" opacity=".6"/>
    <circle cx="34" cy="132" r="1.2" opacity=".6"/>
    <circle cx="110" cy="152" r="1" opacity=".4"/>
    <circle cx="266" cy="134" r="1.1" opacity=".45"/>
    <circle cx="452" cy="140" r="1" opacity=".4"/>
    <circle cx="730" cy="132" r="1.2" opacity=".5"/>
    <circle cx="962" cy="128" r="1" opacity=".42"/>
  </g>

  <!-- 亮点：呼吸 -->
  <g fill="#ffffff">
    <path d="M196 22 l1.6 6 6 1.6 -6 1.6 -1.6 6 -1.6 -6 -6 -1.6 6 -1.6 Z" opacity=".85">
      <animate attributeName="opacity" values=".85;.2;.85" dur="3.8s" begin="-1.2s" repeatCount="indefinite"/>
    </path>
    <path d="M856 22 l1.6 6 6 1.6 -6 1.6 -1.6 6 -1.6 -6 -6 -1.6 6 -1.6 Z" opacity=".85">
      <animate attributeName="opacity" values=".85;.25;.85" dur="3.1s" begin="-2.4s" repeatCount="indefinite"/>
    </path>
    <path d="M528 26 l1.4 5 5 1.4 -5 1.4 -1.4 5 -1.4 -5 -5 -1.4 5 -1.4 Z" opacity=".7">
      <animate attributeName="opacity" values=".7;.15;.7" dur="4.6s" begin="-0.7s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- 月亮 -->
  <circle cx="1006" cy="66" r="92" fill="url(#moon)"/>
  <circle cx="1006" cy="66" r="24" fill="#fff7e2"/>
  <circle cx="997" cy="59" r="4" fill="#f0dfc0" opacity=".55"/>
  <circle cx="1013" cy="74" r="3" fill="#f0dfc0" opacity=".45"/>

  <!-- 山岚 -->
  <rect y="140" width="1200" height="180" fill="url(#haze)"/>

  <!-- 远山 -->
  <path d="M0 252 L96 216 L176 240 L268 158 L332 194 L436 104 L512 172 L612 122 L716 200 L800 142 L902 210 L1000 172 L1090 218 L1200 192 L1200 320 L0 320 Z" fill="#2b3062"/>
  <path d="M436 104 L466 146 L436 158 L406 136 Z" fill="url(#snow)" opacity=".92"/>
  <path d="M268 158 L294 192 L268 202 L242 182 Z" fill="url(#snow)" opacity=".85"/>
  <path d="M612 122 L636 156 L612 166 L588 148 Z" fill="url(#snow)" opacity=".8"/>
  <path d="M800 142 L822 174 L800 184 L778 168 Z" fill="url(#snow)" opacity=".8"/>

  <!-- 近山 -->
  <path d="M0 320 L0 286 L188 250 L336 272 L524 182 L704 254 L862 218 L1012 262 L1200 240 L1200 320 Z" fill="#181c44"/>

  <!-- 雪原 -->
  <path d="M0 320 L0 302 L188 292 L336 308 L524 290 L704 306 L862 292 L1012 306 L1200 296 L1200 320 Z" fill="#eef1ff"/>
  <g fill="#ffffff" opacity=".85">
    <circle cx="120" cy="311" r="1.4"/>
    <circle cx="248" cy="304" r="1.2"/>
    <circle cx="398" cy="313" r="1.5"/>
    <circle cx="606" cy="303" r="1.2"/>
    <circle cx="742" cy="312" r="1.4"/>
    <circle cx="902" cy="302" r="1.2"/>
    <circle cx="1068" cy="312" r="1.4"/>
  </g>

  <!-- 登山者 -->
  <g shape-rendering="crispEdges">
    <rect x="516" y="262" width="15" height="6" fill="#d9384c"/>
    <rect x="518" y="268" width="11" height="6" fill="#f2c9a1"/>
    <rect x="516" y="274" width="15" height="12" fill="#4a90d9"/>
    <rect x="516" y="286" width="6" height="6" fill="#2b3a67"/>
    <rect x="525" y="286" width="6" height="6" fill="#2b3a67"/>
  </g>

  <!-- 草莓 -->
  <g transform="translate(170,266)">
    <path d="M0 9 C6 9 6 17 0 27 C-6 17 -6 9 0 9 Z" fill="#e53935"/>
    <path d="M0 9 C3 11 3 17 0 25 L0 9 Z" fill="#ff7a7a" opacity=".5"/>
    <path d="M-7 5 L0 0 L7 5 L0 8 Z" fill="#3fae5a"/>
    <circle cx="-3" cy="14" r="1.1" fill="#9e1b1b"/>
    <circle cx="3" cy="14" r="1.1" fill="#9e1b1b"/>
    <circle cx="0" cy="20" r="1.1" fill="#9e1b1b"/>
  </g>
  <g transform="translate(1064,278) scale(.78)">
    <path d="M0 9 C6 9 6 17 0 27 C-6 17 -6 9 0 9 Z" fill="#e53935"/>
    <path d="M-7 5 L0 0 L7 5 L0 8 Z" fill="#3fae5a"/>
    <circle cx="-3" cy="14" r="1.1" fill="#9e1b1b"/>
    <circle cx="3" cy="15" r="1.1" fill="#9e1b1b"/>
  </g>

  <!-- 暗角 -->
  <rect width="1200" height="320" fill="url(#vig)"/>

  <!-- 落雪：线性飘落 + 轻微横飘，起点在画布外，循环无跳变 -->
  <g fill="#ffffff">
    <circle cx="60" cy="-10" r="1.2" opacity=".7"><animateTransform attributeName="transform" type="translate" values="0 0; 10 350" dur="9s" begin="-1s" repeatCount="indefinite"/></circle>
    <circle cx="130" cy="-10" r="1.6" opacity=".8"><animateTransform attributeName="transform" type="translate" values="0 0; -8 350" dur="11s" begin="-3s" repeatCount="indefinite"/></circle>
    <circle cx="210" cy="-10" r="2" opacity=".65"><animateTransform attributeName="transform" type="translate" values="0 0; 12 350" dur="13s" begin="-5s" repeatCount="indefinite"/></circle>
    <circle cx="290" cy="-10" r="1.4" opacity=".75"><animateTransform attributeName="transform" type="translate" values="0 0; -10 350" dur="15s" begin="-7s" repeatCount="indefinite"/></circle>
    <circle cx="370" cy="-10" r="1.8" opacity=".7"><animateTransform attributeName="transform" type="translate" values="0 0; 9 350" dur="10s" begin="-2s" repeatCount="indefinite"/></circle>
    <circle cx="455" cy="-10" r="1.2" opacity=".8"><animateTransform attributeName="transform" type="translate" values="0 0; -12 350" dur="12s" begin="-4s" repeatCount="indefinite"/></circle>
    <circle cx="540" cy="-10" r="1.6" opacity=".65"><animateTransform attributeName="transform" type="translate" values="0 0; 8 350" dur="14s" begin="-6s" repeatCount="indefinite"/></circle>
    <circle cx="620" cy="-10" r="2" opacity=".72"><animateTransform attributeName="transform" type="translate" values="0 0; -9 350" dur="16s" begin="-8s" repeatCount="indefinite"/></circle>
    <circle cx="700" cy="-10" r="1.3" opacity=".78"><animateTransform attributeName="transform" type="translate" values="0 0; 11 350" dur="9.5s" begin="-1.5s" repeatCount="indefinite"/></circle>
    <circle cx="780" cy="-10" r="1.7" opacity=".68"><animateTransform attributeName="transform" type="translate" values="0 0; -7 350" dur="11.5s" begin="-3.5s" repeatCount="indefinite"/></circle>
    <circle cx="860" cy="-10" r="1.1" opacity=".8"><animateTransform attributeName="transform" type="translate" values="0 0; 12 350" dur="13.5s" begin="-5.5s" repeatCount="indefinite"/></circle>
    <circle cx="940" cy="-10" r="1.5" opacity=".7"><animateTransform attributeName="transform" type="translate" values="0 0; -11 350" dur="15.5s" begin="-7.5s" repeatCount="indefinite"/></circle>
    <circle cx="1020" cy="-10" r="1.9" opacity=".66"><animateTransform attributeName="transform" type="translate" values="0 0; 9 350" dur="10.5s" begin="-2.5s" repeatCount="indefinite"/></circle>
    <circle cx="1100" cy="-10" r="1.3" opacity=".76"><animateTransform attributeName="transform" type="translate" values="0 0; -10 350" dur="12.5s" begin="-4.5s" repeatCount="indefinite"/></circle>
    <circle cx="1160" cy="-10" r="1.7" opacity=".7"><animateTransform attributeName="transform" type="translate" values="0 0; 7 350" dur="14.5s" begin="-6.5s" repeatCount="indefinite"/></circle>
    <circle cx="25" cy="-10" r="1.4" opacity=".74"><animateTransform attributeName="transform" type="translate" values="0 0; 13 350" dur="16.5s" begin="-8.5s" repeatCount="indefinite"/></circle>
  </g>
</svg>
