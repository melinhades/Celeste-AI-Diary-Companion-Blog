<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 90" width="1200" height="90" role="img" aria-label="snow divider">
  <defs>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#9B87F5" stop-opacity="0"/>
      <stop offset=".5" stop-color="#9B87F5" stop-opacity=".85"/>
      <stop offset="1" stop-color="#9B87F5" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <line x1="20" y1="45" x2="1180" y2="45" stroke="url(#line)" stroke-width="1.4"/>

  <!-- 雪线小峰 -->
