<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<title>Celeste · HiresSnow 启动雪花特效还原</title>
<style>
  html, body { margin: 0; height: 100%; background: #05060a; overflow: hidden; }
  #stage { position: fixed; inset: 0; background: #05060a; }
  canvas { display: block; width: 100vw; height: 100vh; }
  #err { position: fixed; left: 12px; top: 10px; color: #ff8080;
         font: 12px/1.6 ui-monospace, Consolas, monospace; white-space: pre-wrap; }
</style>
</head>
<body>
<div id="stage"><canvas id="cv"></canvas></div>
<div id="err"></div>

<script src="./snow-effect.js"></script>
<script>
(function () {
  var CV = document.getElementById('cv');
  var ctx = CV.getContext('2d');
  var errEl = document.getElementById('err');
  var ASSET = '../blog-ui/Atlases/Overworld/';

  var W, H, snow;

  function resize() {
    W = window.innerWidth;
    H = window.innerHeight;
    CV.width = W;
    CV.height = H;
    if (snow) { snow.width = W; snow.height = H; }
  }

  function loadImage(src) {
    return new Promise(function (res, rej) {
      var img = new Image();
      img.onload = function () { res(img); };
      img.onerror = function () { rej(new Error('素材加载失败: ' + src)); };
      img.src = src;
    });
  }

  Promise.all([loadImage(ASSET + 'snow.png'), loadImage(ASSET + 'overlay.png')])
    .then(function (imgs) {
      resize();
      window.addEventListener('resize', resize);

      var snowImg = imgs[0], overlayImg = imgs[1];
      var pattern = ctx.createPattern(overlayImg, 'repeat');

      snow = new CelesteSnow.HiresSnow({
        width: W, height: H,
        overlayAlpha: CelesteSnow.IL.DEFAULT_OVERLAY_ALPHA,
        snowImage: snowImg,
        overlayImage: overlayImg
      });

      var STEP = 1 / 60, acc = 0, last = performance.now();

      function frame(now) {
        var dt = Math.min((now - last) / 1000, 0.25);
        last = now;
        acc += dt;
        while (acc >= STEP) { snow.Update(STEP); acc -= STEP; }

        ctx.setTransform(1, 0, 0, 1, 0, 0);
        ctx.globalCompositeOperation = 'source-over';
        ctx.globalAlpha = 1;
        ctx.fillStyle = '#05060a';
        ctx.fillRect(0, 0, W, H);

        snow.Render(ctx, pattern);
        requestAnimationFrame(frame);
      }
      requestAnimationFrame(frame);
    })
    .catch(function (e) { errEl.textContent = e.message; });
})();
</script>
</body>
</html>
