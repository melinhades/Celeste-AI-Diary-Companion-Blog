<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blog Admin · 管理台</title>
    <link rel="stylesheet" href="../css/admin.css">
</head>
<body>
<canvas id="dreamRibbons" class="dream"></canvas>
<canvas id="dreamStars" class="dream"></canvas>

<header class="header">
    <div class="brand">
        <span class="brand-mark">B</span>
        <span class="brand-name">InstaPix <em>Admin</em></span>
    </div>
    <div class="header-right">
        <span class="header-clock" id="clock"></span>
        <div class="user-chip"><span class="user-dot"></span>管理员</div>
        <button class="btn btn-sm btn-ghost" id="logoutBtn">退出</button>
    </div>
</header>

<aside class="sidebar">
    <div class="side-label">OVERVIEW</div>
    <div class="nav-item active" data-route="dashboard">
        <span class="nav-icon">◈</span><span class="nav-text">仪表盘</span>
    </div>
    <div class="side-label">CONTENT</div>
    <div class="nav-item" data-route="article">
        <span class="nav-icon">▤</span><span class="nav-text">文章管理</span>
    </div>
    <div class="nav-item" data-route="diary">
        <span class="nav-icon">✎</span><span class="nav-text">日记管理</span>
    </div>
    <div class="nav-item" data-route="comment">
        <span class="nav-icon">✉</span><span class="nav-text">评论管理</span>
    </div>
    <div class="nav-item" data-route="taxonomy">
        <span class="nav-icon">❖</span><span class="nav-text">分类与标签</span>
    </div>
    <div class="side-label">OBSERVE</div>
    <div class="nav-item" data-route="ai">
        <span class="nav-icon">⌁</span><span class="nav-text">AI 调用观测</span>
    </div>
    <div class="side-label">SYSTEM</div>
    <div class="nav-item" data-route="user">
        <span class="nav-icon">◉</span><span class="nav-text">用户</span>
    </div>
    <div class="nav-item" data-route="permission">
        <span class="nav-icon">⌘</span><span class="nav-text">权限管理</span>
    </div>
    <div class="sidebar-foot">
        <div>Celeste-style Console</div>
        <div>v1.0 · admin session</div>
    </div>
</aside>

<main class="main">
    <div class="page-head">
        <div>
            <div class="page-title" id="pageTitle">仪表盘</div>
            <div class="page-sub" id="pageSub">内容规模与近期动态</div>
        </div>
    </div>
    <div id="view"></div>
</main>

<div class="drawer-mask" id="drawerMask"></div>
<aside class="drawer" id="drawer">
    <div class="drawer-head">
        <div class="drawer-title" id="drawerTitle"></div>
        <button class="drawer-close" id="drawerClose">✕</button>
    </div>
    <div class="drawer-body" id="drawerBody"></div>
</aside>

<script src="../js/dream-bg.js"></script>
<script src="../js/admin/api.js"></script>
<script src="../js/admin/ui.js"></script>
<script src="../js/admin/pages/dashboard.js"></script>
<script src="../js/admin/pages/article.js"></script>
<script src="../js/admin/pages/diary.js"></script>
<script src="../js/admin/pages/comment.js"></script>
<script src="../js/admin/pages/taxonomy.js"></script>
<script src="../js/admin/pages/ai.js"></script>
<script src="../js/admin/pages/user.js"></script>
<script src="../js/admin/pages/permission.js"></script>
<script src="../js/admin/app.js"></script>
</body>
</html>
