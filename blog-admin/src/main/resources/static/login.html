<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blog Admin · 登录</title>
    <link rel="stylesheet" href="css/admin.css">
    <style>
        body { display: flex; align-items: center; justify-content: center; overflow: hidden; }
        .login-shell { position: relative; z-index: 2; width: 400px; max-width: 92vw; }
        .login-box {
            background: rgba(16, 22, 48, .68);
            backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px);
            border: 1px solid rgba(120, 200, 255, .16);
            padding: 46px 40px 38px;
            position: relative;
            box-shadow: 0 28px 80px rgba(0, 0, 0, .55);
        }
        .login-box::before, .login-box::after {
            content: ""; position: absolute; width: 14px; height: 14px;
            border-color: rgba(125, 251, 208, .55); border-style: solid;
        }
        .login-box::before { top: -1px; left: -1px; border-width: 1px 0 0 1px; }
        .login-box::after { bottom: -1px; right: -1px; border-width: 0 1px 1px 0; }
        .login-mark {
            width: 44px; height: 44px; margin: 0 auto 18px; display: grid; place-items: center;
            background: linear-gradient(135deg, #00c896, #4b7bff);
            color: #071230; font-family: 'PressStart2P', monospace; font-size: 18px;
            box-shadow: 0 0 26px rgba(0, 200, 150, .4);
        }
        .login-box h2 { text-align: center; color: #eaf2ff; font-size: 21px; letter-spacing: 2px; font-weight: normal; }
        .login-box .sub {
            text-align: center; color: rgba(200, 215, 255, .45); font-size: 12px;
            margin: 9px 0 30px; letter-spacing: .5px;
        }
        .form-group { margin-bottom: 18px; display: flex; flex-direction: column; gap: 7px; }
        .form-group label { color: rgba(200, 215, 255, .7); font-size: 12px; letter-spacing: .5px; }
        .form-group input {
            width: 100%; padding: 12px 14px; font-family: var(--font); font-size: 14px;
            background: rgba(255, 255, 255, .05); color: #eaf2ff;
            border: 1px solid rgba(120, 200, 255, .18); outline: none;
            transition: border-color .2s, background .2s;
        }
        .form-group input::placeholder { color: rgba(200, 215, 255, .28); }
        .form-group input:focus { border-color: rgba(125, 251, 208, .65); background: rgba(255, 255, 255, .08); }
        .btn-login {
            width: 100%; padding: 13px; margin-top: 8px; cursor: pointer;
            font-family: var(--font); font-size: 15px; letter-spacing: 4px; color: #fff;
            background: linear-gradient(135deg, #00c896, #4b7bff 65%, #8a5cff);
            border: none; transition: filter .2s, transform .15s;
        }
        .btn-login:hover { filter: brightness(1.12); transform: translateY(-1px); }
        .error-msg {
            display: none; margin-top: 14px; text-align: center;
            color: #ff7a8a; font-size: 12px;
        }
        .login-foot { text-align: center; margin-top: 22px; color: rgba(200, 215, 255, .22); font-size: 11px; }
    </style>
</head>
<body>
<canvas id="dreamRibbons" class="dream"></canvas>
<canvas id="dreamStars" class="dream"></canvas>
<script src="js/dream-bg.js"></script>

<div class="login-shell">
    <div class="login-box">
        <div class="login-mark">B</div>
        <h2>BLOG ADMIN</h2>
        <div class="sub">Celeste-style Content Console</div>
        <form action="/login" method="post">
            <div class="form-group">
                <label>用户名</label>
                <input type="text" name="username" placeholder="请输入用户名" required autofocus autocomplete="off">
            </div>
            <div class="form-group">
                <label>密码</label>
                <input type="password" name="password" placeholder="请输入密码" required>
            </div>
            <button type="submit" class="btn-login">登 录</button>
        </form>
        <div class="error-msg" id="errorMsg"></div>
        <div class="login-foot">SESSION PROTECTED · INSTAPIX</div>
    </div>
</div>
<script>
    if (location.search.indexOf('error') >= 0) {
        var el = document.getElementById('errorMsg');
        el.textContent = '用户名或密码错误，请重试';
        el.style.display = 'block';
    }
</script>
</body>
</html>
