<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="icon/OIP.webp" type="image/webp">
    <title>Login - Celeste Blog</title>
    <link rel="stylesheet" href="css/common.css?v=20261003f">
    <link rel="preload" href="celeste-font-en/Renogare-Regular.otf" as="font" type="font/otf" crossorigin>
    <link rel="preload" href="fonts/NotoSansCJKsc-Medium.otf" as="font" type="font/otf" crossorigin>
    <link rel="stylesheet" href="css/auth.css?v=20261025b">
    <link rel="stylesheet" href="css/login.css?v=20261025a">
</head>
<body>
    <!-- BGM 播放器 -->
    <audio id="bgmPlayer" loop autoplay>
        <source src="bgm/postcard.mp3" type="audio/mpeg">
    </audio>
    <!-- 夜空星星 -->
    <div class="stars"></div>
    <div class="stars2"></div>
    <!-- 雪花粒子系统 -->
    <canvas id="snowCanvas" style="position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:0;"></canvas>
    <div class="snow-strip"></div>
    <!-- 登录加载动画 -->
    <div id="loginLoadingOverlay">
        <div class="loading-madeline"></div>
        <div class="loading-text">LOADING<span class="loading-dots"></span></div>
    </div>
    <script src="js/login-1.js?v=20261015a"></script>
<div class="login-box">
    <img class="login-madeline" :src="avatarSrc" alt="Madeline" ref="madelineAvatar" loading="lazy" decoding="async">
    <h2>WELCOME BACK</h2>
    <p class="sub">This is Madeline. Let's climb together.</p>
    <form id="loginForm" autocomplete="on" novalidate @submit.prevent="submit">
        <div class="form-group">
            <label for="account">Account</label>
            <input class="form-control" type="text" id="account" name="account"
                   placeholder="Enter your account" autocomplete="username"
                   maxlength="64" autofocus required
                   v-model="account"
                   @input="onAccountInput"
                   :class="{valid: account.trim() && !accountError, error: accountError}"
                   ref="accountInput">
        </div>
        <div class="form-group">
            <label for="password">Password</label>
            <input class="form-control" :type="showPw ? 'text' : 'password'" id="password" name="password"
                   placeholder="Enter your password" autocomplete="current-password"
                   maxlength="128" required
                   v-model="password"
                   @keyup="onPwKeyup"
                   @blur="onPwBlur"
                   :class="{error: pwError}"
                   ref="pwInput">
            <button type="button" class="toggle-pw" tabindex="-1" aria-label="Toggle password visibility" @click="togglePw">
                {{ showPw ? '🙈' : '👁' }}
            </button>
            <div class="caps-warning" :class="{show: capsOn}">⚠ Caps Lock is ON</div>
        </div>
        <div v-if="errShow" :key="errKey" class="form-error show">{{ errMsg }}</div>
        <div class="remember-row">
            <label><input type="checkbox" v-model="rememberMe"> Remember me</label>
        </div>
        <button class="btn btn-primary" type="submit" id="loginBtn" :class="{loading: loading}" :disabled="loading">
            <span class="btn-spinner"></span>
            <span class="btn-text">{{ loading ? 'Logging in...' : 'Log In' }}</span>
        </button>
    </form>
    <div class="login-footer">No account yet? <a href="register.html">Sign up</a></div>
</div>
<script src="js/api.js?v=20261002"></script>
<script src="js/vue.global.prod.js?v=20261008a"></script>
<script src="js/snow-bgm.js"></script>
<script src="js/login-2.js?v=20261025c"></script>
</body>
</html>
