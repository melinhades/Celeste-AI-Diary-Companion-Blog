<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="icon/OIP.webp" type="image/webp">
    <title>Login - Celeste Blog</title>
    <link rel="stylesheet" href="css/common.css">
    <link rel="preload" href="celeste-font-en/Renogare-Regular.otf" as="font" type="font/otf" crossorigin>
    <link rel="preload" href="fonts/NotoSansCJKsc-Medium.otf" as="font" type="font/otf" crossorigin>
    <style>
        body { display:flex; align-items:center; justify-content:center; min-height:100vh; background:#050514; padding:20px; }
        /* ===== 夜空：月光晕 + 两层闪烁星星 ===== */
        body::before {
            content:''; position:fixed; inset:0; pointer-events:none; z-index:0;
            background-image:
                radial-gradient(circle at 78% 16%, rgba(180,200,255,.16), transparent 32%),
                radial-gradient(circle at 18% 82%, rgba(90,110,180,.10), transparent 40%);
        }
        .stars, .stars2 { position:fixed; inset:0; pointer-events:none; z-index:0; width:1px; height:1px; background:transparent; }
        .stars {
            box-shadow: 12vw 8vh 0 1px rgba(255,255,255,.8), 34vw 22vh 0 rgba(255,255,255,.5), 58vw 6vh 0 1px rgba(255,255,255,.7),
                        82vw 18vh 0 rgba(255,255,255,.4), 46vw 12vh 0 rgba(255,255,255,.55), 90vw 40vh 0 1px rgba(255,255,255,.6),
                        8vw 34vh 0 rgba(255,255,255,.45), 68vw 30vh 0 rgba(255,255,255,.5), 24vw 46vh 0 1px rgba(255,255,255,.65),
                        94vw 8vh 0 rgba(255,255,255,.4), 52vw 40vh 0 rgba(255,255,255,.35), 16vw 16vh 0 rgba(255,255,255,.5);
            animation:starTwinkle 4.5s ease-in-out infinite;
        }
        .stars2 {
            box-shadow: 20vw 12vh 0 rgba(255,255,255,.5), 42vw 5vh 0 1px rgba(255,255,255,.7), 72vw 22vh 0 rgba(255,255,255,.45),
                        6vw 26vh 0 rgba(255,255,255,.5), 60vw 34vh 0 rgba(255,255,255,.4), 86vw 12vh 0 1px rgba(255,255,255,.6),
                        30vw 38vh 0 rgba(255,255,255,.35), 96vw 30vh 0 rgba(255,255,255,.45), 48vw 24vh 0 rgba(255,255,255,.5),
                        14vw 42vh 0 rgba(255,255,255,.3), 64vw 10vh 0 rgba(255,255,255,.4), 38vw 48vh 0 rgba(255,255,255,.35);
            animation:starTwinkle 6s ease-in-out 1.6s infinite;
        }
        @keyframes starTwinkle { 0%,100%{opacity:.25} 50%{opacity:.9} }
        /* ===== 登录卡片 ===== */
        .login-box {
            background:url('celeste-gui/poempage.webp') center/100% 100% no-repeat;
            border:none; border-radius:0;
            padding:52px 44px 44px;
            width:440px; max-width:100%;
            position:relative; z-index:1;
            filter:drop-shadow(0 8px 32px rgba(0,0,0,.6));
            opacity:0;
            transform:translateX(-120%) rotate(-8deg);
            transition:opacity .8s ease, transform 1s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        .login-box.slide-in { opacity:1; transform:translateX(0) rotate(0deg); }
        .login-box h2 {
            text-align:center; font-size:20px; color:#3a2018;
            font-family:'Renogare','CelesteZH',sans-serif; letter-spacing:2px; margin-bottom:6px;
        }
        .login-box .sub { text-align:center; color:#8a6f5c; font-size:13px; margin-bottom:26px; }
        .login-madeline { display:block; width:64px; height:64px; border-radius:50%; margin:0 auto 14px; border:2px solid #c4a882; box-shadow:0 0 14px rgba(196,168,130,.5); transition:transform .3s; }
        .login-box .form-group { margin-bottom:16px; position:relative; }
        .login-box .form-group label { color:#5a3e36; font-size:13px; }
        .login-box .form-control {
            background:rgba(255,252,245,.75); border:1px solid #c4a882; color:#3a2018;
            font-family:'Renogare','CelesteZH',sans-serif; padding-right:42px;
        }
        .login-box .form-control::placeholder { color:#b09a82; }
        .login-box .form-control:focus {
            border-color:#5a3e36; box-shadow:0 0 10px rgba(196,168,130,.45); background:rgba(255,252,245,.95);
        }
        .login-box .form-control.error { border-color:#c0392b; box-shadow:0 0 10px rgba(192,57,43,.3); }
        .login-box .form-control.valid { border-color:#27ae60; }
        /* 密码可见切换按钮 */
        .toggle-pw {
            position:absolute; right:10px; top:30px; cursor:pointer;
            width:24px; height:24px; display:flex; align-items:center; justify-content:center;
            color:#8a6f5c; font-size:16px; user-select:none; border:none; background:transparent;
        }
        .toggle-pw:hover { color:#5a3e36; }
        /* Caps Lock 提示 */
        .caps-warning {
            display:none; font-size:11px; color:#e67e22; margin-top:4px; font-family:'Renogare','CelesteZH',sans-serif;
        }
        .caps-warning.show { display:block; animation:fadeIn .3s; }
        @keyframes fadeIn { from{opacity:0} to{opacity:1} }
        /* 记住我 */
        .remember-row { display:flex; align-items:center; justify-content:space-between; margin:10px 0 14px; font-size:12px; color:#8a6f5c; }
        .remember-row label { display:flex; align-items:center; gap:6px; cursor:pointer; }
        .remember-row input[type=checkbox] { accent-color:#5a3e36; cursor:pointer; }
        .login-box .btn-primary {
            width:100%; padding:11px 32px; font-size:14px; margin:6px auto 0; display:flex; align-items:center; justify-content:center; gap:8px;
            border:2px solid #c4a882; background:rgba(255,248,240,.8); color:#5a3e36; font-weight:bold;
            border-radius:4px; box-shadow:none;
            font-family:'Renogare','CelesteZH',sans-serif; letter-spacing:2px;
            cursor:pointer; transition:all .25s;
        }
        .login-box .btn-primary:hover:not(:disabled) { background:#c4a882; color:#fff; transform:translateY(-1px); box-shadow:0 4px 12px rgba(196,168,130,.4); }
        .login-box .btn-primary:disabled { opacity:.7; cursor:not-allowed; }
        /* 按钮加载 spinner */
        .btn-spinner {
            width:16px; height:16px; border:2px solid rgba(90,62,54,.3); border-top-color:#5a3e36;
            border-radius:50%; animation:spin .7s linear infinite; display:none;
        }
        .btn-primary.loading .btn-spinner { display:inline-block; }
        @keyframes spin { to{transform:rotate(360deg)} }
        .login-footer { text-align:center; margin-top:18px; font-size:13px; color:#8a6f5c; }
        .login-footer a { color:#5a3e36; font-weight:bold; border-bottom:1px solid #c4a882; }
        .login-footer a:hover { text-shadow:none; color:#3a2018; }
        /* 错误提示动画 */
        .form-error {
            color:#c0392b; font-size:12px; margin-top:6px; display:none;
            padding:8px 12px; background:rgba(192,57,43,.08); border-radius:4px; border-left:3px solid #c0392b;
            font-family:'Renogare','CelesteZH',sans-serif;
        }
        .form-error.show { display:block; animation:shake .4s; }
        @keyframes shake { 0%,100%{transform:translateX(0)} 25%{transform:translateX(-4px)} 75%{transform:translateX(4px)} }
        .snow-strip {
            position:fixed; left:0; right:0; bottom:0;
            height:80px;
            background:url('celeste-areas/snow-front.webp') repeat-x bottom/220px auto;
            animation:snowDrift 45s linear infinite;
            pointer-events:none;
            z-index:2; opacity:.5;
        }
        @keyframes snowDrift { from{background-position-x:0} to{background-position-x:-440px} }
        /* 登录加载动画 */
        #loginLoadingOverlay {
            position:fixed; inset:0; z-index:9999;
            display:flex; flex-direction:column; align-items:center; justify-content:center;
            opacity:0; pointer-events:none; transition:opacity .35s ease;
        }
        #loginLoadingOverlay.show { opacity:1; pointer-events:auto; }
        #loginLoadingOverlay .loading-madeline {
            width:120px; height:120px; position:relative; z-index:1;
            background-size:100% 100%; background-repeat:no-repeat; background-position:center;
            image-rendering:pixelated;
            animation:loadingRun 0.72s steps(9) infinite;
        }
        @keyframes loadingRun {
            0%   { background-image:url('celeste-gui/loading/00.png'); }
            11%  { background-image:url('celeste-gui/loading/01.png'); }
            22%  { background-image:url('celeste-gui/loading/02.png'); }
            33%  { background-image:url('celeste-gui/loading/03.png'); }
            44%  { background-image:url('celeste-gui/loading/04.png'); }
            55%  { background-image:url('celeste-gui/loading/05.png'); }
            66%  { background-image:url('celeste-gui/loading/06.png'); }
            77%  { background-image:url('celeste-gui/loading/07.png'); }
            88%  { background-image:url('celeste-gui/loading/08.png'); }
        }
        #loginLoadingOverlay .loading-text {
            margin-top:20px; color:#ffe36d; position:relative; z-index:1;
            font-family:'Renogare','CelesteZH',sans-serif; font-size:18px; letter-spacing:3px;
            text-shadow:0 0 12px rgba(255,227,109,.4);
        }
        #loginLoadingOverlay .loading-dots::after { content:''; animation:dots 1.5s steps(4, end) infinite; }
        @keyframes dots { 0%{content:''} 25%{content:'.'} 50%{content:'..'} 75%{content:'...'} }
        /* 移动端响应式 */
        @media (max-width: 480px) {
            .login-box { padding:40px 24px 32px; }
            .login-box h2 { font-size:18px; }
        }
    </style>
</head>
<body>
    <!-- BGM 播放器 -->
    <audio id="bgmPlayer" loop autoplay>
        <source src="bgm/postcard.mp3" type="audio/mpeg">
    </audio>
    <!-- 夜空星星 -->
    <div class="stars"></div>
    <div class="stars2"></div>
    <!-- 雪花粒子系统 -->
    <canvas id="snowCanvas" style="position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:0;"></canvas>
    <div class="snow-strip"></div>
    <!-- 登录加载动画 -->
    <div id="loginLoadingOverlay">
        <div class="loading-madeline"></div>
        <div class="loading-text">LOADING<span class="loading-dots"></span></div>
    </div>
    <script>
    if (document.fonts && document.fonts.ready) {
        document.fonts.ready.then(function() {
            document.body.style.visibility = 'hidden';
            void document.body.offsetHeight;
            document.body.style.visibility = '';
        });
    }
    </script>
<div class="login-box">
    <img class="login-madeline" src="celeste-portraits/madeline/normal00.png" alt="Madeline" id="madelineAvatar" loading="lazy" decoding="async">
    <h2>WELCOME BACK</h2>
    <p class="sub">This is Madeline. Let's climb together.</p>
    <form id="loginForm" autocomplete="on" novalidate>
        <div class="form-group">
            <label for="account">Account</label>
            <input class="form-control" type="text" id="account" name="account"
                   placeholder="Enter your account" autocomplete="username"
                   maxlength="64" autofocus required>
        </div>
        <div class="form-group">
            <label for="password">Password</label>
            <input class="form-control" type="password" id="password" name="password"
                   placeholder="Enter your password" autocomplete="current-password"
                   maxlength="128" required>
            <button type="button" class="toggle-pw" id="togglePw" tabindex="-1" aria-label="Toggle password visibility">👁</button>
            <div class="caps-warning" id="capsWarning">⚠ Caps Lock is ON</div>
        </div>
        <div class="form-error" id="errMsg"></div>
        <div class="remember-row">
            <label><input type="checkbox" id="rememberMe"> Remember me</label>
        </div>
        <button class="btn btn-primary" type="submit" id="loginBtn">
            <span class="btn-spinner"></span>
            <span class="btn-text">Log In</span>
        </button>
    </form>
    <div class="login-footer">No account yet? <a href="register.html">Sign up</a></div>
</div>
<script src="js/api.js"></script>
<script src="js/snow-bgm.js"></script>
<script>
    if (localStorage.getItem('token')) location.href = 'index.html';

    // 记住我：回填账号
    const savedAccount = localStorage.getItem('savedAccount');
    if (savedAccount) {
        document.getElementById('account').value = savedAccount;
        document.getElementById('rememberMe').checked = true;
    }

    // 明信片同款出场
    requestAnimationFrame(() => requestAnimationFrame(() => {
        document.querySelector('.login-box').classList.add('slide-in');
    }));

    // ===== 音效 =====
    function playSfx(name) {
        try {
            const a = new Audio('celeste-sounds/' + name);
            a.volume = 0.8; a.currentTime = 0; a.play().catch(() => {});
        } catch (e) {}
    }
    (function () {
        const src = 'celeste-sounds/ui_main_assistmode_whistle_page1.wav';
        const tryPlay = () => { const a = new Audio(src); a.volume = 0.8; return a.play(); };
        tryPlay().catch(() => {
            const h = () => { tryPlay().catch(() => {}); document.removeEventListener('click', h); document.removeEventListener('keydown', h); };
            document.addEventListener('click', h);
            document.addEventListener('keydown', h);
        });
    })();

    // ===== 密码可见切换 =====
    const pwInput = document.getElementById('password');
    const togglePw = document.getElementById('togglePw');
    togglePw.addEventListener('click', () => {
        const isPw = pwInput.type === 'password';
        pwInput.type = isPw ? 'text' : 'password';
        togglePw.textContent = isPw ? '🙈' : '👁';
        pwInput.focus();
    });

    // ===== Caps Lock 检测 =====
    const capsWarning = document.getElementById('capsWarning');
    pwInput.addEventListener('keyup', (e) => {
        if (e.getModifierState && e.getModifierState('CapsLock')) {
            capsWarning.classList.add('show');
        } else {
            capsWarning.classList.remove('show');
        }
    });
    pwInput.addEventListener('blur', () => capsWarning.classList.remove('show'));

    // ===== 实时校验 =====
    const accountInput = document.getElementById('account');
    accountInput.addEventListener('input', () => {
        accountInput.classList.remove('error', 'valid');
        if (accountInput.value.trim()) accountInput.classList.add('valid');
    });

    // ===== 表单提交 =====
    const form = document.getElementById('loginForm');
    const errEl = document.getElementById('errMsg');
    const btn = document.getElementById('loginBtn');
    const madelineAvatar = document.getElementById('madelineAvatar');

    function showErr(msg) {
        errEl.textContent = msg;
        errEl.classList.remove('show');
        void errEl.offsetWidth; // 重置动画
        errEl.classList.add('show');
        madelineAvatar.src = 'celeste-portraits/madeline/sad00.png';
        madelineAvatar.style.transform = 'scale(1.05)';
        setTimeout(() => madelineAvatar.style.transform = '', 300);
    }

    function setLoading(loading) {
        btn.disabled = loading;
        btn.classList.toggle('loading', loading);
        btn.querySelector('.btn-text').textContent = loading ? 'Logging in...' : 'Log In';
    }

    form.addEventListener('submit', (e) => {
        e.preventDefault();
        doLogin();
    });

    function doLogin() {
        const account = accountInput.value.trim();
        const password = pwInput.value;
        errEl.classList.remove('show');

        if (!account) { accountInput.classList.add('error'); accountInput.focus(); showErr('Please enter your account'); return; }
        if (!password) { pwInput.classList.add('error'); pwInput.focus(); showErr('Please enter your password'); return; }

        accountInput.classList.remove('error');
        pwInput.classList.remove('error');
        setLoading(true);
        madelineAvatar.src = 'celeste-portraits/madeline/determined00.png';

        api('/login', 'POST', { account, password }).then(res => {
            setLoading(false);
            if (res.success) {
                const d = res.data;
                const token = typeof d === 'string' ? d : d.token;
                const nickname = typeof d === 'string' ? account : (d.nickname || d.account || account);
                localStorage.setItem('token', token);
                localStorage.setItem('nickname', nickname);
                // 记住我
                if (document.getElementById('rememberMe').checked) {
                    localStorage.setItem('savedAccount', account);
                } else {
                    localStorage.removeItem('savedAccount');
                }
                try { sessionStorage.setItem('justLoggedIn', '1'); } catch (e) {}
                document.querySelector('.login-box').style.display = 'none';
                document.getElementById('loginLoadingOverlay').classList.add('show');
                setTimeout(() => { location.href = 'index.html'; }, 1200);
            } else {
                showErr(res.msg || 'Wrong account or password');
            }
        });
    }
</script>
</body>
</html>
