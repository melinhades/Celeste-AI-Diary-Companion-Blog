<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<title>Celeste Resort · Oshiro</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="icon/OIP.webp" type="image/webp">
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
* { box-sizing:border-box; margin:0; padding:0; }
@font-face { font-family:'Renogare'; src:url('celeste-font-en/Renogare-Regular.otf') format('opentype'); font-display:swap; }
@font-face { font-family:'CelesteZH'; src:url('fonts/NotoSansCJKsc-Medium.otf') format('opentype'); font-display:swap; }
body { min-height:100vh; background:url('celeste-gui/resort-room-native.png') center/cover no-repeat fixed; image-rendering:pixelated; font-family:'Renogare','CelesteZH','Microsoft YaHei',sans-serif; overflow-x:hidden; }
.topbar { position:fixed; top:14px; left:16px; z-index:20; }
.topbar a { display:inline-block; padding:8px 14px; background:rgba(22,34,60,.88); color:#ffe36d; border:2px solid #ffe36d; border-radius:6px; text-decoration:none; font-size:13px; box-shadow:0 0 10px rgba(255,230,109,.35); }
/* 冰山返回主页按钮（同 diary 的 #homePosterBtn） */
#homePosterBtn {
    position:fixed; top:16px; left:16px; z-index:900;
    width:96px; height:96px; padding:0; border:none; background:transparent; cursor:pointer;
    transition:transform .2s, filter .2s;
}
#homePosterBtn img { width:100%; height:100%; object-fit:contain; display:block; }
#homePosterBtn:hover {
    transform:translateY(-2px) scale(1.05);
    filter:
        drop-shadow(1px 0 0 #10101c) drop-shadow(-1px 0 0 #10101c)
        drop-shadow(0 1px 0 #10101c) drop-shadow(0 -1px 0 #10101c)
        drop-shadow(0 0 10px rgba(200,235,255,1)) drop-shadow(0 0 24px rgba(120,190,255,.8));
}
h1 { position:fixed; top:14px; left:50%; transform:translateX(-50%); font-family:'Press Start 2P',monospace; font-size:14px; color:#ffe36d; text-shadow:0 2px 0 rgba(0,0,0,.6); letter-spacing:2px; z-index:20; }
.wrap { max-width:760px; margin:0 auto; padding:86px 20px 160px; }
.oshiro-wrap { text-align:center; margin-bottom:16px; }
.oshiro-wrap img { width:92px; height:92px; object-fit:cover; border-radius:8px; border:2px solid rgba(255,230,109,.5); box-shadow:0 0 16px rgba(255,230,109,.3); }
.balance { display:flex; align-items:center; gap:10px; justify-content:center; margin-bottom:26px; }
.balance img { width:34px; height:34px; image-rendering:pixelated; filter:drop-shadow(0 0 6px rgba(255,107,138,.6)); }
.balance .num { font-family:'Press Start 2P',monospace; font-size:20px; color:#ff6b8a; text-shadow:0 2px 0 rgba(0,0,0,.6); }
.balance .tip { color:rgba(255,255,255,.55); font-size:12px; }
.items { display:grid; grid-template-columns:repeat(auto-fill,minmax(320px,1fr)); gap:16px; }
.item { background:rgba(22,34,60,.88); border:2px solid rgba(255,230,109,.4); border-radius:8px; padding:16px; display:flex; align-items:center; gap:14px; transition:transform .15s, border-color .15s; }
.item:hover { transform:translateY(-3px); border-color:#ffe36d; }
.item img { width:44px; height:44px; image-rendering:pixelated; object-fit:contain; flex-shrink:0; }
.item .info { flex:1; min-width:0; }
.item .name { color:#fff; font-size:15px; margin-bottom:4px; }
.item .desc { color:rgba(255,255,255,.55); font-size:12px; line-height:1.6; }
.item .buy { padding:8px 14px; border:2px solid #ffe36d; border-radius:6px; background:rgba(22,34,60,.9); color:#ffe36d; cursor:pointer; font-size:13px; white-space:nowrap; flex-shrink:0; transition:background .2s; }
.item .buy:hover:not(:disabled) { background:rgba(255,227,109,.25); }
.item .buy:disabled { opacity:.45; cursor:not-allowed; }
.item.owned { border-color:rgba(255,230,109,.75); }
.item.owned .buy { border-color:#7dcf7d; color:#a5e8a5; }
.oshiro-say { margin-top:26px; text-align:center; color:rgba(255,227,109,.85); font-size:13px; min-height:22px; }
#shopMemo { position:fixed; inset:0; z-index:999; background:rgba(4,4,16,.96); display:flex; align-items:center; justify-content:center; flex-direction:column; cursor:pointer; opacity:0; pointer-events:none; transition:opacity .6s ease; }
#shopMemo.show { opacity:1; pointer-events:auto; }
#shopMemo img { max-width:min(92vw,560px); max-height:72vh; border-radius:6px; box-shadow:0 10px 50px rgba(0,0,0,.7); transform:scale(.94); transition:transform .8s cubic-bezier(.2,.8,.3,1); }
#shopMemo.show img { transform:scale(1); }
#shopMemo .memo-card {
    position:relative; max-width:min(92vw,560px); max-height:72vh;
    border-radius:6px; overflow:hidden; box-shadow:0 10px 50px rgba(0,0,0,.7);
    transform:scale(.94); transition:transform .8s cubic-bezier(.2,.8,.3,1);
}
#shopMemo.show .memo-card { transform:scale(1); }
#shopMemo .memo-card img { width:100%; height:100%; display:block; box-shadow:none; border-radius:0; }
#shopMemo .memo-text {
    position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center;
    padding:10% 12%; text-align:center; color:#1a1a1a;
    font-family:'Renogare','CelesteZH',sans-serif; line-height:1.9;
    text-shadow:0 1px 1px rgba(255,255,255,.3);
}
#shopMemo .memo-text .m-line1 { font-size:clamp(14px,2.2vmin,20px); letter-spacing:.08em; }
#shopMemo .memo-text .m-line2 { font-size:clamp(13px,1.8vmin,17px); letter-spacing:.04em; opacity:.92; }
#shopMemo .memo-text .m-line3 { font-size:clamp(13px,1.8vmin,17px); letter-spacing:.04em; opacity:.92; }
#shopMemo .memo-text .m-sign { font-size:clamp(12px,1.6vmin,15px); margin-top:14px; opacity:.82; letter-spacing:.06em; }
#shopMemo .memo-tip { position:absolute; bottom:26px; left:50%; transform:translateX(-50%); color:rgba(255,230,109,.6); font-size:12px; letter-spacing:2px; }

/* ===== Oshiro 对话框（遮罩 fill 铺满） ===== */
#gameDialog {
    position: fixed;
    left: 50%;
    bottom: 66px;
    transform: translateX(-50%) translateY(24px);
    width: min(94vw, 900px);
    min-height: 128px;
    z-index: 950;
    display: flex;
    align-items: center;
    gap: 18px;
    padding: 20px 30px;
    background: url('Atlases/Portraits/textbox/oshiro.png') center / 100% 100% no-repeat;
    opacity: 0;
    pointer-events: none;
    transition: opacity .25s ease, transform .25s ease;
}
#gameDialog.show { opacity: 1; transform: translateX(-50%) translateY(0); pointer-events: auto; }
#gameDialogOverlay { position:absolute; left:0; top:0; width:100%; height:100%; object-fit:fill; pointer-events:none; z-index:1; }
#gameDialogPortrait { width:92px; height:92px; flex-shrink:0; border-radius:6px; overflow:hidden; z-index:2; }
#gameDialogPortrait img { width:100%; height:100%; object-fit:cover; display:block; }
#gameDialogBody { flex:1; min-width:0; z-index:2; }
#gameDialogName { font-family:'Press Start 2P',monospace; color:#ffe36d; font-size:13px; margin-bottom:5px; }
#gameDialogText { font-family:'Renogare','CelesteZH','Microsoft YaHei',sans-serif; color:#fff; font-size:14px; line-height:1.7; word-break:break-word; }

/* ===== 像素 Oshiro ===== */
#pixelOshiro {
    position: fixed;
    top: 60px;
    left: 40px;
    width: 512px;
    height: 512px;
    object-fit: contain;
    object-position: center bottom;
    image-rendering: pixelated;
    z-index: 945;
    cursor: pointer;
    filter: drop-shadow(0 2px 4px rgba(0,0,0,.5));
    user-select: none;
    -webkit-user-drag: none;
}

/* ===== Oshiro 聊天历史框（双击打开） ===== */
#oshiroChatDialog {
    position: fixed;
    right: 12px;
    bottom: 12px;
    width: 380px;
    max-width: 92vw;
    height: 480px;
    z-index: 955;
    background: url('celeste-gui/card_golden.webp') top / 100% 123% no-repeat;
    border: none;
    border-radius: 0;
    display: none;
    flex-direction: column;
    box-shadow: 0 10px 30px rgba(0,0,0,.35);
    overflow: hidden;
}
#oshiroChatDialog.show { display: flex; }
#oshiroChatDialog .chat-header {
    display:flex; align-items:center; gap:10px;
    padding:14px 16px 8px 42px;
    border-bottom:none;
    background:url('celeste-gui/cardtop_golden.webp') center / 100% 100% no-repeat;
    flex-shrink:0;
}
#oshiroChatDialog .chat-header img { width:36px; height:36px; object-fit:cover; border-radius:6px; }
#oshiroChatDialog .chat-title { flex:1; color:#2b2018; font-family:'Renogare','CelesteZH','Microsoft YaHei',sans-serif; font-size:18px; letter-spacing:1px; }
#oshiroChatDialog .close-btn { background:none; border:none; color:rgba(43,32,24,.55); font-size:16px; cursor:pointer; }
#oshiroChatDialog .close-btn:hover { color:#2b2018; }
#oshiroChatMessages { flex:1; overflow-y:auto; padding:14px 16px 10px 42px; display:flex; flex-direction:column; gap:10px; min-height:0; }
.och-msg { max-width:85%; padding:8px 12px; border-radius:10px; font-size:13px; line-height:1.6; word-break:break-word; font-family:'Renogare','CelesteZH','Microsoft YaHei',sans-serif; }
.och-msg.user { align-self:flex-end; background:rgba(74,144,226,.14); color:#2b3a52; border:1px solid rgba(74,144,226,.4); }
.och-msg.assistant { align-self:flex-start; background:transparent; border:none; padding:4px 6px; color:#3a2e2a; }
#oshiroChatDialog .chat-input { display:flex; gap:8px; padding:8px 12px 6px 12px; border-top:1px dashed rgba(58,46,42,.35); flex-shrink:0; }
#oshiroChatDialog .chat-input input { flex:1; padding:8px 10px; border:1px solid rgba(125,207,255,.5); border-radius:6px; background:rgba(125,207,255,.18); color:#2b3a52; font-size:13px; outline:none; font-family:'Renogare','CelesteZH','Microsoft YaHei',sans-serif; }
#oshiroChatDialog .chat-input input:focus { border-color:#7DCFFF; background:rgba(125,207,255,.3); }
#oshiroChatDialog .chat-input input::placeholder { color:rgba(43,58,82,.45); }
#oshiroChatDialog .chat-input button { padding:8px 14px; border:none; border-radius:6px; background:#FFEB3B; color:#111; cursor:pointer; font-size:14px; letter-spacing:1px; font-family:'Renogare','CelesteZH',sans-serif; box-shadow:inset 0 -2px #111111; }
#oshiroChatDialog .chat-input button:hover { background:#ffeb85; }

/* ===== 两侧烟囱烟雾（环境层，位于一切交互元素之下） ===== */
#chimneySmoke { position:fixed; inset:0; pointer-events:none; z-index:1; overflow:hidden; }
#chimneySmoke img {
    position:absolute; image-rendering:pixelated;
    will-change: transform, opacity;
}

/* ===== 煤球精灵（dustCreature 图层叠加） ===== */
#dustSprite {
    position: fixed;
    left: 140px;
    top: 320px;
    z-index: 935;
    cursor: pointer;
    user-select: none;
    -webkit-user-drag: none;
    filter: drop-shadow(0 2px 3px rgba(0,0,0,.45));
}
#dustSprite .dust-inner {
    position: relative;
    width: 100%;
    height: 100%;
    transform-origin: 50% 100%;
    transition: transform .15s ease;
    animation: dustIdle 2.4s ease-in-out infinite;
}
#dustSprite.moving .dust-inner { animation: dustHop .45s ease-in-out infinite; }
#dustSprite.squish .dust-inner { animation: none; transform: scale(1.3, .55); }
#dustSprite img {
    position: absolute;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%);
    image-rendering: pixelated;
    pointer-events: none;
}
@keyframes dustIdle { 0%,100% { transform: scale(1,1); } 50% { transform: scale(1.05,.95); } }
@keyframes dustHop { 0%,100% { transform: translateY(0) scale(1,1); } 50% { transform: translateY(-7px) scale(.95,1.06); } }

/* ===== 心之水晶（默认空心 → 兑换出彩色水晶心） ===== */
.heart-loop {
    animation: heartBob 2.6s ease-in-out infinite;
    filter: drop-shadow(0 0 10px var(--hg-glow, rgba(120,190,255,.78)));
}
@keyframes heartBob { 0%,100% { transform: translateY(0) rotate(0deg); } 50% { transform: translateY(-5px) rotate(2.5deg); } }

/* 获取仪式全屏：暗场 + 放射光 + 心落定 + 命名牌 */
#heartGet {
    position:fixed; inset:0; z-index:2000; display:none;
    align-items:center; justify-content:center; flex-direction:column;
    background:radial-gradient(120% 120% at 50% 45%, #141628 0%, #0a0b18 55%, #04040c 100%);
    opacity:0; transition:opacity .45s ease; cursor:pointer; overflow:hidden;
}
#heartGet.show { display:flex; }
#heartGet.vis { opacity:1; }
#heartGet .hg-rays {
    position:absolute; left:50%; top:50%; width:170vmax; height:170vmax;
    transform:translate(-50%,-50%);
    background:repeating-conic-gradient(from 0deg, rgba(150,200,255,.15) 0deg 4deg, transparent 4deg 14deg);
    -webkit-mask-image:radial-gradient(closest-side, transparent 12%, #000 30%, transparent 72%);
    mask-image:radial-gradient(closest-side, transparent 12%, #000 30%, transparent 72%);
    animation:hgRaySpin 26s linear infinite;
    opacity:0; transition:opacity 1.2s ease 1.75s; pointer-events:none;
}
#heartGet.vis .hg-rays { opacity:1; }
@keyframes hgRaySpin { to { transform:translate(-50%,-50%) rotate(360deg); } }

/* 像素假心：仪式开场先跳动，破成碎片后真心才坠落（位置由 JS 对齐 .hg-heart） */
#hgFakeHeart {
    position:absolute; width:60px; height:60px; image-rendering:pixelated;
    opacity:0; z-index:3; filter:drop-shadow(0 0 10px rgba(160,220,255,.7));
    transform:translate(-50%,-50%);
}
#heartGet.vis #hgFakeHeart { animation:hgFakePulse .42s ease-in-out infinite alternate; }
#heartGet.vis #hgFakeHeart.breaking { animation:hgFakeBreak .2s ease-in forwards; }
@keyframes hgFakePulse {
    from { opacity:1; transform:translate(-50%,-50%) scale(.94); }
    to   { opacity:1; transform:translate(-50%,-50%) scale(1.08); }
}
@keyframes hgFakeBreak {
    0%  { opacity:1; transform:translate(-50%,-50%) scale(1); }
    100% { opacity:0; transform:translate(-50%,-50%) scale(1.35); filter:brightness(3) drop-shadow(0 0 18px rgba(200,240,255,1)); }
}
#hgFakeHeart.gone { display:none; }
/* 碎片层 */
#hgShards { position:absolute; inset:0; overflow:visible; pointer-events:none; z-index:3; }
#hgShards img {
    position:absolute; image-rendering:pixelated;
    filter:drop-shadow(0 0 4px rgba(170,225,255,.85));
    will-change:transform,opacity;
}

#heartGet .hg-heart {
    position:relative; width:112px; height:112px; image-rendering:pixelated; z-index:2;
    opacity:0; transform:scale(.15);
    filter:drop-shadow(0 0 26px var(--hg-glow, rgba(120,190,255,.8))) brightness(1.15);
}
/* 破心（~1.95s）后真心才坠落 */
#heartGet.vis .hg-heart { animation:hgHeartIn .85s cubic-bezier(.2,1.15,.3,1) 1.95s forwards; }
@keyframes hgHeartIn {
    0%   { opacity:0; transform:scale(.15) rotate(-30deg); }
    70%  { opacity:1; transform:scale(1.22) rotate(4deg); }
    100% { opacity:1; transform:scale(1) rotate(0deg); }
}
#heartGet.vis.shake { animation:hgShake .35s linear; }
@keyframes hgShake { 0%,100% { transform:translate(0,0); } 20% { transform:translate(-7px,4px); } 40% { transform:translate(6px,-4px); } 60% { transform:translate(-4px,-3px); } 80% { transform:translate(4px,3px); } }
#heartGet .hg-flash { position:absolute; inset:0; background:#dfe9ff; opacity:0; pointer-events:none; }
#heartGet.vis .hg-flash { animation:hgFlash .5s ease-out 2.45s; }
@keyframes hgFlash { 0% { opacity:.85; } 100% { opacity:0; } }
#heartGet .hg-title {
    margin-top:34px; z-index:2; color:#e8f1ff;
    font-size:clamp(22px, 4.6vw, 34px); letter-spacing:3px;
    text-shadow:0 0 18px var(--hg-glow, rgba(120,190,255,.9)), 0 2px 0 rgba(0,0,0,.7);
    opacity:0; transform:translateY(10px);
    transition:opacity .8s ease 2.75s, transform .8s ease 2.75s;
}
#heartGet .hg-desc {
    margin-top:12px; z-index:2; color:rgba(214,228,255,.72);
    font-size:14px; letter-spacing:2px;
    opacity:0; transition:opacity .8s ease 3.15s;
}
#heartGet.vis .hg-title { opacity:1; transform:translateY(0); }
#heartGet.vis .hg-desc { opacity:1; }
#heartGet .hg-tip {
    position:absolute; bottom:30px; left:50%; transform:translateX(-50%);
    color:rgba(255,230,109,.55); font-size:12px; letter-spacing:3px;
    opacity:0; transition:opacity .6s ease 3.5s;
}
#heartGet.vis .hg-tip { opacity:1; }

/* ===== 悬停提示按钮：idle 指针呼吸，hover 切换图示（右=highlight 左=resort 挂牌） ===== */
.dot-bubble {
    position:fixed; z-index:940; padding:0; border:none; background:transparent;
    cursor:pointer; user-select:none; -webkit-user-drag:none;
}
.dot-bubble .dot-layer {
    position:absolute; display:block; pointer-events:none;
}
.dot-bubble .dot-hover { opacity:0; transition:opacity .15s ease; }
.dot-bubble:hover .dot-idle { opacity:0; }
.dot-bubble:hover .dot-hover { opacity:1; }
/* idle 黑色指针在深墙上加白色光晕，呼吸 = 缩放 + 光晕起伏，锚点为三个黑点(49.6%,71.5%) */
.dot-bubble .dot-idle {
    transform-origin:49.6% 71.5%;
    animation:dotBreathe 2.2s ease-in-out infinite;
    will-change:transform,filter;
}
@keyframes dotBreathe {
    0%,100% { transform:scale(1);     filter:drop-shadow(0 0 1px rgba(255,255,255,.65)); }
    50%     { transform:scale(1.13);  filter:drop-shadow(0 0 4px rgba(255,255,255,.95)); }
}
#dotRight .dot-idle { animation-duration:2.7s; }

</style>
</head>
<body>
<div id="shopMemo">
    <div class="memo-card">
        <img src="Atlases/Memo/memo.png" alt="memo" loading="lazy" decoding="async">
        <div class="memo-text">
            <div class="m-line1">Welcome to the Celestial Resort</div>
            <div class="m-line2">Since our grand opening in 1952</div>
            <div class="m-line3">we have never closed our doors</div>
            <div class="m-sign">— Mr. Oshiro, Proprietor</div>
        </div>
    </div>
    <div class="memo-tip">点击继续</div>
</div>
<button id="homePosterBtn" title="回到主页 · My Mountain" onclick="location.href='index.html'">
    <img src="celeste-gui/mymountain_icon.png" alt="My Mountain" loading="lazy" decoding="async">
</button>

<audio id="bgmPlayer"></audio>

<img id="pixelOshiro" src="celeste-gui/oshiro-appear.gif" alt="Oshiro" title="Oshiro" loading="lazy" decoding="async" style="display:none">

<!-- 白色省略号互动按钮：中 = 召唤 Oshiro，右 = 开场动画 -->
<button class="dot-bubble" id="dotMid" aria-label="召唤 Oshiro" title="召唤 Oshiro">
    <img class="dot-layer dot-idle" src="Atlases/Gui/hover/idle.png" alt="">
    <img class="dot-layer dot-hover" src="Atlases/Gui/hover/resort.png" alt="">
</button>
<button class="dot-bubble" id="dotRight" aria-label="开场动画" title="开场动画">
    <img class="dot-layer dot-idle" src="Atlases/Gui/hover/idle.png" alt="">
    <img class="dot-layer dot-hover" src="Atlases/Gui/hover/highlight.png" alt="">
</button>

<!-- 煤球精灵：图层由 JS 动态叠加 -->
<div id="dustSprite"><div class="dust-inner"></div></div>

<!-- 两侧烟囱烟雾粒子层 -->
<div id="chimneySmoke"></div>

<div id="gameDialog">
    <img id="gameDialogOverlay" src="Atlases/Portraits/textbox/oshiro_overlay.png" alt="" loading="lazy" decoding="async">
    <div id="gameDialogPortrait"><img id="gameDialogPortraitImg" src="Atlases/Portraits/oshiro/normal00.png" alt="Oshiro" loading="lazy" decoding="async"></div>
    <div id="gameDialogBody">
        <div id="gameDialogName">Oshiro</div>
        <div id="gameDialogText"></div>
    </div>
</div>

<!-- Oshiro 聊天历史框 -->
<div id="oshiroChatDialog">
    <div class="chat-header">
        <img id="ochAvatar" src="Atlases/Portraits/oshiro/normal00.png" alt="Oshiro" loading="lazy" decoding="async">
        <span class="chat-title">Oshiro</span>
        <button class="close-btn" id="ochCloseBtn">✕</button>
    </div>
    <div id="oshiroChatMessages"></div>
    <div class="chat-input">
        <input type="text" id="ochInput" placeholder="跟 Oshiro 说点什么...">
        <button id="ochSendBtn">Send</button>
    </div>
</div>

<!-- 商品展示区已预留：后续商品销售方案优化时在此启用 -->
<div class="wrap" id="shopStage"></div>

<!-- 心之水晶获取仪式：暗场 + 放射光 + 破心音效 + 命名牌 -->
<div id="heartGet">
    <div class="hg-rays"></div>
    <div class="hg-flash"></div>
    <img id="hgFakeHeart" src="heartdoor/icon06.png" alt="" loading="lazy" decoding="async">
    <div id="hgShards"></div>
    <img class="hg-heart" id="hgHeartImg" src="celeste-icons/heartgem_outline.png" alt="heart" loading="lazy" decoding="async">
    <div class="hg-title" id="hgTitle"></div>
    <div class="hg-desc" id="hgDesc"></div>
    <div class="hg-tip">点击收下</div>
</div>

<script src="js/api.js"></script>
<script>
    // ===== 音频手势解锁（修复音效不生效） =====
    ['pointerdown', 'keydown'].forEach(function(ev) {
        window.addEventListener(ev, function() { window.__audioGestured = true; }, { once: true });
    });

    var ROOM_POLY_N = [
        [0.104,0.803], [0.104,0.700], [0.149,0.700], [0.149,0.500],

    function recalcRoomGeo() {

                 y: ny * 1600 * roomGeo.scale + roomGeo.oy };

        recalcRoomGeo();
        return ROOM_POLY_N.map(function (p) { return nToXY(p[0], p[1]); });
    }
    function pointInPoly(x, y, poly) {
        var inside = false;
        for (var i = 0, j = poly.length - 1; i < poly.length; j = i++) {
            var xi = poly[i].x, yi = poly[i].y, xj = poly[j].x, yj = poly[j].y;
            if (((yi > y) !== (yj > y)) &&
                (x < (xj - xi) * (y - yi) / ((yj - yi) || 1e-9) + xi)) inside = !inside;

        return inside;

    function boxInRoom(x, y, w, h, poly) {

            { cls:'dot-hover', size:36*DOT_ZOOM, ox:IDLE_ANCHOR.ox, oy:IDLE_ANCHOR.oy }

    function layoutDots() {

            var minL = Math.min.apply(null, boxes.map(function(b){return b.l;}));

    function smokeSpawn(vi) {
        var kind = Math.random() < 0.4 ? 1 : 0;

        el.src = kind ? SMOKE_W : SMOKE_U;

        smokeParts.push({
            el: el, w: kind ? 18 : 11, h: kind ? 9 : 12,
            nx: v.nx + (Math.random() - 0.5) * 5 / 320,
            ny: v.ny + Math.random() * 2 / 200,

            smokeNext[i] -= dt * 1000;
            if (smokeNext[i] <= 0) { smokeSpawn(i); smokeNext[i] = SMOKE_INTERVAL; }
        }
        for (var j = smokeParts.length - 1; j >= 0; j--) {
            var p = smokeParts[j];
            p.age += dt;

    // ===== 破心：像素心碎成 shard.png 碎片四散（噪声爆裂 + 水晶 ping） =====
    function hgCrackSound() {
        try {
            var ctx = window.__shopAC || (window.__shopAC = new (window.AudioContext || window.webkitAudioContext)());
            var dur = 0.4;
            var buf = ctx.createBuffer(1, Math.floor(ctx.sampleRate * dur), ctx.sampleRate);
            var d = buf.getChannelData(0);
            for (var i = 0; i < d.length; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / d.length, 2.4);
            var src = ctx.createBufferSource();
            src.buffer = buf;
            var hp = ctx.createBiquadFilter();
            hp.type = 'highpass'; hp.frequency.value = 2200;
            var g = ctx.createGain(); g.gain.value = 0.4;
            src.connect(hp); hp.connect(g); g.connect(ctx.destination);
            src.start();
            [3200, 2400].forEach(function(f, i) {
                var o = ctx.createOscillator(), og = ctx.createGain();
                o.type = 'triangle';
                o.frequency.setValueAtTime(f, ctx.currentTime);
                o.frequency.exponentialRampToValueAtTime(f * 0.55, ctx.currentTime + 0.25);
                og.gain.setValueAtTime(i ? 0.08 : 0.12, ctx.currentTime);
                og.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.3);
                o.connect(og); og.connect(ctx.destination);
                o.start(); o.stop(ctx.currentTime + 0.32);
            });
        } catch (e) {}
    }

    // 从 (cx,cy) 爆出 14 片碎片，物理与心门破心同参数
    function hgBurst(cx, cy) {
        var layer = document.getElementById('hgShards');
        if (layer) layer.innerHTML = '';
        var pieces = [];
        for (var k = 0; k < 14; k++) {
            var size = 7 + Math.random() * 9;
            var p = document.createElement('img');
            p.src = 'heartdoor/shard.png';
            p.style.width = size + 'px';
            p.style.height = size + 'px';
            var x0 = cx - size / 2, y0 = cy - size / 2;
            p.style.left = x0 + 'px';
            p.style.top = y0 + 'px';
            layer.appendChild(p);
            var ang = Math.random() * Math.PI * 2;
            var spd = 130 + Math.random() * 210;
            pieces.push({
                el: p, x: x0, y: y0, x0: x0, y0: y0,
                vx: Math.cos(ang) * spd,
                vy: Math.sin(ang) * spd - 120,
                rot: Math.random() * 360,
                vr: (Math.random() * 2 - 1) * 720,
                life: 0, ttl: 0.65 + Math.random() * 0.25
            });
        }
        var last = performance.now();
        function tick(now) {
            var dt = Math.min(0.05, (now - last) / 1000);
            last = now;
            var alive = false;
            pieces.forEach(function(p) {
                p.life += dt;
                if (p.life >= p.ttl) { p.el.style.opacity = '0'; return; }
                alive = true;
                p.vy += 950 * dt;
                p.vx *= Math.pow(0.92, dt * 60);
                p.x += p.vx * dt;
                p.y += p.vy * dt;
                p.rot += p.vr * dt;
                var fade = p.life > p.ttl * 0.55
                    ? 1 - (p.life - p.ttl * 0.55) / (p.ttl * 0.45) : 1;
                p.el.style.opacity = String(fade);
                p.el.style.transform = 'translate(' + (p.x - p.x0) + 'px,' + (p.y - p.y0) + 'px) rotate(' + p.rot + 'deg)';
            });
            if (alive) requestAnimationFrame(tick);
            else setTimeout(function() { layer.innerHTML = ''; }, 200);
        }
        requestAnimationFrame(tick);
    }

    function heartGetSequence(cr, count) {
        var el = document.getElementById('heartGet');
        var im = document.getElementById('hgHeartImg');
        var fake = document.getElementById('hgFakeHeart');
        var glow = CRYSTAL_GLOW[cr.color] || CRYSTAL_GLOW.blue;
        im.src = CRYSTAL_ICON[cr.color] || CRYSTAL_ICON.blue;
        el.style.setProperty('--hg-glow', glow);
        document.getElementById('hgTitle').textContent = '· ' + (cr.title || '心之水晶') + ' ·' + (count > 1 ? '（第 ' + count + ' 颗）' : '');
        document.getElementById('hgDesc').textContent = cr.desc || '';
        // 重置破心状态
        fake.classList.remove('breaking', 'gone');
        var sh = document.getElementById('hgShards'); if (sh) sh.innerHTML = '';
        el.classList.remove('shake');
        el.classList.add('show');
        // 假心对齐真心落定位置（布局完成后读几何）
        requestAnimationFrame(function() {
            var r = im.getBoundingClientRect(), er = el.getBoundingClientRect();
            fake.style.left = (r.left - er.left + r.width / 2) + 'px';
            fake.style.top = (r.top - er.top + r.height / 2) + 'px';
            requestAnimationFrame(function() { el.classList.add('vis'); });
        });
        // 专属心音三段式：Intro 入场 → Loop 停留循环 → Outro 收下
        var sfx = heartSfxBase(cr.color);
        var introA = null, loopA = null;
        try {
            introA = new Audio('celeste-sounds/' + sfx + 'intro.wav');
            introA.volume = 0.85;
        } catch (e) {}
        // 假心跳动 ~0.8s → 鼓胀 0.2s → t=1s 爆裂（碎片+音效+震屏）
        setTimeout(function() { fake.classList.add('breaking'); }, 800);
        setTimeout(function() {
            var fr = fake.getBoundingClientRect(), e2 = el.getBoundingClientRect();
            var bx = fr.left - e2.left + fr.width / 2;
            var by = fr.top - e2.top + fr.height / 2;
            fake.classList.add('gone');
            hgBurst(bx, by);
            hgCrackSound();
        }, 1000);
        // 碎片散尽：t=1.95s 真心开始坠落，intro 同步响起
        setTimeout(function() {
            if (window.__audioGestured && introA) introA.play().catch(function() {});
        }, 1950);
        // t=2.8s 真心落定：wow + 震屏，loop 起，允许点击收下
        var canTake = false;
        setTimeout(function() {
            canTake = true;
            fxSound('wow_so_secret.wav', 0.9);
            el.classList.add('shake');
            setTimeout(function() { el.classList.remove('shake'); }, 400);
            try {
                loopA = new Audio('celeste-sounds/' + sfx + 'loop.wav');
                loopA.loop = true;
                loopA.volume = 0.3;
                if (window.__audioGestured) loopA.play().catch(function() {});
            } catch (e) {}
        }, 2800);
        el.onclick = function() {
            if (!el.classList.contains('vis') || !canTake) return;  // 破心/坠落阶段点击不响应
            try { if (introA) introA.pause(); if (loopA) loopA.pause(); } catch (e) {}
            fxSound(sfx + 'outro.wav', 0.85); // Outro：收下
            el.classList.remove('vis');
            setTimeout(function() {
                el.classList.remove('show');
                render();
                // 炼金彩蛋台词：首颗与再炼不同
                showOshiroDialog(count > 1
                    ? '又来炼金啦？这颗心的颜色……是你当时的样子哦，请收好。'
                    : '这颗心……是从你自己的日记里长出来的。请收好。', '可爱');
            }, 480);
        };
    }

                return;
            }
            var reply = (typeof res.data === 'object' && res.data !== null) ? (res.data.message || '') : (res.data || '');
            var emotion = (typeof res.data === 'object' && res.data !== null) ? (res.data.emotion || '默认') : '默认';
            chatHistory.push({role:'assistant', content:reply});
            appendOchMsg('assistant', reply);
            showOshiroDialog(reply, emotion);
        }).catch(function() {
            if (btn) btn.disabled = false;
            var fallback = '诶？信号好像不太好……稍等一下？';
            appendOchMsg('assistant', fallback);
            showOshiroDialog(fallback, '不安');
        });
    }

    // ===== 煤球精灵：图层叠加 + 四处游逛 =====
    (function() {
        var DUST_DIR = 'celeste-gui/dustCreature/';
        var DUST_SCALE = 4; // 统一放大倍率（像素图整数倍才清晰）
        var sprite = document.getElementById('dustSprite');
        var inner = sprite.querySelector('.dust-inner');

        function addLayer(src) {
            var im = new Image();
            im.src = DUST_DIR + src;
            im.addEventListener('load', function() {
                im.style.width = im.naturalWidth * DUST_SCALE + 'px';
                im.style.height = im.naturalHeight * DUST_SCALE + 'px';
            });
            inner.appendChild(im);
            return im;
        }

        // 身体（3帧抖动）+ 质感层（3帧）+ 眼睛（3帧）
        var baseImgs = ['base00.png', 'base01.png', 'base02.png'].map(addLayer);
        var overlayImgs = ['overlay00.png', 'overlay01.png', 'overlay02.png'].map(addLayer);
        var eyeImgs = ['eyes00.png', 'eyes01.png', 'eyes02.png'].map(addLayer);
        var deadImg = addLayer('deadEyes.png');
        deadImg.style.display = 'none';

        // 容器尺寸跟 base 第 0 帧走
        baseImgs[0].addEventListener('load', function() {
            sprite.style.width = baseImgs[0].naturalWidth * DUST_SCALE + 'px';
            sprite.style.height = baseImgs[0].naturalHeight * DUST_SCALE + 'px';
        });

        function showFrame(list, idx) {
            list.forEach(function(im, i) { im.style.display = i === idx ? 'block' : 'none'; });
        }

        // 身体呼吸抖动
        var dustFi = 0;
        setInterval(function() {
            dustFi = (dustFi + 1) % 3;
            showFrame(baseImgs, dustFi);
            showFrame(overlayImgs, dustFi);
        }, 450);

        // 偶尔眨眼/瞟一眼
        setInterval(function() {
            if (dustBusy || Math.random() >= 0.35) return;
            var f = 1 + Math.floor(Math.random() * 2);
            showFrame(eyeImgs, f);
            setTimeout(function() { if (!dustBusy) showFrame(eyeImgs, 0); }, 280);
        }, 2200);

        // ===== 游逛 =====
        var dustBusy = false;
        function dustXY() {
            return { x: parseFloat(sprite.style.left || '140'), y: parseFloat(sprite.style.top || '320') };
        }
        function dustGroundY() {
            return Math.max(60, window.innerHeight - (sprite.offsetHeight || 64) - 10);
        }
        function dustPick() {
            var w = sprite.offsetWidth || 64;
            var maxX = Math.max(20, window.innerWidth - w - 12);
            var minY = 80, maxY = dustGroundY();
            if (Math.random() < 0.7) {
                // 大多数时候贴地小跑
                return { x: 12 + Math.random() * (maxX - 12), y: maxY - Math.random() * 30 };
            }
            return { x: 12 + Math.random() * (maxX - 12), y: minY + Math.random() * (maxY - minY) };
        }
        function dustWander() {
            if (dustBusy) { setTimeout(dustWander, 1200); return; }
            var cur = dustXY(), tgt = dustPick();
            var dist = Math.sqrt(Math.pow(tgt.x - cur.x, 2) + Math.pow(tgt.y - cur.y, 2));
            var dur = Math.max(900, Math.min(6000, dist * (9 + Math.random() * 6)));
            sprite.classList.add('moving');
            sprite.style.transform = tgt.x < cur.x ? 'scaleX(-1)' : '';
            sprite.style.transition = 'left ' + dur + 'ms linear, top ' + dur + 'ms linear';
            sprite.style.left = tgt.x + 'px';
            sprite.style.top = tgt.y + 'px';
            setTimeout(function() {
                sprite.classList.remove('moving');
                sprite.style.transform = '';
                var rest = Math.random() < 0.25 ? 1500 + Math.random() * 2000 : 300 + Math.random() * 900;
                setTimeout(dustWander, rest);
            }, dur + 80);
        }
        setTimeout(dustWander, 1500);

        // ===== 点击：压扁 + 晕倒眼 + 受惊蹦走 =====
        sprite.addEventListener('click', function() {
            if (dustBusy) return;
            dustBusy = true;
            sprite.classList.add('squish');
            showFrame(eyeImgs, -1);
            deadImg.style.display = 'block';
            setTimeout(function() {
                sprite.classList.remove('squish');
                deadImg.style.display = 'none';
                showFrame(eyeImgs, 0);
                var cur = dustXY();
                var w = sprite.offsetWidth || 64;
                var dir = Math.random() < 0.5 ? -1 : 1;
                var runX = Math.max(12, Math.min(window.innerWidth - w - 12, cur.x + dir * (120 + Math.random() * 160)));
                sprite.classList.add('moving');
                sprite.style.transform = runX < cur.x ? 'scaleX(-1)' : '';
                sprite.style.transition = 'left 500ms ease-out';
                sprite.style.left = runX + 'px';
                setTimeout(function() {
                    sprite.classList.remove('moving');
                    sprite.style.transform = '';
                    dustBusy = false;
                }, 520);
            }, 700);
        });
    })();
</script>
