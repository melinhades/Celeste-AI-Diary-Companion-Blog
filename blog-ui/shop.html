<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<title>Celeste Resort · Oshiro</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="favicon.ico" sizes="16x16 32x32 48x48">
    <link rel="icon" href="icon/OIP.webp?v=20261105a" type="image/webp">
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/text-fx.css?v=20261004a">
<link rel="stylesheet" href="css/shop.css?v=20261107a">

</head>
<body>
<div id="shopMemo">
    <div class="memo-card">
        <img src="Atlases/Memo/memo.png" alt="memo" loading="lazy" decoding="async">
        <div class="memo-text">
            <div class="m-line1">Welcome to the Celestial Resort</div>
            <div class="m-line2">Since our grand opening in 1952</div>
            <div class="m-line3">we have never closed our doors</div>
            <div class="m-sign">— Mr. Oshiro, Proprietor</div>
        </div>
    </div>
    <div class="memo-tip">点击继续</div>
</div>
<button id="homePosterBtn" title="回到主页 · My Mountain" onclick="location.href='index.html'">
    <img src="celeste-gui/mymountain_icon.png" alt="My Mountain" loading="lazy" decoding="async">
</button>

<audio id="bgmPlayer"></audio>

<!-- 第三章 lvl_0x-a 大厅：后台 canvas 由 shop.js 按原版 tileset/贴花运行时绘制 -->
<div id="sceneZoom">
    <canvas id="hallCanvas" width="320" height="184"></canvas>
    <canvas id="gameStage"></canvas>
    <img id="pixelOshiro" src="Atlases/Gameplay/characters/oshiro/oshiro41.png" alt="Oshiro" title="Oshiro" loading="lazy" decoding="async" style="display:none">
    <!-- 光照 RT（320×184 半分辨率）：LightingRenderer 的 BaseColor=Black + DarknessAlpha=0.15 压暗，灯位用 destination-out 挖亮 -->
    <canvas id="hallLight"></canvas>
    <!-- BloomRenderer：BloomBase=0 / Strength=1，bloomgradient 以 screen 叠加（Oshiro 聚光 BloomPoint 半径 16；
         灯笼柔光由 .lantern-glow 的 DOM 径向渐变承担，避免 8px BloomPoint 放大成硬边白球） -->
    <canvas id="hallBloom"></canvas>
    <canvas id="introFx"></canvas>
    <!-- lvl_0x-a 的 2 盏 resortLantern：holder 挂架 + lantern00..02 灯体，混合叠放 -->
    <div class="resort-lantern" data-lantern="0">
        <div class="lantern-glow"></div>
        <img class="lantern-holder" src="Atlases/Gameplay/objects/resortLantern/holder.png" alt="" loading="lazy" decoding="async">
        <img class="lantern-body" src="Atlases/Gameplay/objects/resortLantern/lantern00.png" alt="" loading="lazy" decoding="async">
    </div>
    <div class="resort-lantern" data-lantern="1">
        <div class="lantern-glow"></div>
        <img class="lantern-holder" src="Atlases/Gameplay/objects/resortLantern/holder.png" alt="" loading="lazy" decoding="async">
        <img class="lantern-body" src="Atlases/Gameplay/objects/resortLantern/lantern00.png" alt="" loading="lazy" decoding="async">
    </div>
</div>

<!-- 开场演出：点击任意处跳过（仅由前台服务铃按钮触发） -->
<div id="introSkip"><span>点击跳过开场</span></div>

<!-- 白色省略号互动按钮：中 = 前台服务铃（召唤 Oshiro），右 = 留言簿（备忘录） -->
<button class="dot-bubble" id="dotMid" aria-label="摇铃召唤 Oshiro" title="摇铃召唤 Oshiro">
    <img class="dot-layer dot-idle" src="Atlases/Gui/hover/idle.png" alt="">
    <img class="dot-layer dot-hover" src="Atlases/Gui/hover/resort.png" alt="">
</button>
<button class="dot-bubble" id="dotRight" aria-label="打开留言簿" title="打开留言簿">
    <img class="dot-layer dot-idle" src="Atlases/Gui/hover/idle.png" alt="">
    <img class="dot-layer dot-hover" src="Atlases/Gui/hover/highlight.png" alt="">
</button>

<div id="gameDialog">
    <img id="gameDialogOverlay" src="Atlases/Portraits/textbox/oshiro_overlay.png" alt="" loading="lazy" decoding="async">
    <div id="gameDialogPortrait"><img id="gameDialogPortraitImg" src="Atlases/Portraits/oshiro/normal00.png" alt="Oshiro" loading="lazy" decoding="async"></div>
    <div id="gameDialogBody">
        <div id="gameDialogName">Oshiro</div>
        <div id="gameDialogText"></div>
    </div>
</div>

<!-- Oshiro 聊天历史框 -->
<div id="oshiroChatDialog">
    <div class="chat-header">
        <img id="ochAvatar" src="Atlases/Portraits/oshiro/normal00.png" alt="Oshiro" loading="lazy" decoding="async">
        <span class="chat-title">Oshiro</span>
        <button class="close-btn" id="ochCloseBtn">✕</button>
    </div>
    <div id="oshiroChatMessages">
        <div v-for="(m, mi) in ochMessages" :key="mi" :class="'och-msg ' + m.role">{{ m.text }}</div>
    </div>
    <div class="chat-input">
        <input type="text" id="ochInput" placeholder="跟 Oshiro 说点什么...">
        <button id="ochSendBtn">Send</button>
    </div>
</div>

<!-- 水晶之心收集仪式：Poem —— 心/粒子/文字/装饰全部由 #hgFx 画布绘制（透明底，露出房间场景） -->
<div id="heartGet">
    <canvas id="hgFx"></canvas>
    <div class="hg-poem-tip">点击继续</div>
</div>

<script src="js/api.js?v=20261109d"></script>
<script src="js/text-fx.js?v=20261005b"></script>
<script src="js/vue.global.prod.js?v=20261008a"></script>
<script src="js/celeste-hair.js?v=8"></script>
<script src="js/celeste-character.js?v=20261106a"></script>
<script src="js/celeste-dust-bunny.js?v=20261103b"></script>
<script src="js/gapless-audio.js?v=20261028b"></script>
<script src="js/shop.js?v=20261107a"></script>
<script src="js/seed.js?v=20261109b"></script>
</body>
</html>
