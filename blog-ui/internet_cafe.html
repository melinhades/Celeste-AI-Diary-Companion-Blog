<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Celeste · Internet Cafe</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #000; }

  /* === neon 招牌位置/大小（固定值，已对齐背景） === */
  :root {
    --neon-x: 52.6%;    /* 左偏移（招牌中心 X） */
    --neon-y: 20.6%;    /* 顶部偏移（招牌顶部 Y） */
    --neon-w: 39.47%;   /* 宽度（占视口宽度） */
    --neon-h: 46.8%;    /* 高度（占视口高度） */
    --neon-bright: 1.35; /* 亮度 */
    --int-x: 3%;        /* 内部图水平平移（固定值） */
    --int-y: -6.3%;     /* 内部图垂直平移（固定值） */
    --int-s: 0.4;       /* 内部图缩放（固定值） */
  }

  /* === 背景截图充满全屏（新外观图） === */
  #sky {
    position: absolute; inset: 0;
    background: url('Atlases/Gameplay/scenery/internet_cafe_bg2.png') center/cover no-repeat;
    image-rendering: pixelated;
    image-rendering: -moz-crisp-edges;
    image-rendering: crisp-edges;
  }

  /* === 镜头：内外两层共同的父容器；整体 scale 即镜头向近靠（两层同步缩放，相对位置不变） === */
  #world {
    position: fixed; inset: 0;
    transform-origin: 51% 42%;   /* 对准穹顶建筑中心 */
    transition: transform 2.0s cubic-bezier(.55,0,.8,.35) .1s;
  }
  #world.zoomed { transform: scale(1.22); }

  /* === 外观表层：z-index 高于内部层；点击建筑物后透明化，显露出叠在下方的内部 === */
  #camera {
    position: absolute; inset: 0;
    z-index: 2;
    transition: opacity 1.1s ease;
  }
  #camera.entered { opacity: 0; pointer-events: none; }

  /* 建筑物点击热区（穹顶） */
  #buildHotspot {
    position: absolute;
    left: 36%; top: 17%;
    width: 30%; height: 49%;
    z-index: 12; cursor: pointer;
    border-radius: 40% 40% 12% 12%;
  }
  #buildHotspot::after {
    content: '点击进入';
    position: absolute; bottom: -24px; left: 50%;
    transform: translateX(-50%);
    font-family: 'Courier New', monospace;
    font-size: 11px; letter-spacing: 1px;
    color: rgba(200,230,255,.85);
    background: rgba(0,0,0,.6);
    padding: 2px 8px; border-radius: 3px;
    opacity: 0; transition: opacity .2s;
    pointer-events: none; white-space: nowrap;
  }
  #buildHotspot:hover::after { opacity: 1; }

  /* === 内部层：叠在外观表层下方并全屏铺满；表层透明化后直接显露，无四周黑边 === */
  #interior {
    position: absolute; inset: 0;
    z-index: 1;
    pointer-events: none;
    /* 内部图对齐：平移（视口百分比）+ 缩放，用左下角「调整内部图」面板调 */
    transform: translate(var(--int-x), var(--int-y)) scale(var(--int-s));
    transform-origin: 50% 50%;
  }
  #interior.show { pointer-events: auto; }
  #interiorStage {
    position: absolute; inset: 0;
  }
  #interiorImg {
    display: block; width: 100%; height: 100%;
    object-fit: cover;
    image-rendering: pixelated;
    image-rendering: -moz-crisp-edges;
    image-rendering: crisp-edges;
  }
  /* 电视屏区域（图内像素 x44-75 y40-57 → 百分比） */
  #noiseBox {
    position: absolute;
    left: 36.7%; top: 50.6%;
    width: 25.9%; height: 21.6%;
    cursor: pointer;
    overflow: hidden;
  }
  #noiseBox canvas {
    display: block; width: 100%; height: 100%;
    image-rendering: pixelated;
    image-rendering: -moz-crisp-edges;
    image-rendering: crisp-edges;
  }
  #noiseBox:hover { outline: 1px solid rgba(150,220,255,.55); outline-offset: 1px; }

  /* === 招牌周围漂浮粒子（canvas 是替换元素，inset:0 不会拉伸，必须显式 100%） === */
  #sparkleCanvas {
    position: absolute; inset: 0;
    width: 100%; height: 100%;
    z-index: 8;
    pointer-events: none;
  }

  /* === 霓虹招牌逐帧动画 === */
  #neonSign {
    position: absolute;
    left: var(--neon-x);
    top: var(--neon-y);
    width: var(--neon-w);
    height: var(--neon-h);
    transform: translateX(-50%);
    z-index: 10;
    pointer-events: none;
  }
  #neonSign canvas {
    display: block; width: 100%; height: 100%;
    image-rendering: pixelated;
    image-rendering: -moz-crisp-edges;
    image-rendering: crisp-edges;
    /* 调亮 + 饱和 + 霓虹辉光（双层光晕：青+品红） */
    filter:
      brightness(var(--neon-bright))
      saturate(1.25)
      drop-shadow(0 0 3px rgba(80,255,225,.55))
      drop-shadow(0 0 7px rgba(255,80,210,.30));
  }

  /* === TV 热区已并入内部层 #noiseBox === */

  /* === 环境均匀压暗层：亮度逐渐调低至 30%（全屏均匀，不做四周黑角、不完全黑） === */
  #dimLayer {
    position: fixed; inset: 0;
    z-index: 15; pointer-events: none;
    background: #000;
    opacity: 0;
    transition: opacity 1.4s ease;
  }
  #dimLayer.show { opacity: .3; }
</style>
</head>
<body>
  <!-- 镜头：内外两层叠放，整体缩放即镜头向近靠 -->
  <div id="world">
    <!-- 内部层：叠在表层下方并全屏铺满，表层透明化后直接显露 -->
    <div id="interior">
      <div id="interiorStage">
        <img id="interiorImg" src="Atlases/Gameplay/objects/wavedashtutorial/building_back.png" alt="">
        <div id="noiseBox" title="电视"><canvas></canvas></div>
      </div>
    </div>

    <!-- 外观表层：透明化后显露内部 -->
    <div id="camera">
      <!-- 背景：Celeste 游戏截图充满全屏 -->
      <div id="sky"></div>

      <!-- 招牌周围漂浮小粒子 -->
      <canvas id="sparkleCanvas"></canvas>

      <!-- 霓虹招牌（15 帧逐帧动画，位置已固定对齐背景） -->
      <div id="neonSign"><canvas></canvas></div>

      <!-- 建筑物点击热区 -->
      <div id="buildHotspot"></div>
    </div>
  </div>

  <!-- 四周环境压暗层 -->
  <div id="dimLayer"></div>

<script>
/* ============================================================
   1. neon 15 帧逐帧动画（contain 完整显示，不裁切）
   ============================================================ */
(function () {
  var canvas = document.querySelector('#neonSign canvas');
  var ctx = canvas.getContext('2d');
  ctx.imageSmoothingEnabled = false;

  var FRAME_COUNT = 15;
  var basePath = 'Atlases/Gameplay/objects/wavedashtutorial/';
  var frames = [];
  var loaded = 0;

  for (var i = 0; i < FRAME_COUNT; i++) {
    var img = new Image();
    img.onload = function () { loaded++; if (loaded === FRAME_COUNT) startAnim(); };
    img.src = basePath + 'neon_' + String(i).padStart(2, '0') + '.png';
    frames.push(img);
  }

  function resizeCanvas() {
    canvas.width = canvas.clientWidth;
    canvas.height = canvas.clientHeight;
    ctx.imageSmoothingEnabled = false;
  }
  resizeCanvas();
  window.addEventListener('resize', resizeCanvas);

  var frameIdx = 0, lastTime = 0, rafId;
  var FPS = 12;
  var interval = 1000 / FPS;

  function draw(t) {
    rafId = requestAnimationFrame(draw);
    if (t - lastTime < interval) return;
    lastTime = t;

    var img = frames[frameIdx];
    if (img && img.complete && img.naturalWidth > 0) {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      // contain：完整显示整帧（素材透明底，留白无影响）
      var w = img.naturalWidth, h = img.naturalHeight;
      var cw = canvas.width, ch = canvas.height;
      var scale = Math.min(cw / w, ch / h);
      var dw = w * scale, dh = h * scale;
      var dx = (cw - dw) / 2, dy = (ch - dh) / 2;
      ctx.drawImage(img, dx | 0, dy | 0, dw | 0, dh | 0);
    }
    frameIdx = (frameIdx + 1) % FRAME_COUNT;
  }
  function startAnim() { rafId = requestAnimationFrame(draw); }
})();

/* ============================================================
   2. 漂浮粒子：全屏 + 天空加密度（小星点缓慢漂浮 + 闪烁）
   ============================================================ */
(function () {
  var canvas = document.getElementById('sparkleCanvas');
  var ctx = canvas.getContext('2d');
  var W, H;
  function resize() { W = canvas.width = canvas.clientWidth; H = canvas.height = canvas.clientHeight; }
  resize();
  window.addEventListener('resize', resize);

  // 粒子全屏覆盖：5 成全屏均匀、约 3 成集中在天空（页面上半部）、2 成落穹顶建筑核心
  // 百分比坐标
  var FULL = { x: 0, y: 0, w: 1, h: 1 };
  var SKY = { x: 0, y: 0, w: 1, h: 0.55 };
  var CORE = { x: 0.33, y: 0.26, w: 0.36, h: 0.40 };
  function pickZone() {
    var r = Math.random();
    return (r < 0.5) ? FULL : (r < 0.78 ? SKY : CORE);
  }

  var COLORS = ['#ffffff', '#7affe0', '#ff7ad9', '#b98cff', '#8fd4ff', '#fff3a3'];
  var parts = [];

  // ① 闪烁星点：数量翻倍，大量 1px 小星点营造密度
  var STAR_COUNT = 140;
  for (var i = 0; i < STAR_COUNT; i++) {
    var z = pickZone();
    var big = Math.random() < .12;                 // 少数大星芒
    parts.push({
      type: 'star',
      bx: z.x + Math.random() * z.w,
      by: z.y + Math.random() * z.h,
      ampX: (Math.random() * 1.2 + .4) / 100,      // 漂浮幅度（百分比）
      ampY: (Math.random() * 1.0 + .3) / 100,
      spd: Math.random() * .0006 + .0003,          // 漂浮速度
      phase: Math.random() * Math.PI * 2,
      size: big ? 3 : (Math.random() < .45 ? 1 : 2),
      color: COLORS[Math.random() * COLORS.length | 0],
      tw: Math.random() * .004 + .0008,            // 闪烁速度（拉开差异避免齐闪）
      twPhase: Math.random() * Math.PI * 2,
      baseA: .22 + Math.random() * .28
    });
  }

  // ② 漂浮尘埃：缓慢单向漂移 + 左右轻摆，出界回绕，让画面一直有流动感
  var MOTE_COUNT = 28;
  for (var m = 0; m < MOTE_COUNT; m++) {
    parts.push({
      type: 'mote',
      bx: Math.random(),
      by: Math.random(),
      vx: (Math.random() * .000011 + .000005) * (Math.random() < .5 ? -1 : 1), // 百分比/ms
      vy: -(Math.random() * .000008 + .000004),    // 整体缓慢上升（飘尘）
      amp: (Math.random() * .8 + .3) / 100,        // 左右轻摆幅度
      sway: Math.random() * .001 + .0005,
      phase: Math.random() * Math.PI * 2,
      size: Math.random() < .3 ? 3 : 2,
      color: COLORS[Math.random() * COLORS.length | 0],
      tw: Math.random() * .002 + .0008,
      twPhase: Math.random() * Math.PI * 2
    });
  }

  var last = 0;
  function frame(t) {
    var dt = Math.min(t - last, 50) || 16;         // 限幅防止切后台回跳
    last = t;
    ctx.clearRect(0, 0, W, H);
    for (var i = 0; i < parts.length; i++) {
      var p = parts[i];
      var x, y, s;
      if (p.type === 'mote') {
        p.bx += p.vx * dt; p.by += p.vy * dt;
        if (p.bx < -.02) p.bx = 1.02; else if (p.bx > 1.02) p.bx = -.02;
        if (p.by < -.02) p.by = 1.02; else if (p.by > 1.02) p.by = -.02;
        x = (p.bx + Math.sin(t * p.sway + p.phase) * p.amp) * W;
        y = p.by * H;
        ctx.globalAlpha = .22 + .22 * (0.5 + 0.5 * Math.sin(t * p.tw + p.twPhase));
        ctx.fillStyle = p.color;
        ctx.fillRect(x | 0, y | 0, p.size, p.size);
      } else {
        x = (p.bx + Math.sin(t * p.spd + p.phase) * p.ampX) * W;
        y = (p.by + Math.cos(t * p.spd * .8 + p.phase) * p.ampY) * H;
        var a = p.baseA + (.92 - p.baseA) * (0.5 + 0.5 * Math.sin(t * p.tw + p.twPhase));
        ctx.globalAlpha = a;
        ctx.fillStyle = p.color;
        s = p.size;
        // 小十字星芒（像素风：中心方块 + 横竖各延 1px）；1px 只画单点
        ctx.fillRect(x | 0, y | 0, s, s);
        if (s > 1) {
          ctx.fillRect((x - 1) | 0, y | 0, 1, s);
          ctx.fillRect((x + s) | 0, y | 0, 1, s);
          ctx.fillRect(x | 0, (y - 1) | 0, s, 1);
          ctx.fillRect(x | 0, (y + s) | 0, s, 1);
        }
      }
    }
    ctx.globalAlpha = 1;
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();

/* ============================================================
   4. 交互流：
      ① 内部层叠在外观表层下方；点建筑物 → 表层透明化显露内部、
         环境均匀压暗 30%、镜头整体向近靠
      ② 内部电视循环播放 noise00~02
      ③ 点电视 → 镜头不断缩进至 noise 占满全屏（保持 30% 压暗，不黑屏）→ berryos
      Esc → 全部反向恢复
   ============================================================ */
(function () {
  var world = document.getElementById('world');
  var camera = document.getElementById('camera');
  var hotspot = document.getElementById('buildHotspot');
  var interior = document.getElementById('interior');
  var stage = document.getElementById('interiorStage');
  var interiorImg = document.getElementById('interiorImg');
  var noiseBox = document.getElementById('noiseBox');
  var dim = document.getElementById('dimLayer');

  /* ---- 电视屏在 building_back.png（120x79）内的比例坐标 ---- */
  var TV = { x: .367, y: .506, w: .259, h: .216 };
  var tvOrigin = '49.6% 61.4%';

  // 内部图以 cover 铺满全屏；按 cover 实际显示矩形定位 noiseBox，
  // 图片被裁切时电视热区仍精确贴合
  function positionNoise() {
    var iw = interiorImg.naturalWidth || 120;
    var ih = interiorImg.naturalHeight || 79;
    var cw = stage.clientWidth || window.innerWidth;
    var ch = stage.clientHeight || window.innerHeight;
    var s = Math.max(cw / iw, ch / ih);
    var dw = iw * s, dh = ih * s;
    var ox = (cw - dw) / 2, oy = (ch - dh) / 2;
    noiseBox.style.left = (ox + TV.x * dw) + 'px';
    noiseBox.style.top = (oy + TV.y * dh) + 'px';
    noiseBox.style.width = (TV.w * dw) + 'px';
    noiseBox.style.height = (TV.h * dh) + 'px';
    // 电视中心相对 stage 的比例（点电视放大时作 transform-origin）
    var cxr = (ox + (TV.x + TV.w / 2) * dw) / cw * 100;
    var cyr = (oy + (TV.y + TV.h / 2) * dh) / ch * 100;
    tvOrigin = cxr.toFixed(2) + '% ' + cyr.toFixed(2) + '%';
  }
  interiorImg.addEventListener('load', positionNoise);
  window.addEventListener('load', positionNoise);
  window.addEventListener('resize', positionNoise);

  /* ---- noise 3 帧动画（懒启动：进入内部后才播） ---- */
  var canvas = noiseBox.querySelector('canvas');
  var ctx = canvas.getContext('2d');
  var frames = [], animOn = false, noiseIv = null;
  for (var i = 0; i < 3; i++) {
    var nimg = new Image();
    nimg.src = 'Atlases/Gameplay/objects/wavedashtutorial/noise0' + i + '.png';
    frames.push(nimg);
  }
  function resizeNoise() {
    canvas.width = Math.max(1, canvas.clientWidth);
    canvas.height = Math.max(1, canvas.clientHeight);
    ctx.imageSmoothingEnabled = false;
  }
  window.addEventListener('resize', function () { if (animOn) resizeNoise(); });
  var fIdx = 0;
  function noiseTick() {
    if (!animOn) return;
    var img = frames[fIdx];
    if (img && img.complete && img.naturalWidth > 0) {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      // cover：铺满电视屏
      var w = img.naturalWidth, h = img.naturalHeight;
      var cw = canvas.width, ch = canvas.height;
      var s = Math.max(cw / w, ch / h);
      var dw = w * s, dh = h * s;
      ctx.drawImage(img, (cw - dw) / 2 | 0, (ch - dh) / 2 | 0, dw | 0, dh | 0);
    }
    fIdx = (fIdx + 1) % 3;
  }

  /* ---- ① 点建筑物：表层透明化 + 环境压暗 30% + 镜头向近靠 ---- */
  var entered = false;
  var noiseTimer = null;

  hotspot.addEventListener('click', function () {
    if (entered) return;
    entered = true;

    positionNoise();
    camera.classList.add('entered');    // 表层透明化，显露下方内部
    dim.classList.add('show');          // 环境亮度渐降至 30%
    world.classList.add('zoomed');      // 镜头整体向近靠（内外同步）
    interior.classList.add('show');     // 内部可交互

    // 等表层透明化后启动 noise
    noiseTimer = setTimeout(function () {
      resizeNoise();
      animOn = true;
      noiseTick();
      if (!noiseIv) noiseIv = setInterval(noiseTick, 140);   // 约 7fps，只建一次
    }, 1100);
  });

  /* ---- ③ 点电视：镜头不断缩进至 noise 占满全屏 → 保持 30% 压暗直接跳转 ---- */
  var zooming = false;
  noiseBox.addEventListener('click', function () {
    if (zooming) return;
    zooming = true;
    positionNoise();
    var nr = noiseBox.getBoundingClientRect();
    stage.style.transformOrigin = tvOrigin;   // 精确对准电视屏中心
    var s = Math.max(window.innerWidth / nr.width, window.innerHeight / nr.height) * 1.06;
    stage.style.transform = 'scale(' + s.toFixed(3) + ')';
    // 四周保持 30% 压暗，不黑屏；noise 铺满后直接进入 berryos
    setTimeout(function () { location.href = 'berryos.html'; }, 880);
  });

  /* ---- Esc：从内部退回外观（全部过渡反向播放）；点电视放大后禁用 ---- */
  window.addEventListener('keydown', function (e) {
    if (e.key !== 'Escape') return;
    if (zooming || !interior.classList.contains('show')) return;

    camera.classList.remove('entered');   // 表层恢复不透明
    dim.classList.remove('show');         // 环境亮度恢复
    world.classList.remove('zoomed');     // 镜头回位
    interior.classList.remove('show');    // 内部退出可交互
    animOn = false;
    entered = false;
  });
})();
</script>
<script src="js/api.js?v=20261002"></script>
<script src="js/seed.js?v=20261002d"></script>
</body>
</html>
