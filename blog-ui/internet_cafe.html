<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Celeste · Internet Cafe</title>
<link rel="stylesheet" href="css/internet_cafe.css?v=20261106a">
</head>
<body>
  <!-- 统一加载层：与 article / login 同一套夜空加载动画
       （点阵星星 + 雪花画布 + 雪带 + 十帧跑动的 Madeline + LOADING…），
       场景贴图就绪后由 js/page-loading.js 淡出移除 -->
  <div id="pageLoadingOverlay">
    <div class="ld-stars"></div>
    <div class="ld-stars2"></div>
    <canvas id="ldSnowCanvas"></canvas>
    <div class="ld-snow-strip"></div>
    <div class="loading-madeline"><img class="loading-madeline-sprite" src="celeste-gui/loading/loading-sprite.png" alt="" aria-hidden="true" decoding="async" draggable="false"></div>
    <div class="loading-text">LOADING<span class="loading-dots"></span></div>
  </div>

  <!-- 整个房间由画布实时绘制：背景星空 → 瓦片 → 装饰 → 咖啡厅 → Madeline -->
  <canvas id="scene" aria-label="第九章铭记之后的网吧房间：可操控 Madeline 走进网络咖啡厅"></canvas>
  <div class="vignette"></div>

  <div class="hud" id="hud">门外 &middot; 走近咖啡厅</div>
  <div class="tvPrompt" id="tvPrompt">点击屏幕 &middot; 启动 berryOS</div>
  <div class="fade" id="fade"></div>

<script src="js/page-loading.js?v=20261106d"></script>
<script src="js/celeste-hair.js?v=8"></script>

<script src="js/internet_cafe-1.js?v=20261107c"></script>
<script src="js/api.js?v=20261106a"></script>
<script src="js/seed.js?v=20261101c"></script>
</body>
</html>
