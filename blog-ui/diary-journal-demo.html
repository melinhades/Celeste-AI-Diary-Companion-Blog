<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <link rel="icon" href="icon/OIP.webp" type="image/webp">
    <title>Celeste Journal · Demo</title>
    <style>
        @font-face { font-family:'Renogare'; src:url('celeste-font-en/Renogare-Regular.otf') format('opentype'); font-display:swap; }
        @font-face { font-family:'CelesteZH'; src:url('fonts/NotoSansCJKsc-Medium.otf') format('opentype'); font-display:swap; }
        * { margin:0; padding:0; box-sizing:border-box; }
        body {
            min-height:100vh;
            background:radial-gradient(ellipse at 50% 18%, #24345c, #0c0f1e 75%);
            display:flex; flex-direction:column; align-items:center;
            font-family:'Renogare','CelesteZH','Microsoft YaHei',sans-serif;
            color:#fff; padding:28px 16px 150px;
        }
        h1 { font-size:14px; letter-spacing:3px; color:#ffe36d; margin-bottom:20px; text-shadow:0 0 10px rgba(255,227,109,.4); }
        .stage { width:min(94vw, 600px); transition:width .25s ease; }
        .book { position:relative; width:100%; perspective:1800px; }
        .page {
            position:relative; width:100%;
            transition:transform .55s cubic-bezier(.3,.7,.25,1), opacity .5s ease;
            filter:drop-shadow(0 18px 32px rgba(0,0,0,.55));
            will-change:transform, opacity;
        }
        .page img { width:100%; display:block; }
        .page textarea, .page input {
            position:absolute; border:none; outline:none;
            background:transparent; overflow:hidden;
            font-family:'Renogare','CelesteZH','Microsoft YaHei',sans-serif;
            font-size:clamp(11px, 1.28vw, 15px); line-height:1.9;
            color:rgba(64,58,66,.92);
            caret-color:#e6517c;
        }
        .page textarea { resize:none; }
        .page .gridzone {
            position:absolute; display:grid;
            grid-template-columns:repeat(10, 1fr); grid-template-rows:repeat(10, 1fr);
        }
        .page .gridzone i { cursor:pointer; border-radius:2px; transition:background .25s, box-shadow .25s; }
        .page .gridzone i.on { background:rgba(255,214,90,.75); box-shadow:0 0 6px rgba(255,227,109,.8); }
        .nav { display:flex; align-items:center; justify-content:center; gap:22px; margin-top:24px; }
        .nav button {
            border:2px solid #ffe36d; background:rgba(22,34,60,.85); color:#ffe36d;
            width:42px; height:42px; border-radius:50%; font-size:16px; cursor:pointer;
            box-shadow:0 0 8px rgba(255,230,109,.35); transition:transform .2s;
        }
        .nav button:hover { transform:scale(1.1); }
        .dots { display:flex; gap:8px; }
        .dots span { width:8px; height:8px; border-radius:50%; background:rgba(255,255,255,.25); transition:all .3s; cursor:pointer; }
        .dots span.on { background:#ffe36d; box-shadow:0 0 8px rgba(255,227,109,.7); transform:scale(1.25); }
        .panel {
            position:fixed; left:50%; bottom:14px; transform:translateX(-50%);
            background:rgba(12,15,30,.92); border:1px solid rgba(255,227,109,.35);
            border-radius:10px; padding:10px 18px; z-index:50;
            width:min(94vw, 480px); font-size:12px;
            display:flex; flex-direction:column; gap:5px;
        }
        .panel .row { display:flex; align-items:center; gap:12px; }
        .panel label { width:64px; color:#ffe36d; flex-shrink:0; }
        .panel input[type=range] { flex:1; accent-color:#ffe36d; }
        .panel select { flex:1; background:rgba(22,34,60,.9); color:#fff; border:1px solid rgba(255,227,109,.4); border-radius:4px; }
        .panel .mini { border:1px solid #ffe36d; background:transparent; color:#ffe36d; border-radius:4px; padding:3px 10px; cursor:pointer; font-size:11px; }
        #cfgOut { font-family:monospace; color:rgba(255,255,255,.55); font-size:11px; }
    </style>
</head>
<body>
<h1>CELESTE JOURNAL</h1>
<div id="journalApp" style="display:contents">
<div class="stage" id="stage">
    <div class="book" id="book"></div>
    <div class="nav">
        <button id="prevBtn" @click="goto(cur - 1, -1)">◀</button>
        <div class="dots" id="dots">
            <span v-for="(p, i) in pages" :key="i" :class="{on: cur === i}" @click="goto(i, i > cur ? 1 : -1)"></span>
        </div>
        <button id="nextBtn" @click="goto(cur + 1, 1)">▶</button>
    </div>
</div>
<div class="panel">
    <div class="row"><label>本子大小</label><input type="range" id="sizeR" min="0" max="100" v-model.number="sizeVal"></div>
    <div class="row" style="padding-top:6px; border-top:1px dashed rgba(255,227,109,.25);">
        <label>调框</label>
        <select id="fieldSel" v-model.number="sel">
            <option v-for="(f, i) in fieldOpts" :key="i" :value="i">字段{{ i + 1 }} · {{ f.kind }}</option>
        </select>
        <button id="copyCfg" class="mini" @click="copyCfg">{{ copyText }}</button>
    </div>
    <div class="row"><label>X</label><input type="range" id="fX" min="0" max="95" v-model.number="fx" @input="onFieldSlide"></div>
    <div class="row"><label>Y</label><input type="range" id="fY" min="0" max="95" v-model.number="fy" @input="onFieldSlide"></div>
    <div class="row"><label>宽</label><input type="range" id="fW" min="2" max="95" v-model.number="fw" @input="onFieldSlide"></div>
    <div class="row"><label>高</label><input type="range" id="fH" min="1" max="90" v-model.number="fh" @input="onFieldSlide"></div>
    <div class="row"><span id="cfgOut">{{ cfgText }}</span></div>
</div>
</div>
<script src="js/vue.global.prod.js?v=20261008a"></script>
<script>
    const PAGES = [
        { src: 'celeste-journal/spread1.jpg', crop: { x: 0, y: 0, w: 1, h: 1 },
            fields: [
                { kind: 'area', x: .104, y: .244, w: .364, h: .230 },
                { kind: 'area', x: .104, y: .518, w: .364, h: .144 },
                { kind: 'area', x: .527, y: .230, w: .182, h: .396 },
                { kind: 'area', x: .737, y: .230, w: .173, h: .396 }
            ] },
        { src: 'celeste-journal/spread2.jpg', crop: { x: 0, y: 0, w: 1, h: 1 },
            fields: [
                { kind: 'area', x: .104, y: .244, w: .364, h: .230 },
                { kind: 'area', x: .104, y: .518, w: .364, h: .144 },
                { kind: 'line', x: .536, y: .197, w: .364, h: .036 },
                { kind: 'line', x: .536, y: .255, w: .364, h: .036 },
                { kind: 'grid', x: .536, y: .309, w: .378, h: .396 }
            ] },
        { src: 'celeste-journal/spread3.jpg', crop: { x: 0, y: 0, w: 1, h: 1 },
            fields: [
                { kind: 'area', x: .104, y: .230, w: .364, h: .216 },
                { kind: 'area', x: .104, y: .482, w: .364, h: .122 },
                { kind: 'area', x: .536, y: .215, w: .373, h: .216 },
                { kind: 'cols', x: .536, y: .532, w: .373, h: .094, n: 3 }
            ] }
    ];

    const { createApp, ref, computed, watch, onMounted } = Vue;

    const cur = ref(0);
    let busy = false, pageEl = null;
    const imgCache = {};

    function loadImage(src) {
        return new Promise((res) => {
            const i = new Image();
            i.onload = () => res(i);
            i.onerror = () => {
                console.error('素材加载失败，检查文件是否已复制:', src);
                res(null);
            };
            i.src = src;
        });
    }

    function cropToDataURL(img, c) {
        if (!img) return '';
        const cv = document.createElement('canvas');
        const sw = Math.round(img.naturalWidth * c.w), sh = Math.round(img.naturalHeight * c.h);
        cv.width = sw; cv.height = sh;
        cv.getContext('2d').drawImage(img,
            Math.round(img.naturalWidth * c.x), Math.round(img.naturalHeight * c.y), sw, sh,
            0, 0, sw, sh);
        return cv.toDataURL('image/png');
    }

    function buildField(f, fi, idx) {
        const key = 'jd-' + idx + '-' + fi;
        const common = el => {
            el.style.left = (f.x * 100) + '%';
            el.style.top = (f.y * 100) + '%';
            el.style.width = (f.w * 100) + '%';
            el.style.height = ((f.h || .036) * 100) + '%';
        };
        if (f.kind === 'area' || f.kind === 'line') {
            const el = document.createElement(f.kind === 'area' ? 'textarea' : 'input');
            common(el);
            el.value = localStorage.getItem(key) || '';
            el.addEventListener('input', () => localStorage.setItem(key, el.value));
            return el;
        }
        if (f.kind === 'grid') {
            const wrap = document.createElement('div');
            wrap.className = 'gridzone';
            common(wrap);
            const saved = JSON.parse(localStorage.getItem(key) || '[]');
            for (let i = 0; i < 100; i++) {
                const cell = document.createElement('i');
                if (saved.includes(i)) cell.classList.add('on');
                cell.addEventListener('click', () => {
                    cell.classList.toggle('on');
                    const on = [...wrap.children].map((c, ci) => c.classList.contains('on') ? ci : -1).filter(v => v >= 0);
                    localStorage.setItem(key, JSON.stringify(on));
                });
                wrap.appendChild(cell);
            }
            return wrap;
        }
        if (f.kind === 'cols') {
            const wrap = document.createElement('div');
            wrap.style.cssText = 'position:absolute; display:flex; gap:1.5%;';
            common(wrap);
            for (let i = 0; i < f.n; i++) {
                const inp = document.createElement('input');
                inp.style.cssText = 'flex:1; position:static; width:auto; height:100%; border:none; outline:none; background:transparent; font:inherit; color:rgba(64,58,66,.92); caret-color:#e6517c;';
                inp.value = localStorage.getItem(key + '-' + i) || '';
                inp.addEventListener('input', () => localStorage.setItem(key + '-' + i, inp.value));
                wrap.appendChild(inp);
            }
            return wrap;
        }
    }
    async function buildPage(idx) {
        const p = PAGES[idx];
        if (!imgCache[p.src]) imgCache[p.src] = await loadImage(p.src);
        const el = document.createElement('div');
        el.className = 'page';
        const img = document.createElement('img');
        img.src = cropToDataURL(imgCache[p.src], p.crop);
        el.appendChild(img);
        p.fields.forEach((f, fi) => el.appendChild(buildField(f, fi, idx)));
        return el;
    }

    async function goto(idx, dir) {
        if (!pageEl || busy || idx === cur.value || idx < 0 || idx >= PAGES.length) return;
        busy = true;
        const oldEl = pageEl;
        cur.value = idx; // 圆点高亮由 Vue 接管
        const newEl = await buildPage(idx);
        newEl.style.position = 'absolute';
        newEl.style.top = '0'; newEl.style.left = '0'; newEl.style.width = '100%';
        newEl.style.zIndex = 2;
        newEl.style.opacity = '0';
        newEl.style.transform = dir > 0
            ? 'translateX(8%) scale(.96) rotateY(-7deg)'
            : 'translateX(-8%) scale(.96) rotateY(7deg)';
        book.appendChild(newEl);
        requestAnimationFrame(() => requestAnimationFrame(() => {
            newEl.style.opacity = '1';
            newEl.style.transform = 'none';
            oldEl.style.opacity = '0';
            oldEl.style.transform = dir > 0
                ? 'translateX(-8%) scale(.96) rotateY(7deg)'
                : 'translateX(8%) scale(.96) rotateY(-7deg)';
        }));
        setTimeout(() => {
            oldEl.remove();
            newEl.style.position = 'relative';
            newEl.style.zIndex = '';
            pageEl = newEl;
            busy = false;
        }, 580);
    }

    // ===== 调框面板状态交 Vue，实际定位仍写 PAGES + 字段元素样式 =====
    const sizeVal = ref(40);
    const sel = ref(0);
    const fx = ref(0), fy = ref(0), fw = ref(2), fh = ref(1);
    const cfgText = ref('');
    const copyText = ref('复制配置');
    const fieldOpts = computed(() => PAGES[cur.value].fields);
    let stage = null, book = null;

    function applySize() {
        stage.style.width = 'min(94vw, ' + (520 + sizeVal.value * 8) + 'px)';
    }
    watch(sizeVal, applySize);

    function fieldEl(i) { return pageEl ? pageEl.children[1 + i] : null; }

    function syncFieldSliders() {
        const f = PAGES[cur.value].fields[sel.value];
        if (!f) return;
        fx.value = Math.round(f.x * 100);
        fy.value = Math.round(f.y * 100);
        fw.value = Math.round(f.w * 100);
        fh.value = Math.round((f.h || .036) * 100);
        cfgText.value = 'x:' + f.x.toFixed(3) + ' y:' + f.y.toFixed(3) + ' w:' + f.w.toFixed(3) + ' h:' + (f.h || .036).toFixed(3);
    }
    watch(cur, () => { sel.value = 0; syncFieldSliders(); });
    watch(sel, syncFieldSliders);

    function onFieldSlide() {
        const f = PAGES[cur.value].fields[sel.value];
        if (!f) return;
        f.x = fx.value / 100; f.y = fy.value / 100;
        f.w = fw.value / 100; f.h = fh.value / 100;
        const el = fieldEl(sel.value);
        if (el) {
            el.style.left = (f.x * 100) + '%';
            el.style.top = (f.y * 100) + '%';
            el.style.width = (f.w * 100) + '%';
            el.style.height = (f.h * 100) + '%';
        }
        cfgText.value = 'x:' + f.x.toFixed(3) + ' y:' + f.y.toFixed(3) + ' w:' + f.w.toFixed(3) + ' h:' + f.h.toFixed(3);
    }

    function copyCfg() {
        navigator.clipboard.writeText(JSON.stringify(PAGES.map(p => p.fields), null, 1)).then(() => {
            copyText.value = '已复制!';
            setTimeout(() => { copyText.value = '复制配置'; }, 1200);
        });
    }

    function onKey(e) {
        const t = document.activeElement && document.activeElement.tagName;
        if (t === 'TEXTAREA' || t === 'INPUT') return;
        if (e.key === 'ArrowLeft') goto(cur.value - 1, -1);
        if (e.key === 'ArrowRight') goto(cur.value + 1, 1);
    }

    createApp({
        setup() {
            onMounted(async () => {
                stage = document.getElementById('stage');
                book = document.getElementById('book');
                applySize();
                syncFieldSliders();
                window.addEventListener('keydown', onKey);
                pageEl = await buildPage(0);
                book.appendChild(pageEl);
            });
            return {
                pages: PAGES, cur, goto,
                sizeVal, sel, fieldOpts, copyCfg, copyText,
                fx, fy, fw, fh, onFieldSlide, cfgText
            };
        }
    }).mount('#journalApp');
</script>
<script src="js/seed.js?v=20261005a"></script>
</body>
</html>
