<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Celeste · Madeline Singing</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #0b1026; font-family: 'Courier New', monospace; }

  /* 像素艺术缩放：保留硬边 */
  .px {
    image-rendering: pixelated;
    image-rendering: -moz-crisp-edges;
    image-rendering: crisp-edges;
  }

  /* === Celeste 视频当背景（Madeline + 雪夜 + 信息亭，点击电话后播放一次） === */
  #skyVideo {
    position: absolute; inset: 0;
    width: 100%; height: 100%;
    object-fit: cover;
    object-position: center;
    z-index: 1;
    /* 像素艺术保留硬边（视频本身不是像素的，但保持锐利不模糊） */
    image-rendering: pixelated;
    image-rendering: -moz-crisp-edges;
    image-rendering: crisp-edges;
  }

  /* === 镜子房间同款星点层：停留 + 闪烁（不下坠） === */
  #starLayer {
    position: absolute; inset: 0;
    pointer-events: none;
    z-index: 2;
    overflow: hidden;
  }
  #starLayer i {
    position: absolute;
    image-rendering: pixelated;
    image-rendering: -moz-crisp-edges;
    image-rendering: crisp-edges;
    opacity: 0;
    --dur: 3s; --del: 0s;            /* JS 动态覆盖（闪烁时长/延迟） */
    animation: starTwinkle var(--dur,3s) ease-in-out var(--del,0s) infinite;
    filter: drop-shadow(0 0 6px rgba(95,205,228,.6))
            drop-shadow(0 0 12px rgba(48,96,130,.4));
  }
  @keyframes starTwinkle { 0%,100% { opacity: 0; } 50% { opacity: .95; } }

  /* === 可点击的 payphone 精灵 ===
     payphone.png 原始 45×64，放大 4 倍 = 180×256
     位置已与背景视频中的电话对齐 */
  #payphoneHotspot {
    position: absolute;
    left: 76.15%; bottom: 20.52%;
    width: 180px; height: 256px;
    z-index: 10;
    cursor: pointer;
    transition: transform .15s, filter .15s;
  }
  /* 点击播放后：按钮图层沉到视频下面（动画在背景视频里发生） */
  #payphoneHotspot.played { z-index: 0; pointer-events: none; }
  #payphoneHotspot .receiver {
    position: absolute; inset: 0;
    background: url('Atlases/Gameplay/scenery/payphone.png') center/contain no-repeat;
    image-rendering: pixelated;
    image-rendering: -moz-crisp-edges;
    image-rendering: crisp-edges;
    transform-origin: 50% 100%;
    transition: transform .25s ease-in-out;
  }
  #payphoneHotspot:hover { filter: brightness(1.15) drop-shadow(0 0 8px rgba(255,220,120,.55)); }
  #payphoneHotspot:hover .receiver { transform: translateY(-4px) rotate(-2deg); }
  #payphoneHotspot:active .receiver { transform: translateY(0) rotate(1deg); }
  #payphoneHotspot::after {
    content: '点击电话 · listen to Madeline sing';
    position: absolute; bottom: -28px; left: 50%;
    transform: translateX(-50%);
    font-size: 11px; letter-spacing: 1px;
    color: rgba(255,235,200,.85);
    background: rgba(0,0,0,.65);
    padding: 3px 9px; border-radius: 3px;
    opacity: 0; transition: opacity .2s;
    pointer-events: none; white-space: nowrap;
  }
  #payphoneHotspot:hover::after { opacity: 1; }

  /* === 标题文字 === */
  #pageTitle {
    position: absolute; top: 20px; left: 50%;
    transform: translateX(-50%);
    font-size: 14px; letter-spacing: 4px;
    color: rgba(255,220,200,.65);
    text-shadow: 0 0 8px rgba(255,180,120,.45), 0 0 2px rgba(0,0,0,.9);
    z-index: 20; pointer-events: none; text-align: center;
  }
  #pageTitle .sub { font-size: 10px; letter-spacing: 2px; opacity: .65; margin-top: 4px; }
</style>
</head>
<body>
  <!-- Celeste 视频当背景（初始静止，点击电话后播放一次并停在最终帧） -->
  <video id="skyVideo" muted playsinline preload="auto"></video>

  <!-- 镜子房间同款星点（停留闪烁，铺满屏幕） -->
  <div id="starLayer"></div>

  <!-- 标题 -->
  <div id="pageTitle">
    MADELINE SINGING · PAYPHONE
    <div class="sub">celeste · click the payphone to hear her sing</div>
  </div>

  <!-- 可点击的 payphone 精灵 -->
  <div id="payphoneHotspot" class="px" tabindex="0" role="button" aria-label="Play payphone animation">
    <div class="receiver"></div>
  </div>

<script>
/* ============================================================
   1. 镜子房间同款星点：停留 + 闪烁（铺满屏幕，不下坠）
      素材：Atlases/Gameplay/bgs/02/stars/ 的 a/b/c × 4 帧
   ============================================================ */
(function bgStars() {
  var layer = document.getElementById('starLayer');
  if (!layer) return;

  var DIR = 'Atlases/Gameplay/bgs/02/stars/';
  var TYPES = ['a', 'b', 'c'];
  var FRAMES = 4;
  // 预加载 12 张 PNG + 缓存 background url 字符串
  var cache = {};
  TYPES.forEach(function (t) {
    cache[t] = [];
    for (var i = 0; i < FRAMES; i++) {
      var src = DIR + t + String(i).padStart(2, '0') + '.png';
      cache[t].push('url("' + src + '") center / 100% 100% no-repeat');
      var im = new Image(); im.src = src;
    }
  });

  var STAR_COUNT = 70;            // 铺满屏幕
  var SIZE_MIN = 20, SIZE_MAX = 56;

  function makeStar() {
    var t = TYPES[Math.floor(Math.random() * TYPES.length)];
    var el = document.createElement('i');
    var size = SIZE_MIN + Math.random() * (SIZE_MAX - SIZE_MIN);
    el.style.width = el.style.height = size + 'px';
    el.style.left = (Math.random() * 100).toFixed(2) + '%';
    el.style.top = (Math.random() * 100).toFixed(2) + '%';
    el.style.background = cache[t][Math.floor(Math.random() * FRAMES)];
    // 闪烁节奏：2.5–6.5s，负 delay 让各点处于随机相位（入场即遍布全屏）
    var dur = 2.5 + Math.random() * 4;
    el.style.setProperty('--dur', dur.toFixed(2) + 's');
    el.style.setProperty('--del', (-Math.random() * dur).toFixed(2) + 's');
    // 逐帧切图（和镜子房间同款：160–320ms 循环切 4 帧）
    var frameIdx = Math.floor(Math.random() * FRAMES);
    var interval = setInterval(function () {
      if (!el.parentNode) { clearInterval(interval); return; }
      frameIdx = (frameIdx + 1) % FRAMES;
      el.style.background = cache[t][frameIdx];
    }, 160 + Math.random() * 160);
    layer.appendChild(el);
  }

  for (var i = 0; i < STAR_COUNT; i++) makeStar();
})();

/* ============================================================
   1b. 视频背景：fetch→blob URL 绕过 Python SimpleHTTP 不支持 Range
      初始静止显示首帧，点击电话后才播放（无 loop，停在最终帧）
   ============================================================ */
(function videoBg() {
  var v = document.getElementById('skyVideo');
  if (!v) return;
  var SRC = 'Atlases/Gameplay/scenery/payphone_bg.mp4';

  // fetch 整段视频成 blob 再交给 video（Python SimpleHTTP 不发 206，直连会 ABORTED）
  fetch(SRC).then(function (r) { return r.blob(); }).then(function (blob) {
    v.src = URL.createObjectURL(blob);  // 设 src 自动 load，静止显示首帧
  }).catch(function () {
    v.src = SRC;  // 回退：直连（正式服务器支持 Range 时能用）
  });
})();

/* ============================================================
   2. payphone 点击：背景视频播放一次并停在最终帧；
      按钮图层沉到视频下面（动画在背景发生）
   ============================================================ */
(function wirePayphone() {
  var pp = document.getElementById('payphoneHotspot');
  var v = document.getElementById('skyVideo');
  var started = false;

  function start() {
    if (started) return;
    started = true;
    pp.classList.add('played');   // 图层下沉到视频之下
    v.muted = false;              // 用户点击手势内解除静音，听 Madeline 唱歌
    var p = v.play();             // 无 loop：播完自动停在最终帧
    if (p && p.catch) p.catch(function () {});
  }

  pp.addEventListener('click', start);
  pp.addEventListener('keydown', function (e) {
    if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); start(); }
  });
})();
</script>
<script src="js/api.js?v=20261002"></script>
<script src="js/seed.js?v=20261002d"></script>
</body>
</html>
