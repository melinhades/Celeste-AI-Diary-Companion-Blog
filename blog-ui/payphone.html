<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="icon" href="icon/OIP.webp" type="image/webp">
<title>Celeste · Madeline Singing</title>
<link rel="stylesheet" href="css/payphone.css?v=20261015a">
</head>
<body>
  <!-- Celeste 视频当背景（初始静止，点击电话后播放一次并停在最终帧） -->
  <video id="skyVideo" muted playsinline preload="auto"></video>

  <!-- 镜子房间同款星点（停留闪烁，铺满屏幕） -->
  <div id="starLayer"></div>

  <!-- 标题 -->
  <div id="pageTitle">
    MADELINE SINGING · PAYPHONE
    <div class="sub">celeste · click the payphone to hear her sing</div>
  </div>

  <!-- 可点击的 payphone 精灵 -->
  <div id="payphoneHotspot" class="px" tabindex="0" role="button" aria-label="Play payphone animation"
       :class="{played: started}" @click="start"
       @keydown.enter.prevent="start" @keydown.space.prevent="start">
    <div class="receiver"></div>
  </div>

<script src="js/vue.global.prod.js?v=20261008a"></script>
<script src="js/payphone.js?v=20261015a"></script>
<script src="js/api.js?v=20261002"></script>
<script src="js/seed.js?v=20261028b"></script>
</body>
</html>
