<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="icon/OIP.webp" type="image/webp">
    <title>AI 圆桌会议 · Celeste Blog</title>
    <link rel="stylesheet" href="css/common.css?v=20261003e">
    <link rel="stylesheet" href="css/text-fx.css?v=20261004a">
    <link rel="stylesheet" href="css/roundtable.css?v=20261015a">
</head>
<body>
    <canvas id="snowCanvas" style="position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:1;"></canvas>

    <header class="header">
        <div class="container header-inner">
            <a href="index.html" class="logo"><img src="celeste-gui/logo.webp" alt="Celeste" loading="lazy" decoding="async"></a>
            <nav class="nav">
                <a href="index.html" class="nav-link">Home</a>
                <a href="archives.html" class="nav-link">Archives</a>
                <a href="diary.html" class="nav-link nav-diary-btn" title="Diary with Madeline">
                    <img src="celeste-gui/journal.png" alt="Diary" loading="lazy" decoding="async">
                </a>
                <a href="shop.html" class="nav-link nav-diary-btn" title="Celeste Resort · Oshiro">
                    <img src="Atlases/Gui/menu/play.png" alt="Shop" loading="lazy" decoding="async">
                </a>
                <a href="roundtable.html" class="nav-link nav-chair chair-here" title="AI 圆桌会议">🪑</a>
            </nav>
            <div class="header-right" id="headerRight"></div>
        </div>
    </header>

    <div class="rt-wrap">
        <!-- 未登录 -->
        <div class="rt-login-tip" id="loginTip" v-if="!loggedIn">
            请先<a href="login.html" style="color:#ffe36d">登录</a>，才能召开 AI 圆桌会议。
        </div>

        <!-- 视图 1：创建会议 -->
        <div class="view" id="setupView" :class="{on: loggedIn && view === 'setup'}">
            <div class="rt-title">🪑 AI 圆桌会议 <span style="font-size:12px;color:rgba(200,210,255,.4);font-weight:400;">demo</span></div>
            <div class="rt-sub">抛出一个议题，让 Madeline、Theo、Granny、Badeline 和 Oshiro 围坐讨论，你来插话——散场时，众人会按这场讨论的成色端出一盘「成果派」。</div>

            <!-- 全站讨论大厅（Task 8 接入 /live 数据，默认隐藏；容器先立，独立滚动） -->
            <div class="rt-panel" id="livePanel" style="display:none;">
                <div class="sugg-head">
                    <span class="sugg-title">🔴 全站正在讨论</span>
                    <span class="sugg-sub" id="liveSub">点卡片以观察者身份旁听</span>
                    <span style="flex:1"></span>
                </div>
                <div class="live-list" id="liveList"></div>
            </div>

            <div class="rt-panel">
                <div class="rt-label" style="margin-bottom:8px;">今天想讨论什么议题？</div>
                <textarea id="topicInput" maxlength="200" placeholder="例如：我手里有两个 offer，一个稳定但无聊，一个有风险但成长快，该怎么选？" v-model="topic" @keydown.ctrl.enter="start" @keydown.meta.enter="start"></textarea>
                <div class="rt-row">
                    <span class="rt-label" style="color:rgba(200,210,255,.55);font-size:12px;">自动讨论至众人形成共识，可随时结束</span>
                    <span style="flex:1"></span>
                    <button class="btn-primary" id="startBtn" @click="start">召开会议</button>
                </div>
                <div style="margin-top:14px;">
                    <span class="rt-label">出席席位：</span>
                    <span id="seatPreview" style="font-size:12px;color:rgba(200,210,255,.6);"></span>
                </div>
            </div>

            <div class="sugg-head" style="justify-content:flex-end; margin-bottom:10px;">
                <button class="btn-ghost" id="suggRefresh" style="padding:6px 14px;">换一批</button>
            </div>
            <div id="suggList"><div class="sugg-loading"><div class="sugg-running"></div>正在为你挑选话题…</div></div>

            <div class="hist-title" id="histTitle">📜 历史会议（本机记录）</div>
            <div id="histList"><div class="hist-empty">还没有会议记录。</div></div>
        </div>

        <!-- 视图 2：会议进行 / 回放 -->
        <div class="view" id="stageView" :class="{on: view === 'stage'}">
            <span class="back-link" id="backLink"><img src="Atlases/Gui/menu/exit.png" alt="返回"></span>
            <div class="studio" id="studio" :data-tab="tab">
                <div class="studio-topic">
                    <div class="stage-head">
                        <div style="min-width:0;">
                            <div class="t-topic" id="stageTopic"></div>
                            <div class="t-meta" id="stageMeta"></div>
                        </div>
                        <button class="btn-history" id="historyBtn" disabled>📜 历史记录</button>
                        <button class="btn-ghost" id="participateBtn" style="display:none;flex:none;">✋ 转为参与</button>
                        <button class="btn-ghost" id="stopBtn" style="display:none;flex:none;">结束会议</button>
                    </div>
                </div>
                <div class="studio-seats">
                    <div class="seats" id="seats"></div>
                </div>
                <div class="studio-main rt-panel">
                    <div class="scene-wrap" id="sceneWrap">
                        <canvas class="scene-layer" id="sceneCanvas" width="1152" height="720"></canvas>
                        <div class="scene-scrim"></div>
                        <div id="transcript"></div>
                        <div class="interject-row" id="interjectRow" style="display:none;">
                            <input type="text" id="interjectInput" maxlength="300" placeholder="以「你」的身份插一句话，下一个发言间隙插入…（Enter 发送）" autocomplete="off">
                            <button class="btn-primary" id="interjectBtn" style="padding:0 18px;">插话</button>
                        </div>
                    </div>
                    <div id="resultArea"></div>
                </div>
                <div class="studio-side">
                    <div class="pulse-panel">
                        <div class="pulse-head">🎯 共识雷达</div>
                        <div class="pulse-focus" id="pulseFocus">等待讨论展开…</div>
                        <div class="pulse-block">
                            <div class="pulse-sub ok">🤝 正在形成的共识</div>
                            <ul class="pulse-list" id="consensusList"></ul>
                        </div>
                        <div class="pulse-block">
                            <div class="pulse-sub no">⚔️ 仍然存在的分歧</div>
                            <ul class="pulse-list" id="disagreeList"></ul>
                        </div>
                    </div>
                </div>
            </div>
            <div class="studio-tabs" id="studioTabs">
                <button type="button" data-tab="seats" :class="{on: tab === 'seats'}" @click="tab = 'seats'">席位</button>
                <button type="button" data-tab="main" :class="{on: tab === 'main'}" @click="tab = 'main'">现场</button>
                <button type="button" data-tab="side" :class="{on: tab === 'side'}" @click="tab = 'side'">共识</button>
            </div>
        </div>
    </div>

    <!-- 历史记录弹窗 -->
    <div class="history-mask" id="historyMask">
        <div class="history-panel">
            <div class="history-head">
                <span class="h-title">📜 会议逐字稿</span>
                <button class="h-close" id="historyClose">✕</button>
            </div>
            <div class="history-body" id="historyBody"></div>
        </div>
    </div>

<script src="js/api.js?v=20261002"></script>
<script src="js/text-fx.js?v=20261005b"></script>
<script src="js/auth.js?v=20261003b"></script>
<script src="js/badeline-voice.js?v=20261002b"></script>
<script src="js/roundtable-voice.js?v=20261004c"></script>
<script src="js/roundtable-portraits.js?v=20261004f"></script>
<script src="js/roundtable-bird.js?v=20261004f"></script>
<script src="js/felt-piano.js?v=20261003"></script>
<script src="js/roundtable-scenes.js?v=20261004"></script>
<script src="js/vue.global.prod.js?v=20261008a"></script>
<script src="js/roundtable-1.js?v=20261015a"></script>
<script src="js/roundtable-2.js?v=20261015a"></script>
<script src="js/roundtable-3.js?v=20261015a"></script>
<script src="js/seed.js?v=20261011a"></script>
</body>
</html>
