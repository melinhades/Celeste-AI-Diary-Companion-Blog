<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="icon/OIP.webp" type="image/webp">
    <title>Archives - Celeste Blog</title>
    <link rel="stylesheet" href="css/common.css?v=20261003f">
    <link rel="stylesheet" href="css/text-fx.css?v=20261004a">
    <link rel="stylesheet" href="css/archives.css?v=20261015a">
</head>
<body>
    <!-- BGM 播放器 -->
    <audio id="bgmPlayer" loop>
        <source src="bgm/postcard.mp3" type="audio/mpeg">
    </audio>

    <!-- 雪花粒子系统（与 index 同款） -->
    <canvas id="snowCanvas" style="position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:0;"></canvas>
    <div class="snow-strip"></div>

<header class="header">
    <div class="container header-inner">
        <a href="index.html" class="logo"><img src="celeste-gui/logo.webp" alt="Celeste" loading="lazy" decoding="async"></a>
        <nav class="nav">
            <a href="index.html" class="nav-link">Home</a>
            <a href="archives.html" class="nav-link active">Archives</a>
            <a href="diary.html" class="nav-link nav-diary-btn" title="Diary with Madeline">
                <img src="celeste-gui/journal.png" alt="Diary" loading="lazy" decoding="async">
            </a>
            <a href="shop.html" class="nav-link nav-diary-btn" title="Celeste Resort · Oshiro">
                <img src="Atlases/Gui/menu/play.png" alt="Shop" loading="lazy" decoding="async">
            </a>
            <a href="roundtable.html" class="nav-link nav-chair" title="AI 圆桌会议">🪑</a>
        </nav>
        <div class="header-right" id="headerRight"></div>
    </div>
</header>

<div class="container archives-layout">
    <div class="archives-title"> Archives</div>
    <div id="archiveContent">
        <div v-if="!groups.length" class="loading">Loading...</div>
        <div v-else v-for="(yg, yi) in groups" :key="yg.year" class="year-group">
            <div class="year-label">{{ yg.year }} <span class="archive-count">{{ yg.posts }} posts</span></div>
            <div v-for="m in yg.months" :key="m.m" class="month-block" :class="{collapsed: m.collapsed}">
                <div class="month-row" role="button" @click="toggleMonth(m)">
                    <span class="month-caret">▾</span>
                    <span class="archive-count">{{ m.items.length }} posts</span>
                    <span class="month-name">{{ m.enMonth }}</span>
                    <div class="month-icon">
                        <div class="month-frame"></div>
                        <img class="month-cover" :src="ARC_DIR + m.cover + '.png'" alt="" loading="lazy" decoding="async">
                    </div>
                </div>
                <div class="month-posts">
                    <div v-for="(item, i) in m.items" :key="i" class="archive-item" @click="goArticle(item, demo)">
                        <span class="archive-date">{{ item.month ? yg.year + '-' + m.mm : formatDate(item.createDate) }}</span>
                        <span class="archive-title">{{ item.title || '未命名文章' }}</span>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<footer class="footer">
    <div class="container">© 2026 Celeste Blog System · Explore the Knowledge Ocean</div>
</footer>

<script src="js/api.js?v=20261002"></script>
<script src="js/text-fx.js?v=20261005b"></script>
<script src="js/auth.js?v=20261003b"></script>
<script src="js/vue.global.prod.js?v=20261008a"></script>
<script src="js/snow-bgm.js"></script>
<script src="js/archives-1.js?v=20261025a"></script>
<script src="js/archives-2.js?v=20261015a"></script>
<script src="js/seed.js?v=20261028b"></script>
</body>
</html>
