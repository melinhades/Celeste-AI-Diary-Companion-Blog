<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Felt Piano · 打字音效测试台</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  :root {
    --bg:#0a0e1c; --bg2:#10172a; --ink:#e6f0ff; --ink2:#8fa4c8; --line:rgba(255,255,255,.08);
    --acc:#48a9ff; --acc2:#1a82ec; --glow:rgba(72,169,255,.35);
  }
  html,body { height:100%; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: 'Renogare','CelesteZH','PingFang SC','Microsoft YaHei',sans-serif;
    overflow-x: hidden;
    position: relative;
  }
  body::before {
    content:''; position:fixed; inset:0; z-index:0; pointer-events:none;
    background:
      radial-gradient(60% 50% at 20% 0%, rgba(72,169,255,.10), transparent 70%),
      radial-gradient(50% 40% at 85% 30%, rgba(180,120,255,.10), transparent 70%);
  }
  .wrap { position:relative; z-index:1; max-width:1180px; margin:0 auto; padding:28px 24px 60px; }

  /* header */
  header { display:flex; align-items:flex-end; justify-content:space-between; margin-bottom:22px; }
  h1 { font-size:30px; letter-spacing:1px; color:#fff; }
  h1 span { color:var(--acc); text-shadow:0 0 18px var(--glow); }
  .sub { color:var(--ink2); font-size:13px; margin-top:4px; }
  .badge {
    font-size:11px; padding:5px 12px; border-radius:999px;
    background:rgba(72,169,255,.12); border:1px solid rgba(72,169,255,.35);
    color:var(--acc);
  }

  /* grid */
  .grid { display:grid; grid-template-columns: 1.35fr 1fr; gap:18px; }
  @media (max-width:900px){ .grid{grid-template-columns:1fr;} }

  .card {
    background:rgba(255,255,255,.035);
    border:1px solid var(--line);
    border-radius:16px;
    padding:20px;
    backdrop-filter:blur(10px);
    box-shadow:0 8px 30px rgba(0,0,0,.25);
  }

  /* typing area */
  .type-label { font-size:12px; color:var(--ink2); margin-bottom:8px; letter-spacing:.5px; }
  textarea {
    width:100%; min-height:190px; resize:vertical;
    background:rgba(0,0,0,.3); color:var(--ink);
    border:1px solid var(--line); border-radius:12px;
    padding:14px 16px; font-size:16px; line-height:1.65;
    font-family:'Renogare','CelesteZH',monospace;
    outline:none; transition:border-color .2s, box-shadow .2s;
  }
  textarea:focus { border-color:var(--acc); box-shadow:0 0 0 3px var(--glow); }
  .type-meta { display:flex; gap:14px; margin-top:10px; font-size:12px; color:var(--ink2); }
  .type-meta b { color:#fff; }

  .send-row { display:flex; align-items:center; justify-content:space-between; margin-top:12px; }
  .send-hint { font-size:11.5px; color:var(--ink2); }
  .send-btn {
    padding:10px 28px; border-radius:10px; cursor:pointer;
    background:linear-gradient(135deg,var(--acc),var(--acc2));
    border:0; color:#fff; font-family:inherit; font-size:14px; letter-spacing:2px;
    box-shadow:0 4px 18px var(--glow); transition:transform .12s, box-shadow .12s;
  }
  .send-btn:hover { transform:translateY(-1px); box-shadow:0 6px 24px var(--glow); }
  .send-btn:active { transform:translateY(1px); }

  /* visualizer */
  .viz {
    margin-top:14px; height:64px; border-radius:12px;
    background:rgba(0,0,0,.35); border:1px solid var(--line);
    display:flex; align-items:center; justify-content:center;
    position:relative; overflow:hidden;
  }
  canvas#wave { position:absolute; inset:0; width:100%; height:100%; }
  .note-chip {
    position:relative; z-index:1; font-size:20px; color:var(--acc);
    text-shadow:0 0 14px var(--glow); letter-spacing:1px; transition:opacity .15s;
    opacity:0;
  }
  .note-chip.on { opacity:1; animation:pulse .3s ease; }
  @keyframes pulse { from{transform:scale(1.3)} to{transform:scale(1)} }

  /* params */
  .panel { display:flex; flex-direction:column; gap:16px; }
  .panel h2 { font-size:13px; color:#fff; letter-spacing:.5px; }
  .row { display:grid; grid-template-columns: 72px 1fr 52px; align-items:center; gap:10px; }
  .row label { font-size:12px; color:var(--ink2); }
  .row .val { font-size:12px; color:#fff; text-align:right; font-family:'Renogare',monospace; }
  input[type=range] {
    -webkit-appearance:none; appearance:none; height:4px; border-radius:3px;
    background:linear-gradient(90deg,var(--acc),var(--acc2)); outline:none;
  }
  input[type=range]::-webkit-slider-thumb {
    -webkit-appearance:none; width:16px; height:16px; border-radius:50%;
    background:#fff; border:2px solid var(--acc);
    box-shadow:0 0 10px var(--glow); cursor:pointer;
  }
  .try-grid { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
  .try-btn {
    padding:11px 6px; border-radius:10px; cursor:pointer; font-family:inherit; font-size:12px;
    background:rgba(72,169,255,.1); border:1px solid rgba(72,169,255,.3); color:var(--acc);
    transition:background .15s;
  }
  .try-btn:hover { background:rgba(72,169,255,.22); }
  .pool-note { font-size:11.5px; color:var(--ink2); line-height:1.7; }
  .pool-note b { color:#b9d8ff; font-weight:normal; }

  /* export */
  .export-head { display:flex; justify-content:space-between; align-items:center; margin-bottom:8px; }
  .export-head h3 { font-size:14px; color:#fff; }
  .copy-btn {
    font-size:11px; padding:5px 12px; border-radius:8px; cursor:pointer;
    background:rgba(72,169,255,.15); color:var(--acc); border:1px solid rgba(72,169,255,.35);
    font-family:inherit;
  }
  .copy-btn:hover { background:rgba(72,169,255,.25); }
  pre {
    background:rgba(0,0,0,.45); border:1px solid var(--line); border-radius:10px;
    padding:14px; font-size:11.5px; line-height:1.6; color:#b9d8ff;
    overflow:auto; max-height:300px; font-family:'Consolas',monospace;
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1>Felt <span>Piano</span> 打字音效测试台</h1>
      <div class="sub">原版毛毡钢琴采样 · 聚焦/失焦/打字/Send · 调好后把下方代码接进 messages.html</div>
    </div>
    <span class="badge" id="ctxStatus">点击页面激活音频</span>
  </header>

  <div class="grid">
    <!-- 左：打字区 + Send -->
    <div class="card">
      <div class="type-label">在此打字试听 ↓（聚焦=开始音，点框外=暂停音）</div>
      <textarea id="box" placeholder="点我会响一声开始音，打字每个键随机一个音符，点外面会响暂停音……"></textarea>
      <div class="type-meta">
        <span>已触发 <b id="count">0</b> 次</span>
        <span>当前音效 <b id="curNote">—</b></span>
      </div>
      <div class="send-row">
        <span class="send-hint">Send 按钮随机播放 send 文件夹（accept + 5 个 space）</span>
        <button class="send-btn" id="sendBtn">SEND</button>
      </div>
      <div class="viz">
        <canvas id="wave"></canvas>
        <div class="note-chip" id="chip">—</div>
      </div>
    </div>

    <!-- 右：音量 + 分类试听 -->
    <div class="card panel">
      <h2>全局</h2>
      <div class="row">
        <label>音量</label>
        <input type="range" id="volume" min="0" max="1" step="0.01" value="0.5">
        <span class="val" id="volumeV">0.50</span>
      </div>

      <h2>分类试听</h2>
      <div class="try-grid">
        <button class="try-btn" data-cat="start">开始输入</button>
        <button class="try-btn" data-cat="stop">暂停输入</button>
        <button class="try-btn" data-cat="type">打字音 ×1</button>
        <button class="try-btn" data-cat="send">Send 音 ×1</button>
      </div>

      <h2>随机音池</h2>
      <div class="pool-note" id="poolNote"></div>
    </div>
  </div>

  <!-- 导出代码 -->
  <div class="card" style="margin-top:18px">
    <div class="export-head">
      <h3>复制到 messages.html 的代码</h3>
      <button class="copy-btn" id="copyBtn">复制</button>
    </div>
    <pre id="code"></pre>
  </div>
</div>

<script>
/* ===================== 采样音效播放器 ===================== */
const DIR = 'feltpianotyping/';
const CHAR_NOTES = ['A6_01','A7_01','A7_02','B6_02','C6_01','D6_01','D6_02','E6_01','E6_02','Fs6_01','G6_01'];
const SEND_NOTES = ['accept','space_01','space_02','space_03','space_04','space_05'];

const POOLS = {
  start: ['ui_main_rename_entry_backspace.wav'],
  stop:  ['ui_main_rename_entry_roll.wav'],
  type:  CHAR_NOTES.map(n => `ui_main_rename_entry_char_${n}.wav`),
  send:  SEND_NOTES.map(n => `send/ui_main_rename_entry_${n}.wav`)
};

const SFX = {
  ctx:null, master:null, analyser:null, buffers:new Map(), htmlPool:{},
  init() {
    if (this.ctx) { if (this.ctx.state === 'suspended') this.ctx.resume(); return; }
    const ac = new (window.AudioContext || window.webkitAudioContext)();
    this.ctx = ac;
    this.master = ac.createGain();
    this.master.gain.value = +document.getElementById('volume').value;
    this.analyser = ac.createAnalyser();
    this.analyser.fftSize = 512;
    this.master.connect(this.analyser);
    this.analyser.connect(ac.destination);
    this._waveData = new Uint8Array(this.analyser.frequencyBinCount);
    this.preload();
  },
  async preload() {
    const jobs = [];
    for (const cat in POOLS)
      for (const f of POOLS[cat]) jobs.push(this._load(DIR + f));
    await Promise.all(jobs);
  },
  async _load(url) {
    if (this.buffers.has(url)) return this.buffers.get(url);
    try {
      const r = await fetch(url);
      const buf = await this.ctx.decodeAudioData(await r.arrayBuffer());
      this.buffers.set(url, buf);
      return buf;
    } catch (e) {           // fetch 不可用（file:// 直开）→ 退回 HTMLAudio
      this.buffers.set(url, null);
      return null;
    }
  },
  async play(cat) {
    this.init();
    const list = POOLS[cat];
    const file = list[Math.floor(Math.random() * list.length)];
    const url = DIR + file;
    if (!this.buffers.has(url)) await this._load(url);
    const buf = this.buffers.get(url);
    if (buf) {
      const src = this.ctx.createBufferSource();
      src.buffer = buf;
      src.connect(this.master);
      src.start();
    } else {
      this._playHtml(url);
    }
    return file;
  },
  _playHtml(url) {
    // file:// 直开时 fetch 不可用：用 Audio 元素对象池，快速打字也能轮播
    let pool = this.htmlPool[url];
    if (!pool) { pool = []; this.htmlPool[url] = pool; }
    let a = pool.find(x => x.paused || x.ended);
    if (!a) {
      if (pool.length >= 4) a = pool[0];
      else { a = new Audio(url); pool.push(a); }
    }
    a.volume = this.master ? this.master.gain.value : 0.5;
    try { a.currentTime = 0; } catch {}
    a.play();
  },
  label(file) {
    const m = file.match(/_(?:char_)?([A-G][s]?[67]_\d{2}|accept|space_\d{2}|backspace|roll)/);
    return m ? m[1] : file;
  }
};

/* ===================== UI 绑定 ===================== */
const chip = document.getElementById('chip');
const curNote = document.getElementById('curNote');
const countEl = document.getElementById('count');
let count = 0;

function showNote(name) {
  curNote.textContent = name;
  chip.textContent = name;
  chip.classList.remove('on'); void chip.offsetWidth; chip.classList.add('on');
}

const box = document.getElementById('box');
box.addEventListener('focus', () => SFX.play('start').then(f => showNote(SFX.label(f))));
box.addEventListener('blur',  () => SFX.play('stop'));
const TYPING_RE = /^(Key[A-Z]|Digit\d|Numpad\d|Space|Enter|NumpadEnter|Backspace)$/;
box.addEventListener('keydown', e => {
  // 按物理键判断：中文输入法下 e.key 是 "Process"，但 e.code 仍是 KeyA 等
  if (!TYPING_RE.test(e.code || '')) return;
  SFX.play('type').then(f => {
    showNote(SFX.label(f));
    count++; countEl.textContent = count;
  });
});

document.getElementById('sendBtn').addEventListener('click', () =>
  SFX.play('send').then(f => showNote(SFX.label(f)))
);

document.querySelectorAll('.try-btn').forEach(b =>
  b.addEventListener('click', () => SFX.play(b.dataset.cat).then(f => showNote(SFX.label(f))))
);

document.getElementById('volume').addEventListener('input', e => {
  document.getElementById('volumeV').textContent = (+e.target.value).toFixed(2);
  if (SFX.master) SFX.master.gain.value = +e.target.value;
});

// 音池说明
document.getElementById('poolNote').innerHTML =
  `打字 <b>${POOLS.type.length}</b> 个：${CHAR_NOTES.map(n=>n.replace(/_\d$/,'')).join('、')}<br>` +
  `Send <b>${POOLS.send.length}</b> 个：accept、space×5<br>` +
  `开始/暂停各 <b>1</b> 个，均随机/固定触发`;

// 波形循环
const waveCanvas = document.getElementById('wave');
function loop() {
  if (SFX.analyser) {
    const c = waveCanvas.getContext('2d');
    const w = waveCanvas.width = waveCanvas.clientWidth * devicePixelRatio;
    const h = waveCanvas.height = waveCanvas.clientHeight * devicePixelRatio;
    SFX.analyser.getByteTimeDomainData(SFX._waveData);
    c.clearRect(0,0,w,h);
    c.lineWidth = 2 * devicePixelRatio;
    c.strokeStyle = 'rgba(72,169,255,.7)';
    c.shadowColor = 'rgba(72,169,255,.6)';
    c.shadowBlur = 12;
    c.beginPath();
    const slice = w / SFX._waveData.length;
    for (let i=0;i<SFX._waveData.length;i++) {
      const v = SFX._waveData[i]/128, y = v*h/2, x = i*slice;
      i === 0 ? c.moveTo(x,y) : c.lineTo(x,y);
    }
    c.stroke();
  }
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

// 首次点击激活
function unlock() {
  SFX.init();
  const s = document.getElementById('ctxStatus');
  s.textContent = '音频已激活'; s.style.color = '#7dffb0';
}
document.addEventListener('click', unlock, { once:true });

/* ===================== 代码导出 ===================== */
const codeEl = document.getElementById('code');
codeEl.textContent = `/* ===== Felt Piano 打字音效（原版采样版）=====
放进 messages.html 的 <script> 顶部；路径以 html 所在目录为基准。 */
(function(){
  const DIR = 'feltpianotyping/';
  const TYPES  = [${CHAR_NOTES.map(n=>`'ui_main_rename_entry_char_${n}.wav'`).join(',')}];
  const SENDS  = [${SEND_NOTES.map(n=>`'send/ui_main_rename_entry_${n}.wav'`).join(',')}];
  const START  = 'ui_main_rename_entry_backspace.wav';
  const STOP   = 'ui_main_rename_entry_roll.wav';
  let ac, master, cache = new Map();
  function unlock(){
    if(ac){ if(ac.state==='suspended') ac.resume(); return; }
    ac = new (window.AudioContext||window.webkitAudioContext)();
    master = ac.createGain(); master.gain.value = 0.5; master.connect(ac.destination);
  }
  async function load(f){
    if(cache.has(f)) return cache.get(f);
    const r = await fetch(DIR+f), b = await ac.decodeAudioData(await r.arrayBuffer());
    cache.set(f,b); return b;
  }
  async function play(listOrFile){
    unlock();
    const f = Array.isArray(listOrFile) ? listOrFile[Math.floor(Math.random()*listOrFile.length)] : listOrFile;
    const buf = await load(f);
    const s = ac.createBufferSource(); s.buffer = buf; s.connect(master); s.start();
  }
  /* 绑定一个输入框：聚焦=开始音，失焦=暂停音，按键=随机打字音 */
  window.bindFeltPiano = function(el){
    el.addEventListener('focus', () => play(START));
    el.addEventListener('blur',  () => play(STOP));
    el.addEventListener('keydown', e => {
      if(!/^(Key[A-Z]|Digit\\d|Numpad\\d|Space|Enter|NumpadEnter|Backspace)$/.test(e.code||'')) return;
      play(TYPES);
    });
  };
  /* Send 按钮：随机 send 音 */
  window.feltPianoSend = () => play(SENDS);
})();

/* 使用：
  bindFeltPiano(document.querySelector('textarea或input'));
  sendButton.addEventListener('click', feltPianoSend);
*/`;

document.getElementById('copyBtn').addEventListener('click', async () => {
  try {
    await navigator.clipboard.writeText(codeEl.textContent);
  } catch {
    const ta = document.createElement('textarea');
    ta.value = codeEl.textContent; document.body.appendChild(ta); ta.select();
    document.execCommand('copy'); ta.remove();
  }
  const b = document.getElementById('copyBtn');
  const old = b.textContent; b.textContent = '已复制 ✓'; b.style.color = '#7dffb0';
  setTimeout(() => { b.textContent = old; b.style.color = ''; }, 1400);
});
</script>
</body>
</html>
