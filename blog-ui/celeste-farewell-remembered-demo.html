            const g = j.vy < -30 ? GLIDER.gravAirUp : GLIDER.gravAir;
            // Glider.Update：X 摩擦 vy<0 → 40；vy≥0 → highFrictionTimer>0 ? 40 : 10
            const fric = j.vy < 0 ? GLIDER.frictionUp : (j.highFrictionTimer > 0 ? GLIDER.frictionUp : GLIDER.frictionDown);
            j.vx = approachTo(j.vx, 0, fric * dt);
            j.vy = approachTo(j.vy, 30, g * dt);
          }
        }

        // MoveH / MoveV：碰撞反弹（OnCollideH 速度取反，OnCollideV 向上 -0.5、向下归零）
        const nx = j.x + j.vx * dt;
        if (gliderSolidAt(nx, j.y)) {
          j.vx = -j.vx;
        } else j.x = nx;
        const ny = j.y + j.vy * dt;
        if (gliderSolidAt(j.x, ny)) {
          j.vy = j.vy < 0 ? -j.vy * 0.5 : 0;
        } else j.y = ny;

        // 越界：左右上夹取，掉出下边界 RemoveSelf
        if (j.x < BOUND.x0 + 4) { j.x = BOUND.x0 + 4; j.vx = -j.vx; }
        else if (j.x > BOUND.x1 - 4) { j.x = BOUND.x1 - 4; j.vx = -j.vx; }
        if (j.y - 10 < BOUND.y0) { j.y = BOUND.y0 + 10; j.vy = -j.vy * 0.5; }
        else if (j.y > BOUND.y1 + 16) { jellies.splice(i, 1); continue; }

      }
    }

    // 羽毛：只在相机可见区左右两侧刷新（居中聊天卡不会整块压住），同时最多 6 颗
    function spawnFeather() {
      if (feathers.length >= CAP.feather) return;
      const vw = W / Z, vh = H / Z;
      const fx = Math.random() < 0.5 ? 0.06 + Math.random() * 0.24 : 0.70 + Math.random() * 0.24;
      const x = clampN(cam.x - SPAWN.x + fx * vw, BOUND.x0, BOUND.x1);
      const y = clampN(cam.y - SPAWN.y + vh * (0.18 + Math.random() * 0.27), -280, 40);
      feathers.push({ x: x, y: y, phase: Math.random() * Math.PI * 4 });   // SineWave.Randomize → [0,4π)
    }

    function stepFollowers(dt) {
      for (let i = 0; i < berries.length; i++) {
        const b = berries[i];
        if (b.spawnT < 1) b.spawnT = Math.min(1, b.spawnT + dt / 0.4);
        if (b.delay > 0) { b.delay -= dt; continue; }   // Follower::Update 只看 DelayTimer
        const idx = Math.min(FOLLOW.stepIndex * (i + 1), leader.past.length - 1);
        const tgt = idx >= 0 ? leader.past[idx] : null;
        if (!tgt) continue;
        b.x = followerLerp(b.x, tgt.x, dt);
        b.y = followerLerp(b.y, tgt.y, dt);
      }
      // 金莓/普通莓视觉：idle 帧时钟 + sin(wobble)*2 呼吸 + 拾取 0.4s 弹跳（不影响跟随坐标）
      for (const b of berries) {
        if (b.kind === 'wing') continue;
        b.animT += dt;
        b.wobble += dt * 4;                                  // Strawberry::orig_Update
        if (b.wiggleT >= 0) {
          b.wiggleT += dt;
          if (b.wiggleT >= BERRY_WIGGLE.time) b.wiggleT = -1;
        }
      }
    }
    // Monocle.Wiggler::Update：Value = cos(2π·freq·t)·(1 − t/time)；OnPlayer 回调 Scale = 1 + 0.35·Value
    function berryWiggleScale(b) {
      if (b.wiggleT < 0) return 1;
      const v = Math.cos(Math.PI * 2 * BERRY_WIGGLE.freq * b.wiggleT) * (1 - b.wiggleT / BERRY_WIGGLE.time);
      return 1 + BERRY_WIGGLE.amp * v;
    }

    function stepFeathers() {
      for (let i = feathers.length - 1; i >= 0; i--) {
        const f = feathers[i];
        // FlyFeather Hitbox 20×20 @(-10,-10) 与 Player 8×11 相交（含 f 的局部正弦偏移）
        const fy = f.y + Math.sin(time * Math.PI * 2 * STARFLY.sineFreq + f.phase) * STARFLY.sineAmp;
        if (Math.abs(f.x - m.x) >= (STARFLY.hitW / 2 + 4) ||
            fy - STARFLY.hitH / 2 >= m.y || fy + STARFLY.hitH / 2 <= m.y - 11) continue;
        feathers.splice(i, 1);
        startFly(f);
        // FlyFeather.CollectRoutine：Shake → 0.05s 冻结；页面补整屏闪光与 feather_get
        hitstop = Math.max(hitstop, STARFLY.collectFreeze);
        flash = Math.max(flash, STARFLY.collectFlash);
        if (window.Sfx) Sfx.play('feather/feather_get');
        return;
      }
    }

    function startFly(f) {
      if (fly) return;
      if (heldJelly) releaseJelly(0, 0);   // 拾羽毛时松手（原作 StarFly 分支未取证，避免水母跟飞）
      // D6：方向取 sign(羽毛 - Madeline)；同 x 时用当前朝向
      const dx = Math.sign(f.x - m.x) || (m.facing || 1);
      fly = {
        t: 0, len: 0, mx: dx, my: 0, last: { x: dx, y: 0 },
        timer: STARFLY.time, warnT: 0, flash: false
      };
      m.vx = 0; m.vy = 0;
      m.setState(CelesteCharacter.ST.Normal);
      m.sprite.play('idle');
      // 变形期仍是 HairCount=4 / 普通发色；0.42s 才切 7 + 飞行色
      m.hair.rigid = true;
      m.hair.count = 4;
      m.hair.setColor('normal');
      m.hair.reset(m.x, m.y, m.facing);
      toastEl.textContent = '拾起「金羽毛」';
      toastEl.classList.add('show');
      toastTimer = 2.6;
    }

    function stepFly(dt, input) {
      const f = fly;
      f.t += dt;
      if (f.t < STARFLY.chargeTotal) {
        // starFlyTransforming：Speed → 0；0.32s 动画切 starFly，但发色/发量到 0.42s 才变
        f.len = Math.max(0, f.len - STARFLY.accel * dt);
        // 0.32 前是 startStarFly（hair="0,-2"）；0.32 起是 starFly（hair="0,3" → 发根 = 球心）
        const hairY = f.t < STARFLY.chargeAnim ? STARFLY.hairMorphY : STARFLY.hairFlyY;
        m.hair.update(m.x, m.y, m.facing, 0, hairY, dt, 1);
        return;
      }
      if (f.t - dt < STARFLY.chargeTotal) {
        // 协程尾部才读 Input.Feather：变形期按住的方向才是发射方向
        const d0 = inputDir();
        if (d0) { f.mx = d0.x; f.my = d0.y; f.last = d0; }
        f.len = STARFLY.speedStart;
        f.timer = STARFLY.time;
        // StarFlyCoroutine：发射瞬间才 HairCount=7 + 飞行发色
        m.hair.count = 7;
        m.hair.setColor('fly');
        m.hair.reset(m.x, m.y - 6, m.facing);
      }

      const dir = inputDir();
      const idle = !dir;
      const want = dir || f.last;
      const cur = normV(f.mx, f.my);
      const nd = cur ? rotateToward(cur, want, STARFLY.turnRate * dt) : want;
      f.mx = nd.x; f.my = nd.y; f.last = { x: nd.x, y: nd.y };
      const target = flyTargetSpeed(idle ? null : dotV(nd, want));
      f.len = approachTo(f.len, target, STARFLY.accel * dt);

      // 推进 + 分轴碰撞（Player.OnCollideH / OnCollideV 的 StStarFly 分支）
      let nx = m.x + f.mx * f.len * dt;
      let ny = m.y + f.my * f.len * dt;
      let hx = false, hy = false;
      if (nx < BOUND.x0) { nx = BOUND.x0; hx = true; }
      else if (nx > BOUND.x1) { nx = BOUND.x1; hx = true; }
      if (ny < BOUND.y0) { ny = BOUND.y0; hy = true; }
      else if (ny > BOUND.y1) { ny = BOUND.y1; hy = true; }
      if (!hx && bodySolidFn(nx, m.y)) { hx = true; nx = m.x; }
      if (!hy && bodySolidFn(m.x, ny)) { hy = true; ny = m.y; }
      if (hx || hy) {
        let vx = f.mx * f.len, vy = f.my * f.len;
        if (f.timer < STARFLY.wallDead) {          // 快结束贴墙：该轴速度归零，不反弹
          if (hx) vx = 0;
          if (hy) vy = 0;
        } else {
          if (hx) vx *= -STARFLY.wallRest;
          if (hy) vy *= -STARFLY.wallRest;
        }
        f.len = Math.hypot(vx, vy);
        if (f.len > 0.001) { f.mx = vx / f.len; f.my = vy / f.len; }
        else { f.mx = 0; f.my = 0; }
      }
      m.x = nx; m.y = ny;
      if (Math.abs(f.mx) > 0.01) m.facing = f.mx > 0 ? 1 : -1;

      m.hair.update(m.x, m.y, m.facing, 0, STARFLY.hairFlyY, dt, 1);   // HairOffset (0,3) → 发根落在球心

      // StarFlyUpdate 提前结束（Player.cs:4760-4808，逐条按原作条件）：
      // 1) Jump.Pressed + OnGround(3) → Jump；2) Jump.Pressed + WallJumpCheck(±1) → WallJump
      // 3) Grab.Check + ClimbCheck → 抓墙；4) CanDash → StartDash。撞墙本身只反弹，不结束。
      const gy = groundY(m.x);
      if (input.jumpPressed && gy !== VOID && gy - m.y <= 3) {
        endFly(false);
        m.onGround = true;                 // OnGround(3) 成立才能走 Jump 分支
        m.update(dt, input);
        return;
      }
      if (input.jumpPressed && (m.wallCheck(1) || m.wallCheck(-1))) { endFly(false); m.update(dt, input); return; }
      if (input.grabHeld && m.wallCheck(m.facing)) { endFly(false); m.update(dt, input); return; }
      if (m.canDash(input)) { endFly(false); m.update(dt, input); return; }

      f.timer -= dt;
      if (f.timer < STARFLY.warnTime) {
        f.warnT += dt;
        if (f.warnT >= STARFLY.warnStep) { f.warnT -= STARFLY.warnStep; f.flash = !f.flash; }
      }
      if (f.timer <= 0) endFly(false);
    }

    // StarFlyEnd：|Speed.X| 夹 140；按住 ↑ → Speed.Y=-100；向下速度归零，交回普通状态
    function endFly(silent) {
      if (!fly) return;
      const f = fly;
      fly = null;
      m.hair.count = 4;
      m.hair.rigid = false;
      m.hair.setColor('normal');
      if (silent) { m.hair.reset(m.x, m.y, m.facing); return; }
      const vx0 = f.mx * f.len, vy0 = f.my * f.len;
      const vx = clampN(vx0, -STARFLY.exitX, STARFLY.exitX);
      const vy = flyEndVy(!!(keys['w'] || keys['arrowup']), vy0);
      if (Math.abs(vx) > 0) m.facing = vx > 0 ? 1 : -1;
      m.vx = vx; m.vy = vy;
      m.onGround = false;
      m.maxFall = 160;
      m.highestAirY = m.y;
      feetPrev = m.y;
      m.setState(CelesteCharacter.ST.Normal);
      m.hair.reset(m.x, m.y, m.facing);
    }

    // 实时消息 → 场景物件（历史回放不调用）
    function consumeText(text) {
      const s = String(text || '');
      const nb = (s.match(/🍓|\[c:berry\]/g) || []).length;
      for (let i = 0; i < nb; i++) addBerry('wing');
      const ng = (s.match(/\[c:goldberry\]/g) || []).length;
      for (let i = 0; i < ng; i++) addBerry('gold');
      const np = (s.match(/\[c:plainberry\]/g) || []).length;
      for (let i = 0; i < np; i++) addBerry('plain');
      const nj = (s.match(/🪼|\[c:jelly\]/g) || []).length;
      for (let i = 0; i < nj; i++) spawnJelly();
      const nf = (s.match(/🪶|\[c:feather\]/g) || []).length;
      for (let i = 0; i < nf; i++) spawnFeather();
    }

    function berryFrame(t) { return BERRY_SEQ[Math.floor(t / 0.08) % BERRY_SEQ.length]; }
    function berryIdleFrame(b) {
      const gold = b.kind === 'gold';
      const seq = gold ? BERRY_GOLD_SEQ : BERRY_PLAIN_SEQ;
      const step = gold ? 0.08 : 0.1;
      return (gold ? 'gold' : 'plain') + seq[Math.floor(b.animT / step) % seq.length];
    }

    function drawBerries() {   // 翼草莓（现有，Depth -100 但沿用旧图层：人物之下）
      for (const b of berries) {
        if (b.kind !== 'wing') continue;
        const img = IMG['berry' + berryFrame(time + b.phase)];
        if (!img) continue;
        const p = toScreen(b);
        const sc = 0.4 + 0.6 * b.spawnT;
        const w = 40 * Z * sc, h = 24 * Z * sc;
        if (p.x < -w || p.x > W + w || p.y < -h || p.y > H + h) continue;
        ctx.drawImage(img, Math.round(p.x - w / 2), Math.round(p.y - h / 2), Math.round(w), Math.round(h));
      }
    }

    // 金莓 / 普通莓：Strawberry Depth -100（拾取后 -1000000）→ 比 Player(0) 更靠前，盖在人物与水母之上
    function drawFrontBerries() {
      for (const b of berries) {
        if (b.kind === 'wing') continue;
        const img = IMG[berryIdleFrame(b)];
        if (!img) continue;
        const p = toScreen(b);
        const sc = berryWiggleScale(b);   // Wiggler：拾取瞬间 1.35 → 0.4s 归正
        const w = BERRY_SIZE.w * Z * sc, h = BERRY_SIZE.h * Z * sc;
        const bobY = Math.sin(b.wobble) * 2 * Z;   // orig_Update：sprite.Y 只偏视觉，实体仍贴 Leader 轨迹
        if (p.x < -w || p.x > W + w || p.y + bobY < -h || p.y + bobY > H + h) continue;
        ctx.drawImage(img, Math.round(p.x - w / 2), Math.round(p.y + bobY - h / 2), Math.round(w), Math.round(h));
      }
    }

    // 帧选择（Sprites.xml）：idle 10 帧 0.1s；fall 3 帧 0.08s → fallLoop 2 帧 0.08s 循环；held 单帧
    // 原作只有撞 SeekerBarrier 才播 death；本场景无该实体 → 水母不存在碎裂/死亡帧
    function jellyImage(j) {
      if (j === heldJelly) {
        if (m.vy > 20) {
          const t = j.openT - 3 * GLIDER.fallStep;          // fall 播完再切 fallLoop
          return t < 0 ? IMG['jellyFall' + Math.min(2, Math.floor(j.openT / GLIDER.fallStep))]
            : IMG['jellyFallLoop' + (Math.floor(t / GLIDER.fallStep) % 2)];
        }
        return IMG['jellyHeld'];
      }
      return IMG['jelly' + (Math.floor(j.animT / GLIDER.idleStep) % 10)];
    }
    // Glider.Render 先调 sprite.DrawSimpleOutline()：把同一帧以黑色画在
    // Position ±(1,0)/(0,±1) 四次，再画本体。描边来自代码，不在贴图里
    // （实测 idle0.png 的 alpha 边缘没有任何近黑像素）。
    const JELLY_OUTLINE = new Map();
    const OUTLINE_DIRS = [[-1, 0], [0, -1], [1, 0], [0, 1]];
    function jellyOutline(img) {
      let c = JELLY_OUTLINE.get(img);
      if (c) return c;
      c = document.createElement('canvas');
      c.width = img.naturalWidth || img.width;
      c.height = img.naturalHeight || img.height;
      const g = c.getContext('2d');
      g.drawImage(img, 0, 0);
      g.globalCompositeOperation = 'source-in';
      g.fillStyle = '#000';
      g.fillRect(0, 0, c.width, c.height);
      JELLY_OUTLINE.set(img, c);
      return c;
    }
    function drawJellies() {
      for (const j of jellies) {
        const img = jellyImage(j);
        if (!img) continue;
        const p = toScreen(j);
        const spawn = 0.4 + 0.6 * j.spawnT;
        const w = 48 * Z * spawn * Math.max(Math.abs(j.scaleX), Math.abs(j.scaleY));
        if (p.x < -w || p.x > W + w || p.y < -w || p.y > H + w) continue;
        // ±1 世界像素 = ±Z 屏幕像素；偏移在旋转/缩放之外，和原作先挪 Position 再 Render 一致
        const sil = jellyOutline(img);
        for (const d of OUTLINE_DIRS) {
          ctx.save();
          ctx.translate(p.x + d[0] * Z, p.y + d[1] * Z);
          ctx.rotate(j.rot);
          ctx.scale(Z * spawn * j.scaleX, Z * spawn * j.scaleY);
          ctx.drawImage(sil, -24, -GLIDER.originY, 48, 48);
          ctx.restore();
        }
        ctx.save();
        ctx.translate(p.x, p.y);
        ctx.rotate(j.rot);
        ctx.scale(Z * spawn * j.scaleX, Z * spawn * j.scaleY);
        ctx.drawImage(img, -24, -GLIDER.originY, 48, 48);   // Sprite origin (24, 27.8)
        ctx.restore();
      }
    }

    function drawFeathers() {
      for (const f of feathers) {
        const img = IMG['feather' + (Math.floor((time + f.phase) / 0.06) % 42)];
        if (!img) continue;
        const p = toScreen({ x: f.x, y: f.y + Math.sin(time * Math.PI * 2 * STARFLY.sineFreq + f.phase) * STARFLY.sineAmp });
        const w = 32 * Z;
        if (p.x < -w || p.x > W + w || p.y < -w || p.y > H + w) continue;
        ctx.drawImage(img, Math.round(p.x - w / 2), Math.round(p.y - w / 2), w, w);
      }
    }

    function drawFly() {
      const f = fly;
      const feet = toScreen({ x: m.x, y: m.y });
      m.hair.draw(ctx, toScreen, Z, 0, 1);      // 头发在精灵之下（Player 组件顺序：Hair 先 Add）
      if (f.t < STARFLY.chargeAnim) {
        // startStarFly 4 帧 × 0.08s，Justify(0.5,1) → 左上角 = 脚底 (-16,-32)
        const sc = 1 - 0.4 * (f.t / STARFLY.chargeTotal);
        const img = IMG['morph' + Math.min(3, Math.floor(f.t / 0.08))];
        const w = Math.round(32 * Z * sc);
        if (img) ctx.drawImage(img, Math.round(feet.x - 16 * Z * sc), Math.round(feet.y - 32 * Z * sc), w, w);
      } else {
        // 球心 = (m.x, m.y-6)，origin (16,32) ⇒ 左上角 = 球心 + (-16,-26)
        // 0.32–0.42s 仍是普通发色（与原作 StarFlyCoroutine 一致），0.42s 才转飞行色
        const charging = f.t < STARFLY.chargeTotal;
        const col = charging ? '#ffffff' : ((f.timer < STARFLY.warnTime && f.flash) ? '#AC3232' : '#ffd65c');
        const img = tinted('orb', col);
        const orb = toScreen({ x: m.x, y: m.y - 6 });
        if (img) ctx.drawImage(img, Math.round(orb.x - 16 * Z), Math.round(orb.y - 26 * Z), 32 * Z, 32 * Z);
      }
    }

    // messages.js 在场景脚本之后才加载，但 SSE 可能早到：先同步暴露 → 未就绪入队 → main() 后回放
    window.ChatScene = {
      get ready() { return sceneReady; },
      get flying() { return !!fly; },
      get stats() {
        return {
          berry: berries.length, jelly: jellies.length, feather: feathers.length,
          goldberry: berries.filter(b => b.kind === 'gold').length,
          plainberry: berries.filter(b => b.kind === 'plain').length,
          flying: !!fly, held: !!heldJelly
        };
      },
      consume(content) {
        const t = String(content || '');
        if (!sceneReady) { if (t) sceneQueue.push(t); return; }
        consumeText(t);
      },
      revealChat() { window.dispatchEvent(new CustomEvent('chat:reveal')); },
      reset() {
        berries.length = 0; jellies.length = 0; feathers.length = 0;
        heldJelly = null;
        if (m) { m.holdSlowFall = false; m.holdCannotDuck = false; }
        leader.past.length = 0; leader.acc = 0;
        endFly(true);
      },
      __test: {
        FOLLOWER: FOLLOW, CAP: CAP, STARFLY: STARFLY, GLIDER: GLIDER,
        followerLerp: followerLerp, flyTargetSpeed: flyTargetSpeed,
        flyEndVy: flyEndVy, clampCount: clampCount,
        get held() { return heldJelly; },
        get jellies() { return jellies; },
        get player() { return m; }
      }
    };

    // ===== 渲染 =====
    // 世界坐标（相对出生点）→ 屏幕像素；cam 存的是房间坐标，所以先补回 SPAWN
    function toScreen(n) {
      return { x: (n.x + SPAWN.x - cam.x) * Z, y: (n.y + SPAWN.y - cam.y) * Z };
    }

    // floatySpaceBlock：每格都是 lostlevels 自动瓦片，位置来自地图的 8px 网格
    function drawBlocks() {
      const img = IMG.lost;
      if (!img) return;
      const s = TILE * Z;
      for (const t of blockSprites) {
        const px = (t.wx + SPAWN.x - cam.x) * Z;
        const py = (t.wy + SPAWN.y - cam.y) * Z;
        if (px <= -s || px >= W || py <= -s || py >= H) continue;
        ctx.drawImage(img, t.sx, t.sy, TILE, TILE, px, py, s, s);
      }
    }

    // jumpThru：第九章 AreaData.Jumpthru = "wood"，贴图 24×16 → 8px 三切片（左/中×N/右）
    function drawJumpThrus() {
      const img = IMG.jt;
      if (!img) return;
      const s = TILE * Z;
      for (const j of JTS) {
        const px = (j.x + SPAWN.x - cam.x) * Z;
        const py = (j.y + SPAWN.y - cam.y) * Z;
        if (px >= W || px + j.w * Z <= 0 || py >= H || py <= -s) continue;
        const n = Math.max(1, Math.round(j.w / TILE));
        for (let i = 0; i < n; i++) {
          const cap = i === 0 || i === n - 1;
          const col = i === 0 ? 0 : (i === n - 1 ? 2 : 1);
          const row = cap ? 1 : ((i & 1) ? 1 : 0);     // 原作：两端用外侧行，中段随机上下行
          ctx.drawImage(img, col * TILE, row * TILE, TILE, TILE, px + i * s, py, s, s);
        }
      }
    }

    // exitBlock（tileType='m'）：原作就是一片自动瓦片，Depth -13000 → 先于浮空块绘制
    function drawDoor() {
      const img = IMG.lost;
      if (!img) return;
      const s = TILE * Z;
      for (const t of doorSprites) {
        const px = (t.wx + SPAWN.x - cam.x) * Z;
        const py = (t.wy + SPAWN.y - cam.y) * Z;
        if (px <= -s || px >= W || py <= -s || py >= H) continue;
        ctx.drawImage(img, t.sx, t.sy, TILE, TILE, px, py, s, s);
      }
    }

    // floatingDebris：8×8 碎屑缓慢漂浮
    function drawDebris() {
      const img = IMG.debris;
      if (!img) return;
      const s = TILE * Z;
      ctx.globalAlpha = 0.75;
      for (const d of debris) {
        const bx = Math.sin(time * 0.35 + d.ph) * 10;
        const by = Math.sin(time * 0.27 + d.ph * 1.3) * 6;
        const px = (d.x + SPAWN.x + bx - cam.x) * Z;
        const py = (d.y + SPAWN.y + by - cam.y) * Z;
        if (px <= -s || px >= W || py <= -s || py >= H) continue;
        ctx.drawImage(img, d.f * TILE, 0, TILE, TILE, Math.round(px), Math.round(py), s, s);
      }
      ctx.globalAlpha = 1;
    }

    // 背景全部由 LAYERS 驱动（顺序 = 地图 Stylegrounds 顺序），这里只负责清屏与前景
    function drawBackdrops() {
      for (const l of LAYERS) l.render(cam.x, cam.y);
    }

    function drawForegrounds() {
      for (const l of FG_LAYERS) l.render(cam.x, cam.y);
    }

    // moonBlade（danger/starfish）：Sprites.xml 里 21 帧连成一个循环
    // idle0(帧0, 0.08s) → spin0(1-6, 0.06s) → idle1(7) → spin1(8-13) → idle2(14) → spin2(15-20)
    const BLADE_CYCLE = 3 * 0.08 + 18 * 0.06;         // 1.32s
    function bladeFrame(t) {
      let x = mod(t, BLADE_CYCLE);
      for (let i = 0; i < 21; i++) {
        const d = i % 7 === 0 ? 0.08 : 0.06;
        if (x < d) return i;
        x -= d;
      }
      return 20;
    }

    function drawBlades() {
      const s = 48 * Z;                               // moonBlade 画布 48×48，星体占中间一圈
      for (const b of blades) {
        const p = toScreen(b);
        if (p.x < -s || p.x > W + s || p.y < -s || p.y > H + s) continue;
        const img = IMG['blade' + bladeFrame(time + b.ph)];
        if (!img) continue;
        const g = ctx.createRadialGradient(p.x, p.y, s * 0.05, p.x, p.y, s * 0.5);
        g.addColorStop(0, 'rgba(255,196,150,.22)');
        g.addColorStop(1, 'rgba(255,150,90,0)');
        ctx.fillStyle = g;
        ctx.fillRect(p.x - s * 0.5, p.y - s * 0.5, s, s);
        ctx.drawImage(img, Math.round(p.x - s / 2), Math.round(p.y - s / 2), s, s);
      }
    }

    function drawCreatures() {
      const f = Math.floor(time / 0.08) % 6;
      const img = IMG['creature' + f];
      if (!img) return;
      const s = 10 * Z * 0.9;
      for (const c of creatures) {
        const bob = Math.sin(time * 0.8 + c.ph) * 4;
        const drift = Math.sin(time * 0.33 + c.ph * 0.7) * 10;
        const p = toScreen({ x: c.x + drift, y: c.y + bob });
        if (p.x < -s || p.x > W + s || p.y < -s || p.y > H + s) continue;
        ctx.globalAlpha = 0.9;
        ctx.drawImage(img, Math.round(p.x - s / 2), Math.round(p.y - s / 2), s, s);
        ctx.globalAlpha = 1;
      }
    }

    function drawHeart() {
      if (heart.collected) return;
      const p = toScreen({ x: heart.x, y: heart.y + Math.sin(time * 1.6) * 3 });
      const s = 20 * Z;
      const g = ctx.createRadialGradient(p.x, p.y, 2, p.x, p.y, s * 0.95);
      g.addColorStop(0, 'rgba(200,232,255,.42)');
      g.addColorStop(0.45, 'rgba(120,190,240,.16)');
      g.addColorStop(1, 'rgba(70,140,220,0)');
      ctx.fillStyle = g;
      ctx.fillRect(p.x - s, p.y - s, s * 2, s * 2);
      const img = IMG['heart' + (Math.floor(time * 8) % 14)];
      if (img) ctx.drawImage(img, Math.round(p.x - s / 2), Math.round(p.y - s / 2), s, s);
    }

    function drawDust() {
      ctx.fillStyle = '#c6ecff';
      for (const d of dust) {
        const p = toScreen(d);
        ctx.globalAlpha = Math.max(0, Math.min(1, d.life / 0.4));
        ctx.fillRect(Math.round(p.x), Math.round(p.y), 3, 3);
      }
      ctx.globalAlpha = 1;
    }

    function drawParticles() {
      for (const p of particles) {
        const s = toScreen(p);
        ctx.globalAlpha = Math.max(0, p.life / p.ttl);
        ctx.fillStyle = p.c;
        ctx.fillRect(Math.round(s.x), Math.round(s.y), p.sz, p.sz);
      }
      ctx.globalAlpha = 1;
    }

    function render() {
      ctx.globalCompositeOperation = 'source-over';
      ctx.globalAlpha = 1;
      ctx.fillStyle = STYLE_COLOR;                   // /Map/Style color
      ctx.fillRect(0, 0, W, H);
      drawBackdrops();
      drawDoor();
      drawBlocks();                                  // floatySpaceBlock（lostlevels 自动瓦片）
      drawJumpThrus();                               // jumpThru（wood）
      drawDebris();                                  // floatingDebris
      if (DRAW_SPINNERS) drawBlades();               // spinner ×95（默认关闭：底部的星海会破坏虚空构图）
      drawCreatures();                               // moonCreature ×9
      drawBird();                                    // 教程鸟（停在左上浮块）
      drawHeart();
      drawDust();
      drawParticles();
      // 聊天互动物件：羽毛/翼草莓在人物之下；水母 Depth -5、金莓/普通莓 Depth -100 → 人物之上
      drawFeathers();
      drawBerries();
      const inBubble = bubbleFlying();
      if (fly) drawFly(); else if (!inBubble) m.draw(ctx, toScreen, Z);
      drawJellies();
      drawFrontBerries();
      drawForegrounds();                             // purplesunset（additive .25）盖在关卡之上
      // FormationBackdrop（depth -1999900）：fade 3/s 升到 1，黑 rect 的 alpha = fade * 0.5 * 0.85
      // 覆盖整个世界，泡泡玩家（depth -2000000）画在它之上。
      if (inBubble) {
        ctx.globalAlpha = m.cassetteBackdrop * 0.425;
        ctx.fillStyle = '#000';
        ctx.fillRect(0, 0, W, H);
        ctx.globalAlpha = 1;
        m.draw(ctx, toScreen, Z);
      }
      if (flash > 0) {
        ctx.globalAlpha = Math.min(1, flash);
        ctx.fillStyle = '#eaf6ff';
        ctx.fillRect(0, 0, W, H);
        ctx.globalAlpha = 1;
      }
      drawTutorial();                                // 教程面板最后画，盖在闪光之上
    }

    // ===== 逻辑 =====
    function spawnDust(x, y, n) {
      for (let i = 0; i < n; i++) {
        const a = -Math.PI / 2 + (Math.random() - 0.5) * 1.9;
        const sp = 18 + Math.random() * 34;
        dust.push({ x: x, y: y - 1, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp * 0.6, life: 0.3 + Math.random() * 0.35, ttl: 0.65 });
      }
    }

    function collectHeart() {
      heart.collected = true;
      flash = 0.85;
      toastEl.textContent = '拾起「虚空」· Empty Space';
      toastEl.classList.add('show');
      toastTimer = 2.6;
      for (let i = 0; i < 26; i++) {
        const a = Math.random() * 6.283, sp = 26 + Math.random() * 60;
        particles.push({
          x: heart.x, y: heart.y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp,
          life: 0.7 + Math.random() * 0.5, ttl: 1.2, sz: Math.random() < 0.5 ? 2 : 3,
          c: Math.random() < 0.5 ? '#eaf6ff' : '#9ad8ff'
        });
      }
    }

    function respawn() {
      // 手动重来：若正在泡泡运送，立即打断（不跑落地演出）
      if (m) m.cancelCassetteFly();
      // 飞行中坠落/重来：静默收掉星飞并清空跟随轨迹（草莓/水母不结算、不清空）
      endFly(true);
      heldJelly = null;                        // 手上的水母留在原地（不结算、不回收）
      m.holdSlowFall = false; m.holdCannotDuck = false;
      leader.past.length = 0; leader.acc = 0;
      m.x = 0; m.y = 0; m.vx = 0; m.vy = 0;
      feetPrev = 0;
      m.onGround = true; m.ducking = false; m.fastJump = false;
      m.dashes = m.maxDashes; m.stamina = 110; m.freezeTimer = 0;
      m.dashTime = 0; m.dashTrail.length = 0;
      m.wallSlideDir = 0; m.wallSlideTimer = 1.2; m.dashAttackTimer = 0;
      m.bodySolidFn = bodySolidFn;
      m.sprite.play('idle');
      m.hair.reset(0, 0, 1);
      snapCam();
      dust.length = 0; particles.length = 0;
      hitstop = 0;
      gliderBoostTimer = 0;
      birdReset();                             // 手动重来同样重建鸟与节点序列
      TUT.state = 'wait'; TUT.scale = 0; TUT.armed = true; TUT.cooldown = 1.2;
      deathTimer = 0.45;
      flash = Math.max(flash, 0.35);
    }

    // 死亡 → 泡泡运送（替代旧版「0.35s 白闪 + 瞬移」）。
    // 原作没有死亡泡泡；这里复用 Player.StCassetteFly=21 的演出：
    // 0.12s 原地裹泡（BUBBLE_GRAB_TIME）→ 0.625s 二次贝塞尔 SineInOut 飞回出生点 → 0.2s fallFast → 恢复可控。
    function beginBubbleReturn() {
      if (!m || bubbleFlying()) return;        // 过渡期再触发判定：不重复生成泡泡
      endFly(true);
      heldJelly = null;                        // StartCassetteFly 的 Holding?.Drop()
      m.holdSlowFall = false; m.holdCannotDuck = false;
      leader.past.length = 0; leader.acc = 0;
      m.freezeTimer = 0;
      m.dashTime = 0; m.dashTrail.length = 0;
      m.wallSlideDir = 0; m.wallSlideTimer = 1.2; m.dashAttackTimer = 0;
      hitstop = 0;
      gliderBoostTimer = 0;
      // 房间重载（原作 LostLevels 每次死亡重建实体）：鸟回到初始浮块，节点序列归零
      birdReset();
      TUT.state = 'wait'; TUT.scale = 0; TUT.armed = true; TUT.cooldown = 1.2;
      flash = 0;                               // 泡泡演出不叠白闪
      // 死亡点可能已越出房间左右边界（虚空坠落发生在房间内，x 一般没问题，仍夹一下）
      m.x = Math.max(BOUND.x0, Math.min(BOUND.x1, m.x));
      m.startCassetteFly({ x: 0, y: 0 });      // 终点 = 出生点（本工程 entryPoint）
      CelesteCharacter.playBubbleReturn();     // cassette_bubblereturn 占位音
    }

    // 粒子 / 尘土推进（正常帧与泡泡帧共用）
    function stepFx(dt) {
      for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.x += p.vx * dt; p.y += p.vy * dt;
        p.vy += 12 * dt; p.life -= dt;
        if (p.life <= 0) particles.splice(i, 1);
      }
      for (let i = dust.length - 1; i >= 0; i--) {
        const d = dust[i];
        d.x += d.vx * dt; d.y += d.vy * dt; d.vy += 240 * dt; d.life -= dt;
        if (d.life <= 0) dust.splice(i, 1);
      }
    }

    function tick(dt) {
      time += dt;
      updateLayers(dt);

      // 泡泡运送：玩家不可控（引擎只跑 CassetteFlyUpdate），摄像机每帧直接跟随
      if (bubbleFlying()) {
        m.update(dt, {});        // 引擎忽略输入；泡泡粒子在 updateSharedVisuals 内推进
        followCamBubble();
        stepFx(dt);
        if (flash > 0) flash = Math.max(0, flash - dt * 1.5);
        if (toastTimer > 0) {
          toastTimer -= dt;
          if (toastTimer <= 0) toastEl.classList.remove('show');
        }
        return;
      }
      if (deathTimer > 0) { deathTimer -= dt; return; }
      // FlyFeather.CollectRoutine：收集瞬间冻结 0.05s（原作 yield 0.05f）
      if (hitstop > 0) { hitstop -= dt; return; }

      birdUpdate(dt);          // 先推进鸟（可能把 TUT 收起来），再跑教程状态
      tutorialUpdate(dt);

      const input = {
        left: !!(keys['a'] || keys['arrowleft']),
        right: !!(keys['d'] || keys['arrowright']),
        down: !!(keys['s'] || keys['arrowdown']),
        up: !!(keys['w'] || keys['arrowup']),
        jumpHeld: !!keys[' '] || !!keys['c'],
        jumpPressed: jumpEdge,
        grabHeld: !!(keys['shift'] || keys['z']),
        dashPressed: dashEdge,
        aimX: (keys['d'] || keys['arrowright'] ? 1 : 0) - (keys['a'] || keys['arrowleft'] ? 1 : 0),
        aimY: (keys['s'] || keys['arrowdown'] ? 1 : 0) - (keys['w'] || keys['arrowup'] ? 1 : 0)
      };
      if (dashEdge) gliderBoostTimer = GLIDER.boostWindow;
      jumpEdge = dashEdge = false;
      if (gliderBoostTimer > 0) gliderBoostTimer -= dt;

      // —— 水母持有（Player.NormalUpdate 的 Holding 分支，IL 74-1048）——
      // 未持有：按住抓取键 + PickupCollider 相交 → Pickup（minHoldTimer=0.35）
      // 持有：松开抓取键 → Throw；地面按下 → Drop（Throw 内 MoveY==1 也走 Drop）
      if (heldJelly) {
        if (heldJelly.minHoldTimer > 0) heldJelly.minHoldTimer -= dt;
        // Player.Throw：!GrabCheck && minHoldTimer<=0 → Throw；Throw 内 MoveY==1 → Drop
        if (!input.grabHeld && heldJelly.minHoldTimer <= 0) throwJelly(input.down);
        // IL 901-1048：!Ducking && onGround && MoveY==1 && Speed.Y>=0 && !holdCannotDuck → Drop + Duck
        else if (!m.ducking && m.onGround && input.down && m.vy >= 0 && !m.holdCannotDuck) throwJelly(true);
      } else if (input.grabHeld && !fly) tryPickupJelly();
      m.holdSlowFall = !!heldJelly;

      feetPrev = m.y;
      // 持有时原作跳过整个攀爬分支 → 向引擎屏蔽 grabHeld
      const moveInput = heldJelly ? Object.assign({}, input, { grabHeld: false }) : input;
      // Player.StPickup：0.16s 内只跑 PickupCoroutine，不跑 NormalUpdate（Speed=0、无重力）
      if (heldJelly && heldJelly.pickupT > 0) {
        m.vx = 0; m.vy = 0;
        m.sprite.update(dt);
        m.hair.update(m.x, m.y, m.facing, 0, STARFLY.hairMorphY, dt, 1);
      } else if (fly) stepFly(dt, moveInput); else m.update(dt, moveInput);
      updateCam(dt);

      // 跟随队列 / 水母 / 羽毛（飞行期不吃新羽毛）
      stepLeader(dt);
      stepFollowers(dt);
      stepJellies(dt);
      if (!fly) stepFeathers();

      // 拾起虚空之心（飞行中不判定）
      if (!fly && !heart.collected && Math.abs(m.x - heart.x) < 24 && Math.abs(m.y - heart.y) < 30) collectHeart();

      // 掉出房间底部（世界 y 56 是地板线）—— 飞行期不判定坠落；死亡改走泡泡运送
      if (!fly && m.y > 96) beginBubbleReturn();

      // 粒子 / 尘土
      stepFx(dt);

      if (flash > 0) flash = Math.max(0, flash - dt * 1.5);
      if (toastTimer > 0) {
        toastTimer -= dt;
        if (toastTimer <= 0) toastEl.classList.remove('show');
      }
    }

    // ===== 自检（?scenetest，无头浏览器下用 setInterval 驱动）=====
    function runSelfTest() {
      const out = document.createElement('pre');
      out.id = 'testout';
      out.style.cssText = 'position:fixed;left:10px;bottom:10px;z-index:99;color:#8ef;background:rgba(5,10,25,.85);padding:10px;font:12px/1.6 monospace;white-space:pre';
      document.body.appendChild(out);
      const lines = [];
      let pass = 0, fail = 0;
      const log = (name, ok, extra) => {
        ok ? pass++ : fail++;
        lines.push((ok ? 'PASS ' : 'FAIL ') + name + (extra !== undefined ? '  (' + extra + ')' : ''));
      };
      const reset = (x, y) => {
        m.x = x; m.y = y; m.vx = 0; m.vy = 0; m.onGround = true;
        feetPrev = y;
        m.ducking = false; m.fastJump = false; m.scaleX = m.scaleY = 1;
        m.maxFall = 160; m.highestAirY = y; m.varJumpTimer = 0;
        m.jumpGraceTimer = 0; m.jumpBufferTimer = 0; m.sprite.play('idle');
        // 角色引擎自己的状态（冲刺/爬墙）也要回位，否则连跑测试会互相污染
        m.setState(CelesteCharacter.ST.Normal);
        m.holdSlowFall = false; m.holdCannotDuck = false;
        m.dashes = m.maxDashes; m.stamina = 110; m.freezeTimer = 0;
        m.dashTime = 0; m.dashCooldownTimer = 0; m.dashRefillCooldownTimer = 0;
        m.dashTrail.length = 0;
        // 墙滑 / 天花板 / 身体盒探针的状态也要回位，否则连跑测试会互相污染
        m.wallSlideDir = 0; m.wallSlideTimer = 1.2; m.dashAttackTimer = 0;
        m.bodySolidFn = bodySolidFn;
        m.hair.reset(x, y, 1);
      };
      const step = (n, inp) => {
        for (let i = 0; i < n; i++) m.update(1 / 60, typeof inp === 'function' ? inp(i) : inp);
      };

      // 地面剖面：门顶（世界 y=0）可站，x=-80 上是 16×16 浮块顶面 -56，x=-112 下方全空
      feetPrev = -140;
      log('地面剖面 0 / -56 / 悬空', groundY(0) === 0 && groundY(-80) === -56 && groundY(-112) === VOID,
        [groundY(0), groundY(-80), groundY(-112)].join(' / '));

      reset(0, 0); step(30, {});
      log('待机落稳 idle', m.onGround && m.y === 0 && m.anim === 'idle', m.anim + ' y=' + m.y);

      reset(30, 0); step(30, { left: true });
      log('跑步极速 90', Math.abs(m.vx + 90) < 0.01 && m.y === 0, 'vx=' + m.vx.toFixed(2));

      // floatySpaceBlock 的单向碰撞：从上方落下会停在块顶面（232,320 → 世界 -80,-56）
      reset(-80, -140); m.onGround = false;
      step(60, {});
      log('落在浮空块顶面', m.onGround && Math.abs(m.y + 56) < 0.6, 'x=' + m.x.toFixed(1) + ' y=' + m.y.toFixed(1));

      // 人物系统接线：地面/墙体回调必须真的是本文件实现的那一套
      log('人物引擎接线 ground/wall', m.groundYFn === groundY && m.wallCollideFn === wallCollideFn
        && m.wallAtFn === wallAtFn && m instanceof CelesteCharacter.Character,
        (m.constructor && m.constructor.name) + ' ' + (m.wallCollideFn === wallCollideFn));

      // 墙体几何：x=-80..-64 / y=-56..-40 的 16×16 浮块（BLOCK_RECTS[0]）
      log('墙体探测左面 -80', wallAtFn(-84, -50, 1) === -80 && wallCollideFn(-82, -50, 1) === -80
        && wallCollideFn(-90, -50, 1) === null,
        [wallAtFn(-84, -50, 1), wallCollideFn(-82, -50, 1), wallCollideFn(-90, -50, 1)].join(' / '));

      // 左墙：贴同一浮块右面（世界 x=-64）向左抓 → StClimb。
      // 旧版 wallAtFn 的右边界用 >=，贴左墙时探针 x 恰好等于 b.x+b.w 被丢弃，左侧墙全部抓不住。
      reset(-60, -46); m.onGround = false; m.facing = -1;
      step(1, { left: true, grabHeld: true });
      log('抓左墙 StClimb', wallAtFn(-60, -50, -1) === -64 && m.state === CelesteCharacter.ST.Climb,
        'wall=' + wallAtFn(-60, -50, -1) + ' state=' + m.state);

      // 冲刺：X 触发 → 冻结 3 帧 → StDash 240（原作 DashSpeed）
      reset(0, 0);
      step(1, { dashPressed: true, aimX: 1 });
      step(4, { aimX: 1 });
      log('冲刺 StDash 240', m.state === CelesteCharacter.ST.Dash && Math.abs(Math.abs(m.vx) - 240) < 0.01
        && m.dashes === 0, 'state=' + m.state + ' vx=' + m.vx.toFixed(1) + ' dashes=' + m.dashes);

      // 爬墙：贴住浮块左面按抓墙 → StClimb，向上爬体力逐帧消耗
      // （块顶 y=-56，爬出顶部会 ClimbHop 翻上去，所以只取头 10 帧在墙上的状态）
      reset(-84, -46); m.onGround = false;
      step(1, { right: true, grabHeld: true });
      const climbed = m.state === CelesteCharacter.ST.Climb;
      const stam0 = m.stamina;
      step(10, { right: true, grabHeld: true, up: true });
      log('抓墙 StClimb（向上爬 + 体力→）', climbed && m.state === CelesteCharacter.ST.Climb
        && m.stamina < stam0 && m.y < -46,
        'climb=' + climbed + ' stamina=' + m.stamina.toFixed(1) + ' y=' + m.y.toFixed(1));

      // ===== 动作系统升级（按 orig_UpdateSprite / OnCollideV 的 IL 逐条对齐）=====
      log('人物引擎接线 ceiling/body', m.ceilingFn === ceilingY && m.bodySolidFn === bodySolidFn,
        (m.ceilingFn === ceilingY) + ' / ' + (m.bodySolidFn === bodySolidFn));

      // 天花板：块 [232,320,16,16] 的底边在世界 y=-40，从下方顶上去必须被挡住
      // （旧版完全没有头部碰撞，会直接穿头）
      reset(-72, -16); m.onGround = false; m.vy = -300;
      step(3, {});

        solids: SOLIDS,
        layers: LAYERS,
        fg: FG_LAYERS,
        get collected() { return heart.collected; },
        bird: bird,
        birdLoop: BIRD,
        birdNodes: BIRD_NODES,
        tutorial: TUT,
        closeTutorial: tutorialClose
      };

      // 场景就绪：回放 messages.js 早到的实时消息，之后 consume 直接生效
      sceneReady = true;
      while (sceneQueue.length) consumeText(sceneQueue.shift());

      if (TEST) {
        runSelfTest();
        // 自检跑完后把世界复位到展示状态，方便对画面做视觉核对
        heart.collected = false;
        toastEl.classList.remove('show');
        toastEl.style.display = 'none';
        respawn();
        flash = 0;
        // 无头浏览器里 rAF 可能不推进，自检页用定时器驱动同一套 updateLayers + render
        setInterval(() => {
          time += 1 / 60;
          updateLayers(1 / 60);
          if (flash > 0) flash = Math.max(0, flash - 0.03);
          render();
        }, 40);
      } else {
        let last = 0, renderAcc = 0;
        const chatEl = document.getElementById('chatContainer');
        (function frame(ts) {
          const dt = last ? Math.min((ts - last) / 1000, 0.05) : 1 / 60;
          last = ts;
          tick(dt);
          // 聊天卡展开时背景场景降到 30fps：仍会动，但把合成/滤镜的算力
          // 让给输入与消息滚动；收起聊天后恢复满帧
          const chatOpen = !!chatEl && !chatEl.classList.contains('chat-hidden');
          renderAcc += dt * 1000;
          if (!chatOpen || renderAcc >= 1000 / 30) {
            renderAcc = 0;
            render();
          }
          requestAnimationFrame(frame);
        })(0);
      }
      // 首帧已经画进 #scene 了，再等两帧让它提交，然后把统一加载层淡掉
      requestAnimationFrame(() => requestAnimationFrame(() => {
        if (window.PageLoading) window.PageLoading.ready();
      }));
    }

    main();
  })();
  </script>

    setTimeout(function () {
      var c = document.getElementById('chatContainer');
      if (c) c.removeAttribute('v-cloak');
    }, 0);
