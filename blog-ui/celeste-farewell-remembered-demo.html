<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>铭记 · 山间聊天室</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    html, body {
      margin: 0; height: 100%; overflow: hidden;
      background: #050916; color: #e8f2ff;
      font-family: "Segoe UI", "Microsoft YaHei", sans-serif;
    }
    #scene { display: block; width: 100vw; height: 100vh; image-rendering: pixelated; }
    .vignette {
      position: fixed; inset: 0; pointer-events: none;
      background: radial-gradient(ellipse at 50% 55%, transparent 38%, rgba(3, 6, 18, .58) 100%);
    }
    .hud {
      position: fixed; right: clamp(20px, 4vw, 64px); bottom: 22px;
      font-size: 11px; letter-spacing: .16em; color: #a7c2d5;
    }
    .mute {
      position: fixed; right: clamp(20px, 4vw, 64px); top: clamp(20px, 5vh, 56px);
      width: 38px; height: 38px; border-radius: 50%; cursor: pointer;
      border: 1px solid rgba(160, 200, 230, .35);
      background: rgba(8, 16, 32, .5); color: #cfe6f6; font-size: 15px;
      backdrop-filter: blur(6px);
    }
    .mute:hover { border-color: #a9d9db; background: rgba(18, 40, 58, .65); }
    .toast {
      position: fixed; left: 50%; bottom: 17%; transform: translateX(-50%);
      padding: 10px 20px; border: 1px solid rgba(190, 225, 245, .3); border-radius: 999px;
      background: rgba(6, 14, 30, .62); font-size: 13px; letter-spacing: .18em;
      color: #dff2ff; opacity: 0; transition: opacity .55s ease; pointer-events: none;
      white-space: nowrap;
    }
    .toast.show { opacity: 1; }
    /* 窄屏：给 HUD 换个位置，避免与右下 Toast 等元素挤压 */
    @media (max-width: 720px) {
      .hud { bottom: auto; top: clamp(72px, 12vh, 104px); font-size: 10px; }
    }
  </style>
  <!-- 从 index 的鸟图标飞过来后接着显示同款加载层（视觉见 css/index-bird.css） -->
  <link rel="stylesheet" href="css/index-bird.css?v=20261101f">
  <!-- 复用原实时聊天室（messages.html）的玻璃聊天面板 -->
  <link rel="stylesheet" href="css/messages.css?v=20261015a">
  <style>
    [v-cloak] { display: none !important; }
    /* 关掉 messages.css 自带的雪山底图与压暗 scrim，场景画布要当主背景 */
    body::after { display: none !important; }
    #chatContainer::before { display: none !important; }
    /* 聊天框：屏幕正中 */
    #chatContainer {
      position: fixed; inset: 0; z-index: 8; pointer-events: none;
      display: flex; align-items: center; justify-content: center; padding: 24px;
    }
    .chat-wrap {
      pointer-events: auto; display: flex; flex-direction: column;
      width: min(900px, 94vw); height: min(82vh, 760px); max-width: none;
      margin: 0; padding: 14px 16px 12px; box-sizing: border-box;
      transition: opacity .32s ease, transform .32s ease;
    }
    .msg-layout { display: flex; gap: 18px; height: 100%; min-height: 0; }
    .msg-side {
      width: 210px; flex-shrink: 0; position: static; align-self: stretch;
      max-height: 100%; overflow-y: auto; padding: 8px;
    }
    .msg-main { flex: 1; min-width: 0; height: 100%; display: flex; flex-direction: column; min-height: 0; }
    #chatPane {
      display: flex !important; flex-direction: column; flex: 1; min-height: 0;
      background: rgba(6, 12, 24, .42); border: 1px solid rgba(160, 200, 230, .16);
      border-radius: 20px; overflow: hidden;
      backdrop-filter: blur(16px) saturate(1.25); -webkit-backdrop-filter: blur(16px) saturate(1.25);
      box-shadow: 0 20px 60px rgba(0, 0, 0, .38);
    }
    /* 性能：聊天卡是场景画布上面积最大的半透明层。背景模糊要对每帧都在变的
       游戏画面重新采样，输入/滚动都会跟着卡；去掉实时模糊，改用更实的深色底。 */
    #chatPane { backdrop-filter: none !important; -webkit-backdrop-filter: none !important; background: rgba(6, 12, 24, .70); }
    .chat-wrap .msg-side { backdrop-filter: none !important; -webkit-backdrop-filter: none !important; background: rgba(255, 255, 255, .07); }
    .chat-wrap .chat-input-row { backdrop-filter: none !important; -webkit-backdrop-filter: none !important; background: rgba(12, 18, 34, .78); }
    .chat-head { padding: 14px 16px 0; margin: 0 0 10px; flex-shrink: 0; }
    #chatLog { flex: 1; min-height: 0; overflow-y: auto; padding: 6px 16px 2px; }
    .chat-input-row { flex-shrink: 0; margin: 10px 14px 14px; }
    .chat-login-tip { pointer-events: auto; padding: 140px 20px; }
    .chat-empty { padding: 46px 16px; }
    /* 隐藏态：卡片淡出，只留底部胶囊与操作提示 */
    #chatContainer.chat-hidden .chat-wrap {
      opacity: 0; transform: translateY(16px) scale(.975); pointer-events: none;
    }
    .chat-toggle {
      position: fixed; left: 50%; bottom: 26px; translate: -50% 0; z-index: 9;
      display: inline-flex; align-items: center; gap: 8px; padding: 10px 20px;
      border-radius: 999px; border: 1px solid rgba(160, 200, 230, .35);
      background: rgba(8, 16, 32, .62); color: #dff2ff; font-size: 13px; letter-spacing: .1em;
      cursor: pointer; opacity: 0; pointer-events: none; transition: opacity .3s ease, transform .3s ease;
      backdrop-filter: blur(10px);
    }
    .chat-toggle.show { opacity: 1; pointer-events: auto; }
    .chat-toggle:hover { border-color: #a9d9db; background: rgba(18, 40, 58, .75); }
    .scene-hint {
      position: fixed; left: 50%; bottom: 76px; translate: -50% 0; z-index: 9;
      font-size: 11px; letter-spacing: .14em; color: #a7c2d5;
      opacity: 0; pointer-events: none; transition: opacity .3s ease; white-space: nowrap;
    }
    .scene-hint.show { opacity: 1; }
    /* 场景 HUD / 静音 / toast 让位给居中聊天卡 */
    #hud {
      left: clamp(20px, 4vw, 64px); right: auto; top: clamp(20px, 5vh, 56px); bottom: auto;
      display: flex; flex-direction: column; gap: 6px; z-index: 3;
    }
    #mute { left: auto; right: clamp(20px, 4vw, 64px); z-index: 4; }
    .toast { left: clamp(20px, 4vw, 64px); transform: none; z-index: 4; }
    @media (max-width: 820px) {
      #chatContainer { padding: 0; align-items: flex-end; }
      .chat-wrap { width: 100%; height: 62vh; padding: 8px 10px 10px; justify-content: flex-end; }
      #chatPane { border-radius: 18px 18px 0 0; border-bottom: 0; }
      .msg-side { display: none; }
      .chat-head { padding: 12px 14px 0; }
      #chatLog { padding: 4px 12px 0; }
      .chat-input-row { margin: 8px 10px 10px; }
      #hud { top: 16px; left: 16px; font-size: 10px; }
      #mute { top: 16px; right: 16px; }
      .toast { left: 16px; bottom: calc(62vh + 14px); }
      .chat-toggle { bottom: 18px; }
      .scene-hint { bottom: 64px; font-size: 10px; }
    }
  </style>
</head>
<body>
  <!-- index 点鸟飞走后铺的就是这一层统一加载层（夜空 + 雪花 + 跑动 Madeline），
       场景首帧提交后由 js/page-loading.js 加 .done 淡出 -->
  <div id="pageLoadingOverlay">
    <div class="ld-stars"></div>
    <div class="ld-stars2"></div>
    <canvas id="ldSnowCanvas"></canvas>
    <div class="ld-snow-strip"></div>
    <div class="loading-madeline"></div>
    <div class="loading-text">LOADING<span class="loading-dots"></span></div>
  </div>
  <canvas id="scene" aria-label="第九章铭记场景：明亮星海中的浮空跳板与月球生物"></canvas>
  <div class="vignette"></div>
  <div class="hud" id="hud"><span id="hudHeart">空无&nbsp; 0 / 1</span><span id="hudCollect">草莓 0/10 · 水母 0/4 · 羽毛 0/6</span></div>
  <button class="mute" id="mute" type="button" title="静音（M）">&#9835;</button>
  <div class="toast" id="toast">拾起「空无」</div>
  <!-- messages.js 的雪花层：场景之上、聊天下方 -->
  <canvas id="snowCanvas" style="position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:2;opacity:.55;"></canvas>

  <!-- ===== 实时聊天室（原 messages.html 的 UI，去掉左栏通知，只留山间聊天） ===== -->
  <div id="chatContainer" v-cloak>
    <button id="chatToggle" class="chat-toggle" :class="{show: chatHidden}" type="button" @click="toggleChat">山间聊天</button>
    <div class="scene-hint" :class="{show: chatHidden}">A / D 移动 · Space 跳 · X 冲刺 · Enter 聊天</div>
    <div class="chat-login-tip" v-if="!loggedIn">
      请先<a href="login.html" style="color:#ffe36d">登录</a>，才能进入实时聊天。
    </div>
    <div class="chat-wrap" v-else>
      <div class="msg-layout">
        <aside class="msg-side">
          <div class="msg-side-title">消息</div>
          <div class="msg-side-item" :class="{active: pane === 'chat'}" @click="pane = 'chat'"><span class="rail-ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 18.5l6.2-9.5 3.3 5.2 2.3-3.2L21 18.5z"/><circle cx="16.4" cy="6" r="1.1" fill="currentColor" stroke="none"/></svg></span>山间聊天</div>
        </aside>
        <div class="msg-main">
          <div id="chatPane" v-show="pane === 'chat'">
            <div class="chat-head">
              <div class="head-id">
                <div class="group-av"><svg viewBox="0 0 24 24" fill="none" stroke="#8fc4ff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 18.5l6.2-9.5 3.3 5.2 2.3-3.2L21 18.5z"/><circle cx="16.4" cy="6" r="1.1" fill="#fff3a3" stroke="none"/></svg></div>
                <div class="chat-title">铭记 · 山间聊天</div>
              </div>
              <div class="chat-status" :class="statusState"><span class="dot"></span><span>{{ statusText }}</span></div>
            </div>
            <div id="chatLog">
              <div v-if="logStatus === 'loading'" class="chat-empty">正在拉取聊天记录…</div>
              <div v-else-if="logStatus === 'empty'" class="chat-empty">还没有人说话，发第一条消息试试～</div>
              <div v-else-if="logStatus === 'error'" class="chat-empty">历史记录加载失败。</div>
              <template v-else>
                <template v-for="it in items" :key="it.key">
                  <div v-if="it.t === 'time'" class="chat-time"><span>{{ it.label }}</span></div>
                  <div v-else-if="it.t === 'sys'" class="chat-sys">{{ it.text }}</div>
                  <div v-else-if="it.t === 'msg'" class="chat-msg" :class="it.mine ? 'me' : 'other'" :data-key="it.ik">
                    <template v-if="it.mine">
                      <div class="body">
                        <div v-if="!it.chain" class="nm">{{ it.name }}</div>
                        <div class="bubble" :title="it.title" v-html="it.html"></div>
                      </div>
                      <div v-if="it.chain" class="av placeholder"></div>
                      <div v-else class="av" :style="{background: 'hsl(' + it.hue + ' 52% 55%)'}">{{ it.initial }}</div>
                    </template>
                    <template v-else>
                      <div v-if="it.chain" class="av placeholder"></div>
                      <div v-else-if="it.isBird" class="av bird"><img src="Atlases/WaveDashing/Bird%20Clip%20Art.png" alt="bird"></div>
                      <div v-else class="av" :style="{background: 'hsl(' + it.hue + ' 52% 55%)'}">{{ it.initial }}</div>
                      <div class="body">
                        <div v-if="!it.chain" class="nm">{{ it.name }}</div>
                        <div class="bubble" :title="it.title" v-html="it.html"></div>
                      </div>
                    </template>
                  </div>
                </template>
                <div v-if="typingName" class="chat-msg other typing-row">
                  <div class="av placeholder"></div>
                  <div class="body"><div class="nm typing-name">{{ typingName }} 正在输入</div>
                  <div class="bubble typing-bubble"><i></i><i></i><i></i></div></div>
                </div>
              </template>
            </div>
            <div class="chat-input-row" id="chatInputRow" v-show="pane === 'chat'">
              <div class="emoji-wrap">
                <button type="button" id="emojiBtn" class="emoji-btn" title="插入表情" aria-label="插入表情" @click.stop="emojiOpen = !emojiOpen">
                  <img src="Atlases/Portraits/madeline/peaceful00.png" alt="表情" decoding="async">
                </button>
                <div id="emojiPanel" class="emoji-panel" :class="{open: emojiOpen}" @click.stop>
                  <div class="emoji-tabs">
                    <button type="button" class="emoji-tab" v-for="s in seriesList" :key="s.key"
                      :class="{active: emojiSeries === s.key}" @click="emojiSeries = s.key">{{ s.label }}</button>
                  </div>
                  <div class="emoji-grid" id="emojiGrid">
                    <button type="button" class="emoji-cell" v-for="e in currentEmojis" :key="e.n"
                      :title="e.n" @click="insertEmoji(e.mark)">
                      <img loading="lazy" :src="e.src" :alt="e.n" :data-series="emojiSeries" :data-emo="e.n" decoding="async">
                    </button>
                  </div>
                </div>
              </div>
              <input type="text" id="chatInput" maxlength="500" placeholder="说点什么…（Enter 发送）" autocomplete="off"
                v-model="draft" @keydown="onInputKey" @input="onTypeInput">
              <button id="chatSend" title="发送" aria-label="发送" :disabled="sending" @click="doSend">↑</button>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="js/celeste-hair.js"></script>
  <script src="js/celeste-character.js?v=20261102b"></script>
  <script src="js/bird-motion.js?v=20261031a"></script>
  <script src="js/page-loading.js?v=20261101a"></script>
  <script>
  (async function () {
    'use strict';
    const BASE = 'Atlases/Gameplay/';
    // 1 游戏单位 = Z 屏幕像素；矮屏幕降到 3×，保证竖屏也能看清人物
    const Z = window.innerHeight >= 700 ? 4 : 3;
    const TEST = location.search.indexOf('scenetest') >= 0;

    const cv = document.getElementById('scene');
    const ctx = cv.getContext('2d');
    const hudEl = document.getElementById('hud');
    const hudHeartEl = document.getElementById('hudHeart');
    const hudCollectEl = document.getElementById('hudCollect');
    const toastEl = document.getElementById('toast');
    const muteBtn = document.getElementById('mute');
    let W = 0, H = 0, dpr = 1;

    function resize() {
      // 场景是像素材质（image-rendering:pixelated），按 1x CSS 像素渲染即可：
      // 高 DPI 下原来按 dpr=2 渲染，每帧要填 4 倍像素，视差/粒子一多就掉帧。
      dpr = 1;
      W = window.innerWidth; H = window.innerHeight;
      cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr);
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      ctx.imageSmoothingEnabled = false;
      // cv.width 赋值会清空画布：立即补一帧，否则窗口尺寸变化后会白屏到下一帧
      if (m) render();
    }
    window.addEventListener('resize', resize);

    // ===== 素材加载（全部来自 Atlases）=====
    function loadImage(src) {
      return new Promise(res => {
        const i = new Image();
        i.onload = () => res(i);
        i.onerror = () => res(null);
        i.src = src;
      });
    }
    const IMG = {};
    const TEX = {};                     // (图源|颜色|翻转) → 预乘色画布
    // XNA 的 SpriteBatch 是用 Color 相乘；这里用 multiply + destination-in 复刻：
    // 既把 RGB 乘上目标色，又靠 destination-in 把 alpha 还原，不会像 source-in 那样变成纯色剪影
    function tinted(key, color, flipX, flipY) {
      const ck = key + '|' + (color || '-') + (flipX ? '|x' : '') + (flipY ? '|y' : '');
      if (TEX[ck] !== undefined) return TEX[ck];
      const img = IMG[key];
      if (!img) return null;
      if (!color && !flipX && !flipY) { TEX[ck] = img; return img; }
      const c = document.createElement('canvas');
      c.width = img.width; c.height = img.height;
      const g = c.getContext('2d');
      const place = () => {
        g.setTransform(1, 0, 0, 1, 0, 0);
        if (flipX) { g.translate(c.width, 0); g.scale(-1, 1); }
        if (flipY) { g.translate(0, c.height); g.scale(1, -1); }
        g.drawImage(img, 0, 0);
      };
      place();
      if (color) {
        g.setTransform(1, 0, 0, 1, 0, 0);
        g.globalCompositeOperation = 'multiply';
        g.fillStyle = color;
        g.fillRect(0, 0, c.width, c.height);
        g.globalCompositeOperation = 'destination-in';
        place();
      }
      TEX[ck] = c;
      return c;
    }
    function preload() {
      const jobs = [];
      const put = (key, path) => jobs.push(loadImage(path).then(i => { IMG[key] = i; }));
      // stylegrounds：bgs/10/skybrighter（Game 图集）+ mist / purplesunset（Misc 图集，见 ParseBackdrop 的 atlas 分支）
      put('sky', BASE + 'bgs/10/skybrighter.png');
      put('mist', 'Atlases/Misc/mist.png');
      put('sun', 'Atlases/Misc/purplesunset.png');
      for (let i = 0; i < 3; i++) put('bgs/10/big' + i, BASE + 'bgs/10/big0' + i + '.png');
      for (let i = 0; i < 7; i++) put('bgs/10/small' + i, BASE + 'bgs/10/small0' + i + '.png');
      for (let i = 0; i < 4; i++) put('sf' + i, BASE + 'particles/starfield/0' + i + '.png');
      // 本段（e-00z）的真实实体：spinner → moonBlade(danger/starfish)、moonCreature → tiny、floatingDebris、木跳板
      for (let i = 0; i < 21; i++) put('blade' + i, BASE + 'danger/starfish' + String(i).padStart(2, '0') + '.png');
      for (let i = 0; i < 6; i++) put('creature' + i, BASE + 'scenery/moon_creatures/tiny0' + i + '.png');
      put('debris', BASE + 'scenery/debris.png');
      for (let i = 0; i < 14; i++) put('heart' + i, BASE + 'collectables/heartGem/ghost' + String(i).padStart(2, '0') + '.png');
      // floatySpaceBlock 的 tiletype 全是 'm' → ForegroundTiles.xml 的 lostlevels 自动瓦片集；
      // jumpThru 的 texture 全是 'default' → 第九章 AreaData.Jumpthru = "wood"
      put('lost', BASE + 'tilesets/lostlevels.png');
      put('jt', BASE + 'objects/jumpthru/wood.png');
      // 聊天互动素材：草莓 wings 10 帧（flap）· 水母 glider idle 10 / held 1 / fall 3 / fallLoop 2 / death 8
      // · 金羽毛 idle/flash 各 21 帧 · 星飞球体 starFly00 · 变形 startStarFly 4 帧
      for (let i = 0; i < 10; i++) put('berry' + i, BASE + 'collectables/strawberry/wings0' + i + '.png');
      for (let i = 0; i < 10; i++) put('jelly' + i, BASE + 'objects/glider/idle' + i + '.png');
      put('jellyHeld', BASE + 'objects/glider/held0.png');
      for (let i = 0; i < 3; i++) put('jellyFall' + i, BASE + 'objects/glider/fall' + i + '.png');
      for (let i = 0; i < 2; i++) put('jellyFallLoop' + i, BASE + 'objects/glider/fallLoop' + i + '.png');
      for (let i = 0; i < 8; i++) put('jellyDeath' + i, BASE + 'objects/glider/death0' + i + '.png');
      for (let i = 0; i < 21; i++) {
        put('feather' + i, BASE + 'objects/flyFeather/idle' + String(i).padStart(2, '0') + '.png');
        put('feather' + (21 + i), BASE + 'objects/flyFeather/flash' + String(i).padStart(2, '0') + '.png');
      }
      put('orb', BASE + 'characters/player/starFly00.png');
      for (let i = 0; i < 4; i++) put('morph' + i, BASE + 'characters/player/startStarFly0' + i + '.png');
      return Promise.all(jobs);
    }

    // ===== 关卡几何：lvl_e-00z（铭记段爬升房间，624×432）=====
    // 全部数据来自 LostLevels.bin。坐标换成「相对出生点」的世界坐标：房间 (312,376) → 世界 (0,0)
    const SPAWN = { x: 312, y: 376 };
    const ROOM = { w: 624, h: 432 };
    // floatySpaceBlock ×25 —— [x, y, w, h]（房间坐标，y 是顶面）
    const BLOCK_RECTS = [
      [232, 320, 16, 16], [360, 296, 32, 32], [384, 336, 32, 8], [368, 328, 24, 8],
      [392, 312, 24, 24], [264, 264, 24, 24], [288, 256, 16, 24], [136, 336, 32, 24],
      [168, 344, 16, 16], [144, 360, 32, 8], [288, 280, 8, 8], [352, 192, 32, 24],
      [384, 200, 32, 16], [368, 216, 24, 16], [232, 144, 24, 24], [256, 152, 24, 32],
      [240, 168, 16, 8], [184, 216, 24, 16], [192, 232, 16, 16], [400, 128, 24, 24],
      [424, 144, 16, 16], [416, 152, 8, 8], [320, 80, 32, 24], [352, 88, 16, 32],
      [336, 104, 16, 8]
    ];
    const BLOCKS = BLOCK_RECTS.map(r => ({ x: r[0] - SPAWN.x, y: r[1] - SPAWN.y, w: r[2], h: r[3] }));
    // jumpThru ×9 —— [x, y, w]
    const JT_RECTS = [
      [280, 376, 16], [328, 376, 16], [304, 424, 16], [280, 176, 16], [248, 272, 16],
      [416, 208, 16], [168, 224, 16], [344, 312, 16], [296, 88, 24]
    ];
    const JTS = JT_RECTS.map(r => ({ x: r[0] - SPAWN.x, y: r[1] - SPAWN.y, w: r[2] }));
    // exitBlock（80×64）：出生点就站在这道门上
    const DOOR = { x: 272 - SPAWN.x, y: 376 - SPAWN.y, w: 80, h: 64 };

    const TILE = 8;                                   // 地图与图集都是 8px 瓦片
    const VOID = 9999;
    // 可站立面 = 方块顶面 + 跳板 + 门顶。x/ y 全用世界坐标
    const SOLIDS = BLOCKS.map(b => ({ x0: b.x, x1: b.x + b.w, top: b.y }))
      .concat(JTS.map(j => ({ x0: j.x, x1: j.x + j.w, top: j.y })))
      .concat([{ x0: DOOR.x, x1: DOOR.x + DOOR.w, top: DOOR.y }]);
    // 单向地面：只认「本帧起点脚面」以下最高的那层，所以能从下方穿过方块、再从上方落上去。
    // 阈值必须用移动前的脚面（feetPrev）而不是当前脚面：下落一帧最多 2.7px，
    // 用当前脚面会把刚越过的块顶判成「头顶平台」而穿模落地。
    let feetPrev = 0;
    function groundY(x) {
      const feet = m ? m.y : 0;
      const ref = Math.min(feet, feetPrev);
      let best = VOID;
      for (let i = 0; i < SOLIDS.length; i++) {
        const s = SOLIDS[i];
        if (x + 4 <= s.x0 || x - 4 >= s.x1) continue;   // 玩家碰撞箱宽 8
        if (s.top < ref - 1) continue;                  // 起点脚面以上的方块不参与
        if (s.top < best) best = s.top;
      }
      return best;
    }

    // ===== 墙体：浮空块 + 门体的侧面（jumpThru 是单向板，不挡横向）=====
    // 碰撞盒照原作 Hitbox 8×11：以脚面为原点，半宽 4、身高 11
    const WALLS = BLOCKS.concat([{ x: DOOR.x, y: DOOR.y, w: DOOR.w, h: DOOR.h }]);
    const HALF_W = 4, BODY_H = 11, WALL_PROBE = 4;
    // 能挡头的天花板：只有实心块 + 门体（jumpThru 是单向板，从下往上穿得过去）
    const CEILINGS = WALLS;
    // 身体盒探针用的实心体：额外把跳板算进去（站在跳板上时脚下也算有地板，不该播 edge）
    const RECTS = WALLS.concat(JTS.map(j => ({ x: j.x, y: j.y, w: j.w, h: 8 })));
    // 严格物理阻挡：返回被撞墙面的 x，null = 没撞（签名对齐 celeste-character 的 wallCollideFn）
    function wallCollideFn(px, feetY, dir) {
      const top = feetY - BODY_H;
      for (let i = 0; i < WALLS.length; i++) {
        const b = WALLS[i];
        if (b.y >= feetY || b.y + b.h <= top) continue;          // 垂直不重叠
        if (px + HALF_W <= b.x || px - HALF_W >= b.x + b.w) continue;
        return dir > 0 ? b.x : b.x + b.w;
      }
      return null;
    }
    // 宽容的贴墙检测（wallAtFn：攀爬 / 墙跳 / 墙滑都用它）
    function wallAtFn(px, feetY, dir) {
      const x = px + dir * WALL_PROBE, top = feetY - BODY_H;
      for (let i = 0; i < WALLS.length; i++) {
        const b = WALLS[i];
        if (b.y >= feetY || b.y + b.h <= top) continue;
        if (x < b.x || x >= b.x + b.w) continue;
        return dir > 0 ? b.x : b.x + b.w;
      }
      return null;
    }

    // 原作 CollideCheck<Solid>(Position + offset)：脚底在 (px, feetY) 时，8×11 身体盒是否与实心重叠。
    // push（朝墙推）/ edge（身体前探 2、4px 后全空）/ dangling（攀爬时面前 6px 无墙）都靠它。
    function bodySolidFn(px, feetY) {
      const top = feetY - BODY_H;
      for (let i = 0; i < RECTS.length; i++) {
        const b = RECTS[i];
        if (b.x >= px + HALF_W || b.x + b.w <= px - HALF_W) continue;
        if (b.y >= feetY || b.y + b.h <= top) continue;
        return true;
      }
      return false;
    }

    // 头顶天花板：返回与头部重叠、且最靠下的实心底边；null = 头顶没东西。
    // 对应原作 OnCollideV 的 Speed.Y < 0 分支（撞头 + 4px/5px 向上角修正）。
    function ceilingY(px, feetY) {
      const head = feetY - BODY_H;
      let best = null;
      for (let i = 0; i < CEILINGS.length; i++) {
        const b = CEILINGS[i];
        if (b.x >= px + HALF_W || b.x + b.w <= px - HALF_W) continue;
        if (b.y >= feetY) continue;                   // 顶面在脚底或以下 → 那是地板
        const bottom = b.y + b.h;
        if (bottom <= head + 0.01) continue;          // 底边还在头顶上方 → 没重叠
        if (best === null || bottom > best) best = bottom;
      }
      return best;
    }

    // ===== 迷你 Autotiler：逐指令复刻 Celeste.Autotiler::orig_TileHandler =====
    // 数据源 Graphics/ForegroundTiles.xml：tileset "m" copy="z" path="lostlevels"，
    // 并覆盖了 z 的 padding / center 两组（z 的 5,12 单帧在 m 里被换成一串随机帧）。
    // IL 判定顺序：3×3 全实心 → （四向 16px 内还有实心 ? Center : Padded），
    //               否则按 Masked 列表顺序取第一个 3×3 mask 匹配项。
    const AT_EDGES = [
      ['x0x-111-x1x', 0], ['x1x-111-x0x', 1], ['x1x-011-x1x', 2], ['x1x-110-x1x', 3],
      ['x0x-111-x0x', 4], ['x1x-010-x1x', 5], ['x0x-010-x1x', 6], ['x1x-010-x0x', 7],
      ['x0x-011-x0x', 8], ['x0x-110-x0x', 9], ['x0x-010-x0x', 10], ['x0x-011-x1x', 11],
      ['x0x-110-x1x', 12], ['x1x-011-x0x', 13], ['x1x-110-x0x', 14]
    ];
    const AT_CORNERS = {
      '111-111-110': [4, 0], '110-111-111': [4, 1], '111-111-011': [4, 2], '011-111-111': [4, 3],
      '110-111-110': [4, 4], '010-111-111': [4, 5], '011-111-011': [4, 6], '111-111-010': [4, 7],
      '010-111-110': [4, 8], '010-111-011': [4, 9], '011-111-010': [4, 10], '110-111-010': [4, 11],
      '010-111-010': [4, 12], '110-111-011': [4, 13], '011-111-110': [4, 14]
    };
    // m 的 padding 覆盖：5,0..5,5（孤立小块的收边贴图）
    const AT_PADDED = [0, 1, 2, 3, 4, 5].map(r => [5, r]);
    // m 的 center 覆盖：5,6 权重最高，其余 5,7-5,11 / 5,13-5,14 各两票，5,12 一票
    const AT_CENTER_TILES = [[5, 6], [5, 6], [5, 6], [5, 6], [5, 6], [5, 6], [5, 6],
      [5, 6], [5, 6], [5, 6], [5, 6], [5, 6], [5, 6], [5, 6],
      [5, 7], [5, 8], [5, 9], [5, 10], [5, 11], [5, 13], [5, 14],
      [5, 7], [5, 8], [5, 9], [5, 10], [5, 11], [5, 13], [5, 14], [5, 12]];
    let blockTiles = new Set();      // 世界坐标里所有 8px 实心格
    let blockSprites = [];           // { wx, wy, sx, sy }：预计算到图集的源坐标（静态几何，只算一次）
    let doorTiles = new Set();       // exitBlock 占的格子（单独一套，不参与浮空块的邻域判定）
    let doorSprites = [];
    const solidIn = (set, tx, ty) => set.has(tx + ',' + ty);
    function maskOf(set, tx, ty) {
      const b = (x, y) => (solidIn(set, x, y) ? '1' : '0');
      return b(tx - TILE, ty - TILE) + b(tx, ty - TILE) + b(tx + TILE, ty - TILE) + '-' +
             b(tx - TILE, ty) + '1' + b(tx + TILE, ty) + '-' +
             b(tx - TILE, ty + TILE) + b(tx, ty + TILE) + b(tx + TILE, ty + TILE);
    }
    // 原作 Tiles 集合里的随机取帧：用坐标哈希代替 RNG，保证构图不随刷新跳变
    function pickTile(list, tx, ty) {
      let h = Math.imul(tx | 0, 374761393) + Math.imul(ty | 0, 668265263);
      h = Math.imul(h ^ (h >>> 13), 1274126177);
      return list[((h ^ (h >>> 16)) >>> 0) % list.length];
    }
    function autoTile(set, tx, ty) {
      // ① 3×3 全实心
      let all = true;
      for (let dy = -1; dy <= 1 && all; dy++) {
        for (let dx = -1; dx <= 1; dx++) {
          if (!solidIn(set, tx + dx * TILE, ty + dy * TILE)) { all = false; break; }
        }
      }
      if (all) {
        // ② 四向 2 格外还有实心 → Center；一片空 → Padded（孤立小块）
        const far = solidIn(set, tx - 2 * TILE, ty) || solidIn(set, tx + 2 * TILE, ty) ||
                    solidIn(set, tx, ty - 2 * TILE) || solidIn(set, tx, ty + 2 * TILE);
        return pickTile(far ? AT_CENTER_TILES : AT_PADDED, tx, ty);
      }
      // ③ 边集：按 XML 顺序取第一个匹配的 mask，4 个变体随机
      const m9 = maskOf(set, tx, ty);
      for (let i = 0; i < AT_EDGES.length; i++) {
        const pat = AT_EDGES[i][0];
        let ok = true;
        for (let c = 0; c < 11 && ok; c++) {
          const p = pat[c];
          if (p !== '-' && p !== 'x' && p !== m9[c]) ok = false;
        }
        if (ok) {
          const row = AT_EDGES[i][1];
          const col = Math.abs((tx / TILE) * 7 + (ty / TILE) * 13) % 4;    // 4 个变体里挑一个
          return [col, row];
        }
      }
      // ④ 角集（三面实心的内凹角），都没有就退回 center 随机帧
      return AT_CORNERS[m9] || pickTile(AT_CENTER_TILES, tx, ty);
    }
    function tileSetOf(rect) {
      const set = new Set();
      for (let ty = rect.y; ty < rect.y + rect.h; ty += TILE)
        for (let tx = rect.x; tx < rect.x + rect.w; tx += TILE)
          set.add(tx + ',' + ty);
      return set;
    }
    function spritesOf(rects, set) {
      const out = [];
      for (const b of rects) {
        for (let ty = b.y; ty < b.y + b.h; ty += TILE) {
          for (let tx = b.x; tx < b.x + b.w; tx += TILE) {
            const t = autoTile(set, tx, ty);
            out.push({ wx: tx, wy: ty, sx: t[0] * TILE, sy: t[1] * TILE });
          }
        }
      }
      return out;
    }
    function buildBlockSprites() {
      blockTiles = new Set();
      for (const b of BLOCKS)
        for (let ty = b.y; ty < b.y + b.h; ty += TILE)
          for (let tx = b.x; tx < b.x + b.w; tx += TILE)
            blockTiles.add(tx + ',' + ty);
      blockSprites = spritesOf(BLOCKS, blockTiles);
      // exitBlock：原作 ExitBlock.Added 用 GFX.FGAutotiler 按自身矩形 + tileType 生成 TileGrid（Depth -13000），
      // 地图里这个 exitBlock 的 tileType 就是 'm'，所以门体也是一片 lostlevels 自动瓦片
      doorTiles = tileSetOf(DOOR);
      doorSprites = spritesOf([DOOR], doorTiles);
    }
    buildBlockSprites();

    // ===== 输入：字段集对齐 celeste-character 的 update(dt, input) 完整接口 =====
    // 键位照原作默认：跳跃 Space/C · 冲刺 X/K · 抓墙 Shift/Z
    const keys = Object.create(null);
    let jumpEdge = false, dashEdge = false;
    // 在聊天输入框里打字时不操控 Madeline（否则 a/d/空格 会变成移动和跳跃）
    const typingInChat = e => {
      const t = e.target;
      return !!(t && (t.tagName === 'INPUT' || t.tagName === 'TEXTAREA' || t.isContentEditable));
    };
    window.addEventListener('keydown', e => {
      if (typingInChat(e)) return;
      const k = e.key.toLowerCase();
      const first = !keys[k];
      keys[k] = true;
      if (first && (e.code === 'Space' || k === ' ')) { keys[' '] = true; jumpEdge = true; e.preventDefault(); }
      if (first && k === 'c') jumpEdge = true;
      if (first && (k === 'x' || k === 'k')) dashEdge = true;
      if (k === 'r') respawn();
      if (k === 'm') toggleMute();
      startAudio();
    });
    window.addEventListener('keyup', e => {
      if (typingInChat(e)) return;
      const k = e.key.toLowerCase();
      keys[k] = false;
      if (e.code === 'Space') keys[' '] = false;
    });
    window.addEventListener('blur', () => { for (const k in keys) keys[k] = false; jumpEdge = dashEdge = false; });

    // ===== BGM =====
    const bgm = new Audio('bgm/in-stasis.mp3');
    bgm.loop = true; bgm.volume = 0.24; bgm.preload = 'auto';
    let audioStarted = false, muted = false;
    function startAudio() {
      if (audioStarted) return;
      audioStarted = true;
      bgm.play().catch(() => {});
    }
    function toggleMute() {
      muted = !muted;
      bgm.muted = muted;
      muteBtn.innerHTML = muted ? '&#128263;' : '&#9835;';
      if (!muted) startAudio();
    }
    muteBtn.addEventListener('click', e => { e.stopPropagation(); toggleMute(); });
    window.addEventListener('pointerdown', startAudio);

    // ===== 背景：逐行复刻 Celeste.MapData::ParseBackdrop + Starfield/Planets/Parallax::Render =====
    // 原作在 320×180 逻辑屏上绘制背景，这里等比映射到实际画布；随机分布用固定种子，构图不随 resize 跳变
    function makeRng(seed) {
      let s = seed;
      return () => { s = (s * 16807) % 2147483647; return (s - 1) / 2147483646; };
    }
    const mod = (x, m) => ((x % m) + m) % m;
    const cubeIn = t => t * t * t;   // Ease.CubeIn
    // XNA 的 Color.Lerp(c, Transparent, t) 是通道 + alpha 一起向 0 插值，等价于 RGB 与 alpha 同乘 (1-t)
    function shadeHex(hex, f) {
      const n = parseInt(hex.slice(1), 16);
      const r = Math.round(((n >> 16) & 255) * (1 - f));
      const g = Math.round(((n >> 8) & 255) * (1 - f));
      const b = Math.round((n & 255) * (1 - f));
      return '#' + ((1 << 24) | (r << 16) | (g << 8) | b).toString(16).slice(1);
    }

    // Starfield.cs：15 个 Y 节点连成横向流带（StepSize=32），128 颗星沿带流动并沿法线方向呼吸摆动
    class Starfield {
      constructor(speed, scrollX, scrollY, color, seed) {
        this.speed = speed;
        this.scrollX = scrollX; this.scrollY = scrollY;
        this.color = color;
        this.count = 1;
        const rnd = makeRng(seed);
        const nodes = [];
        let y = rnd() * 180;
        for (let i = 0; i < 15; i++) {                    // Steps = 15
          nodes.push(y);
          y += (rnd() < 0.5 ? -1 : 1) * (16 + rnd() * 24);
        }
        for (let i = 0; i < 4; i++) {                     // 末 4 节点向首节点插值闭合
          const idx = nodes.length - 1 - i;
          nodes[idx] += (nodes[0] - nodes[idx]) * (1 - i / 4);
        }
        this.nodes = nodes;
        this.stars = [];
        for (let i = 0; i < 128; i++) {
          const r = rnd();
          // Color.Lerp(color, Transparent, r*0.5)：亮度与 alpha 同步衰减，量化成 5 档贴图避免每帧重新着色
          const shade = Math.round(r * 2) / 4 * 0.5;
          const star = {
            nodeIndex: Math.floor(rnd() * (nodes.length - 1)),
            nodePercent: rnd(),
            distance: 4 + r * 20,                         // MinDist 4 ~ MaxDist 24
            sine: rnd() * Math.PI * 2,
            shade: shade,
            alpha: 1 - shade,
            tex: Math.max(0, Math.min(3, Math.floor(cubeIn(1 - r) * 4))),
            x: 0, y: 0
          };
          const p = this.targetOf(star);
          star.x = p.x; star.y = p.y;
          this.stars.push(star);
        }
      }
      targetOf(s) {
        const x1 = s.nodeIndex * 32, y1 = this.nodes[s.nodeIndex];
        const x2 = (s.nodeIndex + 1) * 32, y2 = this.nodes[s.nodeIndex + 1];
        const px = x1 + (x2 - x1) * s.nodePercent;
        const py = y1 + (y2 - y1) * s.nodePercent;
        const dx = x2 - x1, dy = y2 - y1;
        const len = Math.hypot(dx, dy) || 1;
        const d = s.distance * Math.sin(s.sine);          // 法线 (-dy, dx) 方向偏移
        return { x: px + (-dy / len) * d, y: py + (dx / len) * d };
      }
      update(dt) {
        const k = dt * 60;                                // 原作趋近是逐帧 /50，按 60fps 归一
        for (const s of this.stars) {
          s.sine += dt * this.speed;
          s.nodePercent += dt * 0.25 * this.speed;
          if (s.nodePercent >= 1) {
            s.nodePercent -= 1;
            s.nodeIndex++;
            if (s.nodeIndex >= this.nodes.length - 1) { s.nodeIndex = 0; s.x -= 448; }
          }
          const t = this.targetOf(s);
          s.x += (t.x - s.x) / 50 * k;
          s.y += (t.y - s.y) / 50 * k;
        }
      }
      render(camX, camY) {
        const sx = W / 320, sy = H / 180;
        for (const s of this.stars) {
          const img = tinted('sf' + s.tex, shadeHex(this.color, s.shade));
          if (!img) continue;
          const lx = -64 + mod(s.x - camX * this.scrollX, 448);
          const ly = -16 + mod(s.y - camY * this.scrollY, 212);
          const w = img.width * sx, h = img.height * sy;
          ctx.globalAlpha = s.alpha;
          ctx.drawImage(img, Math.round(lx * sx - w / 2), Math.round(ly * sy - h / 2), w, h);
        }
        ctx.globalAlpha = 1;
      }
    }

    // Planets.cs：Position = (NextFloat(640), NextFloat(360))，DrawCentered + wrap；color 由 styleground 的 color 属性相乘
    class Planets {
      constructor(count, size, scroll, color, seed) {
        this.count = count;
        this.size = size;
        this.scroll = scroll;
        this.color = color;
        const texCount = size === 'big' ? 3 : 7;          // bgs/10/big00-02 · bgs/10/small00-06
        const rnd = makeRng(seed);
        this.planets = [];
        for (let i = 0; i < count; i++) {
          this.planets.push({
            tex: 'bgs/10/' + size + String(Math.floor(rnd() * texCount)).padStart(2, '0'),
            x: rnd() * 640, y: rnd() * 360
          });
        }
      }
      render(camX, camY) {
        const sx = W / 320, sy = H / 180;
        for (const p of this.planets) {
          const img = tinted(p.tex, this.color);
          if (!img) continue;
          const lx = -32 + mod(p.x - camX * this.scroll, 640);
          const ly = -32 + mod(p.y - camY * this.scroll, 360);
          const w = img.width * sx, h = img.height * sy;
          ctx.drawImage(img, Math.round(lx * sx - w / 2), Math.round(ly * sy - h / 2), w, h);
        }
      }
    }

    // Parallax.cs：Position += Speed*dt；绘制于 Floor(Position - Camera.Position * Scroll)，Loop 时按贴图尺寸平铺
    class Parallax {
      constructor(tex, scroll, speed, color, alpha, loop, flip, additive) {
        this.tex = tex;
        this.scroll = scroll;
        this.speed = speed;
        this.color = color;
        this.alpha = alpha;
        this.loop = loop;
        this.flip = !!flip;
        this.additive = !!additive;
        this.pos = { x: 0, y: 0 };
      }
      update(dt) {
        this.pos.x += this.speed.x * dt;                  // Backdrop::Update：Position += Speed * DeltaTime
        this.pos.y += this.speed.y * dt;
      }
      render(camX, camY) {
        const img = tinted(this.tex, this.color, this.flip);
        if (!img) return;
        const sx = W / 320, sy = H / 180;
        const tw = img.width, th = img.height;             // mist 600×600 · purplesunset 500×280 · skybrighter 320×180
        const px = Math.round(this.pos.x - camX * this.scroll);
        const py = Math.round(this.pos.y - camY * this.scroll);
        ctx.globalCompositeOperation = this.additive ? 'lighter' : 'source-over';
        ctx.globalAlpha = this.alpha;
        if (this.loop) {
          const ox = mod(px, tw) - tw;
          const oy = mod(py, th) - th;
          for (let y = oy; y < 180; y += th) {
            for (let x = ox; x < 320; x += tw) {
              ctx.drawImage(img, x * sx, y * sy, tw * sx, th * sy);
            }
          }
        } else {
          ctx.drawImage(img, px * sx, py * sy, tw * sx, th * sy);
        }
        ctx.globalAlpha = 1;
        ctx.globalCompositeOperation = 'source-over';
      }
    }

    // —— 铭记段（Farewell · Remembered）真实分层 ——
    // 来源：LostLevels.bin 的 /Map/Style/Backgrounds|Foregrounds 中 tag="bright" 组
    // （only: e-*,f-door,f-00,f-01,f-02；exclude: e-00y,e-00yb），顺序与参数照地图原样
    const LAYERS = [
      new Parallax('sky', 0, { x: 0, y: 0 }, null, 1, false, false, false),          // bgs/10/skybrighter，Scroll 0 → 固定天穹
      new Planets(32, 'small', 0.1, '#3b66a8', 1101),                                 // 远层行星：32 颗，冷蓝 #3b66a8
      new Parallax('mist', 0.15, { x: 2, y: 0 }, '#b03b94', 1, true, false, false),   // 品红星云，缓速右移

    // ===== 相机：跟随玩家，并夹在房间 624×432 内（同 Level.Camera 的 Clamp）=====
    const CAM_LEAD_Y = 0.62;                  // 玩家稳在屏幕 62% 高度
    function camBounds() {

    function updateCam(dt) {

      cam.y += (m.y + SPAWN.y - vh * CAM_LEAD_Y - cam.y) * k;

    // ===== 聊天互动：草莓跟随 / 水母 / 金羽毛 StarFly =====
    // 证据（Celeste.dll）：
    //   · Leader::Update → MaxPastPoints=350；OnInterval(0.02) 且位移 ≥3 才 Insert(0,pos)；
    //     第 i 个 follower 取 PastPoints[5*(i+1)]，num 每次 +=5
    //   · Follower::Update 只看 DelayTimer；Strawberry::Added 设 FollowDelay=0.3
    //   · 逼近：Position += (target - Position) * (1 - pow(0.01, dt))
    //   · Glider idle delay 0.1s（Sprites.xml）；FlyFeather idle/flash 各 21 帧 0.06s
    //   · Player.StStarFly：StartStarFly → StarFlyCoroutine(0.42s) → StarFlyUpdate(timer 2s) → StarFlyEnd
    const FOLLOW = { sample: 0.02, minDist: 3, maxPoints: 350, stepIndex: 5, delay: 0.3 };
    const CAP = { berry: 10, jelly: 4, feather: 6 };
    const STARFLY = {
      chargeAnim: 0.32, chargeTotal: 0.42,
      speedStart: 250, accel: 1000, turnRate: 5.5850534,
      vIdle: 91, vTurn: 140, vFast: 190, sameDot: 0.45,
      time: 2.0, warnTime: 0.5, warnStep: 0.05,
      wallDead: 0.2, wallRest: 0.5, exitX: 140, exitUp: 100
    };
    const BOUND = { x0: -304, x1: 304, y0: -288, y1: 48 };
    const COLLECT_R = 14;
    // —— 水母 Glider（Holdable）—
    // 证据（Celeste.dll）：
    //   · Glider..ctor：Hold = Holdable(0.3)，PickupCollider 20×22 @(-10,-16)，SlowFall=true，SlowRun=false
    //   · Player.NormalUpdate：Holding != null 时跳过攀爬；SlowFall 时 maxFall→120/24/40，重力 ×0.5
    //   · Player.Throw：Release(UnitX*Facing) → Glider.OnRelease：Speed = dir × 100，Y=0 时 -0.4；玩家后坐 -80
    //   · Holdable.Release：gravityTimer = 0.1；Player.orig_Pickup：minHoldTimer = 0.35
    //   · Glider.Update 未持有：地面 800 摩擦 + 20 侧滑；空中 200/100 重力、10/40 摩擦；
    //     Holdable.Release 的 gravityTimer=0.1 期间跳过重力与摩擦（ShouldHaveGravity）
    const GLIDER = {
      gravAir: 200, gravAirUp: 100,
      frictionUp: 40, frictionDown: 10,
      groundFriction: 800, groundSlide: 20,
      pickupDelay: 0.35, releaseGravity: 0.1,
      regrabDelay: 0.3,     // Holdable..ctor(0.3) → cannotHoldDelay；Release 后 0.3s 内不可再抓
      throwX: 100, throwY: -40, recoil: 80,
      carryY: -16,
      pickX: 10, pickTop: 16, pickBottom: 6,
      deathTime: 0.64,
      idleStep: 0.1, fallStep: 0.08,
      originY: 27.8
    };
    // Strawberry wings：Sprites.xml <Loop id="flap" delay=".08" frames="0-8,0-8,0-7,9"/>
    const BERRY_SEQ = [0, 1, 2, 3, 4, 5, 6, 7, 8, 0, 1, 2, 3, 4, 5, 6, 7, 8, 0, 1, 2, 3, 4, 5, 6, 7, 9];

    const leader = { past: [], acc: 0 };
    const berries = [], jellies = [], feathers = [];
    let heldJelly = null;
    let fly = null;
    let sceneReady = false;
    const sceneQueue = [];

    const clampN = (v, a, b) => Math.min(Math.max(v, a), b);
    function followerLerp(cur, target, dt) { return cur + (target - cur) * (1 - Math.pow(0.01, dt)); }
    function clampCount(kind, n) { return clampN(Math.round(n), 0, CAP[kind] === undefined ? n : CAP[kind]); }
    // dot = 输入方向与当前 moveDir 的点积；null = 无方向输入
    function flyTargetSpeed(dot) {
      if (dot == null) return STARFLY.vIdle;
      return dot >= STARFLY.sameDot ? STARFLY.vFast : STARFLY.vTurn;
    }
    // StarFlyEnd：按住 ↑ 一律 -100；向下速度归零
    function flyEndVy(up, vy) {
      if (up) return -STARFLY.exitUp;
      return vy > 0 ? 0 : vy;
    }
    function approachTo(v, target, step) {
      return v < target ? Math.min(v + step, target) : Math.max(v - step, target);
    }
    function normV(x, y) {
      const l = Math.sqrt(x * x + y * y);
      return l > 0.0001 ? { x: x / l, y: y / l } : null;
    }
    function dotV(a, b) { return a.x * b.x + a.y * b.y; }
    function rotateToward(from, to, step) {
      const a0 = Math.atan2(from.y, from.x), a1 = Math.atan2(to.y, to.x);
      let d = a1 - a0;
      while (d > Math.PI) d -= Math.PI * 2;
      while (d < -Math.PI) d += Math.PI * 2;
      if (Math.abs(d) <= step) return { x: to.x, y: to.y };
      const a = a0 + (d > 0 ? step : -step);
      return { x: Math.cos(a), y: Math.sin(a) };
    }
    function inputDir() {
      let x = 0, y = 0;
      if (keys['a'] || keys['arrowleft']) x -= 1;
      if (keys['d'] || keys['arrowright']) x += 1;
      if (keys['w'] || keys['arrowup']) y -= 1;
      if (keys['s'] || keys['arrowdown']) y += 1;
      if (!x && !y) return null;
      const l = Math.hypot(x, y);
      return { x: x / l, y: y / l };
    }

    function updateHud() {
      hudCollectEl.textContent = '草莓 ' + berries.length + '/' + CAP.berry +
        ' · 水母 ' + jellies.length + '/' + CAP.jelly +
        ' · 羽毛 ' + feathers.length + '/' + CAP.feather;
    }

    // Leader::Update：每 0.02s 采样一次，位移 ≥3 世界像素才插到队首，超出 350 丢队尾
    function stepLeader(dt) {
      leader.acc += dt;
      if (leader.acc < FOLLOW.sample) return;
      leader.acc -= FOLLOW.sample;
      const p = { x: m.x, y: m.y - 10 };
      const head = leader.past[0];
      if (head && Math.hypot(p.x - head.x, p.y - head.y) < FOLLOW.minDist) return;
      leader.past.unshift(p);
      if (leader.past.length > FOLLOW.maxPoints) leader.past.length = FOLLOW.maxPoints;
    }

    function addBerry() {
      if (berries.length >= CAP.berry) return;   // 超出的 token 直接忽略（不排队）
      const idx = Math.min(FOLLOW.stepIndex * (berries.length + 1), leader.past.length - 1);
      const p = (idx >= 0 && leader.past[idx]) || { x: m.x, y: m.y - 10 };
      berries.push({ x: p.x, y: p.y, spawnT: 0, delay: FOLLOW.delay, phase: Math.random() * 2.4 });
      updateHud();
    }

    // 水母：像金羽毛一样在相机可见区两侧随机刷新（最多 4 只），不再伴飞
    // Glider.Update 会在未持有且与 Player 相撞时销毁，因此落点要避开实心块
    function gliderSolidAt(x, y) {
      const l = x - 4, r = x + 4, t = y - 10, b = y;
      for (let i = 0; i < WALLS.length; i++) {
        const q = WALLS[i];
        if (q.x >= r || q.x + q.w <= l) continue;
        if (q.y >= b || q.y + q.h <= t) continue;
        return true;
      }
      return false;
    }
    function spawnJelly() {
      if (jellies.length >= CAP.jelly) return;
      const vw = W / Z, vh = H / Z;
      let x = 0, y = 0, ok = false;
      for (let a = 0; a < 8 && !ok; a++) {
        const fx = Math.random() < 0.5 ? 0.06 + Math.random() * 0.24 : 0.70 + Math.random() * 0.24;
        x = clampN(cam.x - SPAWN.x + fx * vw, BOUND.x0 + 8, BOUND.x1 - 8);
        y = clampN(cam.y - SPAWN.y + vh * (0.18 + Math.random() * 0.27), -280, 34);
        ok = !gliderSolidAt(x, y);
      }
      if (!ok) { x = clampN(m.x, BOUND.x0 + 8, BOUND.x1 - 8); y = -200; }
      jellies.push({
        x: x, y: y, vx: 0, vy: 0, spawnT: 0, phase: Math.random() * 6,
        rot: 0, scaleX: 1, scaleY: 1,
        highFrictionTimer: 0, gravityTimer: 0,
        deathT: -1, minHoldTimer: 0, cannotHoldTimer: 0, animT: Math.random() * 1.2, openT: 0
      });
      updateHud();
    }

    // Holdable.PickupCollider 20×22 @(-10,-16)：与 Player 8×11 身体盒重叠即进入抓取范围
    function inPickupRange(j) {
      return Math.abs(m.x - j.x) < 4 + GLIDER.pickX &&
        j.y - GLIDER.pickTop < m.y && j.y + GLIDER.pickBottom > m.y - 11;
    }
    // Player.orig_Pickup：Holding=Picked，Ducking=false，minHoldTimer=0.35
    // Glider.OnPickup：Speed=Zero，highFrictionTimer=0.5
    function tryPickupJelly() {
      if (heldJelly || m.ducking || fly) return false;
      let best = null, bestD = Infinity;
      for (const j of jellies) {
        if (j.deathT >= 0 || j.cannotHoldTimer > 0 || !inPickupRange(j)) continue;
        const d = Math.abs(m.x - j.x) + Math.abs(j.y - (m.y - 5));
        if (d < bestD) { bestD = d; best = j; }
      }
      if (!best) return false;
      heldJelly = best;
      best.minHoldTimer = GLIDER.pickupDelay;
      best.highFrictionTimer = 0.5;
      best.vx = 0; best.vy = 0;
      best.gravityTimer = 0;
      best.scaleX = 1; best.scaleY = 1;
      best.x = m.x; best.y = m.y + GLIDER.carryY;
      updateHud();
      return true;
    }
    // Holdable.Release：gravityTimer=0.1；Glider.OnRelease：Speed = dir × 100（Y=0 → -0.4）
    function releaseJelly(dirX, dirY) {
      const j = heldJelly;
      if (!j) return;
      heldJelly = null;
      j.minHoldTimer = 0;
      j.cannotHoldTimer = GLIDER.regrabDelay;      // Holdable.Release: cannotHoldTimer = cannotHoldDelay
      j.gravityTimer = GLIDER.releaseGravity;
      j.vx = dirX * GLIDER.throwX;
      j.vy = dirY !== 0 ? dirY * GLIDER.throwX : (dirX !== 0 ? GLIDER.throwY : 0);
      j.highFrictionTimer = 0.5;
      j.x = m.x; j.y = m.y + GLIDER.carryY;
      let tries = 0;
      while (gliderSolidAt(j.x, j.y) && tries++ < 10) j.y -= 1;   // Holdable.Release 的脱困上移
      m.holdSlowFall = false;
      updateHud();
    }
    // Player.Throw：Release(UnitX*Facing) + 后坐 80；下方向键则走 Player.Drop（零速度）
    function throwJelly(drop) {
      if (!heldJelly) return;
      const dir = m.facing || 1;
      releaseJelly(drop ? 0 : dir, 0);
      if (!drop) m.vx += -GLIDER.recoil * dir;
    }

    // 水母未持有时的物理（Glider.Update IL 786-1553）
    function stepJellies(dt) {
      for (let i = jellies.length - 1; i >= 0; i--) {
        const j = jellies[i];
        if (j.spawnT < 1) j.spawnT = Math.min(1, j.spawnT + dt / 0.35);
        if (j.deathT >= 0) {
          j.deathT += dt;
          if (j.deathT >= GLIDER.deathTime) jellies.splice(i, 1);
          continue;
        }
        if (j === heldJelly) {
          j.animT += dt;
          // Glider.Update：holder.Speed.Y > 20（或风向上）→ PlayOpen(fall/fallLoop)
          j.openT = m.vy > 20 ? j.openT + dt : 0;
          // 持有：Carry 到 Player.Position + (0,-12) + CarryYOffset；旋转按 ClampedMap(Speed.X,-300,300,+34°/-34°)
          const amp = m.onGround ? 0.6981317 : 1.0471976;
          const tgt = -clampN(m.vx, -300, 300) * (amp / 300);
          j.rot = approachTo(j.rot, tgt, Math.PI * dt);
          j.x = m.x; j.y = m.y + GLIDER.carryY;
          continue;
        }

        // 未持有：旋转回正（Glider.Update 未持有 → target 0），动画继续走时
        j.animT += dt; j.openT = 0;
        j.rot = approachTo(j.rot, 0, Math.PI * dt);

        // 未持有：高摩擦计时 + 重新抓取冷却 + 地面侧滑
        if (j.highFrictionTimer > 0) j.highFrictionTimer -= dt;
        if (j.cannotHoldTimer > 0) j.cannotHoldTimer -= dt;
        if (gliderSolidAt(j.x, j.y + 1)) {
          let slide = 0;
          if (!gliderSolidAt(j.x + 3, j.y + 1)) slide = GLIDER.groundSlide;
          else if (!gliderSolidAt(j.x - 3, j.y + 1)) slide = -GLIDER.groundSlide;
          j.vx = approachTo(j.vx, slide, GLIDER.groundFriction * dt);
        } else {
          if (j.gravityTimer > 0) j.gravityTimer -= dt;
          else {
            const g = j.vy < -30 ? GLIDER.gravAirUp : GLIDER.gravAir;
            const fric = j.vy < 0 ? GLIDER.frictionUp : (j.highFrictionTimer > 0 ? GLIDER.frictionDown : GLIDER.frictionUp);
            j.vx = approachTo(j.vx, 0, fric * dt);
            j.vy = approachTo(j.vy, 30, g * dt);
          }
        }

        // MoveH / MoveV：碰撞反弹（OnCollideH 速度取反，OnCollideV 向上 -0.5、向下归零）
        const nx = j.x + j.vx * dt;
        if (gliderSolidAt(nx, j.y)) {
          j.vx = -j.vx;
          j.scaleX = 0.8; j.scaleY = 1.2;
        } else j.x = nx;
        const ny = j.y + j.vy * dt;
        if (gliderSolidAt(j.x, ny)) {
          if (Math.abs(j.vy) > 8) { j.scaleX = 1.2; j.scaleY = 0.8; }
          j.vy = j.vy < 0 ? -j.vy * 0.5 : 0;
        } else j.y = ny;

        // 越界：左右上夹取，掉出下边界 RemoveSelf
        if (j.x < BOUND.x0 + 4) { j.x = BOUND.x0 + 4; j.vx = -j.vx; }
        else if (j.x > BOUND.x1 - 4) { j.x = BOUND.x1 - 4; j.vx = -j.vx; }
        if (j.y - 10 < BOUND.y0) { j.y = BOUND.y0 + 10; j.vy = -j.vy * 0.5; }
        else if (j.y > BOUND.y1 + 16) { jellies.splice(i, 1); updateHud(); continue; }

        // 未持有且与 Player 碰撞 → destroyed（Glider.Update IL 548-720）
        if (Math.abs(m.x - j.x) < 8 && j.y > m.y - 11 && j.y < m.y + 10) {
          j.deathT = 0; j.vx = 0; j.vy = 0;
        }
      }
    }

    // 羽毛：只在相机可见区左右两侧刷新（居中聊天卡不会整块压住），同时最多 6 颗
    function spawnFeather() {
      if (feathers.length >= CAP.feather) return;
      const vw = W / Z, vh = H / Z;
      const fx = Math.random() < 0.5 ? 0.06 + Math.random() * 0.24 : 0.70 + Math.random() * 0.24;
      const x = clampN(cam.x - SPAWN.x + fx * vw, BOUND.x0, BOUND.x1);
      const y = clampN(cam.y - SPAWN.y + vh * (0.18 + Math.random() * 0.27), -280, 40);
      feathers.push({ x: x, y: y, phase: Math.random() * 6 });
      updateHud();
    }

    function stepFollowers(dt) {
      for (let i = 0; i < berries.length; i++) {
        const b = berries[i];
        if (b.spawnT < 1) b.spawnT = Math.min(1, b.spawnT + dt / 0.4);
        if (b.delay > 0) { b.delay -= dt; continue; }   // Follower::Update 只看 DelayTimer
        const idx = Math.min(FOLLOW.stepIndex * (i + 1), leader.past.length - 1);
        const tgt = idx >= 0 ? leader.past[idx] : null;
        if (!tgt) continue;
        b.x = followerLerp(b.x, tgt.x, dt);
        b.y = followerLerp(b.y, tgt.y, dt);
      }
    }

    function stepFeathers() {
      for (let i = feathers.length - 1; i >= 0; i--) {
        const f = feathers[i];
        if (Math.hypot(f.x - m.x, f.y - (m.y - 6)) >= COLLECT_R) continue;
        feathers.splice(i, 1);
        updateHud();
        startFly(f);
        return;
      }
    }

    function startFly(f) {
      if (fly) return;
      if (heldJelly) releaseJelly(0, 0);   // 拾羽毛时松手（原作 StarFly 分支未取证，避免水母跟飞）
      // D6：方向取 sign(羽毛 - Madeline)；同 x 时用当前朝向
      const dx = Math.sign(f.x - m.x) || (m.facing || 1);
      fly = {
        t: 0, len: 0, mx: dx, my: 0, last: { x: dx, y: 0 },
        timer: STARFLY.time, warnT: 0, flash: false
      };
      m.vx = 0; m.vy = 0;
      m.setState(CelesteCharacter.ST.Normal);
      m.sprite.play('idle');
      // 变形期仍是 HairCount=4 / 普通发色；0.42s 才切 7 + 飞行色
      m.hair.rigid = true;
      m.hair.count = 4;
      m.hair.setColor('normal');
      m.hair.reset(m.x, m.y, m.facing);
      toastEl.textContent = '拾起「金羽毛」';
      toastEl.classList.add('show');
      toastTimer = 2.6;
    }

    function stepFly(dt) {
      const f = fly;
      f.t += dt;
      if (f.t < STARFLY.chargeTotal) {
        // starFlyTransforming：Speed → 0；0.32s 切 startStarFly 之后的金色球体
        f.len = Math.max(0, f.len - STARFLY.accel * dt);
        if (f.t >= STARFLY.chargeAnim && m.hair.count !== 7) {
          m.hair.count = 7;
          m.hair.setColor('fly');
          m.hair.reset(m.x, m.y - 6, m.facing);
        }
        m.hair.update(m.x, m.y, m.facing, 0, -2, dt, 1);
        return;
      }
      if (f.t - dt < STARFLY.chargeTotal) {
        // 协程尾部才读 Input.Feather：变形期按住的方向才是发射方向
        const d0 = inputDir();
        if (d0) { f.mx = d0.x; f.my = d0.y; f.last = d0; }
        f.len = STARFLY.speedStart;
        f.timer = STARFLY.time;
      }

      const dir = inputDir();
      const idle = !dir;
      const want = dir || f.last;
      const cur = normV(f.mx, f.my);
      const nd = cur ? rotateToward(cur, want, STARFLY.turnRate * dt) : want;
      f.mx = nd.x; f.my = nd.y; f.last = { x: nd.x, y: nd.y };
      const target = flyTargetSpeed(idle ? null : dotV(nd, want));
      f.len = approachTo(f.len, target, STARFLY.accel * dt);

      // 推进 + 分轴碰撞（Player.OnCollideH / OnCollideV 的 StStarFly 分支）
      let nx = m.x + f.mx * f.len * dt;
      let ny = m.y + f.my * f.len * dt;
      let hx = false, hy = false;
      if (nx < BOUND.x0) { nx = BOUND.x0; hx = true; }
      else if (nx > BOUND.x1) { nx = BOUND.x1; hx = true; }
      if (ny < BOUND.y0) { ny = BOUND.y0; hy = true; }
      else if (ny > BOUND.y1) { ny = BOUND.y1; hy = true; }
      if (!hx && bodySolidFn(nx, m.y)) { hx = true; nx = m.x; }
      if (!hy && bodySolidFn(m.x, ny)) { hy = true; ny = m.y; }
      if (hx || hy) {
        let vx = f.mx * f.len, vy = f.my * f.len;
        if (f.timer < STARFLY.wallDead) {          // 快结束贴墙：该轴速度归零，不反弹
          if (hx) vx = 0;
          if (hy) vy = 0;
        } else {
          if (hx) vx *= -STARFLY.wallRest;
          if (hy) vy *= -STARFLY.wallRest;
        }
        f.len = Math.hypot(vx, vy);
        if (f.len > 0.001) { f.mx = vx / f.len; f.my = vy / f.len; }
        else { f.mx = 0; f.my = 0; }
      }
      m.x = nx; m.y = ny;
      if (Math.abs(f.mx) > 0.01) m.facing = f.mx > 0 ? 1 : -1;

      m.hair.update(m.x, m.y, m.facing, 0, 3, dt, 1);   // HairOffset (0,3) → 发根落在球心

      f.timer -= dt;
      if (f.timer < STARFLY.warnTime) {
        f.warnT += dt;
        if (f.warnT >= STARFLY.warnStep) { f.warnT -= STARFLY.warnStep; f.flash = !f.flash; }
      }
      if (f.timer <= 0) endFly(false);
    }

    // StarFlyEnd：|Speed.X| 夹 140；按住 ↑ → Speed.Y=-100；向下速度归零，交回普通状态
    function endFly(silent) {
      if (!fly) return;
      const f = fly;
      fly = null;
      m.hair.count = 4;
      m.hair.rigid = false;
      m.hair.setColor('normal');
      if (silent) { m.hair.reset(m.x, m.y, m.facing); return; }
      const vx0 = f.mx * f.len, vy0 = f.my * f.len;
      const vx = clampN(vx0, -STARFLY.exitX, STARFLY.exitX);
      const vy = flyEndVy(!!(keys['w'] || keys['arrowup']), vy0);
      if (Math.abs(vx) > 0) m.facing = vx > 0 ? 1 : -1;
      m.vx = vx; m.vy = vy;
      m.onGround = false;
      m.maxFall = 160;
      m.highestAirY = m.y;
      feetPrev = m.y;
      m.setState(CelesteCharacter.ST.Normal);
      m.hair.reset(m.x, m.y, m.facing);
    }

    // 实时消息 → 场景物件（历史回放不调用）
    function consumeText(text) {
      const s = String(text || '');
      const nb = (s.match(/🍓|\[c:berry\]/g) || []).length;
      for (let i = 0; i < nb; i++) addBerry();
      const nj = (s.match(/🪼|\[c:jelly\]/g) || []).length;
      for (let i = 0; i < nj; i++) spawnJelly();
      const nf = (s.match(/🪶|\[c:feather\]/g) || []).length;
      for (let i = 0; i < nf; i++) spawnFeather();
    }

    function berryFrame(t) { return BERRY_SEQ[Math.floor(t / 0.08) % BERRY_SEQ.length]; }

    function drawBerries() {
      for (const b of berries) {
        const img = IMG['berry' + berryFrame(time + b.phase)];
        if (!img) continue;
        const p = toScreen(b);
        const sc = 0.4 + 0.6 * b.spawnT;
        const w = 40 * Z * sc, h = 24 * Z * sc;
        if (p.x < -w || p.x > W + w || p.y < -h || p.y > H + h) continue;
        ctx.drawImage(img, Math.round(p.x - w / 2), Math.round(p.y - h / 2), Math.round(w), Math.round(h));
      }
    }

    // 帧选择（Sprites.xml）：idle 10 帧 0.1s；fall 3 帧 0.08s → fallLoop 2 帧 0.08s 循环；
    // death 8 帧 0.08s（DestroyAnimationRoutine）；held 单帧
    function jellyImage(j) {
      if (j.deathT >= 0) return IMG['jellyDeath' + Math.min(7, Math.floor(j.deathT / GLIDER.deathStep))];
      if (j === heldJelly) {
        if (m.vy > 20) {
          const t = j.openT - 3 * GLIDER.fallStep;          // fall 播完再切 fallLoop
          return t < 0 ? IMG['jellyFall' + Math.min(2, Math.floor(j.openT / GLIDER.fallStep))]
            : IMG['jellyFallLoop' + (Math.floor(t / GLIDER.fallStep) % 2)];
        }
        return IMG['jellyHeld'];
      }
      return IMG['jelly' + (Math.floor(j.animT / GLIDER.idleStep) % 10)];
    }
    function drawJellies() {
      for (const j of jellies) {
        const img = jellyImage(j);
        if (!img) continue;
        const p = toScreen(j);
        const spawn = 0.4 + 0.6 * j.spawnT;
        const w = 48 * Z * spawn * Math.max(Math.abs(j.scaleX), Math.abs(j.scaleY));
        if (p.x < -w || p.x > W + w || p.y < -w || p.y > H + w) continue;
        // 持有且下落（Speed.Y > 20）时按 GliderMoveY 拉伸：↓(0.7,1.4) / ↑(1.2,0.8)
        let sx = 1, sy = 1;
        if (j === heldJelly && m.vy > 20) {
          if (keys['s'] || keys['arrowdown']) { sx = 0.7; sy = 1.4; }
          else if (keys['w'] || keys['arrowup']) { sx = 1.2; sy = 0.8; }
        }
        ctx.save();
        ctx.translate(p.x, p.y);
        ctx.rotate(j.rot);
        ctx.scale(Z * spawn * j.scaleX * sx, Z * spawn * j.scaleY * sy);
        ctx.drawImage(img, -24, -GLIDER.originY, 48, 48);   // Sprite origin (24, 27.8)
        ctx.restore();
      }
    }

    function drawFeathers() {
      for (const f of feathers) {
        const img = IMG['feather' + (Math.floor((time + f.phase) / 0.06) % 42)];
        if (!img) continue;
        const p = toScreen({ x: f.x, y: f.y + Math.sin(time * 2 + f.phase) * 3 });
        const w = 32 * Z;
        if (p.x < -w || p.x > W + w || p.y < -w || p.y > H + w) continue;
        ctx.drawImage(img, Math.round(p.x - w / 2), Math.round(p.y - w / 2), w, w);
      }
    }

    function drawFly() {
      const f = fly;
      const feet = toScreen({ x: m.x, y: m.y });
      m.hair.draw(ctx, toScreen, Z, 0, 1);      // 头发在精灵之下（Player 组件顺序：Hair 先 Add）
      if (f.t < STARFLY.chargeAnim) {
        // startStarFly 4 帧 × 0.08s，Justify(0.5,1) → 左上角 = 脚底 (-16,-32)
        const sc = 1 - 0.4 * (f.t / STARFLY.chargeTotal);
        const img = IMG['morph' + Math.min(3, Math.floor(f.t / 0.08))];
        const w = Math.round(32 * Z * sc);
        if (img) ctx.drawImage(img, Math.round(feet.x - 16 * Z * sc), Math.round(feet.y - 32 * Z * sc), w, w);
      } else {
        // 球心 = (m.x, m.y-6)，origin (16,32) ⇒ 左上角 = 球心 + (-16,-26)
        const col = (f.timer < STARFLY.warnTime && f.flash) ? '#AC3232' : '#ffd65c';
        const img = tinted('orb', col);
        const orb = toScreen({ x: m.x, y: m.y - 6 });
        if (img) ctx.drawImage(img, Math.round(orb.x - 16 * Z), Math.round(orb.y - 26 * Z), 32 * Z, 32 * Z);
      }
    }

    // messages.js 在场景脚本之后才加载，但 SSE 可能早到：先同步暴露 → 未就绪入队 → main() 后回放
    window.ChatScene = {
      get ready() { return sceneReady; },
      get flying() { return !!fly; },
      get stats() {
        return { berry: berries.length, jelly: jellies.length, feather: feathers.length, flying: !!fly, held: !!heldJelly };
      },
      consume(content) {
        const t = String(content || '');
        if (!sceneReady) { if (t) sceneQueue.push(t); return; }
        consumeText(t);
      },
      revealChat() { window.dispatchEvent(new CustomEvent('chat:reveal')); },
      reset() {
        berries.length = 0; jellies.length = 0; feathers.length = 0;
        heldJelly = null;
        if (m) m.holdSlowFall = false;
        leader.past.length = 0; leader.acc = 0;
        endFly(true);
        updateHud();
      },
      __test: {
        FOLLOWER: FOLLOW, CAP: CAP, STARFLY: STARFLY, GLIDER: GLIDER,
        followerLerp: followerLerp, flyTargetSpeed: flyTargetSpeed,
        flyEndVy: flyEndVy, clampCount: clampCount,
        get held() { return heldJelly; }
      }
    };

    // ===== 渲染 =====
    // 世界坐标（相对出生点）→ 屏幕像素；cam 存的是房间坐标，所以先补回 SPAWN
    function toScreen(n) {
      return { x: (n.x + SPAWN.x - cam.x) * Z, y: (n.y + SPAWN.y - cam.y) * Z };
    }

    // floatySpaceBlock：每格都是 lostlevels 自动瓦片，位置来自地图的 8px 网格
    function drawBlocks() {
      const img = IMG.lost;
      if (!img) return;
      const s = TILE * Z;
      for (const t of blockSprites) {
        const px = (t.wx + SPAWN.x - cam.x) * Z;
        const py = (t.wy + SPAWN.y - cam.y) * Z;
        if (px <= -s || px >= W || py <= -s || py >= H) continue;
        ctx.drawImage(img, t.sx, t.sy, TILE, TILE, px, py, s, s);
      }
    }

    // jumpThru：第九章 AreaData.Jumpthru = "wood"，贴图 24×16 → 8px 三切片（左/中×N/右）
    function drawJumpThrus() {
      const img = IMG.jt;
      if (!img) return;
      const s = TILE * Z;
      for (const j of JTS) {
        const px = (j.x + SPAWN.x - cam.x) * Z;
        const py = (j.y + SPAWN.y - cam.y) * Z;
        if (px >= W || px + j.w * Z <= 0 || py >= H || py <= -s) continue;
        const n = Math.max(1, Math.round(j.w / TILE));
        for (let i = 0; i < n; i++) {
          const cap = i === 0 || i === n - 1;
          const col = i === 0 ? 0 : (i === n - 1 ? 2 : 1);
          const row = cap ? 1 : ((i & 1) ? 1 : 0);     // 原作：两端用外侧行，中段随机上下行
          ctx.drawImage(img, col * TILE, row * TILE, TILE, TILE, px + i * s, py, s, s);
        }
      }
    }

    // exitBlock（tileType='m'）：原作就是一片自动瓦片，Depth -13000 → 先于浮空块绘制
    function drawDoor() {
      const img = IMG.lost;
      if (!img) return;
      const s = TILE * Z;
      for (const t of doorSprites) {
        const px = (t.wx + SPAWN.x - cam.x) * Z;
        const py = (t.wy + SPAWN.y - cam.y) * Z;
        if (px <= -s || px >= W || py <= -s || py >= H) continue;
        ctx.drawImage(img, t.sx, t.sy, TILE, TILE, px, py, s, s);
      }
    }

    // floatingDebris：8×8 碎屑缓慢漂浮
    function drawDebris() {
      const img = IMG.debris;
      if (!img) return;
      const s = TILE * Z;
      ctx.globalAlpha = 0.75;
      for (const d of debris) {
        const bx = Math.sin(time * 0.35 + d.ph) * 10;
        const by = Math.sin(time * 0.27 + d.ph * 1.3) * 6;
        const px = (d.x + SPAWN.x + bx - cam.x) * Z;
        const py = (d.y + SPAWN.y + by - cam.y) * Z;
        if (px <= -s || px >= W || py <= -s || py >= H) continue;
        ctx.drawImage(img, d.f * TILE, 0, TILE, TILE, Math.round(px), Math.round(py), s, s);
      }
      ctx.globalAlpha = 1;
    }

    // 背景全部由 LAYERS 驱动（顺序 = 地图 Stylegrounds 顺序），这里只负责清屏与前景
    function drawBackdrops() {
      for (const l of LAYERS) l.render(cam.x, cam.y);
    }

    function drawForegrounds() {
      for (const l of FG_LAYERS) l.render(cam.x, cam.y);
    }

    // moonBlade（danger/starfish）：Sprites.xml 里 21 帧连成一个循环
    // idle0(帧0, 0.08s) → spin0(1-6, 0.06s) → idle1(7) → spin1(8-13) → idle2(14) → spin2(15-20)
    const BLADE_CYCLE = 3 * 0.08 + 18 * 0.06;         // 1.32s
    function bladeFrame(t) {
      let x = mod(t, BLADE_CYCLE);
      for (let i = 0; i < 21; i++) {
        const d = i % 7 === 0 ? 0.08 : 0.06;
        if (x < d) return i;
        x -= d;
      }
      return 20;
    }

    function drawBlades() {
      const s = 48 * Z;                               // moonBlade 画布 48×48，星体占中间一圈
      for (const b of blades) {
        const p = toScreen(b);
        if (p.x < -s || p.x > W + s || p.y < -s || p.y > H + s) continue;
        const img = IMG['blade' + bladeFrame(time + b.ph)];
        if (!img) continue;
        const g = ctx.createRadialGradient(p.x, p.y, s * 0.05, p.x, p.y, s * 0.5);
        g.addColorStop(0, 'rgba(255,196,150,.22)');
        g.addColorStop(1, 'rgba(255,150,90,0)');
        ctx.fillStyle = g;
        ctx.fillRect(p.x - s * 0.5, p.y - s * 0.5, s, s);
        ctx.drawImage(img, Math.round(p.x - s / 2), Math.round(p.y - s / 2), s, s);
      }
    }

    function drawCreatures() {
      const f = Math.floor(time / 0.08) % 6;
      const img = IMG['creature' + f];
      if (!img) return;
      const s = 10 * Z * 0.9;
      for (const c of creatures) {
        const bob = Math.sin(time * 0.8 + c.ph) * 4;
        const drift = Math.sin(time * 0.33 + c.ph * 0.7) * 10;
        const p = toScreen({ x: c.x + drift, y: c.y + bob });
        if (p.x < -s || p.x > W + s || p.y < -s || p.y > H + s) continue;
        ctx.globalAlpha = 0.9;
        ctx.drawImage(img, Math.round(p.x - s / 2), Math.round(p.y - s / 2), s, s);
        ctx.globalAlpha = 1;
      }
    }

    function drawHeart() {
      if (heart.collected) return;
      const p = toScreen({ x: heart.x, y: heart.y + Math.sin(time * 1.6) * 3 });
      const s = 20 * Z;
      const g = ctx.createRadialGradient(p.x, p.y, 2, p.x, p.y, s * 0.95);
      g.addColorStop(0, 'rgba(200,232,255,.42)');
      g.addColorStop(0.45, 'rgba(120,190,240,.16)');
      g.addColorStop(1, 'rgba(70,140,220,0)');
      ctx.fillStyle = g;
      ctx.fillRect(p.x - s, p.y - s, s * 2, s * 2);
      const img = IMG['heart' + (Math.floor(time * 8) % 14)];
      if (img) ctx.drawImage(img, Math.round(p.x - s / 2), Math.round(p.y - s / 2), s, s);
    }

    function drawDust() {
      ctx.fillStyle = '#c6ecff';
      for (const d of dust) {
        const p = toScreen(d);
        ctx.globalAlpha = Math.max(0, Math.min(1, d.life / 0.4));
        ctx.fillRect(Math.round(p.x), Math.round(p.y), 3, 3);
      }
      ctx.globalAlpha = 1;
    }

    function drawParticles() {
      for (const p of particles) {
        const s = toScreen(p);
        ctx.globalAlpha = Math.max(0, p.life / p.ttl);
        ctx.fillStyle = p.c;
        ctx.fillRect(Math.round(s.x), Math.round(s.y), p.sz, p.sz);
      }
      ctx.globalAlpha = 1;
    }

    function render() {
      ctx.globalCompositeOperation = 'source-over';
      ctx.globalAlpha = 1;
      ctx.fillStyle = STYLE_COLOR;                   // /Map/Style color
      ctx.fillRect(0, 0, W, H);
      drawBackdrops();
      drawDoor();
      drawBlocks();                                  // floatySpaceBlock（lostlevels 自动瓦片）
      drawJumpThrus();                               // jumpThru（wood）
      drawDebris();                                  // floatingDebris
      if (DRAW_SPINNERS) drawBlades();               // spinner ×95（默认关闭：底部的星海会破坏空无构图）
      drawCreatures();                               // moonCreature ×9
      drawHeart();
      drawDust();
      drawParticles();
      // 聊天互动物件：羽毛/草莓在人物之下；水母 Depth -5 → 人物之上
      drawFeathers();
      drawBerries();
      if (fly) drawFly(); else m.draw(ctx, toScreen, Z);
      drawJellies();
      drawForegrounds();                             // purplesunset（additive .25）盖在关卡之上
      if (flash > 0) {
        ctx.globalAlpha = Math.min(1, flash);
        ctx.fillStyle = '#eaf6ff';
        ctx.fillRect(0, 0, W, H);
        ctx.globalAlpha = 1;
      }
    }

    // ===== 逻辑 =====
    function spawnDust(x, y, n) {
      for (let i = 0; i < n; i++) {
        const a = -Math.PI / 2 + (Math.random() - 0.5) * 1.9;
        const sp = 18 + Math.random() * 34;
        dust.push({ x: x, y: y - 1, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp * 0.6, life: 0.3 + Math.random() * 0.35, ttl: 0.65 });
      }
    }

    function collectHeart() {
      heart.collected = true;
      flash = 0.85;
      hudHeartEl.textContent = '空无 1 / 1';
      toastEl.textContent = '拾起「空无」· Empty Space';
      toastEl.classList.add('show');
      toastTimer = 2.6;
      for (let i = 0; i < 26; i++) {
        const a = Math.random() * 6.283, sp = 26 + Math.random() * 60;
        particles.push({
          x: heart.x, y: heart.y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp,
          life: 0.7 + Math.random() * 0.5, ttl: 1.2, sz: Math.random() < 0.5 ? 2 : 3,
          c: Math.random() < 0.5 ? '#eaf6ff' : '#9ad8ff'
        });
      }
    }

    function respawn() {
      // 飞行中坠落/重来：静默收掉星飞并清空跟随轨迹（草莓/水母不结算、不清空）
      endFly(true);
      heldJelly = null;                        // 手上的水母留在原地（不结算、不回收）
      m.holdSlowFall = false;
      leader.past.length = 0; leader.acc = 0;
      m.x = 0; m.y = 0; m.vx = 0; m.vy = 0;
      feetPrev = 0;
      m.onGround = true; m.ducking = false; m.fastJump = false;
      m.scaleX = m.scaleY = 1; m.maxFall = 160; m.highestAirY = 0;
      m.varJumpTimer = 0; m.jumpGraceTimer = 0; m.jumpBufferTimer = 0;
      m.setState(CelesteCharacter.ST.Normal);   // 冲刺/攀爬中途重来时状态也要复位
      m.dashes = m.maxDashes; m.stamina = 110; m.freezeTimer = 0;
      m.dashTime = 0; m.dashTrail.length = 0;
      m.wallSlideDir = 0; m.wallSlideTimer = 1.2; m.dashAttackTimer = 0;
      m.bodySolidFn = bodySolidFn;
      m.sprite.play('idle');
      m.hair.reset(0, 0, 1);
      snapCam();
      dust.length = 0; particles.length = 0;
      deathTimer = 0.45;
      flash = Math.max(flash, 0.35);
    }

    function tick(dt) {
      time += dt;
      updateLayers(dt);

      if (deathTimer > 0) { deathTimer -= dt; return; }

      const input = {
        left: !!(keys['a'] || keys['arrowleft']),
        right: !!(keys['d'] || keys['arrowright']),
        down: !!(keys['s'] || keys['arrowdown']),
        up: !!(keys['w'] || keys['arrowup']),
        jumpHeld: !!keys[' '] || !!keys['c'],
        jumpPressed: jumpEdge,
        grabHeld: !!(keys['shift'] || keys['z']),
        dashPressed: dashEdge,
        aimX: (keys['d'] || keys['arrowright'] ? 1 : 0) - (keys['a'] || keys['arrowleft'] ? 1 : 0),
        aimY: (keys['s'] || keys['arrowdown'] ? 1 : 0) - (keys['w'] || keys['arrowup'] ? 1 : 0)
      };
      jumpEdge = dashEdge = false;

      // —— 水母持有（Player.NormalUpdate 的 Holding 分支，IL 74-1048）——
      // 未持有：按住抓取键 + PickupCollider 相交 → Pickup（minHoldTimer=0.35）
      // 持有：松开抓取键 → Throw；地面按下 → Drop（Throw 内 MoveY==1 也走 Drop）
      if (heldJelly) {
        if (heldJelly.minHoldTimer > 0) heldJelly.minHoldTimer -= dt;
        if (!input.grabHeld && heldJelly.minHoldTimer <= 0) throwJelly(input.down);
        else if (!m.ducking && m.onGround && input.down && m.vy >= 0) throwJelly(true);
      } else if (input.grabHeld && !fly) tryPickupJelly();
      m.holdSlowFall = !!heldJelly;

      feetPrev = m.y;
      // 持有时原作跳过整个攀爬分支 → 向引擎屏蔽 grabHeld
      const moveInput = heldJelly ? Object.assign({}, input, { grabHeld: false }) : input;
      if (fly) stepFly(dt); else m.update(dt, moveInput);
      updateCam(dt);

      // 跟随队列 / 水母 / 羽毛（飞行期不吃新羽毛）
      stepLeader(dt);
      stepFollowers(dt);
      stepJellies(dt);
      if (!fly) stepFeathers();

      // 拾起空无之心（飞行中不判定）
      if (!fly && !heart.collected && Math.abs(m.x - heart.x) < 24 && Math.abs(m.y - heart.y) < 30) collectHeart();

      // 掉出房间底部（世界 y 56 是地板线）—— 飞行期不判定坠落
      if (!fly && m.y > 96) respawn();

      // 粒子 / 尘土
      for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.x += p.vx * dt; p.y += p.vy * dt;
        p.vy += 12 * dt; p.life -= dt;
        if (p.life <= 0) particles.splice(i, 1);
      }
      for (let i = dust.length - 1; i >= 0; i--) {
        const d = dust[i];
        d.x += d.vx * dt; d.y += d.vy * dt; d.vy += 240 * dt; d.life -= dt;
        if (d.life <= 0) dust.splice(i, 1);
      }

      if (flash > 0) flash = Math.max(0, flash - dt * 1.5);
      if (toastTimer > 0) {
        toastTimer -= dt;
        if (toastTimer <= 0) toastEl.classList.remove('show');
      }
    }

        blocks: BLOCKS,
        jumpthrus: JTS,
        solids: SOLIDS,
        layers: LAYERS,
        fg: FG_LAYERS,
        get collected() { return heart.collected; }
      };

      // 场景就绪：回放 messages.js 早到的实时消息，之后 consume 直接生效
      updateHud();
      sceneReady = true;
      while (sceneQueue.length) consumeText(sceneQueue.shift());

      if (TEST) {
        runSelfTest();
        // 自检跑完后把世界复位到展示状态，方便对画面做视觉核对
        heart.collected = false;
        hudHeartEl.textContent = '空无  0 / 1';
        updateHud();
        toastEl.classList.remove('show');
        toastEl.style.display = 'none';
        respawn();
        flash = 0;
        // 无头浏览器里 rAF 可能不推进，自检页用定时器驱动同一套 updateLayers + render
        setInterval(() => {
          time += 1 / 60;
          updateLayers(1 / 60);
          if (flash > 0) flash = Math.max(0, flash - 0.03);
          render();
        }, 40);
      } else {
        let last = 0, renderAcc = 0;
        const chatEl = document.getElementById('chatContainer');
        (function frame(ts) {
          const dt = last ? Math.min((ts - last) / 1000, 0.05) : 1 / 60;
          last = ts;
          tick(dt);
          // 聊天卡展开时背景场景降到 30fps：仍会动，但把合成/滤镜的算力
          // 让给输入与消息滚动；收起聊天后恢复满帧
          const chatOpen = !!chatEl && !chatEl.classList.contains('chat-hidden');
          renderAcc += dt * 1000;
          if (!chatOpen || renderAcc >= 1000 / 30) {
            renderAcc = 0;
            render();
          }
          requestAnimationFrame(frame);
        })(0);
      }
      // 首帧已经画进 #scene 了，再等两帧让它提交，然后把统一加载层淡掉
      requestAnimationFrame(() => requestAnimationFrame(() => {
        if (window.PageLoading) window.PageLoading.ready();
      }));
    }

    main();
  })();
  </script>

    setTimeout(function () {
      var c = document.getElementById('chatContainer');
      if (c) c.removeAttribute('v-cloak');
    }, 0);
  </script>
