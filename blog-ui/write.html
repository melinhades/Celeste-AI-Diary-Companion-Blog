<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="icon/OIP.webp" type="image/webp">
    <title>Write - Celeste Blog</title>
    <link rel="stylesheet" href="css/common.css?v=20261003f">
    <link rel="stylesheet" href="css/text-fx.css?v=20261004a">
    <link rel="stylesheet" href="css/chat-widget.css?v=20261025a">
    <link rel="stylesheet" href="css/write.css?v=20261025a">
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    
</head>
<body>
    <!-- BGM 播放器 -->
    <audio id="bgmPlayer" loop>
        <source src="bgm/womanbird.mp3" type="audio/mpeg">
    </audio>

<header class="header">
    <div class="container header-inner">
        <a href="index.html" class="logo"><img src="celeste-gui/logo.webp" alt="Celeste" loading="lazy" decoding="async"></a>
        <nav class="nav">
            <a href="index.html" class="nav-link">Home</a>
            <a href="archives.html" class="nav-link">Archives</a>
            <a href="diary.html" class="nav-link nav-diary-btn" title="Diary with Madeline">
                <img src="celeste-gui/journal.png" alt="Diary" loading="lazy" decoding="async">
            </a>
            <a href="shop.html" class="nav-link nav-diary-btn" title="Celeste Resort · Oshiro">
                <img src="Atlases/Gui/menu/play.png" alt="Shop" loading="lazy" decoding="async">
            </a>
            <a href="roundtable.html" class="nav-link nav-chair" title="AI 圆桌会议">🪑</a>
        </nav>
        <div class="header-right" id="headerRight"></div>
    </div>
</header>

<div class="container write-layout" id="writeApp">
    <input class="write-title-input" type="text" id="articleTitle" placeholder="Article title..." v-model="title">

    <div class="write-meta">
        <select id="categorySelect" v-model="categoryId">
            <option value="">Select category</option>
            <option v-for="c in categories" :key="c.id" :value="String(c.id)">{{ c.categoryName || c.name }}</option>
        </select>
        <input type="text" id="tagsInput" placeholder="Tags, comma separated: Java,Spring" v-model="tagsRaw">
        <input type="text" id="summaryInput" placeholder="Summary (optional)" v-model="summary">
    </div>

    <div class="write-toolbar">
        <button class="toolbar-btn" onclick="insertMd('**','**')"><b>B</b></button>
        <button class="toolbar-btn" onclick="insertMd('*','*')"><i>I</i></button>
        <button class="toolbar-btn" onclick="insertMd('## ','')">H2</button>
        <button class="toolbar-btn" onclick="insertMd('### ','')">H3</button>
        <button class="toolbar-btn" onclick="insertMd('`','`')">Code</button>
        <button class="toolbar-btn" onclick="insertMd('\n\n','\n```\n')">Code Block</button> <button class="toolbar-btn" onclick="insertMd('> ','')">Quote</button> <button class="toolbar-btn" onclick="insertMd('[link](',')')">Link</button> <button class="toolbar-btn" onclick="insertMd('- ','')">List</button>
        <button class="toolbar-btn" onclick="document.getElementById('imageInput').click()"><img src="celeste-collectables/goldberry.png" alt="" loading="lazy" decoding="async">Image</button>
        <input type="file" id="imageInput" accept="image/*" style="display:none" onchange="uploadImage(this)">
        <button class="toolbar-btn" id="openMadelineBtn"><img src="celeste-collectables/strawberry.png" alt="" loading="lazy" decoding="async">Madeline</button>
        <button class="toolbar-btn" id="toolbarPolishBtn" style="border-color:rgba(255,227,109,.5);color:#ffe36d;"><img src="celeste-icons/beat.png" alt="" loading="lazy" decoding="async">润色</button>
        <button class="toolbar-btn" id="toolbarGenBtn" style="border-color:rgba(120,220,255,.5);color:#78dcff;"><img src="celeste-collectables/cassette.png" alt="" loading="lazy" decoding="async">生成文章</button>
    </div>
    <textarea class="write-body" id="articleBody" placeholder="Start writing... Markdown supported" v-model="body"></textarea>
    <script src="js/write-1.js?v=20261015b"></script>
    <div class="char-count" id="charCount">{{ body.length }} chars</div>
    <div id="imgPreviewBar" style="display:flex;gap:10px;flex-wrap:wrap;margin:4px 0 10px;">
        <img v-for="(s, ii) in imgSrcs" :key="s + '-' + ii" :src="s" style="max-height:84px;max-width:140px;object-fit:contain;border-radius:6px;border:1px solid rgba(138,43,226,.35);background:rgba(30,27,75,.4);" loading="lazy" decoding="async">
    </div>

    <div class="write-footer">
        <button class="btn btn-outline" onclick="history.back()">Cancel</button>
        <button class="btn btn-primary" onclick="publishArticle()" id="publishBtn">Publish</button>
    </div>
</div>

<img id="wpPixelMadeline" src="celeste-gui/bounceline.gif" alt="Madeline" title="单击摸摸她 · 双击打开聊天记录" loading="lazy" decoding="async">
<canvas id="snowCanvas" style="position:fixed;inset:0;z-index:0;pointer-events:none;"></canvas>
<div id="wpGameDialog">
    <div id="wpGameDialogPortrait"><img id="wpGameDialogPortraitImg" src="celeste-portraits/madeline/normal00.png" alt="Madeline" loading="lazy" decoding="async"></div>
    <div id="wpGameDialogBody">
        <div id="wpGameDialogName">Madeline</div>
        <div id="wpGameDialogText"></div>
    </div>
</div>

<div id="madeline-chat-dialog">
    <div class="chat-header">
        <div id="chat-madeline-avatar-wrap">
            <img id="chatAvatar" src="celeste-portraits/madeline/normal00.png" alt="Madeline" loading="lazy" decoding="async">
        </div>
        <span class="chat-title">Madeline</span>
        <button class="close-btn" id="closeChatBtn">✕</button>
    </div>
    <div class="chat-messages" id="chatMessages"></div>
    <div class="chat-input">
        <input type="text" id="chatInput" placeholder="跟 Madeline 说点什么...">
        <button id="chatSendBtn">Send</button>
    </div>
</div>

<footer class="footer"> <div class="container">© 2024 Celeste Blog · Explore the stars</div> </footer>
<script src="js/api.js?v=20261002"></script>
<script src="js/text-fx.js?v=20261005b"></script>
<script src="js/vue.global.prod.js?v=20261008a"></script>
<script src="js/auth.js?v=20261003b"></script>
<script src="js/madeline-core.js?v=20261002"></script>
<script src="js/snow-bgm.js"></script>
<script src="js/write-madeline.js?v=20261025a"></script>
<script src="js/write-2.js?v=20261015b"></script>
<script src="js/write-3.js?v=20261015b"></script>
<script src="js/seed.js?v=20261011a"></script>
</body>
</html>
