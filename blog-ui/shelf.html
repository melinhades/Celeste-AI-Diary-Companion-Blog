    // 阶段1（心门未全开 · Badeline 未解锁）：0:00–2:11 循环
    // 阶段2（四心齐 · Badeline 解锁）：2:11–4:25 循环
    // 实现：WebAudio 按秒切片 → AudioBufferSourceNode loop=true 采样级无缝循环；
    //       解码失败降级 HTMLAudio + 60ms 轮询回跳；加载失败静默（不影响页面其他功能）
    (function () {
        var SRC = 'bgm/Resurrections.mp3';
        var P = { p1: { start: 0, end: 131 }, p2: { start: 131, end: 265 } }; // 2:11=131s，4:25=265s
        var VOL = 0.32;
        var actx = null, master = null;
        var bufs = {}, ready = false, failed = false, loading = false;
        var cur = null, curPhase = null, wantOn = false;
        var fbAudio = null, fbPhase = null, fbTimer = null;

        function ensureCtx() {
            if (actx) return actx;
            try {
                var AC = window.AudioContext || window.webkitAudioContext;
                if (!AC) { failed = true; return null; }
                actx = window.__mirrorAC || new AC();   // 与碎裂音效共用上下文
                window.__mirrorAC = actx;
                master = actx.createGain();
                master.gain.value = VOL;
                master.connect(actx.destination);
            } catch (e) { failed = true; }
            return actx;
        }
        // 自动播放策略兜底：首次任意点击恢复被挂起的上下文
        document.addEventListener('click', function resumeAC() {
            if (actx && actx.state === 'suspended') { actx.resume().catch(function () {}); }
            if (actx && actx.state === 'running') document.removeEventListener('click', resumeAC);
        });

        function badelineUnlocked() {
            // 映射：镜中 Badeline 现身（召唤中且非告别动画）= 解锁状态
            var m = document.getElementById('shelfMirror');
            return !!(m && m.classList.contains('summoned') && !m.classList.contains('bye'));
        }
        function phaseOf() { return badelineUnlocked() ? 'p2' : 'p1'; }

        function preload() {
            if (loading || failed || ready) return;
            if (!ensureCtx()) return;
            loading = true;
            fetch(SRC).then(function (r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.arrayBuffer(); })
                .then(function (ab) { return actx.decodeAudioData(ab); })
                .then(function (buf) {
                    ['p1', 'p2'].forEach(function (k) { bufs[k] = sliceBuffer(buf, P[k].start, P[k].end); });
                    ready = true;
                    if (wantOn) playPhase(phaseOf());
                })
                .catch(function () { failed = true; if (wantOn) fbStart(phaseOf()); });
        }
        // 按秒切片：采样级精确（无缝循环的关键——loop 在切片端点处零间隙）
        function sliceBuffer(buf, s, e) {
            var sr = buf.sampleRate;
            var a = Math.max(0, Math.floor(s * sr));
            var b = Math.min(buf.length, Math.floor(e * sr));
            var out = actx.createBuffer(buf.numberOfChannels, b - a, sr);
            for (var ch = 0; ch < buf.numberOfChannels; ch++) {
                out.copyToChannel(buf.getChannelData(ch).subarray(a, b), ch);
            }
            return out;
        }

        function playPhase(ph) {
            if (!ready || !wantOn) return;
            if (curPhase === ph && cur) return;      // 已在播该片段
            stopCur();
            curPhase = ph;
            try {
                cur = actx.createBufferSource();
                cur.buffer = bufs[ph];
                cur.loop = true;
                cur.connect(master);
                cur.start(0, 0);                      // 切换耗时 <10ms
            } catch (e) { cur = null; curPhase = null; }
        }
        function stopCur() {
            try { if (cur) { cur.stop(); cur.disconnect(); } } catch (e) {}
            cur = null; curPhase = null;
        }

        // 降级路径：HTMLAudio + 60ms 轮询回跳（循环点可能有极短接缝，属可接受降级）
        function fbStart(ph) {
            if (!fbAudio) {
                try {
                    fbAudio = new Audio(SRC);
                    fbAudio.volume = VOL;
                    fbAudio.preload = 'auto';
                    fbAudio.addEventListener('error', function () { fbAudio = null; }, { once: true });
                } catch (e) { fbAudio = null; return; }
            }
            fbPhase = ph;
            var seg = P[ph];
            var seek = function () {
                try { fbAudio.currentTime = seg.start; } catch (e) {}
                fbAudio.play().catch(function () {});
            };
            if (fbAudio.readyState >= 1) seek();
            else fbAudio.addEventListener('loadedmetadata', seek, { once: true });
            if (fbTimer) clearInterval(fbTimer);
            fbTimer = setInterval(function () {
                if (!wantOn || !fbAudio || fbAudio.paused) return;
                var s2 = P[fbPhase];
                if (fbAudio.currentTime >= s2.end || fbAudio.currentTime < s2.start) {
                    try { fbAudio.currentTime = s2.start; } catch (e) {}
                }
            }, 60);
        }
        function fbStop() {
            try { if (fbAudio) fbAudio.pause(); } catch (e) {}
            if (fbTimer) { clearInterval(fbTimer); fbTimer = null; }
        }

        function enter() {
            wantOn = true;
            preload();
            // 压过全站 BGM，避免两首叠播
            var bp = document.getElementById('bgmPlayer');
            if (bp && !bp.paused) { bp.pause(); window.__mirrorBGMDucked = true; }
            if (ready) playPhase(phaseOf());
            else if (failed) fbStart(phaseOf());
        }
        function exit() {
            wantOn = false;
            stopCur();
            fbStop();
            var bp = document.getElementById('bgmPlayer');
            if (bp && window.__mirrorBGMDucked) { bp.play().catch(function () {}); window.__mirrorBGMDucked = false; }
        }
        document.addEventListener('visibilitychange', function () {
            if (document.hidden) { stopCur(); fbStop(); }
            else if (wantOn) { if (ready) playPhase(phaseOf()); else if (failed) fbStart(phaseOf()); }
        });

        window.__mirrorBGM = {
            enter: enter, exit: exit,
            refresh: function () { if (wantOn) { ready ? playPhase(phaseOf()) : (failed && fbStart(phaseOf())); } },
            // 自检：切片时长 / 当前阶段 / 上下文状态
            status: function () {
                return {
                    ready: ready, failed: failed, wantOn: wantOn,
                    phase: curPhase || (fbPhase ? 'fb-' + fbPhase : null),
                    ctxState: actx ? actx.state : null,
                    p1Len: bufs.p1 ? bufs.p1.duration : 0,
                    p2Len: bufs.p2 ? bufs.p2.duration : 0
                };
            }
        };
    })();

    // ===== dream 模式边框调节面板（右上角按钮，仅开发者/调参用） =====
    (function () {
        var DEFAULTS = {
            'frame-top':    '0px',
            'frame-scale':  '1',
            'glass-top':    '0px',
            'glass-scale':  '1',
            'door-top':     '0px',
            'door-scale':   '1'
        };
        var GROUPS = [
            { name: '镜框', sliders: [
                { key: 'frame-top',   label: '上/下', min: -100, max: 100, step: 2,    unit: 'px' },
                { key: 'frame-scale', label: '缩放',  min: 0.6,  max: 1.4,  step: 0.02, unit: ''   }
            ]},
            { name: '镜面', sliders: [
                { key: 'glass-top',   label: '上/下', min: -100, max: 100, step: 2,    unit: 'px' },
                { key: 'glass-scale', label: '缩放',  min: 0.6,  max: 1.4,  step: 0.02, unit: ''   }
            ]},
            { name: '心门', sliders: [
                { key: 'door-top',   label: '上/下', min: -80,  max: 80,  step: 2,    unit: 'px' },
                { key: 'door-scale', label: '缩放',  min: 0.7,  max: 1.4,  step: 0.02, unit: ''   }
            ]}
        ];
        var LS_KEY = 'shelfAdj';
        var ALL_SLIDERS = [];
        GROUPS.forEach(function (g) { g.sliders.forEach(function (s) { ALL_SLIDERS.push(s); }); });
        // 清理旧 key（mirror-top/mirror-scale → frame/glass）
        try {
            var old = JSON.parse(localStorage.getItem(LS_KEY) || '{}');
            if (old['mirror-top'] != null || old['mirror-scale'] != null) {
                delete old['mirror-top']; delete old['mirror-scale'];
                localStorage.setItem(LS_KEY, JSON.stringify(old));
            }
        } catch (e) {}
        // 读 localStorage 初始化
        var saved = {};
        try { saved = JSON.parse(localStorage.getItem(LS_KEY) || '{}'); } catch (e) {}
        Object.keys(DEFAULTS).forEach(function (k) {
            if (saved[k] != null) document.documentElement.style.setProperty('--' + k, saved[k]);
            else document.documentElement.style.setProperty('--' + k, DEFAULTS[k]);
        });
        // 造按钮
        var btn = document.createElement('div');
        btn.className = 'adjust-btn'; btn.textContent = '⚙'; btn.title = '调节镜框/镜面/心门（进 dream 后可见）';
        document.body.appendChild(btn);
        // 造面板
        var panel = document.createElement('div');
        panel.className = 'adjust-panel';
        var html = '<h4>Dream 调节</h4>';
        GROUPS.forEach(function (g) {
            html += '<div class="adjust-group">';
            html += '<div class="adjust-row"><span style="flex:0 0 60px;color:#a78bfa;font-size:11px;letter-spacing:.12em;">' + g.name.toUpperCase() + '</span></div>';
            g.sliders.forEach(function (s) { html += sliderRow(s); });
            html += '</div>';
        });
        html += '<button class="adjust-reset">恢复默认</button>';
        panel.innerHTML = html;
        document.body.appendChild(panel);

        function sliderRow(s) {
            var cur = getVar(s.key);
            return '<div class="adjust-row">'
                + '<label>' + s.label + '</label>'
                + '<input type="range" data-key="' + s.key + '" min="' + s.min + '" max="' + s.max + '" step="' + s.step + '" value="' + stripUnit(cur, s.unit) + '">'
                + '<span class="val" data-v="' + s.key + '">' + cur + '</span>'
                + '</div>';
        }
        function getVar(k) {
            var v = getComputedStyle(document.documentElement).getPropertyValue('--' + k).trim();
            return v || DEFAULTS[k];
        }
        function stripUnit(v, unit) { return parseFloat(v); }
        function fmtVal(key, raw, unit) {
            return unit ? (raw + unit) : Number(raw).toFixed(2);
        }

        btn.addEventListener('click', function () { panel.classList.toggle('show'); });
        document.addEventListener('click', function (e) {
            if (!panel.classList.contains('show')) return;
            if (panel.contains(e.target) || btn.contains(e.target)) return;
            panel.classList.remove('show');
        });
        panel.querySelectorAll('input[type=range]').forEach(function (sl) {
            var key = sl.dataset.key;
            var unit = ALL_SLIDERS.find(function (x) { return x.key === key; }).unit;
            sl.addEventListener('input', function () {
                var v = fmtVal(key, sl.value, unit);
                document.documentElement.style.setProperty('--' + key, v);
                panel.querySelector('[data-v="' + key + '"]').textContent = v;
                saved[key] = v;
                try { localStorage.setItem(LS_KEY, JSON.stringify(saved)); } catch (e) {}
            });
        });
        panel.querySelector('.adjust-reset').addEventListener('click', function () {
            ALL_SLIDERS.forEach(function (s) {
                document.documentElement.style.setProperty('--' + s.key, DEFAULTS[s.key]);
                var v = DEFAULTS[s.key];
                panel.querySelector('[data-v="' + s.key + '"]').textContent = v;
                var sl = panel.querySelector('input[data-key="' + s.key + '"]');
                sl.value = stripUnit(v, s.unit);
                saved[s.key] = v;
            });
            try { localStorage.setItem(LS_KEY, JSON.stringify(saved)); } catch (e) {}
        });
    })();
</script>
</body>
</html>
