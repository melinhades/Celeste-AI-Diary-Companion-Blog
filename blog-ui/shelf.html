<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<title>回忆书架 · Madeline</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="favicon.ico" sizes="16x16 32x32 48x48">
    <link rel="icon" href="icon/OIP.webp?v=20261105a" type="image/webp">
<!-- 字体全部走 css/shelf.css 里的本地 @font-face，不再引 Google Fonts（外链 render-blocking，被墙会导致整页字体回退） -->
<link rel="stylesheet" href="css/text-fx.css?v=20261004a">
<link rel="stylesheet" href="css/shelf.css?v=20261109a">
<link rel="stylesheet" href="css/badeline-panel.css?v=20261108a">
</head>
<body>
<div class="topbar"><a href="diary.html" class="nav-diary-btn" title="回到日记本 · Back to Diary"><img src="celeste-gui/journal.png" alt="Diary" loading="lazy" decoding="async"></a></div>
<canvas id="shelfSnow" style="position:fixed;inset:0;z-index:1;pointer-events:none;"></canvas>
<!-- dream 模式场景：极光 + 篝火 + 围炉睡觉的 Madeline（点她本人 → 睡醒动画 → 离开梦境）；置于 body 层级，避免 transform 祖先影响 fixed 定位 -->
<div id="dreamScene">
    <!-- dream 内部双屏：左=心门侧（篝火+Madeline+极光），右=镜之房间（紫色空间） -->
    <div class="ds-world">
        <div class="ds-left">
            <div class="ds-astars" id="dsAStars" aria-hidden="true"></div>
            <!-- 雪脊上的鸟（js/dream-birds.js）：一只大蓝鸟 + 五只蹦跳小鸟，单画布一次绘制 -->
            <canvas id="dsBirds" aria-hidden="true"></canvas>
            <!-- 金羽毛：随机散布天空（≤6 根）；点击 → 星飞光球（方向键/WASD 操控，Esc 收回） -->
            <div id="dsFeathers" aria-hidden="false"></div>
            <img id="dsFire" src="celeste-gui/campfire/dream00.png" alt="" decoding="async" onerror="if(!this.dataset.r){this.dataset.r=1;var s=this.src,t=this;setTimeout(function(){t.src=s;},300);}">
            <img id="dsMadeline" src="celeste-gui/madeline-sleep.gif" alt="Madeline" title="叫醒 Madeline" decoding="async">
        </div>
        <!-- 过渡区：独立缓冲区域，背景为雪夜右缘实测垂直色带被镜之房间暗紫逐渐覆盖 -->
        <div class="ds-bridge" aria-hidden="true"></div>
        <section id="mirrorRoom">
            <canvas id="mirrorScene" aria-hidden="true"></canvas>
            <div id="shelfMirror" role="button" title="敲一敲镜子？">
                <div class="badeline-wrap"><div class="badeline-inner"><img id="badelineImg" src="celeste-player/badeline/lookingUp_f.gif" alt="Badeline" loading="lazy" decoding="async"></div></div>
            </div>
        </section>
    </div>
    <!-- 心门：游戏截图光柱（door.png）；开启后上下两段错位拉开露出中段开口（不消失）；
         四心图标叠在截图原空心轮廓位置，开启后上排归上段、下排归下段 -->
    <div id="heartDoor" class="locked" role="button" title="一道结了冰的心门……">
        <div class="hd-half hd-half-t"><i class="hd-img"></i></div>
        <div class="hd-half hd-half-b"><i class="hd-img"></i></div>
        <div class="hd-hearts">
            <img class="h0" src="heartdoor/icon00.png" alt="" decoding="async">
            <img class="h1" src="heartdoor/icon00.png" alt="" decoding="async">
            <img class="h2" src="heartdoor/icon00.png" alt="" decoding="async">
            <img class="h3" src="heartdoor/icon00.png" alt="" decoding="async">
        </div>
    </div>
    <!-- Poem 仪式：80 粒子 + 240px GUI 心 + poemside 装饰 + 辉光层 + 文字描边（IL: Celeste.Poem） -->
    <!-- 透明底，露出背后 dream 雪夜+篝火场景 -->
    <div id="heartGet">
        <canvas id="hgFx"></canvas>
        <div class="hg-poem-tip">点击继续</div>
    </div>

    <div id="dreamTools">
        <button class="dt-anim-btn" id="dreamNightBtn" title="夜 话" aria-label="夜话">
            <img id="nightBoostImg" src="Atlases/Gameplay/objects/badelineboost/idle00.png" alt="" decoding="async">
        </button>
    </div>

    <!-- 梦境日记：暗调书写卡 + 旧梦列表 + Madeline 解梦回应 -->
    <div id="dreamJournalPanel" class="dream-panel">
        <div class="dp-motes"></div>
        <div class="dp-card">
            <div class="dp-head">
                <h2>梦境日记</h2>
                <button class="dp-close" id="djClose" title="收起">✕</button>
            </div>
            <div class="dp-body">
                <div class="dp-write">
                    <input id="dreamTitle" maxlength="40" placeholder="给这个梦起个名字（可不写）">
                    <textarea id="dreamContent" placeholder="趁还没忘干净——梦里你在哪？谁在？发生了什么？哪里不对劲？"></textarea>
                    <div class="dp-actions">
                        <button class="dp-primary" id="dreamSaveBtn">封存这个梦</button>
                    </div>
                    <div class="dream-reply" id="dreamReply">
                        <img src="celeste-portraits/madeline/normal00.png" alt="Madeline">
                        <div class="dr-body">
                            <div class="dr-name">MADELINE</div>
                            <div class="dr-text" id="dreamReplyText"></div>
                        </div>
                    </div>
                </div>
                <aside class="dp-old">
                    <h3>旧 梦</h3>
                    <ul id="dreamList"></ul>
                </aside>
            </div>
        </div>
    </div>

    <!-- Badeline 夜话：她读你的梦，用影子视角戳破 -->
    <div id="dreamNightPanel" class="dream-panel">
        <div class="dp-motes"></div>
        <div class="dp-card nt-card">
            <div class="dp-head">
                <h2>夜 话</h2>
                <label class="nt-dreampick">她在读
                    <select id="ntDreamPick"></select>
                </label>
                <button class="dp-close" id="ntClose" title="收起">✕</button>
            </div>
            <div class="nt-msgs" id="ntMsgs"></div>
            <div class="nt-inputrow">
                <input id="ntInput" maxlength="500" placeholder="回她一句……">
                <button class="nt-send" id="ntSend">说</button>
            </div>
        </div>
    </div>
</div>
<div id="strawberryBonfire">
    <div class="sb-scene">
        <img class="sb-madeline" src="celeste-gui/madeline-sitdown.gif" alt="Madeline" fetchpriority="high" decoding="async" onerror="if(!this.dataset.r){this.dataset.r=1;var s=this.src,t=this;setTimeout(function(){t.src=s;},300);}">
        <div class="sb-fire" id="sbFire"><img id="sbFlameImg" alt="" fetchpriority="high" decoding="async" onerror="if(!this.dataset.r){this.dataset.r=1;var s=this.src,t=this;setTimeout(function(){t.src=s;},300);}"></div>
    </div>
</div>
<div id="berryTrophy" class="empty"></div>

<!-- 磁带选曲已删：进紫色空间自动切 Resurrections，回书架自动切回 Dearest Friends -->

<!-- BGM 播放器 -->
<audio id="bgmPlayer" loop>
    <source src="bgm/dearest-friends.mp3" type="audio/mpeg">
</audio>

<div id="world">
    <!-- 第一幕：书架（仅展示内容，dream 元素已搬到 #dreamScene） -->
    <section id="shelfView" class="view">
        <div class="wrap">
            <div id="cards" class="cards">
                <!-- 快照卡槽：保留 vanilla insertAdjacentHTML（情绪聚合 IIFE 维护） -->
                <div id="snapSlot"></div>
                <!-- 日记列表：Vue 接管渲染（loading/error/ok+月份分隔+日记行；empty 留白） -->
                <div id="diaryVue">
                    <div v-if="status==='loading'" class="empty"><span class="em">📖</span>正在搬书……</div>
                    <div v-else-if="status==='error'" class="empty"><span class="em">🌫️</span>书架暂时打不开（{{ errMsg }}）</div>
                    <template v-else-if="status==='ok'">
                        <div class="cards-head"><div class="ch-title"><span class="ch-en">Memory Index</span><span class="ch-cn">记忆目录</span></div><span class="ch-stat">共 <b>{{ totalPosts }}</b> 篇 · <b>{{ totalDays }}</b> 天</span></div>
                        <template v-for="g in viewGroups" :key="g.key">
                            <div v-if="g.divider" class="month-divider"><span class="md-name">{{ g.monEn }} {{ g.year }}</span><span class="md-cn">{{ g.monCn }}</span><span class="md-line"></span><span class="md-cnt">{{ g.monthCnt }} 篇</span></div>
                            <div class="shelf-row" :data-i="g.i">
                                <span class="row-icowrap"><img class="row-icon" src="namespace/cassette.png" alt="" loading="lazy" decoding="async"><i v-if="g.mood" class="row-mood" :style="{background: g.mood.color}" :title="g.mood.name"></i></span>
                                <div class="row-main"><div class="row-title">{{ g.title }}</div>
                                    <div v-if="g.snip" class="row-snip">{{ g.snip }}</div></div>
                                <div class="row-date">{{ g.enDate }}<span v-if="g.multi" class="row-count">×{{ g.entryCount }}</span></div>
                            </div>
                        </template>
                    </template>
                </div>
            </div>
            <div id="detail" class="detail">
                <button class="back">← 返回列表</button>
                <div class="detail-nav"><button class="prev-e" title="同日上一篇">←</button><span class="pos"></span><button class="next-e" title="同日下一篇">→</button></div>
                <div class="t"></div><div class="d"></div><div class="c"></div>
                <div class="acts"><button class="edit">回去编辑这篇</button><button class="publish">发成博客</button><button class="export-postcard">🖼 导出明信片</button><button class="del">删掉它</button></div>
            </div>
        </div>
    </section>
</div>

<!-- Badeline 聊天：镜子破碎召唤后出现 -->
<div id="blChat">
    <div class="bl-head">
        <img id="blHeadImg" src="celeste-player/badeline/lookingUp_f.gif" alt="">
        <div class="bl-name">BADELINE</div>
        <button class="bl-close" id="blClose" title="她先走了">✕</button>
    </div>
    <div id="blMsgs"></div>
    <div class="bl-input">
        <input id="blInput" type="text" maxlength="200" placeholder="说什么……她都听得见">
        <button id="blSend">说</button>
    </div>
</div>

<!-- Badeline 游戏对话框：官方文本框 + 情绪立绘逐帧动画（参照 diary 页 Madeline gameDialog 架构） -->
<div id="badelineDialog" role="button" title="点一下让她闭嘴">
    <div id="badelineDialogPortrait"><img id="blDialogImg" src="celeste-portraits/badeline/normal00.png" alt="Badeline" loading="lazy" decoding="async"></div>
    <div id="badelineDialogBody">
        <div id="badelineDialogName">Badeline</div>
        <div id="badelineDialogText"></div>
    </div>
</div>
<script src="js/api.js?v=20261109d"></script>
<!-- 地基层：本地状态 / 日记接口 / 音效池，均需先于 shelf.js 加载 -->
<script src="js/lib/store.js?v=20261106a"></script>
<script src="js/lib/diaryApi.js?v=20261108a"></script>
<script src="js/lib/sfx.js?v=20261108a"></script>
<script src="js/text-fx.js?v=20261005b"></script>
<script src="js/badeline-voice.js"></script>
<script src="js/lib/emotion-map.js?v=20261108a"></script>
<script src="js/vue.global.prod.js?v=20261008a"></script>
<script src="js/gapless-audio.js?v=20261028b"></script>
<script src="js/cassette.js?v=20261028b"></script>
<script src="js/celeste-hair.js?v=20261026a"></script>
<script src="js/celeste-character.js?v=20261110b"></script>
<script src="js/celeste-mirror-map.js?v=20261030a"></script>
<script src="js/celeste-mirror.js?v=20261110a"></script>
<!-- 雪脊鸟群：bird-motion.js 是和圆桌会议主持鸟共用的运动引擎（拖尾 / 变体音效池 / 曲线原语），
     dream-birds.js 监听 dream:entered / dream:exiting，必须排在 shelf.js 之前注册监听 -->
<script src="js/bird-motion.js?v=20261109a"></script>
<script src="js/dream-birds.js?v=20261109a"></script>
<script src="js/badeline-crawlout.js?v=20261107b"></script>
<script src="js/badeline-panel.js?v=20261108b"></script>
<script src="js/lib/png-anim.js?v=20261109a"></script>
<script src="js/shelf.js?v=20261109c"></script>
<script src="js/seed.js?v=20261109b"></script>
</body>
</html>
