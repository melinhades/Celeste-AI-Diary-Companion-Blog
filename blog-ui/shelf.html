<html lang="zh">
<head>
<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="icon/OIP.webp" type="image/webp">
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
* { box-sizing:border-box; margin:0; padding:0; }
@font-face { font-family:'Renogare'; src:url('celeste-font-en/Renogare-Regular.otf') format('opentype'); font-display:swap; }
@font-face { font-family:'CelesteZH'; src:url('fonts/NotoSansCJKsc-Medium.otf') format('opentype'); font-display:swap; }
body { min-height:100vh; background:url('celeste-gui/shelf-screen.webp') center/cover no-repeat fixed; font-family:'Renogare','CelesteZH','Microsoft YaHei',sans-serif; opacity:0; animation:pageFadeIn .8s ease forwards; }
/* #world 宽 200% 必然横向溢出：禁掉横向滚动，防止点击门时浏览器把页面带着横滚（scrollLeft 残留会让镜之房间错位露出 body 背景） */

@keyframes pageFadeIn { from { opacity:0; } to { opacity:1; } }
/* 可访问性：键盘聚焦高亮 */
:focus-visible { outline:2px solid #ffe36d; outline-offset:2px; border-radius:4px; }

.topbar a { display:inline-block; padding:24px 42px; background:rgba(22,34,60,.88); color:#ffe36d; border:2px solid #ffe36d; border-radius:6px; text-decoration:none; font-size:13px; box-shadow:0 0 10px rgba(255,230,109,.35); }
.topbar a.nav-diary-btn { padding:0; background:none; border:none; box-shadow:none; cursor:pointer; transition:transform .2s, filter .2s; vertical-align:middle; }
.topbar a.nav-diary-btn:hover { transform:scale(1.15); }
.topbar a.nav-diary-btn img { height:56px; width:auto; display:block; filter:drop-shadow(0 0 10px rgba(255,235,59,.7)); }
h1 { position:fixed; top:14px; left:50%; transform:translateX(-50%); font-family:'Press Start 2P',monospace; font-size:15px; color:#ffe36d; text-shadow:0 2px 0 rgba(0,0,0,.6); letter-spacing:2px; z-index:20; }
.wrap { max-width:1000px; margin:0 auto; padding:76px 20px 40px; }
/* ===== 日记列表：memo 纸页完整展示 ===== */
.cards {
    display:flex; flex-direction:column; gap:0;
    width:min(680px, 92vw);
    margin:0 auto;
    background:#e9dfcd url('celeste-journal/memo.png') center top / 100% auto no-repeat;
    border-radius:4px; padding:84px 52px 44px;
    filter:drop-shadow(0 12px 32px rgba(0,0,0,.4));
    position:relative;
    min-height:640px;
    transition:opacity .4s ease;
}
/* 纸页边缘做旧：左右两侧细微暗角 */
.cards::after {
    content:''; position:absolute; inset:0; border-radius:4px; pointer-events:none; z-index:3;
    box-shadow:inset 0 0 60px rgba(120,90,40,.08), inset 0 2px 0 rgba(255,255,255,.4);
}
/* 盖掉左上角 logo：纯色，和纸页底色一致 */
.cards::before {
    content:''; position:absolute; left:0; top:0;
    width:26%; height:9%;
    background:#e9dfcd;
    z-index:1; pointer-events:none;
}
.shelf-row {
    position:relative; display:flex; align-items:center; gap:14px;
    background:transparent; border:none; border-bottom:1px dashed rgba(163,129,47,.18);
    border-radius:6px; padding:16px 10px; cursor:pointer;
    opacity:0; transition:opacity .5s ease, transform .5s cubic-bezier(.22,1,.36,1), background .2s ease, box-shadow .2s ease;
    z-index:2;
}
.shelf-row:last-child { border-bottom:none; }
.shelf-row:hover { background:rgba(163,129,47,.08); box-shadow:inset 0 0 0 1px rgba(163,129,47,.18); }
.shelf-row:active { background:rgba(163,129,47,.14); transform:scale(.985); }
.shelf-row.from-below { transform:translateY(56px); }
.shelf-row.from-above { transform:translateY(-56px); }
.shelf-row.in { opacity:1; transform:translateY(0); }
.shelf-row.in:hover { transform:translateX(4px); }
.shelf-row.in:active { transform:scale(.985); }
.shelf-row .row-icon { width:28px; height:28px; image-rendering:pixelated; flex-shrink:0; opacity:.9; filter:drop-shadow(0 1px 2px rgba(0,0,0,.15)); transition:transform .2s ease; }
.shelf-row:hover .row-icon { transform:scale(1.12) rotate(-4deg); }
.shelf-row .row-main { flex:1; min-width:0; display:flex; flex-direction:column; gap:4px; }
.shelf-row .row-title { font-family:'Renogare','CelesteZH',sans-serif; font-size:15px; color:#3d2f1a; font-weight:700; letter-spacing:.3px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; text-shadow:0 1px 0 rgba(255,255,255,.5); }
.shelf-row .row-snip { font-size:12px; color:rgba(58,46,42,.6); line-height:1.6; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.shelf-row .row-date { font-family:'Renogare','CelesteZH',sans-serif; font-size:12px; color:#9a8560; letter-spacing:.5px; flex-shrink:0; display:flex; align-items:center; gap:6px; transition:color .2s ease; }
.shelf-row:hover .row-date { color:#6a5326; }
.shelf-row .row-count { display:inline-block; padding:2px 8px; background:rgba(163,129,47,.18); color:#6a5326; border-radius:10px; font-size:11px; font-weight:700; }
.shelf-row.snapshot { border-bottom-color:rgba(163,129,47,.35); }
.shelf-row.snapshot .row-title { color:#8a5a2b; }
.shelf-row.snapshot:hover { background:rgba(200,140,60,.1); }
.detail.anim-up { animation:slideUpIn .45s cubic-bezier(.22,1,.36,1); }
.detail.anim-down { animation:slideDownIn .45s cubic-bezier(.22,1,.36,1); }
@keyframes slideUpIn { from { opacity:0; transform:translateY(46px); } to { opacity:1; transform:translateY(0); } }
@keyframes slideDownIn { from { opacity:0; transform:translateY(-46px); } to { opacity:1; transform:translateY(0); } }
.empty { text-align:center; color:rgba(255,255,255,.85); background:rgba(22,34,60,.75); border:1px solid rgba(255,230,109,.2); border-radius:10px; padding:60px 24px; font-size:14px; line-height:2.2; backdrop-filter:blur(4px); }
.empty .em { display:block; font-size:28px; margin-bottom:14px; opacity:.9; }
.detail { display:none; background:linear-gradient(160deg, rgba(22,34,60,.95) 0%, rgba(14,22,44,.95) 100%); border:2px solid rgba(255,230,109,.45); border-radius:10px; padding:26px 28px; box-shadow:0 20px 50px rgba(0,0,0,.5), inset 0 1px 0 rgba(255,255,255,.06); }
.detail.show { display:block; }
.detail-nav { display:flex; align-items:center; justify-content:space-between; gap:10px; margin-bottom:16px; }
.detail-nav button { padding:8px 20px; border:2px solid rgba(255,230,109,.6); border-radius:6px; background:rgba(22,34,60,.6); color:#ffe36d; font-size:14px; cursor:pointer; transition:background .15s, transform .1s, border-color .15s; font-family:inherit; }
.detail-nav button:hover:not(:disabled) { background:rgba(255,230,109,.18); border-color:#ffe36d; }
.detail-nav button:active:not(:disabled) { transform:scale(.95); }
.detail-nav button:disabled { opacity:.25; cursor:not-allowed; }
.detail-nav .pos { color:rgba(255,230,109,.7); font-size:12px; font-family:'Renogare',sans-serif; letter-spacing:1px; }

.detail .t { color:#ffe36d; font-size:22px; margin-bottom:8px; word-break:break-all; font-weight:700; line-height:1.4; text-shadow:0 1px 4px rgba(0,0,0,.4); }
.detail .d { color:rgba(255,230,109,.55); font-size:12px; margin-bottom:18px; letter-spacing:.5px; }
.detail .c { color:rgba(255,255,255,.92); font-size:15px; line-height:2.1; white-space:pre-wrap; word-break:break-word; padding:16px 18px; background:rgba(0,0,0,.18); border-radius:8px; border-left:3px solid rgba(255,230,109,.3); }
.acts { display:flex; gap:10px; margin-top:24px; flex-wrap:wrap; }
.acts button { flex:1; min-width:120px; padding:11px 0; border-radius:6px; cursor:pointer; font-size:14px; border:2px solid rgba(255,230,109,.5); background:rgba(22,34,60,.6); color:#ffe36d; font-family:inherit; transition:all .15s ease; }
.acts button:hover:not(:disabled) { background:rgba(255,230,109,.18); border-color:#ffe36d; transform:translateY(-2px); box-shadow:0 4px 12px rgba(255,230,109,.15); }
.acts button:active { transform:translateY(0); }

.acts button.del:hover { background:rgba(230,81,124,.18); border-color:#e6517c; box-shadow:0 4px 12px rgba(230,81,124,.2); }
.toast { position:fixed; left:50%; bottom:40px; transform:translateX(-50%) translateY(20px); background:rgba(22,34,60,.96); color:#ffe36d; border:1px solid rgba(255,230,109,.5); padding:12px 22px; border-radius:8px; opacity:0; transition:all .3s cubic-bezier(.22,1,.36,1); z-index:99; font-size:13px; box-shadow:0 8px 24px rgba(0,0,0,.4), 0 0 0 1px rgba(255,230,109,.1); max-width:90vw; text-align:center; }

/* ===== 镜子：镜之房间正中偏上 · 图层叠加 · 点击破碎召唤 Badeline ===== */
#shelfMirror {
    position: relative;
    margin: -32px auto 0;                /* 整体上移 32px，让镜框更贴合紫色空间视觉重心 */
    width: 0;
    height: 0;
    cursor: pointer;
    user-select: none;
    -webkit-user-drag: none;
    filter: drop-shadow(0 10px 22px rgba(0,0,0,.5));
}
#shelfMirror .m-layer {
    position: absolute;
    left: 50%;
    top: 50%;
    transform: translate(-50%,-50%);
    image-rendering: pixelated;
    pointer-events: none;
}
#shelfMirror .m-mask { animation: maskDrift 5s ease-in-out infinite; }
@keyframes maskDrift {
    0%,100% { transform: translate(-50%,-50%) translate(0,0); }
    30% { transform: translate(-50%,-50%) translate(5px,-6px); }
    65% { transform: translate(-50%,-50%) translate(-5px,4px); }
}
#shelfMirror.mirror-shake { animation: mirrorShake .28s linear 2; }
@keyframes mirrorShake {
    0%,100% { transform: translate(0,0); }
    25% { transform: translate(-5px,3px); }
    50% { transform: translate(5px,-3px); }
    75% { transform: translate(-4px,-2px); }
}
#shelfMirror .badeline-wrap {
    position: absolute;
    left: 50%;
    top: 50%;
    opacity: 0;
    pointer-events: none;
    z-index: 6;
}
/* 自由游荡态：wrap 被 DOM 移到 #mirrorRoom 子级后启用，相对房间全屏定位 */
.badeline-wrap.free {
    position: absolute;
    opacity: 1;
    pointer-events: auto;          /* 自由游荡时可点击本人触发对话 */
    z-index: 10;                    /* 比心门(z-index:8)高，不被门盖住 */
    transition: opacity .8s ease, left 1.5s ease, top 1.5s ease, transform .3s ease;
    will-change: left, top, transform;
}
.badeline-wrap.free .badeline-inner { animation: none; }   /* 自由游荡时关闭原 floating 浮动，避免与 transition 冲突 */
#shelfMirror.summoned .badeline-wrap {
    animation: badelineRise .9s cubic-bezier(0.34,1.56,0.64,1);   /* 无 forwards：.done 类接管驻留态 */
    opacity: 1;                                                    /* 动画结束后立即可见，不闪 0 */
}
/* 驻留态：animationend 后加 .done，由静态 CSS 接管 transform（含 --glass-scale），绕过 forwards+var() Safari 风险 */
#shelfMirror.summoned .badeline-wrap.done {
    transform: translate(-50%, -78%) scale(var(--glass-scale));
}
@keyframes badelineRise {
    from { opacity: 0; transform: translate(-50%,10%) scale(calc(var(--glass-scale) * .3)); }
    to   { opacity: 1; transform: translate(-50%,-78%) scale(var(--glass-scale)); }
}
#shelfMirror.summoned.bye .badeline-wrap { animation: badelineBye .7s ease forwards; }
@keyframes badelineBye {
    from { opacity: 1; transform: translate(-50%,-78%) scale(var(--glass-scale)); }
    to   { opacity: 0; transform: translate(-50%,-120%) scale(calc(var(--glass-scale) * .7)); }
}
.badeline-inner {
    width: 96px; height: 96px;             /* 固定尺寸：img 绝对定位居中，不撑大父级（不限父容器） */
    position: relative;
}
#shelfMirror .badeline-inner { animation: badelineFloat 2.6s ease-in-out infinite; }
@keyframes badelineFloat { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-8px); } }
.badeline-inner img {
    image-rendering: pixelated;
    filter: drop-shadow(0 0 14px rgba(125,80,200,.75));
}
/*
 * Badeline 立绘尺寸统一：5 个 gif 两类源尺寸
 *   32×32（spin/sleep/pretendDead/rollGetUp）→ 96px 容器 = 3× 整数放大
 *   96×96（lookingUp）→ 同尺寸角色在 3× 大画布中，1:1 显示时角色仅其他 gif 的一半
 *   解决：lookingUp 用 288px(96×3) 渲染，3× 整数放大 → 角色显示尺寸与 32px 源一致
 *   .badeline-inner 固定 96px + overflow:visible，img 绝对定位居中，288px 超出部分为透明像素不可见
 */
#badelineImg {
    position: absolute; left: 50%; top: 50%; transform: translate(-50%,-50%);
    width: 96px; height: 96px;
    object-fit: contain;
    image-rendering: pixelated;   /* 32px 源 3× 整数放大保持锐边 */
    cursor: pointer;
    user-select: none;
    -webkit-user-drag: none;
}
#badelineImg.big { width: 288px; height: 288px; }   /* lookingUp 96px 源 3× 放大 = 288px */
#badelineImg:hover { filter: drop-shadow(0 0 18px rgba(160,110,220,.95)); transition: filter .2s ease; }

/* ===== Badeline 聊天面板：镜子召唤后出现 ===== */
#blChat {

    background: rgba(16, 10, 28, .93);

    flex-direction: column;
    overflow: hidden;
    opacity: 0;
    transform: translateX(-50%) translateY(16px);
    transition: opacity .25s ease, transform .25s ease;
}
#blChat.show { display: flex; }
#blChat.vis { opacity: 1; transform: translateX(-50%) translateY(0); }

    display: flex;
    align-items: center;
    gap: 10px;

    border-bottom: 1px solid rgba(205, 182, 255, .25);
}

.bl-msg.user { align-self: flex-end; color: #ffe36d; background: rgba(255,230,109,.1); border: 1px solid rgba(255,230,109,.3); }
.bl-msg.loading { color: rgba(232,221,255,.5); font-style: italic; }
#blChat .bl-input { display: flex; gap: 8px; padding: 10px 12px; border-top: 1px solid rgba(205,182,255,.25); }
#blInput { flex: 1; padding: 9px 10px; border: 1px solid rgba(205,182,255,.4); border-radius: 6px; background: rgba(205,182,255,.1); color: #efe7ff; font-size: 13px; outline: none; font-family: 'Renogare','CelesteZH','Microsoft YaHei',sans-serif; }
#blInput:focus { border-color: #cdb6ff; background: rgba(205,182,255,.18); }
#blInput::placeholder { color: rgba(232,221,255,.35); }
#blSend { padding: 9px 16px; border: none; border-radius: 6px; background: #8a5cff; color: #fff; cursor: pointer; font-size: 14px; letter-spacing: 1px; font-family: 'Renogare','CelesteZH',sans-serif; box-shadow: inset 0 -2px rgba(0,0,0,.35); }
#blSend:hover:not(:disabled) { background: #9d7bff; }
#blSend:disabled { opacity: .5; cursor: not-allowed; }
.bl-emo { display: inline-block; font-size: 10px; color: #b79aff; border: 1px solid rgba(183,154,255,.45); border-radius: 8px; padding: 0 6px; margin-right: 6px; vertical-align: 1px; opacity: .9; }

/* ===== Badeline 游戏对话框：官方文本框 + 情绪立绘（演出层；聊天面板让位上移） ===== */
#badelineDialog {
    position: fixed;
    left: 50%;
    bottom: 26px;
    transform: translateX(-50%) translateY(24px);
    width: min(94vw, 900px);
    min-height: 128px;
    z-index: 1600;
    display: flex;
    align-items: center;
    gap: 18px;
    padding: 20px 30px;
    background: url('celeste-portraits/textbox/badeline.png') center / 100% 100% no-repeat;

    cursor: pointer;

#badelineDialog.show { opacity: 1; transform: translateX(-50%) translateY(0); pointer-events: auto; }
#badelineDialogPortrait { width: 92px; height: 92px; flex-shrink: 0; border-radius: 6px; overflow: hidden; background: rgba(0,0,0,.4); }
#badelineDialogPortrait img { width: 100%; height: 100%; object-fit: cover; display: block; image-rendering: pixelated; }
#badelineDialogName { color: #cdb6ff; font-family: 'Renogare','CelesteZH','Microsoft YaHei',sans-serif; font-size: 13px; letter-spacing: 2px; margin-bottom: 5px; text-shadow: 0 0 10px rgba(205,182,255,.45); }
#badelineDialogText { color: #f2ecff; font-family: 'Renogare','CelesteZH','Microsoft YaHei',sans-serif; font-size: 14px; line-height: 1.7; word-break: break-word; min-height: 48px; white-space: pre-wrap; }
#blChat.dialog-live { bottom: 178px; }
@media (max-width: 640px) {
    #badelineDialog { padding: 14px 18px; min-height: 104px; gap: 12px; }
    #badelineDialogPortrait { width: 72px; height: 72px; }
    #blChat.dialog-live { bottom: 150px; }
}

/* ===== 横向世界：书架（单屏，常规态） ===== */
html, body { overflow-x: hidden; }
#world { display:block; width:100%; }
#world .view { width:100%; min-height:100vh; position:relative; box-sizing:border-box; }

/* ===== dreamScene 内部双屏容器：左=心门+篝火，右=镜之房间 ===== */
.ds-world {
    position:absolute; left:0; top:0;
    width:calc(200vw + var(--bridge-w)); height:100vh;
    display:flex;
    transition:transform 1.35s cubic-bezier(.65,0,.35,1); will-change:transform;
    transform-origin: left center;
}
.ds-world > .ds-left, .ds-world > #mirrorRoom { width:100vw; height:100vh; flex-shrink:0; position:relative; overflow:hidden; }
.ds-world.panned { transform:translateX(calc(-100vw - var(--bridge-w))); }
/* 过渡区（真实缓冲区域，宽 --bridge-w ≥ 镜子 384px）：
   两色渐变 #20175e → #010104，节奏为"先快速变黑再缓入右色"：前 1/5 就压到近黑，余下长尾缓慢趋近 #010104，
   缓冲带以右侧暗色为主导 */
.ds-bridge {
    width:var(--bridge-w); height:100vh; flex-shrink:0; position:relative; overflow:hidden;
    background:linear-gradient(90deg, #20175e 0%, #0a0830 14%, #040314 32%, #02020a 55%, #010104 100%);
}

/* ===== 心门（游戏截图蓝色光柱 · 全高占满右侧） =====
   door.png 为 312×1425 截图（已抹除四颗空心轮廓，心形由 icon00-06 帧叠加），
   门宽 = 100vh × 312/1425 ≈ 21.9vh，严格保持原始像素比例，无拉伸变形 */
:root { --door-w:21.9vh; --crack:16px; }
#heartDoor {
    position:absolute; right:0; top:0; height:100vh;
    width:var(--door-w);
    cursor:not-allowed; z-index:8; user-select:none;
    overflow:hidden;
    filter:drop-shadow(-10px 0 30px rgba(80,190,255,.35));
    transition:filter .8s ease, opacity .6s ease, transform 1.35s cubic-bezier(.65,0,.35,1);
}
/* 上下两半：各盖 1px 消除 subpixel 缝；截图背景在半内按全门尺寸铺放。
   开启后（.split）两半错位拉开露出中段开口（照游戏原图：上段 0~55%、下段 74~100%），门柱不消失 */
#heartDoor .hd-half {
    position:absolute; left:0; right:0; height:calc(50% + 1px); overflow:hidden;
    transition:transform 1.15s cubic-bezier(.65,0,.22,1), height .72s cubic-bezier(.3,.55,.45,1);
}
#heartDoor .hd-half-t { top:0; }
#heartDoor .hd-half-b { bottom:0; }
#heartDoor .hd-half .hd-img {
    position:absolute; left:0; width:100%; height:200%;
    background:url('heartdoor/door.png') center / 100% 100% no-repeat;
    image-rendering:pixelated;
    transition:height .72s cubic-bezier(.3,.55,.45,1);
}
#heartDoor .hd-half-t .hd-img { top:0; }
#heartDoor .hd-half-b .hd-img { bottom:0; }
/* 开启：上段拉长到 55%（图片 0~55%），下段收到 26%（图片 74~100%），中段 55~74% 成开口 */
#heartDoor.split { cursor:pointer; }
#heartDoor.split .hd-half-t { height:55%; }
#heartDoor.split .hd-half-t .hd-img { height:calc(100% / 0.55); }
#heartDoor.split .hd-half-b { height:26%; }
#heartDoor.split .hd-half-b .hd-img { height:calc(100% / 0.26); }
/* 开启后两段切口贴 top.png 白色锯齿装饰弥补断口：尺寸参照门两侧回纹带宽（39/312 门宽）：
   下段正向（横梁贴切口、柱垂入段内），上段垂直翻转（横梁贴切口、柱托入段内） */
#heartDoor.split .hd-half-t::after,
#heartDoor.split .hd-half-b::before {
    content:''; position:absolute; left:0; right:0;
    height:calc(var(--door-w) * 39 / 312);
    background:url('heartdoor/top.png') top left / calc(var(--door-w) * 39 / 312) calc(var(--door-w) * 39 / 312) repeat-x;
    image-rendering:pixelated;
    filter:drop-shadow(0 0 5px rgba(170,230,255,.75));
}
#heartDoor.split .hd-half-b::before { top:0; z-index:2; }
#heartDoor.split .hd-half-t::after { bottom:0; transform:scaleY(-1); z-index:2; }
/* 四颗心：全门坐标系定位（容器挂在门根节点）。开启后上排归上段（51%）、下排归下段（82%），与门柱同框 */
#heartDoor .hd-hearts {
    position:absolute; left:0; top:0; width:100%; height:100%; z-index:3;
}
#heartDoor .hd-hearts img {
    position:absolute; width:20.2%; aspect-ratio:1/1;
    transform:translate(-50%,-50%);
    image-rendering:pixelated;
    filter:drop-shadow(0 0 3px rgba(6,16,28,.95)) drop-shadow(0 0 8px rgba(120,200,235,.5));
    transition:filter .45s ease, top .72s cubic-bezier(.3,.55,.45,1);
}
#heartDoor .hd-hearts img.h0 { left:35.26%; top:63.75%; }
#heartDoor .hd-hearts img.h1 { left:65.71%; top:63.75%; }
#heartDoor .hd-hearts img.h2 { left:35.26%; top:70.42%; }
#heartDoor .hd-hearts img.h3 { left:65.71%; top:70.42%; }
#heartDoor.split .hd-hearts img.h0, #heartDoor.split .hd-hearts img.h1 { top:51%; }
#heartDoor.split .hd-hearts img.h2, #heartDoor.split .hd-hearts img.h3 { top:82%; }
#heartDoor.split .hd-hearts img {
    filter:drop-shadow(0 0 6px rgba(255,255,255,.9)) drop-shadow(0 0 14px rgba(90,180,225,.8));
}
/* 开口保持透明：不加光带，直接透出后面场景 */
#heartDoor .hd-hearts img.pop { animation:hdPop .55s cubic-bezier(.22,1.4,.36,1); }
@keyframes hdPop {
    0%   { transform:translate(-50%,-50%) scale(.3); filter:drop-shadow(0 0 0 rgba(160,220,255,0)); }
    55%  { transform:translate(-50%,-50%) scale(1.4); filter:drop-shadow(0 0 18px rgba(230,250,255,.95)); }
    100% { transform:translate(-50%,-50%) scale(1); filter:drop-shadow(0 0 6px rgba(215,245,255,.5)); }
}
#heartDoor.ready { cursor:pointer; }
#heartDoor.ready { filter:drop-shadow(-10px 0 30px rgba(80,190,255,.35)) drop-shadow(0 0 22px rgba(150,225,255,.45)); }
#heartDoor.ready .hd-hearts img { animation:hdPulse 1.6s ease-in-out infinite; }
@keyframes hdPulse { 0%,100% { transform:translate(-50%,-50%) scale(1); } 50% { transform:translate(-50%,-50%) scale(1.12); } }
#heartDoor.shake { animation:hdShake .3s linear 2; }
@keyframes hdShake { 0%,100% { translate:0 0; } 25% { translate:-6px 0; } 75% { translate:6px 0; } }
/* 开门特效（由 JS 挂到 #dreamScene）：全屏白闪 / 门底残影暗斑 */
#doorFlash { position:fixed; inset:0; z-index:1601; pointer-events:none; background:#eaf9ff;
    animation:doorFlashFx .5s ease-out forwards; }
@keyframes doorFlashFx { 0% { opacity:0; } 14% { opacity:.85; } 100% { opacity:0; } }
#doorResidue { position:fixed; bottom:0; right:calc(var(--door-w) * -0.4);
    width:calc(var(--door-w) * 1.8); height:24vh; z-index:1590; pointer-events:none;
    background:radial-gradient(58% 66% at 50% 96%, rgba(6,5,16,.8), rgba(6,5,16,0) 72%);
    animation:doorResidueFx 2.1s ease-out forwards; }
@keyframes doorResidueFx { 0% { opacity:.9; } 100% { opacity:0; } }
#heartDoor.away { opacity:0; pointer-events:none; }
/* panned（镜之房间侧）：心门随镜头一起向左出画。#heartDoor 是 .ds-world 的兄弟节点，
   用 ~ 兄弟选择器叠加 translateX(-100vw)，与 .ds-world 平移量一致、节奏同步 */
.ds-world.panned ~ #heartDoor {
    transform: translateX(calc(-100vw - var(--bridge-w))) translateY(var(--door-top)) scale(var(--door-scale));
    cursor: default;
    pointer-events: none;
}

/* ===== 镜之房间（心门后） ===== */
#mirrorRoom {
    /* 极暗紫渐变 + Badeline 专属背景图叠加，图片 cover 铺满 */
    background:
        radial-gradient(120% 95% at 50% 42%, #221736 0%, #120d22 52%, #060410 100%),
        url('celeste-areas/bg-badeline/00.png') center / cover no-repeat;
    background-blend-mode: multiply;    /* 渐变乘上图片，暗部压黑、亮部保留 */
    display:flex; align-items:center; justify-content:center;
    isolation:isolate;
}

/* ===== dream 模式边框调节面板（开发者工具） ===== */
.adjust-btn {
    position: fixed; top: 14px; right: 14px;
    width: 30px; height: 30px; border-radius: 50%;
    background: rgba(138, 43, 226, 0.3);
    border: 1px solid rgba(255, 255, 255, 0.35);
    color: #fff; font-size: 14px; font-weight: 700;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer; z-index: 9999; backdrop-filter: blur(6px);
    transition: transform .15s ease, background .15s ease;
    box-shadow: 0 2px 10px rgba(0,0,0,.4);
}
.adjust-btn:hover { background: rgba(138, 43, 226, 0.6); transform: scale(1.1); }
.adjust-panel {
    position: fixed; top: 52px; right: 14px;
    width: 260px; padding: 16px 18px;
    background: rgba(20, 14, 40, 0.95);
    border: 1px solid rgba(138, 43, 226, 0.5);
    border-radius: 10px; z-index: 9999;
    color: #e8e8f0; font-size: 13px;
    backdrop-filter: blur(12px);
    box-shadow: 0 8px 28px rgba(0,0,0,.6);
    opacity: 0; transform: translateY(-8px) scale(.95);
    pointer-events: none;
    transition: opacity .18s ease, transform .18s ease;
}
.adjust-panel.show { opacity: 1; transform: translateY(0) scale(1); pointer-events: auto; }
.adjust-panel h4 { margin: 0 0 10px; font-size: 12px; color: #a78bfa; letter-spacing: .08em; text-transform: uppercase; }
.adjust-group { margin-bottom: 12px; }
.adjust-group:last-child { margin-bottom: 0; }
.adjust-row { display: flex; align-items: center; gap: 10px; margin-bottom: 6px; }
.adjust-row label { flex: 0 0 52px; color: #c8c8dc; font-size: 12px; }
.adjust-row input[type=range] { flex: 1; accent-color: #a78bfa; }
.adjust-row .val { flex: 0 0 44px; text-align: right; font-variant-numeric: tabular-nums; color: #a78bfa; font-size: 12px; }
.adjust-reset { margin-top: 8px; width: 100%; padding: 6px;
    background: transparent; border: 1px solid rgba(255,255,255,.2);
    color: #c8c8dc; border-radius: 6px; cursor: pointer; font-size: 12px; }
.adjust-reset:hover { background: rgba(255,255,255,.1); border-color: rgba(138,43,226,.6); }

/* 心门 + 镜之房间默认隐藏，dream 激活时才出现 ===== */
/* 调节面板用的 CSS 变量 —— 可动态覆盖 localStorage 持久化的值 */
:root {
    /* 镜框（frame.png雕花边框）独立 */
    --frame-top:     -32px;    /* 镜框 上/下 偏移（正=下，负=上） */
    --frame-scale:   1;       /* 镜框 缩放 */
    /* 镜面（玻璃+反射+破碎+Badeline角色）独立 */
    --glass-top:     0px;     /* 镜面 上/下 偏移 */
    --glass-scale:   1;       /* 镜面 缩放 */
    /* 心门 */
    --door-top:      0px;
    --door-scale:    1;
}
#heartDoor, #mirrorRoom { display: none !important; }
body.dream-active #heartDoor {
    display: block !important;
    transform: translateY(var(--door-top)) scale(var(--door-scale));
    transform-origin: top right;
}
body.dream-active #mirrorRoom { display: flex !important; }
/* 镜框独立变换 —— frame.png (.m-frame) */
body.dream-active #shelfMirror .m-frame {
    transform: translate(-50%, -50%) translateY(var(--frame-top)) scale(var(--frame-scale));
    transform-origin: center center;
}
/* 镜面系独立变换 —— .m-glass + .badeline-wrap（Badeline 在玻璃层上） */
body.dream-active #shelfMirror .m-glass,
body.dream-active #shelfMirror .badeline-wrap {
    transform-origin: center center;
    transform: translate(-50%, -50%) translateY(var(--glass-top)) scale(var(--glass-scale));
}

/* ===== 紫色空间粒子：3 类星点 PNG 纯竖直下落 + 蓝色拖尾（取素材 stars 实际色） ===== */
.mv-layer { position:absolute; inset:0; overflow:hidden; pointer-events:none; z-index:-1; }
/* 进镜之房间后隐藏全屏雪花画布（暗色空间不要雪） */
#shelfSnow { transition:opacity .5s ease; }
body:has(.ds-world.panned) #shelfSnow { opacity:0; }
body:has(.ds-world.panned) #strawberryBonfire { opacity:0; pointer-events:none; transition:opacity .5s ease; }
.star {
    position:absolute; top:-56px; left:var(--x);
    image-rendering:pixelated; opacity:0;
    animation:starFall linear forwards;
    will-change:transform, opacity, filter;
    /* drop-shadow 发光半径用 --glowAmount 变量，由 keyframes 从 0 逐步涨到 72px */
    filter:drop-shadow(0 0 calc(var(--glowAmount) * .4) rgba(95,205,228,.7))
           drop-shadow(0 0 var(--glowAmount) rgba(48,96,130,.45));
}
/* 注册 --glowAmount 为 <length>，让 drop-shadow 在 keyframes 里能插值动画（Chrome 85+/Safari 15.4+ 支持） */
@property --glowAmount { syntax:'<length>'; initial-value:0px; inherits:false; }
@keyframes starFall {
    /* 纯竖直下落 + 发光从小到大：入场弱光 → 中段爆亮 → 消散前光最盛 */
    0%   { transform:translate3d(0,0,0); opacity:0;   --glowAmount: 0px; }
    6%   { opacity:1;  --glowAmount: 24px; }
    50%  { --glowAmount: 48px; }
    92%  { opacity:.55; --glowAmount: 64px; }
    100% { transform:translate3d(0, var(--dist), 0); opacity:0; --glowAmount: 72px; }
}

/* ===== dream 场景：极光夜空 + 雪原篝火（像素风：硬边缘 · 平色带 · 台阶轮廓） ===== */
#dreamScene {
    position:fixed; inset:0; z-index:1500; overflow:hidden;
    --bridge-w: 420px;    /* 两场景间过渡区宽度（≥ 镜子显示宽 384px），pan 距离随其联动 */
    /* 天空：深靛夜空，极光带微亮（参照实机第七章梦境天色） */
    background:linear-gradient(180deg, #110d38 0%, #181245 26%, #221a58 44%, #1e1550 58%, #16103e 78%, #110b30 100%);
    opacity:0; visibility:hidden; pointer-events:none;
    transition:opacity 1.1s ease, visibility 0s linear 1.1s;
}
#dreamScene.show { opacity:1; visibility:visible; pointer-events:auto; transition:opacity 1.1s ease; }
/* 星空：方形像素点（background 硬边方块，百分比定位自适应宽度） */
.ds-stars { position:absolute; inset:0 0 32% 0; opacity:.85;
    background:
        linear-gradient(#ffffff,#ffffff) 8% 18%/2px 2px no-repeat,
        linear-gradient(#cfeaff,#cfeaff) 16% 64%/2px 2px no-repeat,
        linear-gradient(#ffffff,#ffffff) 23% 36%/3px 3px no-repeat,
        linear-gradient(#9fd8ff,#9fd8ff) 30% 8%/2px 2px no-repeat,
        linear-gradient(#ffffff,#ffffff) 37% 52%/2px 2px no-repeat,
        linear-gradient(#cfeaff,#cfeaff) 44% 24%/2px 2px no-repeat,
        linear-gradient(#ffffff,#ffffff) 51% 70%/3px 3px no-repeat,
        linear-gradient(#9fd8ff,#9fd8ff) 58% 14%/2px 2px no-repeat,
        linear-gradient(#ffffff,#ffffff) 64% 42%/2px 2px no-repeat,
        linear-gradient(#cfeaff,#cfeaff) 71% 30%/2px 2px no-repeat,
        linear-gradient(#ffffff,#ffffff) 78% 60%/3px 3px no-repeat,
        linear-gradient(#9fd8ff,#9fd8ff) 85% 20%/2px 2px no-repeat,
        linear-gradient(#ffffff,#ffffff) 92% 46%/2px 2px no-repeat,
        linear-gradient(#cfeaff,#cfeaff) 96% 12%/2px 2px no-repeat;
    animation:dsTwinkle 3.6s steps(2) infinite;
}
@keyframes dsTwinkle { 0%,100% { opacity:.4; } 50% { opacity:.95; } }
/* 极光色像素星点：天空与桥底下随机闪烁（JS 生成，蓝 #6fd8ff / 绿 #7dffc8，每点独立节奏） */
.ds-astars { position:absolute; inset:0; z-index:1; pointer-events:none; }
.ds-astars i { position:absolute; width:3px; height:3px; opacity:0;
    animation:dsAuroraTw var(--dur,3s) ease-in-out var(--del,0s) infinite; }
@keyframes dsAuroraTw { 0%,100% { opacity:0; } 50% { opacity:.95; } }
/* dream 左屏：整幅游戏截图铺底（celeste-gui/dream/scene.png，2540x1429=16:9，
   已抹除原截图中的 Madeline 与篝火），含极光/远山/两侧雪墙/雪台；
   cover+bottom 锚定：16:9 屏零裁切，其他比例裁两侧、雪台始终贴底 */
.ds-left {
    background:url('celeste-gui/dream/scene.png') center bottom / cover no-repeat;
}
/* 篝火：站在截图雪台面上（雪线在全高 75% 处，即底部 25%）；本身即"记梦"入口，hover 泛绿光 */
#dsFire { position:absolute; left:50%; bottom:25%; width:clamp(135px,27.3vmin,195px);
    transform:translateX(-50%); image-rendering:pixelated;
    cursor:pointer; transition:filter .18s ease; }
#dsFire:hover { filter:drop-shadow(0 0 14px rgba(110,255,180,.8)); }
/* 围炉睡觉的 Madeline（篝火左侧）：可点击，hover 泛暖光提示"可叫醒" */
#dsMadeline {
    position:absolute; left:39%; bottom:24.8%; z-index:3;
    width:clamp(67.6px,14.3vmin,109.2px); image-rendering:pixelated;
    cursor:pointer; user-select:none; -webkit-user-drag:none;
    transition:filter .2s ease, transform .15s ease;
}
#dsMadeline:hover { filter:drop-shadow(0 0 10px rgba(255,210,150,.85)); transform:translateY(-2px); }
#dsMadeline.waking { cursor:default; pointer-events:none; }

/* ===== dream 功能入口：夜话（badelineboost 动画，置于心门左侧） ===== */
/* transition 放基础态：panned 淡出、goBack 回雪夜时逐渐浮现（渐显渐隐双向生效） */
#dreamTools { position:absolute; top:16px; right:calc(var(--door-w) + 22px); z-index:5; transition:opacity .5s ease; }
/* 平移进镜之房间后心门已出画，按钮随之淡出 */

<script>
    // ===== 雪花动画（mountainSnow 原版贴图） =====
    (function () {
        const canvas = document.getElementById('shelfSnow');
        const ctx = canvas.getContext('2d');
        const flakeImg = new Image();
        flakeImg.src = 'celeste-gui/mountain-snow.png';
        let flakes = [];
        function resize() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
        function mk(randomY) {
            return {
                x: Math.random() * canvas.width,
                y: randomY ? Math.random() * canvas.height : -20,
                s: Math.random() * 10 + 5,
                speed: Math.random() * 1 + 0.4,
                wind: Math.random() * 0.4 - 0.2,
                opacity: Math.random() * 0.55 + 0.3,
                rot: Math.random() * Math.PI * 2,
                rotSpeed: (Math.random() - 0.5) * 0.02,
                swing: Math.random() * Math.PI * 2,
                swingSpeed: Math.random() * 0.02 + 0.008
            };
        }
        function init() { flakes = []; for (let i = 0; i < 50; i++) flakes.push(mk(true)); }
        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            if (flakeImg.complete && flakeImg.naturalWidth > 0) {
                for (const f of flakes) {
                    f.y += f.speed; f.swing += f.swingSpeed; f.rot += f.rotSpeed;
                    f.x += Math.sin(f.swing) * 0.5 + f.wind;
                    if (f.y > canvas.height + 20) Object.assign(f, mk(false));
                    if (f.x > canvas.width + 20) f.x = -20;
                    if (f.x < -20) f.x = canvas.width + 20;
                    ctx.save();
                    ctx.globalAlpha = f.opacity;
                    ctx.translate(f.x, f.y);
                    ctx.rotate(f.rot);
                    ctx.drawImage(flakeImg, -f.s / 2, -f.s / 2, f.s, f.s);
                    ctx.restore();
                }
            }
            requestAnimationFrame(draw);
        }
        window.addEventListener('resize', resize);
        resize(); init(); draw();
    })();

    const bgmPlayer = document.getElementById('bgmPlayer');
    // 默认 Dearest Friends（磁带选曲已删，用户无法手动切换 BGM）
    const savedTime = parseFloat(localStorage.getItem('bgmTimeShelf') || '0');
    if (savedTime > 0) bgmPlayer.currentTime = savedTime;
    bgmPlayer.volume = 0.3;
    bgmPlayer.play().catch(() => {});
    setInterval(() => { localStorage.setItem('bgmTimeShelf', bgmPlayer.currentTime); }, 2000);
    function tryPlayBGM() { bgmPlayer.play().then(() => { document.removeEventListener('click', tryPlayBGM); document.removeEventListener('keydown', tryPlayBGM); }).catch(() => {}); }
    document.addEventListener('click', tryPlayBGM);
    document.addEventListener('keydown', tryPlayBGM);

    // ===== 磁带选曲已删：进紫色空间自动切 Resurrections，回书架自动切回 Dearest Friends =====

function renderPostcardCanvas(canvas, title, dateStr, content, summary, strawCount) {
    var ctx = canvas.getContext('2d');
    var INK = '#8f4a3c';
    var INK_SOFT = 'rgba(143,74,60,.78)';
    return loadPostcardImg().then(function (img) {
        var W = 1200, H = 800;
        if (img) {
            H = Math.round(W * img.naturalHeight / img.naturalWidth);
            canvas.width = W; canvas.height = H;
            ctx.drawImage(img, 0, 0, W, H);
        } else {
            canvas.width = W; canvas.height = H;
            ctx.fillStyle = '#f2e2d5'; ctx.fillRect(0, 0, W, H);
            ctx.strokeStyle = INK_SOFT; ctx.lineWidth = 3;
            ctx.strokeRect(18, 18, W - 36, H - 36);
        }

        // ===== To: 两条横线上写标题和日期 =====
        ctx.fillStyle = INK;
        ctx.font = 'italic 30px "Renogare","CelesteZH","Microsoft YaHei",sans-serif';
        ctx.fillText((title || '无题').substring(0, 26), W * 0.14, H * 0.130);
        ctx.font = 'italic 19px "Renogare","CelesteZH","Microsoft YaHei",sans-serif';
        ctx.fillStyle = INK_SOFT;
        ctx.fillText(dateStr || '', W * 0.14, H * 0.200);

        // ===== 中间大片书写区：内容总结（【】里的字红色高亮） =====
        // 自动适配书写框：字号按字数二分试探（21→11.5px 连续取最大可容字号）；实在装不下才在框底截断补 "…"
        var RED_INK = '#c8433a';
        var FONT_STACK = '"Renogare","CelesteZH","Microsoft YaHei",sans-serif';
        var full = (content || '').substring(0, 1000);
        var segs = [], mSeg, reSeg = /【([^】]*)】/g, lastI = 0;
        while ((mSeg = reSeg.exec(full)) !== null) {
            if (mSeg.index > lastI) segs.push({ t: full.slice(lastI, mSeg.index), r: false });
            segs.push({ t: mSeg[1], r: true });
            lastI = reSeg.lastIndex;
        }
        if (lastI < full.length) segs.push({ t: full.slice(lastI), r: false });
        var lx = W * 0.07, maxX = W * 0.56, ly0 = H * 0.34, mh = H * 0.62;
        // 逐字排版走查：draw=false 仅模拟（看装不装得下），draw=true 落笔；超出书写框底即停
        function layoutSegs(list, fs, lh, draw) {
            ctx.font = fs + 'px ' + FONT_STACK;
            var ly = ly0, x = lx, fits = true, px = lx, py = ly0;
            for (var si = 0; si < list.length; si++) {
                var chars = list[si].t.split('');
                for (var ci = 0; ci < chars.length; ci++) {
                    var ch = chars[ci];
                    if (ch === '\n') { x = lx; ly += lh; continue; }
                    var cw = ctx.measureText(ch).width;
                    if (x + cw > maxX) { x = lx; ly += lh; }
                    if (ly > mh) { fits = false; si = list.length; break; }
                    px = x; py = ly;
                    if (draw) {
                        ctx.fillStyle = list[si].r ? RED_INK : INK;
                        ctx.fillText(ch, x, ly);
                    }
                    x += cw;
                }
            }
            return { fits: fits, ly: ly, x: x, px: px, py: py };
        }
        var pick = null;
        (function () {
            var lhFull = Math.round(21 * 1.71);
            if (layoutSegs(segs, 21, lhFull, false).fits) { pick = { fs: 21, lh: lhFull }; return; }   // 短文：直接用最大字号
            var lo = 11.5, hi = 21;                                                                    // lo=字号下限，hi=已知装不下
            for (var it = 0; it < 6; it++) {                                                           // 二分：按字数连续取最大可容字号
                var mid = Math.round(((lo + hi) / 2) * 4) / 4, lhMid = Math.round(mid * 1.71);
                if (layoutSegs(segs, mid, lhMid, false).fits) { pick = { fs: mid, lh: lhMid }; lo = mid; }
                else hi = mid;
            }
            if (!pick) pick = { fs: 11.5, lh: Math.round(11.5 * 1.71) };                               // 11.5px 也装不下：框底截断
        })();
        var fin = layoutSegs(segs, pick.fs, pick.lh, true);
        if (!fin.fits) {                          // 框底截断：末尾补 "…"（行宽放不下就省略）
            ctx.font = pick.fs + 'px ' + FONT_STACK;
            var ew = ctx.measureText('\u2026').width;
            if (fin.x + ew <= maxX) { ctx.fillStyle = INK; ctx.fillText('\u2026', fin.x, fin.py); }
        }
        var endLy = fin.fits ? fin.ly : (fin.py + pick.lh), endX = fin.fits ? fin.x : fin.px;
        if (endX > lx) endLy += pick.lh;

        // ===== 金句（最打动的一句）=====
        if (summary) {
            var sy2 = Math.min(endLy + 20, H * 0.74);
            ctx.strokeStyle = 'rgba(143,74,60,.35)'; ctx.lineWidth = 1;
            ctx.beginPath(); ctx.moveTo(W * 0.07, sy2 - 10); ctx.lineTo(W * 0.57, sy2 - 10); ctx.stroke();
            ctx.fillStyle = INK;
            ctx.font = 'italic 20px "Renogare","CelesteZH";'
            ctx.fillText('\u201c' + summary.substring(0, 60) + '\u201d', W * 0.08, sy2 + 22);
        }

        // ===== 落款（右下角，避开素材左下角的 Postcard~）=====
        ctx.fillStyle = INK_SOFT;
        ctx.font = 'italic 17px "Renogare","CelesteZH";'
        ctx.textAlign = 'right';
        ctx.fillText('\u00d7' + (strawCount || 0) + '  \u2014 Madeline', W * 0.92, H * 0.9);
        ctx.textAlign = 'left';
    });
}

var peSnowRaf = null, peFlakes = [];
function startPeSnow() {
    var cv = document.getElementById('peSnow');
    if (!cv || peSnowRaf) return;
    var c = cv.getContext('2d');
    cv.width = window.innerWidth; cv.height = window.innerHeight;
    peFlakes = [];
    for (var i = 0; i < 60; i++) {
        peFlakes.push({
            x: Math.random() * cv.width, y: Math.random() * cv.height,
            r: Math.random() * 2.5 + 1, sp: Math.random() * 1.2 + 0.4,
            w: Math.random() * 0.4 - 0.2, o: Math.random() * 0.5 + 0.2,
            sw: Math.random() * Math.PI * 2, sws: Math.random() * 0.02 + 0.01
        });
    }
    function loop() {
        c.clearRect(0, 0, cv.width, cv.height);
        for (var j = 0; j < peFlakes.length; j++) {
            var f = peFlakes[j];
            f.y += f.sp; f.sw += f.sws;
            f.x += Math.sin(f.sw) * 0.5 + f.w;
            if (f.y > cv.height + 10) { f.y = -10; f.x = Math.random() * cv.width; }
            if (f.x > cv.width + 10) f.x = -10;
            if (f.x < -10) f.x = cv.width + 10;
            c.beginPath();
            c.arc(f.x, f.y, f.r, 0, Math.PI * 2);
            c.fillStyle = 'rgba(255,255,255,' + f.o + ')';
            c.fill();
        }
        peSnowRaf = requestAnimationFrame(loop);
    }
    loop();
}
function stopPeSnow() {
    if (peSnowRaf) { cancelAnimationFrame(peSnowRaf); peSnowRaf = null; }
}

                const t = new Date(d.updateDate || d.createDate).getTime();
                return !isNaN(t) && now - t <= days * 86400000;
            });
            const hasType = (type, fromT) => snaps.some(s => s.type === type && s.createdAt >= fromT);
            const created = [];

            const week = inRange(7);
            if (week.length >= 3 && !hasType('week', now - 7 * 86400000)) {
                created.push(await buildSnap('week', week, 'Weekly Recap'));
            }
            const month = inRange(30);
            if (month.length >= 8 && !hasType('month', now - 30 * 86400000)) {
                created.push(await buildSnap('month', month, 'Monthly Recap'));
            }
            if (created.length) {
                setSnaps(created.concat(snaps));
                renderSnapCards();
                pcPlay('ui_main_postcard_variants_in.wav');
                showToast(created.length > 1 ? '两张新快照明信片收进书架了' : '一张新的快照明信片收进书架了');
            }
            async function buildSnap(type, list, label) {
                const times = list.map(d => new Date(d.updateDate || d.createDate).getTime()).sort((a, b) => a - b);
                const joined = list.map(d => d.content || '').join('\n');
                let reflect = '';
                let emotionData = aggregateStoredEmotions(list);
                if (!emotionData) {
                    try {
                        const res = await api('/diary/emotion-analyze', 'POST', { content: joined.slice(0, 1500) });
                        if (res.success && res.data) emotionData = res.data;
                    } catch (e) {}
                }
                try {
                    const res = await api('/diary/snap-reflect', 'POST', { content: joined.slice(0, 1200), emotion: emotionSummaryText(emotionData) });
                    if (res.success && res.data && res.data.message) reflect = res.data.message;
                } catch (e) {}
                return {
                    id: type + '-' + now,
                    type: type,
                    label: label,
                    from: fmt(times[0]),
                    to: fmt(times[times.length - 1]),
                    count: list.length,
                    topEmotion: emotionData ? emotionData.topEmotion : countEmotion(list.map(d => d.content || '')),
                    emotions: emotionData ? (emotionData.emotions || []) : [],
                    intensity: emotionData ? emotionData.intensity : null,
                    keySentence: emotionData ? (emotionData.keySentence || '') : '',
                    events: emotionData ? (emotionData.events || []) : [],
                    concerns: emotionData ? (emotionData.concerns || []) : [],
                    quote: extractQuote(list),
                    reflect: reflect,
                    createdAt: now
                };
            }
        }

            if (s.concerns && s.concerns.length) emotionLine += '\n你心里挂念着：' + s.concerns.join('、');

        function blSendMsg() {

                    var aiEmo = (res && res.success && res.data) ? BadelineVoice.normalize(res.data.emotion) : null;
                    var emo = aiEmo || blInferEmotion(m); // AI 情绪分析标记优先（归一化），缺失按台词推断
                    blAdd('assistant', m, emo);
                    blPush('assistant', m);

    // ===== Badeline 动作树：镜之房间内自由游荡（5 套 gif + 状态机 + 全屏定位）=====
    (function () {
        var room = document.getElementById('mirrorRoom');

        var ACTIONS = {
            roam:      { gif: 'spin.gif',        move: true,  dur: [3000, 6000], big: false },   // 32×32 源
            lookUp:    { gif: 'lookingUp.gif',   move: false, dur: [2000, 4000], big: true  },   // 96×96 源 → 288px(3×) 匹配 32px 源角色尺寸
            sleep:     { gif: 'sleep.gif',       move: false, dur: [3000, 6000], big: false },
            roll:      { gif: 'pretendDead.gif', move: false, dur: [2000, 4000], big: false },

        };
        // 状态转移：roam 是走路态；static 态之间随机；roll→rollGetUp→强制 roam
        // 权重参考 diary 页 Madeline 行为树：走路占比 <50%，走完更愿意停下来做动作
        var TRANS = {

            wrap.style.left = x + '%';

        }

        function pickTarget() {

            var ny = 22 + Math.random() * 54;     // 22% – 76%

        function startRoamTick() {
            stopRoamTick();

            var dx = tgt.x - x;
            var dy = tgt.y - y;
            var dist = Math.sqrt(dx * dx + dy * dy);
            if (dist < 6) {
                // 太近 → 原地翻转朝向 + 稍后再选
                wrap.style.transform = 'translate(-50%, -50%) scale(var(--glass-scale)) scaleX(' + (dx >= 0 ? -1 : 1) + ')';

            var speed = 120;   // px per second
            var dxPx = dx * room.clientWidth / 100;
            var dyPx = dy * room.clientHeight / 100;
            var distPx = Math.sqrt(dxPx * dxPx + dyPx * dyPx);
            var dur = Math.max(0.5, Math.min(12, distPx / speed));   // 12s 覆盖最坏对角线，避免 transition 被截断瞬移
            place(tgt.x, tgt.y, dx < 0 ? -1 : 1, dur);

            roamTick = setTimeout(startRoamTick, dur * 1000 + 300 + Math.random() * 700);

        function stopRoamTick() {

        }

        function setState(name) {
            cur = name;
            var a = ACTIONS[name];
            img.src = DIR + a.gif;
            img.classList.toggle('big', !!a.big);   /* 96px 源(lookingUp) 用 288px 渲染，其余 32px 源用 96px */
            if (a.move) {

                startRoamTick();
            } else {
                // static：停住
                stopRoamTick();
                // 原地 flip（除了 rollGetUp — 一次性起身动画不需要翻）
                if (name !== 'rollGetUp' && Math.random() < .4) {
                    wrap.style.transform = 'translate(-50%, -50%) scale(var(--glass-scale)) scaleX(' + (Math.random() < .5 ? -1 : 1) + ')';
                }

            for (var i = 0; i < opts.length; i++) {

        // ===== 自由游荡模式启动：DOM 移到 #mirrorRoom 子级，开启 .free 类 =====
        function startFreeRoam(initialX, initialY, withFade, fromSummon) {
            if (roaming) return;

            room.appendChild(wrap);
            wrap.classList.add('free');
            wrap.style.transition = 'opacity .8s ease';
            wrap.style.left = initialX + '%';
            wrap.style.top = initialY + '%';

            setState('roam');

        function stopFreeRoam() {
            roaming = false; inDialog = false; summonedMode = false;

            wrap.style.transition = '';
            wrap.style.left = '';
            wrap.style.top = '';

    })();

    // ===== 紫色空间粒子：3 类星点 PNG 纯竖直下落 + 独立切帧 + 蓝色拖尾 =====
    (function () {

        // 预加载 12 张 PNG + 缓存 background url 字符串
        var cache = {};
        TYPES.forEach(function (t) {
            cache[t] = [];
            for (var i = 0; i < FRAMES; i++) {
                var src = DIR + t + String(i).padStart(2, '0') + '.png';
                cache[t].push('url("' + src + '") center / 100% 100% no-repeat');
                var im = new Image(); im.src = src;

        // 生成一颗星点；prefillDelay>0 时用负 animation-delay 让它"已经在下落途中"（随机相位遍布全屏）
        function makeStar(prefillDelay) {
            var t = TYPES[Math.floor(Math.random() * TYPES.length)];
            var el = document.createElement('i');
            el.className = 'star';
            el.style.width = el.style.height = SIZE + 'px';
            el.style.background = cache[t][Math.floor(Math.random() * FRAMES)];
            el.style.setProperty('--x', (Math.random() * 96).toFixed(1) + '%');
            el.style.setProperty('--dist', (room.clientHeight + 64) + 'px');
            var dur = 6 + Math.random() * 9;                 // 下降时长：6–15s
            el.style.animationDuration = dur.toFixed(2) + 's';
            if (prefillDelay > 0) el.style.animationDelay = (-prefillDelay).toFixed(2) + 's';
            var frameIdx = Math.floor(Math.random() * FRAMES);
            var interval = setInterval(function () {
                if (!el.parentNode) { clearInterval(interval); return; }
                frameIdx = (frameIdx + 1) % FRAMES;
                el.style.background = cache[t][frameIdx];
            }, 160 + Math.random() * 160);                   // 切帧也略快
            el.addEventListener('animationend', function () { el.remove(); });
            layer.appendChild(el);
        }

                if (!wasPanned) {
                    // 刚进入镜之房间：一次性预填满屏，各粒子处于随机下落相位（不再从零慢慢积累）

            layer.innerHTML = '';

        }

        var DJ_SRC = 'bgm/Starjump.mp3', DJ_SEG_END = 34, DJ_VOL = 0.32;

            try {
                djAudio = new Audio(DJ_SRC);
                djAudio.volume = DJ_VOL;
                djAudio.preload = 'auto';
                djAudio.addEventListener('error', function () { djAudio = null; }, { once: true });
            } catch (e) { djAudio = null; }
            return djAudio;
        }
        function djLoopWatch() {   // 0–34s 片段循环：60ms 轮询回跳
            if (djTimer) clearInterval(djTimer);
            djTimer = setInterval(function () {
                if (!djOn || !djAudio || djAudio.paused) return;
                if (djAudio.currentTime >= DJ_SEG_END || djAudio.currentTime < 0) {
                    try { djAudio.currentTime = 0; } catch (e) {}
                }
            }, 60);
        }
        function djStart() {       // 进 dream：从 0 起播并压过全站 BGM
            djOn = true;
            var a = djEnsure();
            if (!a) return;
            var seek = function () { try { a.currentTime = 0; } catch (e) {} a.play().catch(function () {}); };
            if (a.readyState >= 1) seek();
            else a.addEventListener('loadedmetadata', seek, { once: true });
            djDuck(true);
            djLoopWatch();
        }
        function djPause() {       // 进镜之房间：暂停留位（Resurrections 接管）
            djOn = false;

            if (djTimer) { clearInterval(djTimer); djTimer = null; }
        }
        function djResume() {      // 回雪夜：从暂停处续播
            if (!djAudio) return;
            djOn = true;
            djAudio.play().catch(function () {});
            djLoopWatch();
        }
        function djStop() {        // 离 dream：彻底停止并复位，同时恢复全站 BGM
            djOn = false;
            if (djTimer) { clearInterval(djTimer); djTimer = null; }

        // ===== 金羽毛：天上散布 ≤6 根，点击 → flash → 大球飞 → 键盘控制 =====
        var fxLayer = document.getElementById('dsFeathers');
        var featherN = 0, featherPlaced = [];

        // 拒绝采样：天空区 [4vw,70vw]×[7vh,35vh] 内随机点，与已放羽毛的屏幕距离 ≥ need(px)
        function featherRandPos(need) {
            for (var t = 0; t < 300; t++) {
                var x = 4 + Math.random() * 66, y = 7 + Math.random() * 28, ok = true;
                for (var i = 0; i < featherPlaced.length; i++) {
                    var dx = (x - featherPlaced[i].x) * innerWidth / 100;
                    var dy = (y - featherPlaced[i].y) * innerHeight / 100;
                    if (dx * dx + dy * dy < need * need) { ok = false; break; }
                }
                if (ok) return { x: x, y: y };
            }
            return null;
        }
        function addFeather() {
            var need = 384, p = null;             // 最短间隔 = 镜子之宽
            while (need > 120 && !(p = featherRandPos(need))) need = Math.round(need * 0.8);
            if (!p) return;
            featherPlaced.push(p);
            var b = document.createElement('button');
            b.className = 'feather';
            b.title = '金羽毛';
            b.style.left = p.x + 'vw';
            b.style.top = p.y + 'vh';
            b.innerHTML = '<img src="celeste-gui/loop.gif" alt="" decoding="async">';
            b.addEventListener('click', function () { startFeatherFly(b); });
            fxLayer.appendChild(b);
        }

        // ===== 金羽毛飞行：flash 白闪 → 单大球（~Madeline 尺寸 80px）飞 → 方向键/WASD =====
        function startFeatherFly(srcEl) {
            if (document.getElementById('featherFlyCanvas')) return;  // 防并发
            var ended = false;

            // 1) canvas overlay
            var cv = document.createElement('canvas');
            cv.id = 'featherFlyCanvas';
            cv.width = innerWidth; cv.height = innerHeight;
            document.body.appendChild(cv);
            var ctx = cv.getContext('2d');
            ctx.imageSmoothingEnabled = false;

            // 2) HUD
            var hint = document.createElement('div');
            hint.id = 'featherFlyHint';
            hint.textContent = '方向键 / WASD 控制 · Esc 让羽毛回来';
            document.body.appendChild(hint);

            // 3) 大球初始位置 = 羽毛中心；尺寸对齐 Madeline 约 80px（半径 40）
            var rect = srcEl.getBoundingClientRect();
            var cx0 = rect.left + rect.width / 2;
            var cy0 = rect.top + rect.height / 2;
            var ORB_R = 40;
            var TRAIL_LEN = 12;
            var orb = { x: cx0, y: cy0, vx: 0, vy: 0, trail: [] };

            // 4) 键盘
            var keys = {};
            var onDown = function (e) {
                var k = e.key.toLowerCase();
                if (e.key === 'Escape') { endFly(); e.preventDefault(); e.stopPropagation(); return; }
                if (e.repeat) return;
                if (k === 'arrowup' || k === 'arrowdown' || k === 'arrowleft' || k === 'arrowright'
                    || k === 'w' || k === 'a' || k === 's' || k === 'd') {
                    keys[k] = true; e.preventDefault(); e.stopPropagation();
                }
            };
            var onUp = function (e) { keys[e.key.toLowerCase()] = false; };
            var onResize = function () { cv.width = innerWidth; cv.height = innerHeight; };
            document.addEventListener('keydown', onDown, true);
            document.addEventListener('keyup', onUp, true);
            window.addEventListener('resize', onResize);

            // 5) 物理（大球响应要跟得上，加速度 + 限速都调高）
            var ACCEL = 0.8;
            var FRICTION = 0.92;
            var MAX_VEL = 7;

            // 6) 主循环
            var raf = 0, frame = 0, maxFrame = 60 * 12;
            var FLASH_FRAMES = 6;

            function step() {
                frame++;
                if (frame > maxFrame) { endFly(); return; }

                ctx.clearRect(0, 0, cv.width, cv.height);

                // flash 白闪（6 帧淡出）
                if (frame <= FLASH_FRAMES) {
                    var a = 0.85 * (1 - frame / FLASH_FRAMES);
                    var g = ctx.createRadialGradient(cx0, cy0, 4, cx0, cy0, 140);
                    g.addColorStop(0, 'rgba(255,255,240,' + a + ')');
                    g.addColorStop(1, 'rgba(255,255,240,0)');
                    ctx.fillStyle = g;
                    ctx.fillRect(cx0 - 140, cy0 - 140, 280, 280);
                    srcEl.style.filter = 'brightness(3) saturate(0)';
                } else if (srcEl.style.opacity !== '0') {
                    srcEl.style.filter = '';
                    srcEl.style.transition = 'opacity 0.4s ease-out, transform 0.4s ease-out';
                    srcEl.style.opacity = '0';
                    srcEl.style.transform = 'scale(0.3)';
                }

                if (frame > FLASH_FRAMES) {
                    // 加速度
                    var ax = 0, ay = 0;
                    if (keys['arrowup']    || keys['w']) ay -= ACCEL;
                    if (keys['arrowdown']  || keys['s']) ay += ACCEL;
                    if (keys['arrowleft']  || keys['a']) ax -= ACCEL;
                    if (keys['arrowright'] || keys['d']) ax += ACCEL;

                    // 速度 + 摩擦
                    orb.vx = (orb.vx + ax) * FRICTION;
                    orb.vy = (orb.vy + ay) * FRICTION;
                    var sp = Math.sqrt(orb.vx * orb.vx + orb.vy * orb.vy);
                    if (sp > MAX_VEL) { orb.vx = orb.vx / sp * MAX_VEL; orb.vy = orb.vy / sp * MAX_VEL; }

                    // 位置
                    orb.x += orb.vx;
                    orb.y += orb.vy;

                    // 拖尾（短 + 小 + 发光）
                    orb.trail.push({ x: orb.x, y: orb.y });
                    if (orb.trail.length > TRAIL_LEN) orb.trail.shift();
                    for (var i = 0; i < orb.trail.length; i++) {
                        var tp = orb.trail[i];
                        var tk = i / orb.trail.length;  // 0(旧) → 1(新)
                        var ta = tk * 0.8;
                        var tr = 1.5 + tk * 2;          // 半径 1.5 → 3.5px
                        // glow halo
                        ctx.shadowBlur = 10;
                        ctx.shadowColor = 'rgba(195,196,162,' + (ta * 0.8) + ')';
                        // 圆形拖尾粒子（非方块）
                        ctx.fillStyle = 'rgba(195,196,162,' + ta + ')';
                        ctx.beginPath();
                        ctx.arc(tp.x, tp.y, tr, 0, Math.PI * 2);
                        ctx.fill();
                    }
                    ctx.shadowBlur = 0;

                    // 大球本体（圆形，#fefab2 → 稍暗，外发光）
                    ctx.shadowBlur = 30;
                    ctx.shadowColor = '#fefab2';
                    var coreGrad = ctx.createRadialGradient(orb.x - ORB_R * 0.3, orb.y - ORB_R * 0.3, 2, orb.x, orb.y, ORB_R);
                    coreGrad.addColorStop(0, '#fffde0');
                    coreGrad.addColorStop(0.5, '#fefab2');
                    coreGrad.addColorStop(1, '#e8d97a');
                    ctx.fillStyle = coreGrad;
                    ctx.beginPath();
                    ctx.arc(orb.x, orb.y, ORB_R, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.shadowBlur = 0;

                    // 飞出屏幕 + 余量 → 结束
                    if (orb.x < -ORB_R || orb.x > cv.width + ORB_R
                        || orb.y < -ORB_R || orb.y > cv.height + ORB_R) {
                        endFly();
                        return;
                    }
                }

                raf = requestAnimationFrame(step);
            }

            function endFly() {
                if (ended) return; ended = true;
                cancelAnimationFrame(raf);
                document.removeEventListener('keydown', onDown, true);
                document.removeEventListener('keyup', onUp, true);
                window.removeEventListener('resize', onResize);
                cv.remove();
                hint.remove();
                // 恢复羽毛 → 下次还能再点
                srcEl.style.filter = '';
                srcEl.style.opacity = '1';
                srcEl.style.transform = 'scale(1)';
            }

            step();
        }

        function spawnFeathers() {
            fxLayer.innerHTML = '';
            featherPlaced = [];
            api('/feather/count', 'GET').then(function (res) {
                featherN = (res && res.success && res.data && res.data.count) || 0;
                if (featherN > 0) {
                    for (var i = 0; i < Math.min(featherN, 6); i++) addFeather();
                } else {
                    featherN = 3;
                    for (var i = 0; i < featherN; i++) addFeather();
                }
            }).catch(function () {
                featherN = 3;
                for (var i = 0; i < featherN; i++) addFeather();
            });
        }

        // 叫醒 Madeline：睡觉 → 睡醒动画（2.4s）→ 离开梦境；动画期间防重复点击

        var nightBoost = (function () {

            return bub;
        }
        function showEmpty() {
            msgs.innerHTML = '';

        }
        function resetNight(dreamId) {
            ntHist = []; ntDreamId = dreamId; ntOpenedFor = dreamId;
            msgs.innerHTML = '';
        }
        function ensureNightOpening() {
            if (!dreams.length) { ntDreamId = null; showEmpty(); return; }
            var id = pick.value || dreams[0].id;
            pick.value = id;
            if (ntOpenedFor === id && msgs.children.length) return;  // 这个梦已经开聊过，保留现场
            resetNight(id);
            ntBusy = true; ntSend.disabled = true;
            addRow('bl', '……', 'normal').classList.add('nt-typing');
            api('/diary/dream-night-talk', 'POST', { dreamId: id, message: '', history: '[]' }, 20000)
                .then(function (res) {
                    msgs.innerHTML = '';

                .finally(function () { ntBusy = false; ntSend.disabled = false; ntInput.focus(); });
        }

        function sendNight() {
            var v = ntInput.value.trim();

            addRow('user', v);
            ntHist.push({ role: 'user', content: v });
            ntBusy = true; ntSend.disabled = true;
            api('/diary/dream-night-talk', 'POST',
                { dreamId: ntDreamId, message: v, history: JSON.stringify(ntHist.slice(-10)) }, 20000)
                .then(function (res) {
                    if (res && res.success && res.data) {
                        addRow('bl', res.data.message, res.data.emotion || 'normal');

                    } else {

                    }
                })
                .catch(function () { addRow('bl', '……信号断了。像做梦做到一半被人摇醒。', 'worried'); })
                .finally(function () { ntBusy = false; ntSend.disabled = false; ntInput.focus(); });

    // 硬防横向滚动：overflow-x:clip 的兼容兜底 —— 任何来源的横向滚动（如点击门时浏览器把门滚回视野）立即归零，
    // 否则 body.scrollLeft 残留会让平移后的镜之房间错位、露出 body 背景
    document.addEventListener('scroll', function () {
        if (document.body && document.body.scrollLeft) document.body.scrollLeft = 0;
        if (document.documentElement && document.documentElement.scrollLeft) document.documentElement.scrollLeft = 0;
    }, true);

    // ===== 心门音效：7 个 WAV 预加载 + 按需触发（避开 BGM 音量） =====
    (function () {
        var DIR = 'heartdoor/sounds/';
        var NAMES = ['heartdoor_entry','heartdoor_slam','frontdoor_heartfill_1','frontdoor_heartfill_2','frontdoor_heartfill_3','frontdoor_heartfill_4','frontdoor_unlock'];
        var VOL = 0.7;
        var pool = {};
        NAMES.forEach(function (n) {
            var a = new Audio(DIR + n + '.wav');
            a.preload = 'auto'; a.volume = VOL; a.muted = false;
            pool[n] = a;
        });
        // play 支持多实例：每次 new Audio 避免同标签重入打断
        function play(name) {
            var src = pool[name]; if (!src) return;
            var a = new Audio(src.src); a.volume = VOL; a.play().catch(function () {});
        }
        window.__hdSfx = { play: play };
    })();

    // ===== 心门：初始全空 → 每达成一次解锁条件逐颗点亮 → 四心填满自动播放一次性分裂 → 点击进门 =====
    (function () {
        var door = document.getElementById('heartDoor');
        var dsWorld = document.querySelector('.ds-world');
        if (!door || !dsWorld) return;

        var TOTAL = hearts.length;            // 4 颗心

        var litNow = 0;                        // 当前已点亮的颗数
        var splitting = false;                 // 分裂动画播放中
        // 分裂为一次性动画：播过即永久保持最终态，刷新直接恢复 split 态、不再重播
        var splitDone = false;
        try { splitDone = localStorage.getItem('heartDoorSplit') === '1'; } catch (e) {}
        if (splitDone) { opened = true; door.classList.add('split'); }

        // ===== 开启条件：四心为初始条件——心门由商店炼制的水晶心驱动（heartDoorHearts 数组） =====
        // 每炼一颗心点亮一颗，满 TOTAL 颗门就绪；之后继续炼心不再进门，只改变 Badeline 人格
        // 预览可加 ?opendoor 强制点亮全部
        function forceOpen() { return new URLSearchParams(location.search).has('opendoor'); }
        function targetOf() {
            if (forceOpen()) return TOTAL;
            var n = 0;
            try {
                var arr = JSON.parse(localStorage.getItem('heartDoorHearts') || 'null');
                if (Array.isArray(arr) && arr.length) n = arr.length;

        // 极光色像素星点：天空与桥底下随机位置闪烁（蓝/绿，每点独立节奏）
        (function initAuroraStars() {
            var host = document.querySelector('#dreamScene .ds-left');

            if (!host || !box || box.children.length) return;

                i.style.setProperty('--dur', (0.9 + Math.random() * 1.1).toFixed(2) + 's');

        // 开门特效：白闪 / 门底残影暗斑，挂到 #dreamScene，动画结束自清理
        function spawnDoorFx() {
            var scene = document.getElementById('dreamScene');
            if (!scene) return;
            ['doorFlash', 'doorResidue'].forEach(function (id) {

        function triggerSplit() {
            if (splitDone || splitting) return;
            splitting = true;
            door.classList.remove('ready');
            door.classList.add('split');
            door.title = '走进门后……';
            try { localStorage.setItem('heartDoorSplit', '1'); } catch (e) {}
            spawnDoorFx();
            // 白闪瞬间 → heartdoor_slam（深 boom）
            if (window.__hdSfx) window.__hdSfx.play('heartdoor_slam');

        function maybePlaySplit(delay) { if (!splitDone && !splitting) setTimeout(triggerSplit, delay); }

        // 单颗心：7 帧填充动画 + pop 弹跳反馈
        function fillHeart(im, done) {
            var f = 0;
            var iv = setInterval(function () {
                f++;
                if (f >= 6) {
                    clearInterval(iv);
                    paint(im, true);
                    im.classList.add('pop');
                    setTimeout(function () { im.classList.remove('pop'); }, 580);
                    if (done) done();
                } else {
                    im.src = 'heartdoor/icon0' + f + '.png';
                }
            }, 70);
        }

        // 把点亮数推进到 target：新增部分逐颗动画点亮，减少则静默校正
        // applySeq 链序号：新的推进会作废上一条填充链，防止双链并发把 litNow 跳奇数颗
        var applySeq = 0;
        function applyTarget(target, animate) {
            target = Math.max(0, Math.min(TOTAL, target));
            var seq = ++applySeq;
            // 第一次有心点亮 → heartdoor_entry
            if (animate && litNow === 0 && target > 0 && window.__hdSfx) window.__hdSfx.play('heartdoor_entry');
            if (target <= litNow || !animate) {
                hearts.forEach(function (im, i) { paint(im, i < target); });
                litNow = target; persist(); refreshState();
                if (target >= TOTAL) {
                    // 满心静默校正 → frontdoor_unlock
                    if (window.__hdSfx) window.__hdSfx.play('frontdoor_unlock');
                    maybePlaySplit(650);
                }
                return;
            }
            refreshState();                    // 动画期间保持锁定
            hearts.forEach(function (im, i) { if (i < litNow) paint(im, true); });  // 先还原已有进度，再逐颗点亮新增
            (function next() {
                if (seq !== applySeq) return;  // 已被更新的推进取代，整链作废
                if (litNow >= target) {
                    persist(); refreshState();
                    if (target >= TOTAL) {
                        // 最后一颗 pop 落定 → frontdoor_unlock
                        if (window.__hdSfx) window.__hdSfx.play('frontdoor_unlock');
                        maybePlaySplit(580);
                    }
                    return;
                }
                var idx = litNow;  // 当前要填第几颗（0-based，对应 heartfill idx+1）
                fillHeart(hearts[litNow], function () {
                    if (seq !== applySeq) return;   // 过期链不计进度
                    // 每颗心填充完成 → frontdoor_heartfill_{idx+1}
                    if (window.__hdSfx) window.__hdSfx.play('frontdoor_heartfill_' + (idx + 1));
                    litNow++; setTimeout(next, 300);
                });

        }

        // 初始：按已炼心数恢复（heartDoorHearts 驱动，有新增则动画点亮）
        var saved = parseInt(localStorage.getItem('heartDoorLit') || '0', 10);
        litNow = Math.max(0, Math.min(TOTAL, isNaN(saved) ? 0 : saved));
        applyTarget(targetOf(), litNow < targetOf());

        // 书架日记加载完成后推进进度（按已炼心数，真实数据优先）
        window.__setDoorProgress = function () { applyTarget(targetOf(), true); };

        function panRight() {
            dsWorld.classList.add('panned');

            // 不再 door.classList.add('away') — 心门在镜之房间侧只露一半，可点击回书架
            if (window.__mirrorBGM) window.__mirrorBGM.enter();

                if (window.__badelineEnterRoom) window.__badelineEnterRoom();

        }

        // ===== 破门星尘：白色像素尘埃以横向为主从门心爆散（参照 Farewell 开门） =====
        function doorBurst() {
            // 挂到 #dreamScene 的全屏 fixed 层：门体溶解时星尘仍独立存活
            var scene = document.getElementById('dreamScene') || document.body;
            var layer = document.createElement('div');
            layer.style.cssText = 'position:fixed;inset:0;overflow:hidden;pointer-events:none;z-index:1590;';
            scene.appendChild(layer);
            var r = door.getBoundingClientRect();
            var cx = r.left + r.width / 2, cy = r.top + r.height * 0.645;   // 开口中心（55~74% 中点）
            var pieces = [];
            for (var k = 0; k < 56; k++) {
                var horiz = Math.random() < 0.62;          // 六成沿横向喷成一条光带
                var i = document.createElement('i');
                var s = Math.random() < 0.75 ? 2 : 3;      // 2~3px 像素尘
                i.style.cssText = 'position:absolute;left:' + (cx - s / 2) + 'px;top:' + (cy - s / 2) +
                    'px;width:' + s + 'px;height:' + s + 'px;background:' +
                    (Math.random() < 0.3 ? '#d8f4ff' : '#ffffff') +
                    ';box-shadow:0 0 4px rgba(200,240,255,.9);';
                layer.appendChild(i);
                var ang, spd, dir = Math.random() < 0.5 ? -1 : 1;
                if (horiz) { ang = Math.random() * 0.9 - 0.45; spd = 180 + Math.random() * 300; }
                else { ang = Math.random() * Math.PI * 2; spd = 60 + Math.random() * 160; }
                pieces.push({
                    el: i, x: cx, y: cy,
                    vx: Math.cos(ang) * spd * dir,
                    vy: Math.sin(ang) * spd * (horiz ? 0.5 : 1) - 40,
                    life: 0, ttl: 0.8 + Math.random() * 0.9
                });

            try {
                var AC = window.__mirrorAC || (window.__mirrorAC = new (window.AudioContext || window.webkitAudioContext)());
                var buf = AC.createBuffer(1, Math.floor(AC.sampleRate * 0.35), AC.sampleRate);
                var d = buf.getChannelData(0);
                for (var n = 0; n < d.length; n++) d[n] = (Math.random() * 2 - 1) * Math.pow(1 - n / d.length, 2.2);
                var src = AC.createBufferSource(); src.buffer = buf;
                var hp = AC.createBiquadFilter(); hp.type = 'highpass'; hp.frequency.value = 2400;
                var g = AC.createGain(); g.gain.value = 0.35;
                src.connect(hp); hp.connect(g); g.connect(AC.destination); src.start();
                [3200, 2500].forEach(function (f, i2) {
                    var o = AC.createOscillator(), og = AC.createGain();
                    o.type = 'triangle';
                    o.frequency.setValueAtTime(f, AC.currentTime);
                    o.frequency.exponentialRampToValueAtTime(f * 0.55, AC.currentTime + 0.22);
                    og.gain.setValueAtTime(i2 ? 0.07 : 0.11, AC.currentTime);
                    og.gain.exponentialRampToValueAtTime(0.001, AC.currentTime + 0.28);
                    o.connect(og); og.connect(AC.destination);
                    o.start(); o.stop(AC.currentTime + 0.3);
                });
            } catch (e) {}
            // 物理：微重力横向扩散，逐渐淡出
            var last = performance.now();
            function tick(now) {
                var dt = Math.min(0.05, (now - last) / 1000); last = now;
                var alive = false;
                pieces.forEach(function (p) {
                    p.life += dt;
                    if (p.life >= p.ttl) { p.el.style.opacity = '0'; return; }
                    alive = true;
                    p.vy += 160 * dt;
                    p.x += p.vx * dt; p.y += p.vy * dt;
                    p.el.style.opacity = String(1 - p.life / p.ttl);
                    p.el.style.transform = 'translate(' + (p.x - cx) + 'px,' + (p.y - cy) + 'px)';
                });
                if (alive) requestAnimationFrame(tick); else layer.remove();
            }
            requestAnimationFrame(tick);
        }

        // 回书架：心门已随镜头出画，改由点击镜之房间背景返回
        function goBack() {
