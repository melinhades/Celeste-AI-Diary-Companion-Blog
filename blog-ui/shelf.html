<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<title>回忆书架 · Madeline</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="icon/OIP.webp" type="image/webp">
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
* { box-sizing:border-box; margin:0; padding:0; }
@font-face { font-family:'Renogare'; src:url('celeste-font-en/Renogare-Regular.otf') format('opentype'); font-display:swap; }
@font-face { font-family:'CelesteZH'; src:url('fonts/NotoSansCJKsc-Medium.otf') format('opentype'); font-display:swap; }
body { min-height:100vh; background:url('celeste-gui/shelf-bg.webp') center/cover no-repeat fixed; font-family:'Renogare','CelesteZH','Microsoft YaHei',sans-serif; }
.topbar { position:fixed; top:14px; left:16px; z-index:20; }
.topbar a { display:inline-block; padding:8px 14px; background:rgba(22,34,60,.88); color:#ffe36d; border:2px solid #ffe36d; border-radius:6px; text-decoration:none; font-size:13px; box-shadow:0 0 10px rgba(255,230,109,.35); }
h1 { position:fixed; top:14px; left:50%; transform:translateX(-50%); font-family:'Press Start 2P',monospace; font-size:15px; color:#ffe36d; text-shadow:0 2px 0 rgba(0,0,0,.6); letter-spacing:2px; z-index:20; }
.wrap { max-width:1000px; margin:0 auto; padding:76px 20px 40px; }
.cards { display:grid; grid-template-columns:repeat(auto-fill,minmax(230px,1fr)); gap:26px 20px; }
/* ===== 日记纸页（page.png 叠放 + 抽出） ===== */
.page { position:relative; aspect-ratio:3/4; padding:60% 16px 14px; cursor:pointer; background:url('Atlases/Gui/collectables/cassette.png') center top/82% auto no-repeat; filter:drop-shadow(0 6px 10px rgba(0,0,0,.4)); transition:transform .28s ease, filter .28s ease; }
.page:hover { transform:translateY(-12px) scale(1.05); filter:drop-shadow(0 16px 22px rgba(0,0,0,.55)); z-index:3; }
.page:hover { animation:shelfCassetteWiggle 1.1s ease-in-out infinite; }
@keyframes shelfCassetteWiggle { 0%,100% { rotate:0deg; } 25% { rotate:-3deg; } 75% { rotate:3deg; } }
.page-date { font-family:'Renogare','CelesteZH','Microsoft YaHei',sans-serif; font-size:13px; letter-spacing:2px; color:#fff; text-align:center; text-transform:uppercase; border-bottom:1px solid rgba(255,255,255,.35); padding-bottom:8px; margin-bottom:10px; text-shadow:0 1px 3px rgba(0,0,0,.7); }
.page-t { font-family:'Renogare','CelesteZH','Microsoft YaHei',sans-serif; font-size:15px; color:#fff; text-shadow:0 1px 3px rgba(0,0,0,.7); font-weight:600; margin-bottom:8px; word-break:break-all; line-height:1.4; }
.page-s { font-size:12px; color:rgba(255,255,255,.85); text-shadow:0 1px 2px rgba(0,0,0,.6); line-height:1.9; display:-webkit-box; -webkit-line-clamp:4; -webkit-box-orient:vertical; overflow:hidden; }
.page-count { position:absolute; top:10px; right:12px; padding:1px 9px; background:rgba(138,109,74,.16); border:1px solid rgba(138,109,74,.35); border-radius:9px; font-family:'Renogare','CelesteZH','Microsoft YaHei',sans-serif; font-size:11px; color:#7a5f3f; }
.empty { text-align:center; color:rgba(255,255,255,.75); background:rgba(22,34,60,.7); border-radius:8px; padding:60px 20px; font-size:14px; line-height:2.2; }
.detail { display:none; background:rgba(22,34,60,.9); border:2px solid rgba(255,230,109,.4); border-radius:8px; padding:22px; }
.detail.show { display:block; }
.detail-nav { display:flex; align-items:center; justify-content:space-between; gap:10px; margin-bottom:14px; }
.detail-nav button { padding:6px 18px; border:2px solid #ffe36d; border-radius:6px; background:rgba(22,34,60,.9); color:#ffe36d; font-size:14px; cursor:pointer; transition:background .15s; }
.detail-nav button:hover:not(:disabled) { background:rgba(255,230,109,.15); }
.detail-nav button:disabled { opacity:.3; cursor:not-allowed; }
.detail-nav .pos { color:rgba(255,230,109,.7); font-size:12px; font-family:'Renogare',sans-serif; letter-spacing:1px; }
.detail .back { background:none; border:none; color:#ffe36d; cursor:pointer; font-size:13px; margin-bottom:14px; }
.detail .t { color:#ffe36d; font-size:20px; margin-bottom:6px; word-break:break-all; }
.detail .d { color:rgba(255,230,109,.6); font-size:12px; margin-bottom:16px; }
.detail .c { color:rgba(255,255,255,.9); font-size:14px; line-height:2; white-space:pre-wrap; word-break:break-all; }
.acts { display:flex; gap:10px; margin-top:22px; }
.acts button { flex:1; padding:10px 0; border-radius:6px; cursor:pointer; font-size:14px; border:2px solid #ffe36d; background:rgba(22,34,60,.9); color:#ffe36d; }
.acts button.del { border-color:#e6517c; color:#ff9ab5; }
.toast { position:fixed; left:50%; bottom:40px; transform:translateX(-50%) translateY(20px); background:rgba(22,34,60,.95); color:#ffe36d; border:1px solid #ffe36d; padding:10px 18px; border-radius:6px; opacity:0; transition:.3s; z-index:99; font-size:13px; }
.toast.show { opacity:1; transform:translateX(-50%) translateY(0); }
/* ===== 篝火（从 diary 迁来） ===== */
#strawberryBonfire{position:fixed;right:26px;bottom:24px;z-index:20;display:flex;flex-direction:column;align-items:flex-end;gap:8px;user-select:none;cursor:pointer;}
.sb-straw{display:flex;align-items:center;gap:5px;padding:4px 11px;background:rgba(22,34,60,.9);border:2px solid rgba(255,230,109,.5);border-radius:8px;box-shadow:0 0 8px rgba(255,230,109,.25);font-family:'Press Start 2P',monospace;font-size:11px;color:#ff6b8a;}
.sb-straw img{width:20px;height:20px;image-rendering:pixelated;}
.sb-scene{position:relative;display:flex;align-items:flex-end;gap:2px;}
.sb-scene::before{content:'';position:absolute;left:50%;bottom:-8px;transform:translateX(-50%);width:220px;height:64px;background:radial-gradient(ellipse at center,rgba(255,150,50,.35) 0%,rgba(255,150,50,.12) 45%,transparent 70%);pointer-events:none;animation:sbGlow 1.6s ease-in-out infinite alternate;}
@keyframes sbGlow{from{opacity:.7}to{opacity:1}}
.sb-madeline{width:74px;height:auto;image-rendering:pixelated;filter:drop-shadow(0 3px 6px rgba(0,0,0,.5));}
.sb-flag{width:30px;height:auto;image-rendering:pixelated;align-self:flex-end;margin:0 -2px 2px 0;filter:drop-shadow(0 0 4px rgba(125,207,255,.5));}
.sb-flash{position:absolute;left:50%;bottom:0;transform:translateX(-50%);width:80px;height:auto;image-rendering:pixelated;pointer-events:none;z-index:2;}
.sb-fire{position:relative;display:flex;align-items:flex-end;justify-content:center;}
.sb-fire img{display:block;height:auto;image-rendering:pixelated;filter:drop-shadow(0 0 14px rgba(255,150,50,.65));}
.sb-label{font-family:'Press Start 2P',monospace;font-size:9px;color:rgba(255,230,109,.75);text-shadow:0 1px 2px rgba(0,0,0,.8);position:absolute;bottom:-16px;left:50%;transform:translateX(-50%);white-space:nowrap;}
/* ===== 商店收藏品展示 ===== */
#berryTrophy{position:fixed;top:70px;right:16px;z-index:20;display:flex;gap:8px;padding:6px 10px;background:rgba(22,34,60,.85);border:1px dashed rgba(255,230,109,.4);border-radius:8px;}
#berryTrophy img{width:26px;height:26px;image-rendering:pixelated;object-fit:contain;filter:drop-shadow(0 0 4px rgba(255,230,109,.5));}
#berryTrophy.empty{display:none;}
</style>
</head>
<body>
<h1>MEMORY SHELF</h1>
<div class="topbar"><a href="diary.html">← 回日记本</a></div>
<canvas id="shelfSnow" style="position:fixed;inset:0;z-index:1;pointer-events:none;"></canvas>
<div id="strawberryBonfire">
    <div class="sb-straw"><img id="sbStrawImg" src="celeste-collectables/strawberry.png" alt="strawberry"><span id="sbCount">0</span></div>
    <div class="sb-scene">
        <img class="sb-madeline" src="celeste-gui/madeline-sitdown.gif" alt="Madeline">

</div>

<!-- BGM 播放器 -->
<audio id="bgmPlayer" loop>
    <source src="bgm/dearest-friends.mp3" type="audio/mpeg">
</audio>

<div class="wrap">
    <div id="cards" class="cards"></div>
    <div id="detail" class="detail">
        <button class="back">← 返回列表</button>

        <div class="acts"><button class="edit">回去编辑这篇</button><button class="export-postcard">🖼 导出明信片</button><button class="del">删掉它</button></div>
    </div>
</div>
<script src="js/api.js"></script>
<script>
    // ===== 雪花动画（mountainSnow 原版贴图） =====
    (function () {
        const canvas = document.getElementById('shelfSnow');
        const ctx = canvas.getContext('2d');
        const flakeImg = new Image();
        flakeImg.src = 'celeste-gui/mountain-snow.png';
        let flakes = [];
        function resize() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
        function mk(randomY) {
            return {
                x: Math.random() * canvas.width,
                y: randomY ? Math.random() * canvas.height : -20,
                s: Math.random() * 10 + 5,
                speed: Math.random() * 1 + 0.4,
                wind: Math.random() * 0.4 - 0.2,
                opacity: Math.random() * 0.55 + 0.3,
                rot: Math.random() * Math.PI * 2,
                rotSpeed: (Math.random() - 0.5) * 0.02,
                swing: Math.random() * Math.PI * 2,
                swingSpeed: Math.random() * 0.02 + 0.008
            };
        }
        function init() { flakes = []; for (let i = 0; i < 50; i++) flakes.push(mk(true)); }
        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            if (flakeImg.complete && flakeImg.naturalWidth > 0) {
                for (const f of flakes) {
                    f.y += f.speed; f.swing += f.swingSpeed; f.rot += f.rotSpeed;
                    f.x += Math.sin(f.swing) * 0.5 + f.wind;
                    if (f.y > canvas.height + 20) Object.assign(f, mk(false));
                    if (f.x > canvas.width + 20) f.x = -20;
                    if (f.x < -20) f.x = canvas.width + 20;
                    ctx.save();
                    ctx.globalAlpha = f.opacity;
                    ctx.translate(f.x, f.y);
                    ctx.rotate(f.rot);
                    ctx.drawImage(flakeImg, -f.s / 2, -f.s / 2, f.s, f.s);
                    ctx.restore();
                }
            }
            requestAnimationFrame(draw);
        }
        window.addEventListener('resize', resize);
        resize(); init(); draw();
    })();

    const bgmPlayer = document.getElementById('bgmPlayer');
    const savedTime = parseFloat(localStorage.getItem('bgmTimeShelf') || '0');
    if (savedTime > 0) bgmPlayer.currentTime = savedTime;
    bgmPlayer.volume = 0.3;
    bgmPlayer.play().catch(() => {});
    setInterval(() => { localStorage.setItem('bgmTimeShelf', bgmPlayer.currentTime); }, 2000);
    function tryPlayBGM() { bgmPlayer.play().then(() => { document.removeEventListener('click', tryPlayBGM); document.removeEventListener('keydown', tryPlayBGM); }).catch(() => {}); }
    document.addEventListener('click', tryPlayBGM);
    document.addEventListener('keydown', tryPlayBGM);

function renderPostcardCanvas(canvas, title, dateStr, content, summary, strawCount) {
    var ctx = canvas.getContext('2d');
    var W = 1200, H = 800;
    canvas.width = W; canvas.height = H;
    ctx.fillStyle = '#0f1729'; ctx.fillRect(0, 0, W, H);
    var grad = ctx.createLinearGradient(0, 0, 0, 320);
    grad.addColorStop(0, '#1a2744'); grad.addColorStop(1, '#0f1729');
    ctx.fillStyle = grad; ctx.fillRect(0, 0, W, 320);
    for (var i = 0; i < 50; i++) {
        ctx.fillStyle = 'rgba(255,255,255,' + (Math.random() * 0.4 + 0.1) + ')';
        var sx = Math.random() * W, sy = Math.random() * 260, ss = Math.random() * 2 + 0.5;
        ctx.fillRect(Math.floor(sx), Math.floor(sy), ss, ss);
    }
    ctx.fillStyle = '#1e2d4a';
    ctx.beginPath(); ctx.moveTo(0, 300);
    ctx.lineTo(120, 170); ctx.lineTo(280, 230); ctx.lineTo(480, 110);
    ctx.lineTo(680, 190); ctx.lineTo(880, 130); ctx.lineTo(1060, 200);
    ctx.lineTo(W, 260); ctx.lineTo(W, 320); ctx.lineTo(0, 320);
    ctx.closePath(); ctx.fill();
    ctx.fillStyle = '#253552';
    ctx.beginPath(); ctx.moveTo(0, 310);
    ctx.lineTo(200, 250); ctx.lineTo(400, 280); ctx.lineTo(600, 220);
    ctx.lineTo(800, 265); ctx.lineTo(1000, 235); ctx.lineTo(W, 285);
    ctx.lineTo(W, 320); ctx.lineTo(0, 320);
    ctx.closePath(); ctx.fill();
    ctx.fillStyle = '#ffe36d';
    ctx.font = '22px "Press Start 2P",monospace';
    ctx.fillText('MOUNTAIN DIARY', 60, 380);
    ctx.fillStyle = 'rgba(255,227,109,.45)';
    ctx.font = '13px "Press Start 2P",monospace';
    ctx.fillText(dateStr || '', 60, 410);
    ctx.fillStyle = '#ffe36d';
    ctx.fillRect(60, 425, W - 120, 2);
    ctx.fillStyle = '#fff';
    ctx.font = '24px "Renogare","Microsoft YaHei",sans-serif';
    var dt = (title || '无题').substring(0, 36);
    ctx.fillText(dt, 60, 470);
    ctx.fillStyle = 'rgba(255,255,255,.82)';
    ctx.font = '15px "Renogare","CelesteZH","Microsoft YaHei",sans-serif';
    var snip = (content || '').substring(0, 280);
    var words = snip.split('');
    var line = '', ly = 510, mh = 630, ml = Math.floor((W - 120) / 15);
    for (var ci = 0; ci < words.length; ci++) {
        if (words[ci] === '\n') { ctx.fillText(line, 60, ly); line = ''; ly += 28; if (ly > mh) break; continue; }
        if ((line + words[ci]).length > ml) { ctx.fillText(line, 60, ly); line = words[ci]; ly += 28; if (ly > mh) break; }
        else line += words[ci];
    }
    if (line && ly <= mh) ctx.fillText(line, 60, ly);
    if (summary) {
        var sy2 = Math.min(ly + 45, 660);
        ctx.fillStyle = 'rgba(255,227,109,.5)';
        ctx.fillRect(60, sy2 - 12, W - 120, 1);
        ctx.fillStyle = 'rgba(255,227,109,.75)';
        ctx.font = '14px "Renogare","CelesteZH","Microsoft YaHei",sans-serif';
        var st = summary.substring(0, 80);
        ctx.fillText('\u201c' + st + '\u201d', 80, sy2 + 14);
    }
    ctx.fillStyle = 'rgba(255,255,255,.35)';
    ctx.font = '11px "Press Start 2P",monospace';
    ctx.fillText('\u00d7' + (strawCount || 0) + '  \u2014 Madeline', 60, H - 36);
    ctx.fillStyle = 'rgba(255,230,109,.25)';
    for (var bx = 0; bx < W; bx += 8) { ctx.fillRect(bx, 0, 4, 4); ctx.fillRect(bx, H - 4, 4, 4); }
    for (var by = 0; by < H; by += 8) { ctx.fillRect(0, by, 4, 4); ctx.fillRect(W - 4, by, 4, 4); }
}
var PC_SOUNDS = {};
function pcPlay(name) {
    try {
        if (!PC_SOUNDS[name]) PC_SOUNDS[name] = new Audio('celeste-sounds/' + name);
        var a = PC_SOUNDS[name];
        a.currentTime = 0;
        a.volume = 0.9;
        a.play().catch(function(){});
    } catch (e) { }
}
function exportPostcard(data) {
    var modal = document.getElementById('postcardExportModal');
    if (!modal) {
        modal = document.createElement('div');
        modal.id = 'postcardExportModal';
        modal.innerHTML = '<canvas id="postcardCanvas"></canvas><div class="pe-actions"><button id="peDownload">\u2b07 下载明信片</button><button class="pe-close" id="peClose">\u2715 关闭</button></div>';
        document.body.appendChild(modal);
        document.getElementById('peClose').addEventListener('click', function() { modal.classList.remove('show'); pcPlay('ui_main_postcard_variants_out.wav'); });
        modal.addEventListener('click', function(e) { if (e.target === modal) { modal.classList.remove('show'); pcPlay('ui_main_postcard_variants_out.wav'); } });
    }
    var canvas = document.getElementById('postcardCanvas');
    renderPostcardCanvas(canvas, data.title, data.date, data.content, data.summary, parseInt(localStorage.getItem('diarySaveCount') || '0'));
    document.getElementById('peDownload').onclick = function() {
        var url = canvas.toDataURL('image/png');
        var a = document.createElement('a');
        a.download = 'mountain-diary-' + (data.date || '').replace(/\D/g, '').slice(0, 8) + '.png';
        a.href = url;
        document.body.appendChild(a); a.click(); document.body.removeChild(a);
    };
    modal.classList.add('show');
    pcPlay('ui_main_postcard_variants_in.wav');
}

(async function () {
    if (!localStorage.getItem('token')) { alert('请先登录'); location.href = 'login.html'; return; }
    const cards = document.getElementById('cards');
    const detail = document.getElementById('detail');
    let data = [], cur = null;
    function fmt(v) {
        if (!v) return '';
        const d = new Date(typeof v === 'number' || /^\d+$/.test(String(v)) ? Number(v) : v);
        if (isNaN(d.getTime())) return String(v);
        return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
    }
    const MONTHS_EN = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
    function fmtEn(v) {
        if (!v) return '';
        const d = new Date(typeof v === 'number' || /^\d+$/.test(String(v)) ? Number(v) : v);
        if (isNaN(d.getTime())) return String(v);
        return MONTHS_EN[d.getMonth()] + ' ' + d.getDate() + ', ' + d.getFullYear();
    }
    // ===== 日记翻页音效：forward = 抽出/向右，back = 向左（官方素材，变体随机） =====
    const PAGE_SFX = {
        forward: ['ui_world_journal_page_cover_forward_01.wav', 'ui_world_journal_page_cover_forward_02.wav', 'ui_world_journal_page_cover_forward_03.wav'],
        back: ['ui_world_journal_page_main_back_01.wav', 'ui_world_journal_page_main_back_02.wav', 'ui_world_journal_page_main_back_03.wav']
    };
    const PAGE_AUDIO = {};
    function playPageSfx(dir) {
        try {
            const list = PAGE_SFX[dir];
            const name = list[Math.floor(Math.random() * list.length)];
            if (!PAGE_AUDIO[name]) PAGE_AUDIO[name] = new Audio('celeste-sounds/' + name);
            const a = PAGE_AUDIO[name];
            a.currentTime = 0;
            a.volume = 0.20;
            a.play().catch(() => {});
        } catch (e) { /* 无声降级 */ }
    }
    let groups = [], curGroup = null, curIdx = 0;
    function buildGroups() {
        const map = new Map();
        for (const d of data) {
            const key = fmt(d.updateDate || d.createDate);
            if (!map.has(key)) map.set(key, []);
            map.get(key).push(d);
        }
        groups = [...map.values()].map(es => ({ date: es[0].updateDate || es[0].createDate, entries: es }));
    }
    function showList() { detail.classList.remove('show'); cards.style.display = ''; }
    function renderEntry() {
        cur = curGroup.entries[curIdx];
        detail.querySelector('.t').textContent = cur.title || '无题';
        detail.querySelector('.d').textContent = fmtEn(cur.updateDate || cur.createDate);
        detail.querySelector('.c').textContent = cur.content || '';
        detail.querySelector('.pos').textContent = (curIdx + 1) + ' / ' + curGroup.entries.length;
        detail.querySelector('.prev-e').disabled = curIdx === 0;
        detail.querySelector('.next-e').disabled = curIdx === curGroup.entries.length - 1;
    }
    function showDetail(i) {
        curGroup = groups[i]; if (!curGroup) return;
        curIdx = 0;
        cards.style.display = 'none';
        renderEntry();
        detail.classList.add('show');
    }
    detail.querySelector('.prev-e').addEventListener('click', () => { if (curIdx > 0) { playPageSfx('back'); curIdx--; renderEntry(); } });
    detail.querySelector('.next-e').addEventListener('click', () => { if (curGroup && curIdx < curGroup.entries.length - 1) { playPageSfx('forward'); curIdx++; renderEntry(); } });
    document.addEventListener('keydown', e => {
        if (!detail.classList.contains('show')) return;
        if (e.key === 'ArrowLeft') detail.querySelector('.prev-e').click();
        if (e.key === 'ArrowRight') detail.querySelector('.next-e').click();
    });
    async function load() {
        cards.innerHTML = '<div class="empty">正在搬书……</div>';
        const res = await api('/diary/list', 'GET');
        if (res.success && Array.isArray(res.data)) {
            data = res.data;
            if (!data.length) { cards.innerHTML = '<div class="empty">书架还空着。<br>写下第一篇，它就有了位置。</div>'; return; }
            buildGroups();
            cards.innerHTML = groups.map((g, i) =>
                '<div class="page" data-i="' + i + '">' +
                (g.entries.length > 1 ? '<div class="page-count">×' + g.entries.length + '</div>' : '') +
                '<div class="page-date">' + fmtEn(g.date) + '</div>' +
                '<div class="page-t">' + escHtml(g.entries[0].title || '无题') + '</div>' +
                '<div class="page-s">' + escHtml((g.entries[0].content || '').slice(0, 130)) + '</div>' +
                '</div>').join('');
        } else {
            cards.innerHTML = '<div class="empty">书架暂时打不开（' + escHtml(res.msg || '未知错误') + '）</div>';
        }
    }
    cards.addEventListener('click', ev => {
        const c = ev.target.closest('.page');
        if (c) { playPageSfx('forward'); showDetail(+c.dataset.i); }
    });

    // 悬停时磁带转轴转动（19 帧像素动画）
    (function () {
        const REEL_FRAMES = [];
        for (let i = 0; i < 19; i++) REEL_FRAMES.push('celeste-collectables/cassette/idle' + String(i).padStart(2, '0') + '.png');
        REEL_FRAMES.forEach(s => { const im = new Image(); im.src = s; });
        let reelTimer = null, reelFi = 0, reelCur = null;
        cards.addEventListener('mouseover', e => {
            const p = e.target.closest('.page');
            if (!p || p === reelCur) return;
            reelCur = p; reelFi = 0;
            if (reelTimer) clearInterval(reelTimer);
            reelTimer = setInterval(() => {
                reelFi = (reelFi + 1) % 19;
                if (reelCur) reelCur.style.backgroundImage = 'url(' + REEL_FRAMES[reelFi] + ')';
            }, 90);
        });
        cards.addEventListener('mouseout', e => {
            const p = e.target.closest('.page');
            if (!p || !reelCur || (e.relatedTarget && p.contains(e.relatedTarget))) return;
            if (reelTimer) { clearInterval(reelTimer); reelTimer = null; }
            reelCur.style.backgroundImage = '';
            reelCur = null;
        });
    })();
    detail.querySelector('.back').addEventListener('click', showList);

    detail.querySelector('.export-postcard').addEventListener('click', () => {
        if (!cur) return;
        exportPostcard({ title: cur.title, date: fmt(cur.updateDate || cur.createDate), content: cur.content, summary: '' });
    });

    detail.querySelector('.edit').addEventListener('click', () => {
        if (cur) location.href = 'diary.html?edit=' + encodeURIComponent(cur.id);
    });
    detail.querySelector('.del').addEventListener('click', async () => {
        if (!cur) return;
        if (!confirm('确定要删掉这篇日记吗？删了就找不回来了。')) return;
        const res = await api('/diary?diaryId=' + encodeURIComponent(cur.id), 'DELETE');
        if (res.success) { showToast('这一页合上了'); showList(); load(); }
        else showToast(res.msg || '删除失败');
    });
    await load();
})();

    // ===== 篝火渲染（原版 campfire 逐帧动画） =====
    (function () {
        const TROPHIES = {
            goldberry: 'celeste-collectables/goldberry/idle00.png',
            cassette: 'celeste-collectables/cassette/idle00.png',
            heartgem: 'celeste-collectables/heartgem/0/00.png',
            moonberry: 'celeste-collectables/moonberry/normal00.png'
        };
        let owned = [];
        try { owned = JSON.parse(localStorage.getItem('berryOwned') || '[]'); } catch (e) {}
        const trophy = document.getElementById('berryTrophy');
        owned.forEach(id => {
            if (!TROPHIES[id]) return;
            const im = document.createElement('img');
            im.src = TROPHIES[id]; im.title = id; im.dataset.id = id;
            trophy.appendChild(im);
        });
        if (trophy.children.length) trophy.classList.remove('empty');
        function mkTrophyFrames(prefix, n) { const a = []; for (let i = 0; i < n; i++) a.push(prefix + String(i).padStart(2, '0') + '.png'); return a; }
        function heartTier() {
            const c = parseInt(localStorage.getItem('diarySaveCount') || '0');
            return c >= 100 ? 3 : c >= 60 ? 2 : c >= 30 ? 1 : 0;
        }
        const TROPHY_FRAMES = {
            goldberry: mkTrophyFrames('celeste-collectables/goldberry/idle', 12),
            moonberry: mkTrophyFrames('celeste-collectables/moonberry/normal', 52),
            cassette: mkTrophyFrames('celeste-collectables/cassette/idle', 19)
        };
        const STRAW_FRAMES = mkTrophyFrames('celeste-collectables/strawberry/normal', 62);
        STRAW_FRAMES.forEach(s => { const im = new Image(); im.src = s; });
        let tfi = 0;
        setInterval(() => {
            trophy.querySelectorAll('img').forEach(im => {
                if (im.dataset.id === 'heartgem') {
                    im.src = 'celeste-collectables/heartgem/' + heartTier() + '/' + String(tfi % 14).padStart(2, '0') + '.png';
                    return;
                }
                const f = TROPHY_FRAMES[im.dataset.id];
                if (f) im.src = f[tfi % f.length];
            });
            const strawIm = document.getElementById('sbStrawImg');
            if (strawIm) strawIm.src = STRAW_FRAMES[tfi % STRAW_FRAMES.length];
            tfi++;
        }, 90);

        const FIRE_FRAMES = [];
        for (let i = 0; i < 16; i++) FIRE_FRAMES.push('celeste-gui/campfire/fire' + String(i).padStart(2, '0') + '.png');
        const SMOKE_FRAMES = [];
        for (let i = 0; i < 8; i++) SMOKE_FRAMES.push('celeste-gui/campfire/smoking' + String(i).padStart(2, '0') + '.png');
        FIRE_FRAMES.concat(SMOKE_FRAMES).forEach(src => { const im = new Image(); im.src = src; });

        const flameImg = document.getElementById('sbFlameImg');
        let curFrames = null, fi = 0;
        setInterval(() => {
            if (!curFrames || !curFrames.length) return;
            flameImg.src = curFrames[fi % curFrames.length];
            fi++;
        }, 70);

        function updateBonfire() {
            const fire = document.getElementById('sbFire');
            const cnt = document.getElementById('sbCount');
            const total = parseInt(localStorage.getItem('diarySaveCount') || '0') - parseInt(localStorage.getItem('berrySpent') || '0');
            const s = parseInt(localStorage.getItem('diaryStreak') || '0');
            cnt.textContent = total;
            fire.querySelectorAll('.sb-label').forEach(e => e.remove());
            if (s >= 1) {
                curFrames = FIRE_FRAMES; fi = 0;
                flameImg.style.width = (s >= 30 ? 120 : s >= 7 ? 104 : s >= 3 ? 90 : 76) + 'px';
            } else {
                curFrames = SMOKE_FRAMES; fi = 0;
                flameImg.style.width = '64px';
            }
            const lb = document.createElement('div');
            lb.className = 'sb-label';
            lb.textContent = s >= 30 ? '\u2605' + s : s + '天';
            fire.appendChild(lb);
            const flag = document.getElementById('sbFlag');
            if (s >= 30) { flag.src = 'celeste-gui/checkpoint/flag30.png'; flag.title = '存档点 \u2605' + s; flag.style.display = ''; }
            else if (s >= 7) { flag.src = 'celeste-gui/checkpoint/flag7.png'; flag.title = '存档点 ' + s + ' 天'; flag.style.display = ''; }
            else if (s >= 3) { flag.src = 'celeste-gui/checkpoint/flag3.png'; flag.title = '存档点 ' + s + ' 天'; flag.style.display = ''; }
            else { flag.style.display = 'none'; }
        }
        updateBonfire();
        document.getElementById('strawberryBonfire').addEventListener('click', () => {
            const s = parseInt(localStorage.getItem('diaryStreak') || '0');
            const line = s >= 30 ? '篝火已经燃成传说了！\u2605'
                : s >= 7 ? '火光正旺，继续攀登！'
                : s >= 3 ? '篝火稳定燃烧着。'
                : s >= 1 ? '小火苗也在努力发光。'
                : '火堆冷了……写一篇日记把它点燃吧。';
            showToast(line);
        });
    })();
</script>
