<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<title>回忆书架 · Madeline</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="icon/OIP.webp" type="image/webp">
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
* { box-sizing:border-box; margin:0; padding:0; }
@font-face { font-family:'Renogare'; src:url('celeste-font-en/Renogare-Regular.otf') format('opentype'); font-display:swap; }
@font-face { font-family:'CelesteZH'; src:url('fonts/NotoSansCJKsc-Medium.otf') format('opentype'); font-display:swap; }
body { min-height:100vh; background:url('celeste-gui/shelf-screen.webp') center/cover no-repeat fixed; font-family:'Renogare','CelesteZH','Microsoft YaHei',sans-serif; opacity:0; animation:pageFadeIn .8s ease forwards; }
/* #world 宽 200% 必然横向溢出：禁掉横向滚动，防止点击门时浏览器把页面带着横滚（scrollLeft 残留会让镜之房间错位露出 body 背景） */
html, body { overflow-x:hidden; overflow-x:clip; }
@keyframes pageFadeIn { from { opacity:0; } to { opacity:1; } }
/* 可访问性：键盘聚焦高亮 */
:focus-visible { outline:2px solid #ffe36d; outline-offset:2px; border-radius:4px; }
.topbar { position:fixed; top:28px; left:32px; z-index:40; }
.topbar a { display:inline-block; padding:24px 42px; background:rgba(22,34,60,.88); color:#ffe36d; border:2px solid #ffe36d; border-radius:6px; text-decoration:none; font-size:13px; box-shadow:0 0 10px rgba(255,230,109,.35); }
.topbar a.nav-diary-btn { padding:0; background:none; border:none; box-shadow:none; cursor:pointer; transition:transform .2s, filter .2s; vertical-align:middle; }
.topbar a.nav-diary-btn:hover { transform:scale(1.15); }
.topbar a.nav-diary-btn img { height:56px; width:auto; display:block; filter:drop-shadow(0 0 10px rgba(255,235,59,.7)); }
h1 { position:fixed; top:14px; left:50%; transform:translateX(-50%); font-family:'Press Start 2P',monospace; font-size:15px; color:#ffe36d; text-shadow:0 2px 0 rgba(0,0,0,.6); letter-spacing:2px; z-index:20; }
.wrap { max-width:1000px; margin:0 auto; padding:76px 20px 40px; }
/* ===== 日记列表：memo 纸页完整展示 ===== */
.cards {
    display:flex; flex-direction:column; gap:0;
    width:min(680px, 92vw);
    margin:0 auto;
    background:#e9dfcd url('celeste-journal/memo.png') center top / 100% auto no-repeat;
    border-radius:4px; padding:84px 52px 44px;
    filter:drop-shadow(0 12px 32px rgba(0,0,0,.4));
    position:relative;
    min-height:640px;
    transition:opacity .4s ease;
}
/* 纸页边缘做旧：左右两侧细微暗角 */
.cards::after {
    content:''; position:absolute; inset:0; border-radius:4px; pointer-events:none; z-index:3;
    box-shadow:inset 0 0 60px rgba(120,90,40,.08), inset 0 2px 0 rgba(255,255,255,.4);
}
/* 盖掉左上角 logo：纯色，和纸页底色一致 */
.cards::before {
    content:''; position:absolute; left:0; top:0;
    width:26%; height:9%;
    background:#e9dfcd;
    z-index:1; pointer-events:none;
}
.shelf-row {
    position:relative; display:flex; align-items:center; gap:14px;
    background:transparent; border:none; border-bottom:1px dashed rgba(163,129,47,.18);
    border-radius:6px; padding:16px 10px; cursor:pointer;
    opacity:0; transition:opacity .5s ease, transform .5s cubic-bezier(.22,1,.36,1), background .2s ease, box-shadow .2s ease;
    z-index:2;
}
.shelf-row:last-child { border-bottom:none; }
.shelf-row:hover { background:rgba(163,129,47,.08); box-shadow:inset 0 0 0 1px rgba(163,129,47,.18); }
.shelf-row:active { background:rgba(163,129,47,.14); transform:scale(.985); }
.shelf-row.from-below { transform:translateY(56px); }
.shelf-row.from-above { transform:translateY(-56px); }
.shelf-row.in { opacity:1; transform:translateY(0); }
.shelf-row.in:hover { transform:translateX(4px); }
.shelf-row.in:active { transform:scale(.985); }
.shelf-row .row-icon { width:28px; height:28px; image-rendering:pixelated; flex-shrink:0; opacity:.9; filter:drop-shadow(0 1px 2px rgba(0,0,0,.15)); transition:transform .2s ease; }
.shelf-row:hover .row-icon { transform:scale(1.12) rotate(-4deg); }
.shelf-row .row-main { flex:1; min-width:0; display:flex; flex-direction:column; gap:4px; }
.shelf-row .row-title { font-family:'Renogare','CelesteZH',sans-serif; font-size:15px; color:#3d2f1a; font-weight:700; letter-spacing:.3px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; text-shadow:0 1px 0 rgba(255,255,255,.5); }
.shelf-row .row-snip { font-size:12px; color:rgba(58,46,42,.6); line-height:1.6; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.shelf-row .row-date { font-family:'Renogare','CelesteZH',sans-serif; font-size:12px; color:#9a8560; letter-spacing:.5px; flex-shrink:0; display:flex; align-items:center; gap:6px; transition:color .2s ease; }
.shelf-row:hover .row-date { color:#6a5326; }
.shelf-row .row-count { display:inline-block; padding:2px 8px; background:rgba(163,129,47,.18); color:#6a5326; border-radius:10px; font-size:11px; font-weight:700; }
.shelf-row.snapshot { border-bottom-color:rgba(163,129,47,.35); }
.shelf-row.snapshot .row-title { color:#8a5a2b; }
.shelf-row.snapshot:hover { background:rgba(200,140,60,.1); }
.detail.anim-up { animation:slideUpIn .45s cubic-bezier(.22,1,.36,1); }
.detail.anim-down { animation:slideDownIn .45s cubic-bezier(.22,1,.36,1); }
@keyframes slideUpIn { from { opacity:0; transform:translateY(46px); } to { opacity:1; transform:translateY(0); } }
@keyframes slideDownIn { from { opacity:0; transform:translateY(-46px); } to { opacity:1; transform:translateY(0); } }
.empty { text-align:center; color:rgba(255,255,255,.85); background:rgba(22,34,60,.75); border:1px solid rgba(255,230,109,.2); border-radius:10px; padding:60px 24px; font-size:14px; line-height:2.2; backdrop-filter:blur(4px); }
.empty .em { display:block; font-size:28px; margin-bottom:14px; opacity:.9; }
.detail { display:none; background:linear-gradient(160deg, rgba(22,34,60,.95) 0%, rgba(14,22,44,.95) 100%); border:2px solid rgba(255,230,109,.45); border-radius:10px; padding:26px 28px; box-shadow:0 20px 50px rgba(0,0,0,.5), inset 0 1px 0 rgba(255,255,255,.06); }
.detail.show { display:block; }
.detail-nav { display:flex; align-items:center; justify-content:space-between; gap:10px; margin-bottom:16px; }
.detail-nav button { padding:8px 20px; border:2px solid rgba(255,230,109,.6); border-radius:6px; background:rgba(22,34,60,.6); color:#ffe36d; font-size:14px; cursor:pointer; transition:background .15s, transform .1s, border-color .15s; font-family:inherit; }
.detail-nav button:hover:not(:disabled) { background:rgba(255,230,109,.18); border-color:#ffe36d; }
.detail-nav button:active:not(:disabled) { transform:scale(.95); }
.detail-nav button:disabled { opacity:.25; cursor:not-allowed; }
.detail-nav .pos { color:rgba(255,230,109,.7); font-size:12px; font-family:'Renogare',sans-serif; letter-spacing:1px; }
.detail .back { background:none; border:none; color:rgba(255,230,109,.8); cursor:pointer; font-size:13px; margin-bottom:16px; transition:color .15s, transform .15s; padding:4px 0; }
.detail .back:hover { color:#ffe36d; transform:translateX(-3px); }
.detail .t { color:#ffe36d; font-size:22px; margin-bottom:8px; word-break:break-all; font-weight:700; line-height:1.4; text-shadow:0 1px 4px rgba(0,0,0,.4); }
.detail .d { color:rgba(255,230,109,.55); font-size:12px; margin-bottom:18px; letter-spacing:.5px; }
.detail .c { color:rgba(255,255,255,.92); font-size:15px; line-height:2.1; white-space:pre-wrap; word-break:break-word; padding:16px 18px; background:rgba(0,0,0,.18); border-radius:8px; border-left:3px solid rgba(255,230,109,.3); }
.acts { display:flex; gap:10px; margin-top:24px; flex-wrap:wrap; }
.acts button { flex:1; min-width:120px; padding:11px 0; border-radius:6px; cursor:pointer; font-size:14px; border:2px solid rgba(255,230,109,.5); background:rgba(22,34,60,.6); color:#ffe36d; font-family:inherit; transition:all .15s ease; }
.acts button:hover:not(:disabled) { background:rgba(255,230,109,.18); border-color:#ffe36d; transform:translateY(-2px); box-shadow:0 4px 12px rgba(255,230,109,.15); }
.acts button:active { transform:translateY(0); }
.acts button.del { border-color:rgba(230,81,124,.6); color:#ff9ab5; }
.acts button.del:hover { background:rgba(230,81,124,.18); border-color:#e6517c; box-shadow:0 4px 12px rgba(230,81,124,.2); }
.toast { position:fixed; left:50%; bottom:40px; transform:translateX(-50%) translateY(20px); background:rgba(22,34,60,.96); color:#ffe36d; border:1px solid rgba(255,230,109,.5); padding:12px 22px; border-radius:8px; opacity:0; transition:all .3s cubic-bezier(.22,1,.36,1); z-index:99; font-size:13px; box-shadow:0 8px 24px rgba(0,0,0,.4), 0 0 0 1px rgba(255,230,109,.1); max-width:90vw; text-align:center; }
.toast.show { opacity:1; transform:translateX(-50%) translateY(0); }


/* ===== 明信片弹窗：每日明信片同款入场动画 ===== */
#postcardExportModal { position:fixed; inset:0; z-index:1200; display:none; flex-direction:column; align-items:center; justify-content:center; gap:18px; background:rgba(5,5,20,.95); }
#postcardExportModal.show { display:flex; }
#postcardExportModal .pe-snow { position:absolute; inset:0; width:100%; height:100%; pointer-events:none; z-index:0; }
#postcardExportModal .pe-stage { display:flex; flex-direction:column; align-items:center; gap:18px; z-index:1; opacity:0; transform:translateX(-120%) rotate(-8deg); transition:opacity .8s ease, transform 1s cubic-bezier(0.34, 1.56, 0.64, 1); }
#postcardExportModal .pe-stage.slide-in { opacity:1; transform:translateX(0) rotate(0deg); }
#postcardExportModal canvas#postcardCanvas { max-width:92vw; max-height:74vh; border-radius:6px; box-shadow:0 16px 48px rgba(0,0,0,.7); background:#0f1729; filter:drop-shadow(0 8px 32px rgba(0,0,0,.6)); }
#postcardExportModal .pe-actions { display:flex; gap:14px; opacity:0; transition:opacity .5s ease; }
#postcardExportModal .pe-actions.show { opacity:1; }
#postcardExportModal button { padding:9px 20px; border-radius:6px; cursor:pointer; font-size:13px; border:2px solid #ffe36d; background:rgba(22,34,60,.92); color:#ffe36d; font-family:inherit; }
#postcardExportModal button:hover { background:rgba(255,230,109,.15); }

/* ===== 篝火（从 diary 迁来） ===== */
#strawberryBonfire{position:fixed;right:calc(var(--door-w) + 20px);bottom:24px;z-index:20;display:flex;flex-direction:column;align-items:flex-end;gap:8px;user-select:none;cursor:pointer;}
.sb-scene{position:relative;display:flex;align-items:flex-end;gap:2px;}
.sb-scene::before{content:'';position:absolute;left:50%;bottom:-8px;transform:translateX(-50%);width:220px;height:64px;background:radial-gradient(ellipse at center,rgba(255,150,50,.35) 0%,rgba(255,150,50,.12) 45%,transparent 70%);pointer-events:none;animation:sbGlow 1.6s ease-in-out infinite alternate;}
@keyframes sbGlow{from{opacity:.7}to{opacity:1}}
.sb-madeline{width:74px;height:auto;image-rendering:pixelated;filter:drop-shadow(0 3px 6px rgba(0,0,0,.5));}
.sb-flag{width:30px;height:auto;image-rendering:pixelated;align-self:flex-end;margin:0 -2px 2px 0;filter:drop-shadow(0 0 4px rgba(125,207,255,.5));}
.sb-flash{position:absolute;left:50%;bottom:0;transform:translateX(-50%);width:80px;height:auto;image-rendering:pixelated;pointer-events:none;z-index:2;}
.sb-fire{position:relative;display:flex;align-items:flex-end;justify-content:center;}
.sb-fire img{display:block;height:auto;image-rendering:pixelated;filter:drop-shadow(0 0 14px rgba(255,150,50,.65));}
.sb-label{font-family:'Renogare','CelesteZH',sans-serif;font-size:12px;color:rgba(255,230,109,.9);text-shadow:0 1px 2px rgba(0,0,0,.8);position:absolute;bottom:-18px;left:50%;transform:translateX(-50%);white-space:nowrap;letter-spacing:1px;}
/* ===== 商店收藏品展示 ===== */
#berryTrophy{position:fixed;top:70px;right:calc(var(--door-w) + 12px);z-index:20;display:flex;gap:8px;padding:6px 10px;background:rgba(22,34,60,.85);border:1px dashed rgba(255,230,109,.4);border-radius:8px;}
#berryTrophy img{width:26px;height:26px;image-rendering:pixelated;object-fit:contain;filter:drop-shadow(0 0 4px rgba(255,230,109,.5));}
#berryTrophy.empty{display:none;}

/* ===== 磁带选曲（cassette 收集品点歌） ===== */
/* 磁带选曲 CSS 已删 */
/* ===== 篝火（从 diary 迁来） ===== */
/* ===== 快照明信片行（列表里的一条） ===== */
.shelf-row.snapshot { background:url('celeste-journal/memo.png') center/100% 100% no-repeat; border:none; }
/* ===== 快照详情：翻开的 Journal 跨页 ===== */
#snapJournalModal { position:fixed; inset:0; z-index:1200; display:none; align-items:center; justify-content:center; background:rgba(4,6,14,.82); backdrop-filter:blur(3px); }
#snapJournalModal.show { display:flex; }
.sj-book { position:relative; width:min(860px,94vw); }
.sj-bg { display:block; width:100%; border-radius:6px; box-shadow:0 18px 50px rgba(0,0,0,.7); }
.sj-page { position:absolute; top:16%; height:68%; font-family:'Renogare','CelesteZH','Microsoft YaHei',sans-serif; color:#3d3226; }
.sj-left { left:9%; width:36%; }
.sj-right { left:55%; width:36%; }

.sj-close:hover { background:rgba(255,230,109,.5); }

/* ===== 镜子：镜之房间正中 · 图层叠加 · 点击破碎召唤 Badeline ===== */
#shelfMirror {
    position: relative;
    margin: 0;
    width: 0;
    height: 0;
    cursor: pointer;
    user-select: none;
    -webkit-user-drag: none;
    filter: drop-shadow(0 10px 22px rgba(0,0,0,.5));
}
#shelfMirror .m-layer {
    position: absolute;
    left: 50%;
    top: 50%;
    transform: translate(-50%,-50%);
    image-rendering: pixelated;
    pointer-events: none;
}
#shelfMirror .m-mask { animation: maskDrift 5s ease-in-out infinite; }
@keyframes maskDrift {
    0%,100% { transform: translate(-50%,-50%) translate(0,0); }
    30% { transform: translate(-50%,-50%) translate(5px,-6px); }
    65% { transform: translate(-50%,-50%) translate(-5px,4px); }
}
#shelfMirror.mirror-shake { animation: mirrorShake .28s linear 2; }
@keyframes mirrorShake {
    0%,100% { transform: translate(0,0); }
    25% { transform: translate(-5px,3px); }
    50% { transform: translate(5px,-3px); }
    75% { transform: translate(-4px,-2px); }
}
#shelfMirror .badeline-wrap {
    position: absolute;
    left: 50%;
    top: 50%;
    opacity: 0;
    pointer-events: none;
    z-index: 6;
}
/* 自由游荡态：wrap 被 DOM 移到 #mirrorRoom 子级后启用，相对房间全屏定位 */
.badeline-wrap.free {
    position: absolute;
    opacity: 1;
    pointer-events: auto;          /* 自由游荡时可点击本人触发对话 */
    z-index: 10;                    /* 比心门(z-index:8)高，不被门盖住 */
    transition: opacity .8s ease, left 1.5s ease, top 1.5s ease, transform .3s ease;
    will-change: left, top, transform;
}
.badeline-wrap.free .badeline-inner { animation: none; }   /* 自由游荡时关闭原 floating 浮动，避免与 transition 冲突 */
#shelfMirror.summoned .badeline-wrap { animation: badelineRise .9s cubic-bezier(0.34,1.56,0.64,1) forwards; }
@keyframes badelineRise {
    from { opacity: 0; transform: translate(-50%,10%) scale(.3); }
    to   { opacity: 1; transform: translate(-50%,-78%) scale(1); }
}
#shelfMirror.summoned.bye .badeline-wrap { animation: badelineBye .7s ease forwards; }
@keyframes badelineBye {
    from { opacity: 1; transform: translate(-50%,-78%) scale(1); }
    to   { opacity: 0; transform: translate(-50%,-120%) scale(.7); }
}
#shelfMirror .badeline-inner { animation: badelineFloat 2.6s ease-in-out infinite; }
@keyframes badelineFloat { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-8px); } }
#shelfMirror .badeline-inner img {
    image-rendering: pixelated;
    filter: drop-shadow(0 0 14px rgba(125,80,200,.75));
}
/* Badeline 立绘统一 56px：5 个 gif 像素尺寸不一，统一固定像素值防止跳动 */
#badelineImg {
    width: 56px;
    height: auto;
    cursor: pointer;
    user-select: none;
    -webkit-user-drag: none;
}
#badelineImg:hover { filter: drop-shadow(0 0 18px rgba(160,110,220,.95)); transition: filter .2s ease; }

/* ===== Badeline 聊天面板：镜子召唤后出现 ===== */
#blChat {
    position: fixed;
    left: 50%;
    bottom: 84px;
    width: min(92vw, 520px);
    z-index: 960;
    background: rgba(16, 10, 28, .93);
    border: 2px solid rgba(205, 182, 255, .5);
    border-radius: 10px;
    box-shadow: 0 10px 40px rgba(0, 0, 0, .6), 0 0 18px rgba(205, 182, 255, .18);
    display: none;
    flex-direction: column;
    overflow: hidden;
    opacity: 0;
    transform: translateX(-50%) translateY(16px);
    transition: opacity .25s ease, transform .25s ease;
}
#blChat.show { display: flex; }
#blChat.vis { opacity: 1; transform: translateX(-50%) translateY(0); }
#blChat .bl-head {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 14px;
    border-bottom: 1px solid rgba(205, 182, 255, .25);
}
#blChat .bl-head img { width: 40px; height: 40px; image-rendering: pixelated; border-radius: 6px; background: rgba(0,0,0,.4); object-fit: cover; }
#blChat .bl-name { flex: 1; color: #cdb6ff; font-family: 'Renogare','CelesteZH','Microsoft YaHei',sans-serif; font-size: 16px; letter-spacing: 1px; text-shadow: 0 0 10px rgba(205,182,255,.4); }
#blChat .bl-close { background: none; border: none; color: rgba(205,182,255,.6); font-size: 16px; cursor: pointer; }
#blChat .bl-close:hover { color: #cdb6ff; }
#blMsgs { padding: 12px 14px; display: flex; flex-direction: column; gap: 8px; max-height: 40vh; min-height: 110px; overflow-y: auto; }
.bl-msg { max-width: 86%; padding: 8px 12px; border-radius: 10px; font-size: 13px; line-height: 1.7; word-break: break-word; font-family: 'Renogare','CelesteZH','Microsoft YaHei',sans-serif; white-space: pre-wrap; }
.bl-msg.assistant { align-self: flex-start; color: #e8ddff; background: rgba(205,182,255,.12); border: 1px solid rgba(205,182,255,.28); }
.bl-msg.user { align-self: flex-end; color: #ffe36d; background: rgba(255,230,109,.1); border: 1px solid rgba(255,230,109,.3); }
.bl-msg.loading { color: rgba(232,221,255,.5); font-style: italic; }
#blChat .bl-input { display: flex; gap: 8px; padding: 10px 12px; border-top: 1px solid rgba(205,182,255,.25); }
#blInput { flex: 1; padding: 9px 10px; border: 1px solid rgba(205,182,255,.4); border-radius: 6px; background: rgba(205,182,255,.1); color: #efe7ff; font-size: 13px; outline: none; font-family: 'Renogare','CelesteZH','Microsoft YaHei',sans-serif; }
#blInput:focus { border-color: #cdb6ff; background: rgba(205,182,255,.18); }
#blInput::placeholder { color: rgba(232,221,255,.35); }
#blSend { padding: 9px 16px; border: none; border-radius: 6px; background: #8a5cff; color: #fff; cursor: pointer; font-size: 14px; letter-spacing: 1px; font-family: 'Renogare','CelesteZH',sans-serif; box-shadow: inset 0 -2px rgba(0,0,0,.35); }
#blSend:hover:not(:disabled) { background: #9d7bff; }
#blSend:disabled { opacity: .5; cursor: not-allowed; }
.bl-emo { display: inline-block; font-size: 10px; color: #b79aff; border: 1px solid rgba(183,154,255,.45); border-radius: 8px; padding: 0 6px; margin-right: 6px; vertical-align: 1px; opacity: .9; }

/* ===== Badeline 游戏对话框：官方文本框 + 情绪立绘（演出层；聊天面板让位上移） ===== */
#badelineDialog {
    position: fixed;
    left: 50%;
    bottom: 26px;
    transform: translateX(-50%) translateY(24px);
    width: min(94vw, 900px);
    min-height: 128px;
    z-index: 970;
    display: flex;
    align-items: center;
    gap: 18px;
    padding: 20px 30px;
    background: url('celeste-portraits/textbox/badeline.png') center / 100% 100% no-repeat;
    opacity: 0;
    pointer-events: none;
    cursor: pointer;
    transition: opacity .25s ease, transform .25s ease;
}
#badelineDialog.show { opacity: 1; transform: translateX(-50%) translateY(0); pointer-events: auto; }
#badelineDialogPortrait { width: 92px; height: 92px; flex-shrink: 0; border-radius: 6px; overflow: hidden; background: rgba(0,0,0,.4); }
#badelineDialogPortrait img { width: 100%; height: 100%; object-fit: cover; display: block; image-rendering: pixelated; }
#badelineDialogName { color: #cdb6ff; font-family: 'Renogare','CelesteZH','Microsoft YaHei',sans-serif; font-size: 13px; letter-spacing: 2px; margin-bottom: 5px; text-shadow: 0 0 10px rgba(205,182,255,.45); }
#badelineDialogText { color: #f2ecff; font-family: 'Renogare','CelesteZH','Microsoft YaHei',sans-serif; font-size: 14px; line-height: 1.7; word-break: break-word; min-height: 48px; white-space: pre-wrap; }
#blChat.dialog-live { bottom: 178px; }
@media (max-width: 640px) {
    #badelineDialog { padding: 14px 18px; min-height: 104px; gap: 12px; }
    #badelineDialogPortrait { width: 72px; height: 72px; }
    #blChat.dialog-live { bottom: 150px; }
}

/* ===== 横向世界：书架 ⇄ 心门后的镜之房间 ===== */
html, body { overflow-x: hidden; }
#world { display:flex; width:200%; transition:transform 1.35s cubic-bezier(.65,0,.35,1); will-change:transform; }
#world .view { width:50%; min-height:100vh; flex-shrink:0; position:relative; }
#shelfView { box-sizing:border-box; padding-right:var(--door-w); }
#world.panned { transform:translateX(-50%); }

/* ===== 心门（水晶心大门 · 全高占满右侧 · 未开启） ===== */
:root { --door-w:200px; }
#heartDoor {
    position:absolute; right:0; top:0; height:100vh;
    width:var(--door-w);
    cursor:not-allowed; z-index:8; user-select:none;
    filter:drop-shadow(-6px 0 34px rgba(70,160,200,.45));
    transition:filter .8s ease, opacity .6s ease;
}
#heartDoor .hd-mist {
    position:absolute; inset:-40px;
    background:url('heartdoor/mist.png') repeat; background-size:160px 160px;
    image-rendering:pixelated; opacity:.24;
    filter:blur(1px) brightness(1.2) hue-rotate(182deg);
    animation:hdMist 9s linear infinite;
}
@keyframes hdMist { from { background-position:0 0; } to { background-position:160px 320px; } }
#heartDoor .hd-gate { position:absolute; inset:0; }
/* 裁剪壳：深冷门龛底色 + 溢出裁剪；心形门体嵌在龛中，分裂后露出亮心光柱 */
#heartDoor .hd-clip {
    position:absolute; inset:0; overflow:hidden;
    background:linear-gradient(180deg, #2c3f54 0%, #1c2c3d 45%, #121e2b 100%);
    box-shadow:inset 0 0 34px rgba(5,11,19,.78);
}
#heartDoor .hd-bright {
    position:absolute; inset:0; opacity:0;
    background:
        radial-gradient(58% 46% at 50% 50%, #ffffff 0%, #eafcff 18%, #bdeffb 42%, #7fd2f0 68%, rgba(110,200,240,.38) 88%, rgba(110,200,240,0) 100%),
        linear-gradient(180deg, #9adcf0, #5cb9dc);
    box-shadow:0 0 46px 16px rgba(150,225,255,.5);
    transition:opacity .8s ease .12s;
}
#heartDoor.split .hd-bright { opacity:1; }
/* ===== 心形门：低分辨率像素整心，上下两半 canvas 贴裂缝拼接，闭合即无缝整心 ===== */
#heartDoor { --crack:16px; --cap-h:32px; }
#heartDoor .hd-half {
    position:absolute; left:0; right:0; height:50%; overflow:hidden;
    transition:transform 1.15s cubic-bezier(.65,0,.22,1);
}
#heartDoor .hd-half-t { top:0; }
#heartDoor .hd-half-b { bottom:0; }
/* 分裂微开：上/下半向相反方向移动一小段距离后停住（一次性，终态保持） */
#heartDoor.split .hd-half-t { transform:translateY(calc(-1 * var(--crack))); }
#heartDoor.split .hd-half-b { transform:translateY(var(--crack)); }
/* 半心 canvas：底边/顶边贴裂缝，闭合时上下两块拼成一整颗心 */
#heartDoor .hd-heart {
    position:absolute; left:0; width:100%; height:auto; display:block;
    image-rendering:pixelated; z-index:2;
}
#heartDoor .hd-half-t .hd-heart { bottom:0; }
#heartDoor .hd-half-b .hd-heart { top:0; }
/* 四颗心嵌入门体：上/下半各一排 2 颗，随半门一起移动 */
#heartDoor .hd-gate { z-index:2; }
#heartDoor .hd-hearts {
    position:absolute; left:50%; transform:translateX(-50%);
    display:grid; grid-template-columns:repeat(2, 50px); gap:14px; z-index:3;
}
#heartDoor .hd-half-t .hd-hearts { bottom:26px; }
#heartDoor .hd-half-b .hd-hearts { top:26px; }
/* 裂缝透光：分裂后两半之间亮起一道光缝（藏在门体后，只从缝里漏出来） */
#heartDoor .hd-clip::after {
    content:''; position:absolute; left:11%; right:11%; top:50%; height:6px;
    transform:translateY(-50%); z-index:1; opacity:0; border-radius:3px;
    background:#f2fdff;
    box-shadow:0 0 14px 4px rgba(220,248,255,.95), 0 0 40px 14px rgba(150,225,255,.55);
    transition:opacity .5s ease .35s;
}
#heartDoor.split .hd-clip::after { opacity:.95; }
#heartDoor.split .hd-heart { filter:drop-shadow(0 0 16px rgba(190,240,255,.7)); }
/* ===== 门框：top.png 顶冠/底冠 + edge.png 两侧立柱，心形门体嵌在框中 ===== */
#heartDoor .hd-cap {
    position:absolute; left:0; right:0; height:var(--cap-h); z-index:4;
    background:url('heartdoor/top.png') repeat-x; background-size:var(--cap-h) var(--cap-h);
    image-rendering:pixelated;
}
#heartDoor .hd-cap.top { top:0; }
#heartDoor .hd-cap.bottom { bottom:0; transform:scaleY(-1); }
#heartDoor .hd-rail {
    position:absolute; top:var(--cap-h); bottom:var(--cap-h); width:var(--cap-h); z-index:4;
    background:url('heartdoor/edge.png') repeat-y; background-size:var(--cap-h) var(--cap-h);
    image-rendering:pixelated;
}
#heartDoor .hd-rail.left { left:0; }
#heartDoor .hd-rail.right { right:0; transform:scaleX(-1); }
#heartDoor .hd-hearts img {
    width:50px; height:50px; image-rendering:pixelated;
    opacity:.85; filter:drop-shadow(0 0 6px rgba(215,245,255,.5));
    transition:opacity .45s ease, filter .45s ease;
}
#heartDoor.split .hd-hearts img {
    opacity:1;
    filter:drop-shadow(0 0 6px rgba(255,255,255,.9)) drop-shadow(0 0 14px rgba(90,180,225,.8));
}
/* 空心态（icon00 细白轮廓）：暗色晕圈+青光衬底，让未点亮的空心清晰可辨 */
#heartDoor .hd-hearts img[src*='icon00'] {
    opacity:1;
    filter:drop-shadow(0 0 3px rgba(6,16,28,.95)) drop-shadow(0 0 8px rgba(120,200,235,.5));
}
#heartDoor .hd-hearts img.pop { animation:hdPop .55s cubic-bezier(.22,1.4,.36,1); }
@keyframes hdPop {
    0%   { transform:scale(.3); filter:drop-shadow(0 0 0 rgba(160,220,255,0)); }
    55%  { transform:scale(1.4); filter:drop-shadow(0 0 18px rgba(230,250,255,.95)); }
    100% { transform:scale(1); opacity:.85; filter:drop-shadow(0 0 6px rgba(215,245,255,.5)); }
}
#heartDoor.ready { cursor:pointer; }
#heartDoor.ready .hd-heart { filter:drop-shadow(0 0 12px rgba(190,240,255,.9)) drop-shadow(0 0 30px rgba(140,220,255,.5)); }
#heartDoor.ready .hd-hearts img { animation:hdPulse 1.6s ease-in-out infinite; }
@keyframes hdPulse { 0%,100% { transform:scale(1); } 50% { transform:scale(1.12); } }
#heartDoor.shake { animation:hdShake .3s linear 2; }
@keyframes hdShake { 0%,100% { translate:0 0; } 25% { translate:-6px 0; } 75% { translate:6px 0; } }
#heartDoor.away { opacity:0; pointer-events:none; }
/* panned（镜之房间侧）：心门只露左半边，右半跑出视口；点击回书架
   position:fixed 绕过 #world transform 的 containing block，让 left:calc(100vw-...) 真正按视口算 */
#world.panned #heartDoor {
    position: fixed;
    top: 0;
    height: 100vh;
    width: var(--door-w);
    right: auto;
    left: calc(100vw - var(--door-w) / 2);
    cursor: pointer;
    opacity: 1;
    pointer-events: auto;
    z-index: 8;
}

/* ===== 镜之房间（心门后） ===== */
#mirrorRoom {
    /* 极暗紫渐变 + Badeline 专属背景图叠加，图片 cover 铺满 */
    background:
        radial-gradient(120% 95% at 50% 42%, #221736 0%, #120d22 52%, #060410 100%),
        url('celeste-areas/bg-badeline/00.png') center / cover no-repeat;
    background-blend-mode: multiply;    /* 渐变乘上图片，暗部压黑、亮部保留 */
    display:flex; align-items:center; justify-content:center;
    isolation:isolate;
}

/* ===== 紫色空间粒子：3 类星点 PNG 纯竖直下落 + 蓝色拖尾（取素材 stars 实际色） ===== */
.mv-layer { position:absolute; inset:0; overflow:hidden; pointer-events:none; z-index:-1; }
/* 进镜之房间后隐藏全屏雪花画布（暗色空间不要雪） */
#shelfSnow { transition:opacity .5s ease; }
body:has(#world.panned) #shelfSnow { opacity:0; }
/* 进紫色空间后，shelf 侧的草莓篝火 + Madeline 隐藏，不跟着移 */
body:has(#world.panned) #strawberryBonfire { opacity:0; pointer-events:none; transition:opacity .5s ease; }
.star {
    position:absolute; top:-56px; left:var(--x);
    image-rendering:pixelated; opacity:0;
    animation:starFall linear forwards;
    will-change:transform, opacity, filter;
    /* drop-shadow 发光半径用 --glowAmount 变量，由 keyframes 从 0 逐步涨到 72px */
    filter:drop-shadow(0 0 calc(var(--glowAmount) * .4) rgba(95,205,228,.7))
           drop-shadow(0 0 var(--glowAmount) rgba(48,96,130,.45));
}
/* 注册 --glowAmount 为 <length>，让 drop-shadow 在 keyframes 里能插值动画（Chrome 85+/Safari 15.4+ 支持） */
@property --glowAmount { syntax:'<length>'; initial-value:0px; inherits:false; }
@keyframes starFall {
    /* 纯竖直下落 + 发光从小到大：入场弱光 → 中段爆亮 → 消散前光最盛 */
    0%   { transform:translate3d(0,0,0); opacity:0;   --glowAmount: 0px; }
    6%   { opacity:1;  --glowAmount: 24px; }
    50%  { --glowAmount: 48px; }
    92%  { opacity:.55; --glowAmount: 64px; }
    100% { transform:translate3d(0, var(--dist), 0); opacity:0; --glowAmount: 72px; }
}

/* ===== dream 场景：极光夜空 + 雪原篝火（像素风：硬边缘 · 平色带 · 台阶轮廓） ===== */
#dreamScene {
    position:fixed; inset:0; z-index:1500; overflow:hidden;
    /* 天空：深靛夜空，极光带微亮（参照实机第七章梦境天色） */
    background:linear-gradient(180deg, #110d38 0%, #181245 26%, #221a58 44%, #1e1550 58%, #16103e 78%, #110b30 100%);
    opacity:0; visibility:hidden; pointer-events:none;
    transition:opacity 1.1s ease, visibility 0s linear 1.1s;
}
#dreamScene.show { opacity:1; visibility:visible; pointer-events:auto; transition:opacity 1.1s ease; }
/* 星空：方形像素点（background 硬边方块，百分比定位自适应宽度） */
.ds-stars { position:absolute; inset:0 0 32% 0; opacity:.85;
    background:
        linear-gradient(#ffffff,#ffffff) 8% 18%/2px 2px no-repeat,
        linear-gradient(#cfeaff,#cfeaff) 16% 64%/2px 2px no-repeat,
        linear-gradient(#ffffff,#ffffff) 23% 36%/3px 3px no-repeat,
        linear-gradient(#9fd8ff,#9fd8ff) 30% 8%/2px 2px no-repeat,
        linear-gradient(#ffffff,#ffffff) 37% 52%/2px 2px no-repeat,
        linear-gradient(#cfeaff,#cfeaff) 44% 24%/2px 2px no-repeat,
        linear-gradient(#ffffff,#ffffff) 51% 70%/3px 3px no-repeat,
        linear-gradient(#9fd8ff,#9fd8ff) 58% 14%/2px 2px no-repeat,
        linear-gradient(#ffffff,#ffffff) 64% 42%/2px 2px no-repeat,
        linear-gradient(#cfeaff,#cfeaff) 71% 30%/2px 2px no-repeat,
        linear-gradient(#ffffff,#ffffff) 78% 60%/3px 3px no-repeat,
        linear-gradient(#9fd8ff,#9fd8ff) 85% 20%/2px 2px no-repeat,
        linear-gradient(#ffffff,#ffffff) 92% 46%/2px 2px no-repeat,
        linear-gradient(#cfeaff,#cfeaff) 96% 12%/2px 2px no-repeat;
    animation:dsTwinkle 3.6s steps(2) infinite;
}
@keyframes dsTwinkle { 0%,100% { opacity:.4; } 50% { opacity:.95; } }
/* 极光：游戏截图裁出的极光帘幕（celeste-gui/dream/aurora.png，4x 最近邻降采样保像素颗粒），
   收窄到 92vw 按原图比例定高（16:9 屏下光幕垂至约 53% 高度，对齐实机构图）；
   左右+底部 mask 渐隐融入夜空，小幅横移不露边 */
.ds-aurora { position:absolute; left:4%; right:4%; top:0;
    background-repeat:no-repeat; image-rendering:pixelated; z-index:2; }
.ds-aurora.a1 {
    height:auto; aspect-ratio:391/127; opacity:.98;
    background-image:url('celeste-gui/dream/aurora.png');
    background-size:100% 100%;
    animation:dsSway 12s linear infinite alternate;
    -webkit-mask-image:
        linear-gradient(90deg, transparent 0, #000 5%, #000 95%, transparent 100%),
        linear-gradient(180deg, #000 74%, transparent 99%);
    -webkit-mask-composite:source-in;
    mask-image:
        linear-gradient(90deg, transparent 0, #000 5%, #000 95%, transparent 100%),
        linear-gradient(180deg, #000 74%, transparent 99%);
    mask-composite:intersect;
}
.ds-aurora.a2, .ds-aurora.a3 { display:none; }
@keyframes dsSway {
    0%   { transform:translateX(0); }
    100% { transform:translateX(-1.8%); }
}
/* 远山：截图极光层已带山脊剪影，far 层隐藏；near 层保留作雪台后的近景深紫坡 */
.ds-mtn { position:absolute; left:0; right:0; background-size:100% 100%; background-repeat:no-repeat; image-rendering:pixelated; }
.ds-mtn.far { display:none; }
.ds-mtn.near { top:52%; height:27%; }
/* 雪台：canvas 白雪台面 + 垂雪圆缘 + 暗紫岩层晶簇 */
.ds-ground { position:absolute; left:0; right:0; bottom:0; height:26%;
    background-size:100% 100%; background-repeat:no-repeat; image-rendering:pixelated; }
/* 两侧紫色晶岩柱：贴边高耸窄柱，canvas 斑驳紫晶 + 积雪盖 */
.ds-rock { position:absolute; bottom:0; width:6%; height:92%;
    background-size:100% 100%; background-repeat:no-repeat; image-rendering:pixelated; }
.ds-rock.l { left:0; }
.ds-rock.r { right:0; transform:scaleX(-1); width:9%; height:82%; }
/* 篝火光晕圆（ds-fire-glow）已删：极光本身够亮，不需要额外中心光斑 */
#dsFire { position:absolute; left:50%; bottom:16%; width:clamp(160px,32vmin,230px);
    transform:translateX(-50%); image-rendering:pixelated; }
/* 围炉睡觉的 Madeline（篝火左侧）：可点击，hover 泛暖光提示“可叫醒” */
#dsMadeline {
    position:absolute; left:39%; bottom:16.5%; z-index:3;
    width:clamp(52px,11vmin,84px); image-rendering:pixelated;
    cursor:pointer; user-select:none; -webkit-user-drag:none;
    transition:filter .2s ease, transform .15s ease;
}
#dsMadeline:hover { filter:drop-shadow(0 0 10px rgba(255,210,150,.85)); transform:translateY(-2px); }
#dsMadeline.waking { cursor:default; pointer-events:none; }

/* ===== dream 功能入口：记梦 / Badeline 夜话 ===== */
#dreamTools { position:absolute; top:20px; left:50%; transform:translateX(-50%); z-index:5; display:flex; gap:14px; }
.dt-btn {
    display:flex; align-items:center; gap:7px; padding:9px 16px; cursor:pointer;
    font-family:'Renogare','CelesteZH','Microsoft YaHei',sans-serif; font-size:13px; letter-spacing:3px;
    color:#d9e7ff; background:rgba(14,18,48,.62);
    border:2px solid rgba(150,190,255,.4);
    box-shadow:0 0 0 2px rgba(8,10,30,.75), 3px 3px 0 rgba(0,0,0,.55);
    transition:all .18s ease;
}
.dt-btn .dt-ico { font-size:14px; line-height:1; filter:drop-shadow(0 0 6px rgba(160,210,255,.8)); }
#dreamNightBtn { border-color:rgba(190,150,255,.5); color:#e6dcff; }
.dt-btn:hover { background:rgba(60,90,180,.35); transform:translateY(-2px); box-shadow:0 0 14px rgba(120,170,255,.45), 3px 3px 0 rgba(0,0,0,.55); }
#dreamNightBtn:hover { background:rgba(90,55,170,.32); box-shadow:0 0 14px rgba(170,120,255,.5), 3px 3px 0 rgba(0,0,0,.55); }
.dt-btn:active { transform:translateY(1px); }

/* ===== 梦境面板：更暗的底 · 半透明文字 · 飘浮光尘（区别于书架纸页质感） ===== */
.dream-panel {
    position:absolute; inset:0; z-index:20; display:flex; align-items:center; justify-content:center;
    background:rgba(7,8,26,.55); backdrop-filter:blur(3px);
    opacity:0; visibility:hidden; transition:opacity .35s ease, visibility 0s linear .35s;
}
.dream-panel.show { opacity:1; visibility:visible; transition:opacity .35s ease; }
.dp-motes { position:absolute; inset:0; overflow:hidden; pointer-events:none; }
.dp-motes i {
    position:absolute; bottom:-10px; width:3px; height:3px;
    background:rgba(190,220,255,.85); box-shadow:0 0 6px 1px rgba(150,200,255,.7);
    animation:dpMote linear infinite;
}
#dreamNightPanel .dp-motes i { background:rgba(214,190,255,.85); box-shadow:0 0 6px 1px rgba(180,140,255,.7); }
@keyframes dpMote {
    0%   { transform:translateY(0) translateX(0); opacity:0; }
    12%  { opacity:.9; }
    88%  { opacity:.6; }
    100% { transform:translateY(-92vh) translateX(var(--drift,24px)); opacity:0; }
}
.dp-card {
    position:relative; width:min(92vw,720px); max-height:86vh; display:flex; flex-direction:column;
    background:linear-gradient(180deg, rgba(18,20,52,.93), rgba(11,12,36,.95));
    border:2px solid rgba(140,175,255,.35);
    box-shadow:0 0 40px rgba(60,90,200,.25), 0 0 0 3px rgba(6,8,24,.8), 6px 6px 0 rgba(0,0,0,.45);
}
#dreamNightPanel .dp-card { border-color:rgba(178,140,255,.4); box-shadow:0 0 40px rgba(110,60,200,.28), 0 0 0 3px rgba(6,8,24,.8), 6px 6px 0 rgba(0,0,0,.45); }
.dp-head {
    display:flex; align-items:center; justify-content:space-between; flex-shrink:0;
    padding:13px 18px; border-bottom:1px solid rgba(140,175,255,.22);
}
#dreamNightPanel .dp-head { border-bottom-color:rgba(178,140,255,.3); }
.dp-head h2 {
    margin:0; font-family:'Renogare','CelesteZH','Microsoft YaHei',sans-serif;
    font-size:16px; letter-spacing:5px; color:#cfe0ff; text-shadow:0 0 12px rgba(130,180,255,.5);
}
#dreamNightPanel .dp-head h2 { color:#d9c8ff; text-shadow:0 0 12px rgba(180,130,255,.55); }
.dp-close {
    width:30px; height:30px; cursor:pointer; color:rgba(210,225,255,.8);
    background:transparent; border:1px solid rgba(150,180,255,.35); font-size:14px;
    transition:all .15s;
}
.dp-close:hover { background:rgba(120,80,220,.3); color:#fff; border-color:#cdb6ff; }
.dp-body { flex:1; min-height:0; display:flex; gap:14px; padding:14px 18px 16px; }
.dp-write { flex:1; display:flex; flex-direction:column; gap:10px; min-width:0; }
#dreamTitle, #dreamContent, #ntInput {
    width:100%; box-sizing:border-box; color:rgba(226,236,255,.88);
    background:rgba(8,10,32,.55); border:1px solid rgba(140,175,255,.28);
    font-family:'Renogare','CelesteZH','Microsoft YaHei',sans-serif; font-size:14px; line-height:1.8;
    outline:none; transition:border-color .2s, box-shadow .2s;
}
#dreamTitle { padding:9px 12px; letter-spacing:2px; }
#dreamContent { flex:1; min-height:200px; resize:none; padding:12px; }
#dreamTitle::placeholder, #dreamContent::placeholder, #ntInput::placeholder { color:rgba(170,195,235,.38); }
#dreamTitle:focus, #dreamContent:focus, #ntInput:focus {
    border-color:rgba(160,200,255,.7); box-shadow:0 0 12px rgba(100,160,255,.22);
}
.dp-actions { display:flex; justify-content:flex-end; flex-shrink:0; }
.dp-primary {
    padding:9px 20px; cursor:pointer; font-family:'Renogare','CelesteZH','Microsoft YaHei',sans-serif;
    font-size:13px; letter-spacing:3px; color:#eaf2ff;
    background:linear-gradient(180deg, rgba(70,110,220,.55), rgba(45,70,170,.65));
    border:2px solid rgba(170,200,255,.55); box-shadow:3px 3px 0 rgba(0,0,0,.5);
    transition:all .15s;
}
.dp-primary:hover { transform:translateY(-1px); box-shadow:0 0 16px rgba(120,170,255,.5), 3px 3px 0 rgba(0,0,0,.5); }
.dp-primary:disabled { opacity:.5; cursor:wait; transform:none; box-shadow:3px 3px 0 rgba(0,0,0,.5); }

/* Madeline 解梦回应卡 */

<script>
    // ===== 雪花动画（mountainSnow 原版贴图） =====
    (function () {
        const canvas = document.getElementById('shelfSnow');
        const ctx = canvas.getContext('2d');
        const flakeImg = new Image();
        flakeImg.src = 'celeste-gui/mountain-snow.png';
        let flakes = [];
        function resize() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
        function mk(randomY) {
            return {
                x: Math.random() * canvas.width,
                y: randomY ? Math.random() * canvas.height : -20,
                s: Math.random() * 10 + 5,
                speed: Math.random() * 1 + 0.4,
                wind: Math.random() * 0.4 - 0.2,
                opacity: Math.random() * 0.55 + 0.3,
                rot: Math.random() * Math.PI * 2,
                rotSpeed: (Math.random() - 0.5) * 0.02,
                swing: Math.random() * Math.PI * 2,
                swingSpeed: Math.random() * 0.02 + 0.008
            };
        }
        function init() { flakes = []; for (let i = 0; i < 50; i++) flakes.push(mk(true)); }
        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            if (flakeImg.complete && flakeImg.naturalWidth > 0) {
                for (const f of flakes) {
                    f.y += f.speed; f.swing += f.swingSpeed; f.rot += f.rotSpeed;
                    f.x += Math.sin(f.swing) * 0.5 + f.wind;
                    if (f.y > canvas.height + 20) Object.assign(f, mk(false));
                    if (f.x > canvas.width + 20) f.x = -20;
                    if (f.x < -20) f.x = canvas.width + 20;
                    ctx.save();
                    ctx.globalAlpha = f.opacity;
                    ctx.translate(f.x, f.y);
                    ctx.rotate(f.rot);
                    ctx.drawImage(flakeImg, -f.s / 2, -f.s / 2, f.s, f.s);
                    ctx.restore();
                }
            }
            requestAnimationFrame(draw);
        }
        window.addEventListener('resize', resize);
        resize(); init(); draw();
    })();

    const bgmPlayer = document.getElementById('bgmPlayer');
    // 默认 Dearest Friends（磁带选曲已删，用户无法手动切换 BGM）
    const savedTime = parseFloat(localStorage.getItem('bgmTimeShelf') || '0');
    if (savedTime > 0) bgmPlayer.currentTime = savedTime;
    bgmPlayer.volume = 0.3;
    bgmPlayer.play().catch(() => {});
    setInterval(() => { localStorage.setItem('bgmTimeShelf', bgmPlayer.currentTime); }, 2000);
    function tryPlayBGM() { bgmPlayer.play().then(() => { document.removeEventListener('click', tryPlayBGM); document.removeEventListener('keydown', tryPlayBGM); }).catch(() => {}); }
    document.addEventListener('click', tryPlayBGM);
    document.addEventListener('keydown', tryPlayBGM);

    // ===== 磁带选曲已删：进紫色空间自动切 Resurrections，回书架自动切回 Dearest Friends =====

function renderPostcardCanvas(canvas, title, dateStr, content, summary, strawCount) {
    var ctx = canvas.getContext('2d');
    var INK = '#8f4a3c';
    var INK_SOFT = 'rgba(143,74,60,.78)';
    return loadPostcardImg().then(function (img) {
        var W = 1200, H = 800;
        if (img) {
            H = Math.round(W * img.naturalHeight / img.naturalWidth);
            canvas.width = W; canvas.height = H;
            ctx.drawImage(img, 0, 0, W, H);
        } else {
            canvas.width = W; canvas.height = H;
            ctx.fillStyle = '#f2e2d5'; ctx.fillRect(0, 0, W, H);
            ctx.strokeStyle = INK_SOFT; ctx.lineWidth = 3;
            ctx.strokeRect(18, 18, W - 36, H - 36);
        }

        // ===== To: 两条横线上写标题和日期 =====
        ctx.fillStyle = INK;
        ctx.font = 'italic 30px "Renogare","CelesteZH","Microsoft YaHei",sans-serif';
        ctx.fillText((title || '无题').substring(0, 26), W * 0.14, H * 0.130);
        ctx.font = 'italic 19px "Renogare","CelesteZH","Microsoft YaHei",sans-serif';
        ctx.fillStyle = INK_SOFT;
        ctx.fillText(dateStr || '', W * 0.14, H * 0.200);

        // ===== 中间大片书写区：内容总结（【】里的字红色高亮） =====
        // 自动适配书写框：字号按字数二分试探（21→11.5px 连续取最大可容字号）；实在装不下才在框底截断补 "…"
        var RED_INK = '#c8433a';
        var FONT_STACK = '"Renogare","CelesteZH","Microsoft YaHei",sans-serif';
        var full = (content || '').substring(0, 1000);
        var segs = [], mSeg, reSeg = /【([^】]*)】/g, lastI = 0;
        while ((mSeg = reSeg.exec(full)) !== null) {
            if (mSeg.index > lastI) segs.push({ t: full.slice(lastI, mSeg.index), r: false });
            segs.push({ t: mSeg[1], r: true });
            lastI = reSeg.lastIndex;
        }
        if (lastI < full.length) segs.push({ t: full.slice(lastI), r: false });
        var lx = W * 0.07, maxX = W * 0.56, ly0 = H * 0.34, mh = H * 0.62;
        // 逐字排版走查：draw=false 仅模拟（看装不装得下），draw=true 落笔；超出书写框底即停
        function layoutSegs(list, fs, lh, draw) {
            ctx.font = fs + 'px ' + FONT_STACK;
            var ly = ly0, x = lx, fits = true, px = lx, py = ly0;
            for (var si = 0; si < list.length; si++) {
                var chars = list[si].t.split('');
                for (var ci = 0; ci < chars.length; ci++) {
                    var ch = chars[ci];
                    if (ch === '\n') { x = lx; ly += lh; continue; }
                    var cw = ctx.measureText(ch).width;
                    if (x + cw > maxX) { x = lx; ly += lh; }
                    if (ly > mh) { fits = false; si = list.length; break; }
                    px = x; py = ly;
                    if (draw) {
                        ctx.fillStyle = list[si].r ? RED_INK : INK;
                        ctx.fillText(ch, x, ly);
                    }
                    x += cw;
                }
            }
            return { fits: fits, ly: ly, x: x, px: px, py: py };
        }
        var pick = null;
        (function () {
            var lhFull = Math.round(21 * 1.71);
            if (layoutSegs(segs, 21, lhFull, false).fits) { pick = { fs: 21, lh: lhFull }; return; }   // 短文：直接用最大字号
            var lo = 11.5, hi = 21;                                                                    // lo=字号下限，hi=已知装不下
            for (var it = 0; it < 6; it++) {                                                           // 二分：按字数连续取最大可容字号
                var mid = Math.round(((lo + hi) / 2) * 4) / 4, lhMid = Math.round(mid * 1.71);
                if (layoutSegs(segs, mid, lhMid, false).fits) { pick = { fs: mid, lh: lhMid }; lo = mid; }
                else hi = mid;
            }
            if (!pick) pick = { fs: 11.5, lh: Math.round(11.5 * 1.71) };                               // 11.5px 也装不下：框底截断
        })();
        var fin = layoutSegs(segs, pick.fs, pick.lh, true);
        if (!fin.fits) {                          // 框底截断：末尾补 "…"（行宽放不下就省略）
            ctx.font = pick.fs + 'px ' + FONT_STACK;
            var ew = ctx.measureText('\u2026').width;
            if (fin.x + ew <= maxX) { ctx.fillStyle = INK; ctx.fillText('\u2026', fin.x, fin.py); }
        }
        var endLy = fin.fits ? fin.ly : (fin.py + pick.lh), endX = fin.fits ? fin.x : fin.px;
        if (endX > lx) endLy += pick.lh;

        // ===== 金句（最打动的一句）=====
        if (summary) {
            var sy2 = Math.min(endLy + 20, H * 0.74);
            ctx.strokeStyle = 'rgba(143,74,60,.35)'; ctx.lineWidth = 1;
            ctx.beginPath(); ctx.moveTo(W * 0.07, sy2 - 10); ctx.lineTo(W * 0.57, sy2 - 10); ctx.stroke();
            ctx.fillStyle = INK;
            ctx.font = 'italic 20px "Renogare","CelesteZH";'
            ctx.fillText('\u201c' + summary.substring(0, 60) + '\u201d', W * 0.08, sy2 + 22);
        }

        // ===== 落款（右下角，避开素材左下角的 Postcard~）=====
        ctx.fillStyle = INK_SOFT;
        ctx.font = 'italic 17px "Renogare","CelesteZH";'
        ctx.textAlign = 'right';
        ctx.fillText('\u00d7' + (strawCount || 0) + '  \u2014 Madeline', W * 0.92, H * 0.9);
        ctx.textAlign = 'left';
    });
}
var PC_IMG = null;
function loadPostcardImg() {
    return new Promise(function (res) {
        if (PC_IMG) return res(PC_IMG);
        var im = new Image();
        im.onload = function () { PC_IMG = im; res(im); };
        im.onerror = function () { res(null); };
        im.src = 'celeste-gui/postcard.webp';
    });
}
var PC_SOUNDS = {};
function pcPlay(name) {
    try {
        if (!PC_SOUNDS[name]) PC_SOUNDS[name] = new Audio('celeste-sounds/' + name);
        var a = PC_SOUNDS[name];
        a.currentTime = 0;
        a.volume = 0.9;
        a.play().catch(function(){});
    } catch (e) { }
}
function exportPostcard(data) {
    var modal = document.getElementById('postcardExportModal');
    if (!modal) {
        modal = document.createElement('div');
        modal.id = 'postcardExportModal';
        modal.innerHTML = '<canvas class="pe-snow" id="peSnow"></canvas>' +
            '<div class="pe-stage"><canvas id="postcardCanvas"></canvas>' +
            '<div class="pe-actions"><button id="peDownload">\u2b07 下载明信片</button><button class="pe-close" id="peClose">Keep \u2665</button></div></div>';
        document.body.appendChild(modal);
        var closePe = function() {
            pcPlay('ui_main_postcard_variants_out.wav');
            stopPeSnow();
            modal.style.transition = 'opacity .6s ease';
            modal.style.opacity = '0';
            setTimeout(function () {
                modal.classList.remove('show');
                modal.style.opacity = '';
                modal.style.transition = '';
                modal.querySelector('.pe-stage').classList.remove('slide-in');
                modal.querySelector('.pe-actions').classList.remove('show');
            }, 600);
        };
        document.getElementById('peClose').addEventListener('click', closePe);
        modal.addEventListener('click', function(e) { if (e.target === modal) closePe(); });
    }
    var canvas = document.getElementById('postcardCanvas');
    renderPostcardCanvas(canvas, data.title, data.date, data.content, data.summary, parseInt(localStorage.getItem('diarySaveCount') || '0')).then(function () {
        modal.classList.add('show');
        startPeSnow();
        setTimeout(function () { modal.querySelector('.pe-stage').classList.add('slide-in'); }, 400);
        setTimeout(function () { modal.querySelector('.pe-actions').classList.add('show'); }, 1600);
    });
    document.getElementById('peDownload').onclick = function() {
        var url = canvas.toDataURL('image/png');
        var a = document.createElement('a');
        a.download = 'mountain-diary-' + (data.date || '').replace(/\D/g, '').slice(0, 8) + '.png';
        a.href = url;
        document.body.appendChild(a); a.click(); document.body.removeChild(a);
    };
    pcPlay('ui_main_postcard_variants_in.wav');
}

// ===== 弹窗内飘雪（与每日明信片同款，精简版） =====
var peSnowRaf = null, peFlakes = [];
function startPeSnow() {
    var cv = document.getElementById('peSnow');
    if (!cv || peSnowRaf) return;
    var c = cv.getContext('2d');
    cv.width = window.innerWidth; cv.height = window.innerHeight;
    peFlakes = [];
    for (var i = 0; i < 60; i++) {
        peFlakes.push({
            x: Math.random() * cv.width, y: Math.random() * cv.height,
            r: Math.random() * 2.5 + 1, sp: Math.random() * 1.2 + 0.4,
            w: Math.random() * 0.4 - 0.2, o: Math.random() * 0.5 + 0.2,
            sw: Math.random() * Math.PI * 2, sws: Math.random() * 0.02 + 0.01
        });
    }
    function loop() {
        c.clearRect(0, 0, cv.width, cv.height);
        for (var j = 0; j < peFlakes.length; j++) {
            var f = peFlakes[j];
            f.y += f.sp; f.sw += f.sws;
            f.x += Math.sin(f.sw) * 0.5 + f.w;
            if (f.y > cv.height + 10) { f.y = -10; f.x = Math.random() * cv.width; }
            if (f.x > cv.width + 10) f.x = -10;
            if (f.x < -10) f.x = cv.width + 10;
            c.beginPath();
            c.arc(f.x, f.y, f.r, 0, Math.PI * 2);
            c.fillStyle = 'rgba(255,255,255,' + f.o + ')';
            c.fill();
        }
        peSnowRaf = requestAnimationFrame(loop);
    }
    loop();
}
function stopPeSnow() {
    if (peSnowRaf) { cancelAnimationFrame(peSnowRaf); peSnowRaf = null; }
}

(async function () {
    if (!localStorage.getItem('token')) { alert('请先登录'); location.href = 'login.html'; return; }
    const cards = document.getElementById('cards');
    const detail = document.getElementById('detail');
    let data = [], cur = null;
    function fmt(v) {
        if (!v) return '';
        const d = new Date(typeof v === 'number' || /^\d+$/.test(String(v)) ? Number(v) : v);
        if (isNaN(d.getTime())) return String(v);
        return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
    }
    const MONTHS_EN = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
    function fmtEn(v) {
        if (!v) return '';
        const d = new Date(typeof v === 'number' || /^\d+$/.test(String(v)) ? Number(v) : v);
        if (isNaN(d.getTime())) return String(v);
        return MONTHS_EN[d.getMonth()] + ' ' + d.getDate() + ', ' + d.getFullYear();
    }
    // ===== 日记翻页音效：forward = 抽出/向右，back = 向左（官方素材，变体随机） =====
    const PAGE_SFX = {
        forward: ['ui_world_journal_page_cover_forward_01.wav', 'ui_world_journal_page_cover_forward_02.wav', 'ui_world_journal_page_cover_forward_03.wav'],
        back: ['ui_world_journal_page_main_back_01.wav', 'ui_world_journal_page_main_back_02.wav', 'ui_world_journal_page_main_back_03.wav']
    };
    const PAGE_AUDIO = {};
    function playPageSfx(dir) {
        try {
            const list = PAGE_SFX[dir];
            const name = list[Math.floor(Math.random() * list.length)];
            if (!PAGE_AUDIO[name]) PAGE_AUDIO[name] = new Audio('celeste-sounds/' + name);
            const a = PAGE_AUDIO[name];
            a.currentTime = 0;
            a.volume = 0.20;
            a.play().catch(() => {});
        } catch (e) { /* 无声降级 */ }
    }
    // ===== 滚动进场：往下滑 → 新行从下方上滑入；往上翻 → 上方行从上方下滑入 =====
    const shelfIO = new IntersectionObserver(list => {
        list.forEach(en => {
            const el = en.target;
            if (en.isIntersecting) {
                el.classList.add(en.boundingClientRect.top > 0 ? 'from-below' : 'from-above');
                requestAnimationFrame(() => requestAnimationFrame(() => el.classList.add('in')));
            } else {
                el.classList.remove('in', 'from-below', 'from-above');
            }
        });
    }, { threshold: 0.08 });
    function observeShelfRows() {
        cards.querySelectorAll('.shelf-row:not(.observed)').forEach(el => {
            el.classList.add('observed');
            shelfIO.observe(el);
        });
    }
    function replayAnim(el, cls) {
        el.classList.remove('anim-up', 'anim-down');
        void el.offsetWidth;
        el.classList.add(cls);
    }
    let groups = [], curGroup = null, curIdx = 0;
    function buildGroups() {
        const map = new Map();
        for (const d of data) {
            const key = fmt(d.updateDate || d.createDate);
            if (!map.has(key)) map.set(key, []);
            map.get(key).push(d);
        }
        groups = [...map.values()].map(es => ({ date: es[0].updateDate || es[0].createDate, entries: es }));
    }
    function showList() { detail.classList.remove('show'); cards.style.display = ''; }
    function renderEntry() {
        cur = curGroup.entries[curIdx];
        detail.querySelector('.t').textContent = cur.title || '无题';
        detail.querySelector('.d').textContent = fmtEn(cur.updateDate || cur.createDate);
        detail.querySelector('.c').textContent = cur.content || '';
        detail.querySelector('.pos').textContent = (curIdx + 1) + ' / ' + curGroup.entries.length;
        detail.querySelector('.prev-e').disabled = curIdx === 0;
        detail.querySelector('.next-e').disabled = curIdx === curGroup.entries.length - 1;
    }
    function showDetail(i) {
        curGroup = groups[i]; if (!curGroup) return;
        curIdx = 0;
        cards.style.display = 'none';
        renderEntry();
        detail.classList.add('show');
        replayAnim(detail, 'anim-up');
    }
    detail.querySelector('.prev-e').addEventListener('click', () => { if (curIdx > 0) { playPageSfx('back'); curIdx--; renderEntry(); replayAnim(detail, 'anim-down'); } });
    detail.querySelector('.next-e').addEventListener('click', () => { if (curGroup && curIdx < curGroup.entries.length - 1) { playPageSfx('forward'); curIdx++; renderEntry(); replayAnim(detail, 'anim-up'); } });
    document.addEventListener('keydown', e => {
        if (!detail.classList.contains('show')) return;
        if (e.key === 'ArrowLeft') detail.querySelector('.prev-e').click();
        if (e.key === 'ArrowRight') detail.querySelector('.next-e').click();
    });
    async function load() {
        cards.innerHTML = '<div class="empty"><span class="em">📖</span>正在搬书……</div>';
        const res = await api('/diary/list?type=day', 'GET');
        if (res.success && Array.isArray(res.data)) {
            data = res.data;
            if (window.__setDoorProgress) window.__setDoorProgress(data.length);
            if (!data.length) { cards.innerHTML = '<div class="empty"><span class="em">🗻</span>书架还空着。<br>写下第一篇，它就有了位置。</div>'; return; }
            buildGroups();
            cards.innerHTML = groups.map((g, i) => {
                const first = g.entries[0];
                const title = (first.title && first.title.trim()) ? first.title.trim()
                    : (g.entries.length > 1 ? g.entries.length + ' 篇日记' : '无题');
                const snip = String(first.content || '').replace(/\s+/g, ' ').trim().slice(0, 48);
                const cnt = g.entries.length > 1 ? '<span class="row-count">×' + g.entries.length + '</span>' : '';
                return '<div class="shelf-row" data-i="' + i + '">' +
                    '<img class="row-icon" src="namespace/cassette.png" alt="" loading="lazy" decoding="async">' +
                    '<div class="row-main"><div class="row-title">' + escHtml(title) + '</div>' +
                    (snip ? '<div class="row-snip">' + escHtml(snip) + '</div>' : '') + '</div>' +
                    '<div class="row-date">' + fmtEn(g.date) + cnt + '</div>' +
                    '</div>';
            }).join('');
        } else {
            cards.innerHTML = '<div class="empty"><span class="em">🌫️</span>书架暂时打不开（' + escHtml(res.msg || '未知错误') + '）</div>';
        }
        observeShelfRows();
    }
    cards.addEventListener('click', ev => {
        const c = ev.target.closest('.shelf-row');
        if (!c || c.classList.contains('snapshot')) return;
        // 点开往期日记：磁带预览音效（每周/每月快照明信片走各自的 variants 音效，不在此列）
        pcPlay('cassette_preview_intro.wav'); showDetail(+c.dataset.i);
    });

    detail.querySelector('.back').addEventListener('click', showList);

    detail.querySelector('.export-postcard').addEventListener('click', () => {
        if (!cur) return;
        exportPostcard({ title: cur.title, date: fmt(cur.updateDate || cur.createDate), content: cur.content, summary: '' });
    });

    detail.querySelector('.edit').addEventListener('click', () => {
        if (cur) location.href = 'diary.html?edit=' + encodeURIComponent(cur.id);
    });
    detail.querySelector('.del').addEventListener('click', async () => {
        if (!cur) return;
        if (!confirm('确定要删掉这篇日记吗？删了就找不回来了。')) return;
        const res = await api('/diary?diaryId=' + encodeURIComponent(cur.id), 'DELETE');
        if (res.success) { showToast('这一页合上了'); showList(); load(); }
        else showToast(res.msg || '删除失败');
    });
    await load();

    // ================================================================
    // ===== 快照：一段时间后，Madeline 把这段日子做成一张明信片 =====
    // 书架上悬停自己翻书，点开是明信片（variants 音效）
    // ================================================================
    (function () {
        const EMOTION_DICT = {
            '开心': ['开心', '高兴', '快乐', '哈哈', '太棒', '喜欢', '幸福', '笑', '兴奋', '顺利'],
            '悲伤': ['难过', '伤心', '哭', '失落', '遗憾', '心痛', '委屈', '崩溃'],
            '孤独': ['孤独', '一个人', '寂寞', '没人', '想念', '空荡'],
            '不安': ['焦虑', '紧张', '担心', '害怕', '不安', '慌', '压力', '失眠'],
            '愤怒': ['生气', '愤怒', '烦躁', '讨厌', '气死', '火大'],
            '满足': ['满足', '踏实', '安心', '平静', '值得', '感恩', '治愈'],
            '希望': ['期待', '希望', '明天', '以后', '加油', '计划', '梦想'],
            '惊讶': ['没想到', '居然', '竟然', '惊', '突然', '万万']
        };
        function countEmotion(texts) {
            const scores = {};
            for (const t of texts) {
                for (const emo in EMOTION_DICT) {
                    for (const kw of EMOTION_DICT[emo]) {
                        const m = t.split(kw).length - 1;
                        if (m > 0) scores[emo] = (scores[emo] || 0) + m;
                    }
                }
            }
            let best = null, max = 0;
            for (const emo in scores) { if (scores[emo] > max) { max = scores[emo]; best = emo; } }
            return best || '平静';
        }
        function extractQuote(entries) {
            const sents = [];
            for (const e of entries) {
                const parts = String(e.content || '').split(/(?<=[。！？!?])|[\n]/);
                for (const p of parts) {
                    const s = p.trim();
                    if (s.length >= 6 && s.length <= 46) sents.push(s);
                }
            }
            if (!sents.length) return '这段日子字还不多，但每一页都算数。';
            let best = sents[0], bestScore = -1;
            for (const s of sents) {
                let score = 0;
                for (const emo in EMOTION_DICT) {
                    if (EMOTION_DICT[emo].some(kw => s.indexOf(kw) !== -1)) score += 2;
                }
                score += Math.min(s.length, 30) / 15;
                score += Math.random();
                if (score > bestScore) { bestScore = score; best = s; }
            }
            return best;
        }
        function getSnaps() {
            try {
                const arr = JSON.parse(localStorage.getItem('diarySnapshots') || '[]');
                return arr.map(s => {
                    if (s.type === 'week') s.label = 'Weekly Recap';
                    else if (s.type === 'month') s.label = 'Monthly Recap';
                    return s;
                });
            } catch (e) { return []; }
        }
        function setSnaps(s) { localStorage.setItem('diarySnapshots', JSON.stringify(s)); }

        // ===== 聚合每篇日记落库的情绪数据（保存时后端 AI 已分析好） =====
        function aggregateStoredEmotions(list) {
            const emoSum = {};
            const intensities = [];
            const events = [];
            const concerns = [];
            let analyzed = 0;
            for (const d of list) {
                if (!d.emotionDetail) continue;
                let det;
                try { det = JSON.parse(d.emotionDetail); } catch (e) { continue; }
                analyzed++;
                (det.emotions || []).forEach(e => {
                    emoSum[e.name] = (emoSum[e.name] || 0) + (e.percent || 0);
                });
                if (det.intensity) intensities.push(det.intensity);
                (det.events || []).forEach(ev => { if (events.indexOf(ev) === -1) events.push(ev); });
                if (det.concern && concerns.indexOf(det.concern) === -1) concerns.push(det.concern);
            }
            if (!analyzed) return null;
            const emotions = Object.entries(emoSum)
                .map(([name, sum]) => ({ name: name, percent: Math.round(sum / analyzed) }))
                .sort((a, b) => b.percent - a.percent)
                .slice(0, 4);
            return {
                topEmotion: emotions[0] ? emotions[0].name : null,
                emotions: emotions,
                intensity: intensities.length ? Math.round(intensities.reduce((a, b) => a + b, 0) / intensities.length) : null,
                keySentence: '',
                events: events.slice(0, 5),
                concerns: concerns.slice(0, 3)
            };
        }

        function emotionSummaryText(agg) {
            if (!agg || !agg.emotions || !agg.emotions.length) return '';
            let t = '主要情绪：' + agg.emotions.map(e => e.name + ' ' + e.percent + '%').join('、');
            if (agg.intensity) t += '；平均强度 ' + agg.intensity + '/5';
            if (agg.events && agg.events.length) t += '；期间的事：' + agg.events.join('、');
            if (agg.concerns && agg.concerns.length) t += '；挂心的事：' + agg.concerns.join('、');
            return t;
        }

        // ===== 检查是否到了生成快照的时候 =====
        async function maybeGenerate() {
            const now = Date.now();
            const snaps = getSnaps();
            const inRange = (days) => data.filter(d => {
                const t = new Date(d.updateDate || d.createDate).getTime();
                return !isNaN(t) && now - t <= days * 86400000;
            });
            const hasType = (type, fromT) => snaps.some(s => s.type === type && s.createdAt >= fromT);
            const created = [];

            const week = inRange(7);
            if (week.length >= 3 && !hasType('week', now - 7 * 86400000)) {
                created.push(await buildSnap('week', week, 'Weekly Recap'));
            }
            const month = inRange(30);
            if (month.length >= 8 && !hasType('month', now - 30 * 86400000)) {
                created.push(await buildSnap('month', month, 'Monthly Recap'));
            }
            if (created.length) {
                setSnaps(created.concat(snaps));
                renderSnapCards();
                pcPlay('ui_main_postcard_variants_in.wav');
                showToast(created.length > 1 ? '两张新快照明信片收进书架了' : '一张新的快照明信片收进书架了');
            }
            async function buildSnap(type, list, label) {
                const times = list.map(d => new Date(d.updateDate || d.createDate).getTime()).sort((a, b) => a - b);
                const joined = list.map(d => d.content || '').join('\n');
                let reflect = '';
                let emotionData = aggregateStoredEmotions(list);
                if (!emotionData) {
                    try {
                        const res = await api('/diary/emotion-analyze', 'POST', { content: joined.slice(0, 1500) });
                        if (res.success && res.data) emotionData = res.data;
                    } catch (e) {}
                }
                try {
                    const res = await api('/diary/snap-reflect', 'POST', { content: joined.slice(0, 1200), emotion: emotionSummaryText(emotionData) });
                    if (res.success && res.data && res.data.message) reflect = res.data.message;
                } catch (e) {}
                return {
                    id: type + '-' + now,
                    type: type,
                    label: label,
                    from: fmt(times[0]),
                    to: fmt(times[times.length - 1]),
                    count: list.length,
                    topEmotion: emotionData ? emotionData.topEmotion : countEmotion(list.map(d => d.content || '')),
                    emotions: emotionData ? (emotionData.emotions || []) : [],
                    intensity: emotionData ? emotionData.intensity : null,
                    keySentence: emotionData ? (emotionData.keySentence || '') : '',
                    events: emotionData ? (emotionData.events || []) : [],
                    concerns: emotionData ? (emotionData.concerns || []) : [],
                    quote: extractQuote(list),
                    reflect: reflect,
                    createdAt: now
                };
            }
        }

        // ===== 书架上的快照卡 =====
        function snapCardHtml(s) {
            return '<div class="shelf-row snapshot" data-snap="' + s.id + '">' +
                '<img class="row-icon" src="namespace/remix.png" alt="" loading="lazy" decoding="async">' +
                '<div class="row-main"><div class="row-title">' + escHtml(s.label) + '</div>' +
                '<div class="row-snip">共 ' + s.count + ' 篇 · ' + fmt(s.from) + ' ~ ' + fmt(s.to) + '</div></div>' +
                '<div class="row-date">' + fmt(s.createdAt) + '</div>' +
                '</div>';
        }
        function renderSnapCards() {
            cards.querySelectorAll('.shelf-row.snapshot').forEach(el => el.remove());
            const snaps = getSnaps();
            if (!snaps.length) return;
            cards.insertAdjacentHTML('afterbegin', snaps.map(snapCardHtml).join(''));
            observeShelfRows();
        }


        // ===== 点击：做成明信片，内容总结写在上面（variants 音效） =====
        function openSnapPostcard(s) {
            const body = s.reflect || ('这段日子，你写下了 ' + s.count + ' 篇日记。');
            let emotionLine = '';
            if (s.emotions && s.emotions.length) {
                emotionLine = '\n\n这段日子的情绪：' + s.emotions.map(e => e.name + ' ' + e.percent + '%').join(' · ');
                if (s.intensity) emotionLine += '（强烈程度 ' + s.intensity + '/5）';
            } else if (s.topEmotion) {
                emotionLine = '\n\n你最近常常感到【' + s.topEmotion + '】。';
            }
            if (s.events && s.events.length) emotionLine += '\n这些日子：' + s.events.slice(0, 4).join('、');
            if (s.concerns && s.concerns.length) emotionLine += '\n你心里挂念着：' + s.concerns.join('、');
            if (s.keySentence) emotionLine += '\n「' + s.keySentence + '」';
            exportPostcard({
                title: s.label + ' · 共 ' + s.count + ' 篇',
                date: fmt(s.createdAt),
                content: body + emotionLine,
                summary: s.quote
            });
        }
        cards.addEventListener('click', ev => {
            const c = ev.target.closest('.shelf-row.snapshot');
            if (!c) return;
            const s = getSnaps().find(x => x.id === c.dataset.snap);
            if (s) openSnapPostcard(s);
        });

        // ===== 入场：先渲染已有快照，再检查要不要生成新的 =====
        renderSnapCards();
        setTimeout(maybeGenerate, 800);
    })();
})();

    // ===== 篝火渲染（原版 campfire 逐帧动画） =====
    (function () {
        const TROPHIES = {
            goldberry: 'celeste-collectables/goldberry/idle00.png',
            cassette: 'celeste-collectables/cassette/idle00.png',
            heartgem: 'celeste-collectables/heartgem/0/spin00.png',
            moonberry: 'celeste-collectables/moonberry/normal00.png'
        };
        let owned = [];
        try { owned = JSON.parse(localStorage.getItem('berryOwned') || '[]'); } catch (e) {}
        const trophy = document.getElementById('berryTrophy');
        owned.forEach(id => {
            if (!TROPHIES[id]) return;
            const im = document.createElement('img');
            im.src = TROPHIES[id]; im.title = id; im.dataset.id = id;
            trophy.appendChild(im);
        });
        if (trophy.children.length) trophy.classList.remove('empty');
        function mkTrophyFrames(prefix, n) { const a = []; for (let i = 0; i < n; i++) a.push(prefix + String(i).padStart(2, '0') + '.png'); return a; }

        var TRANS = {
            lookUp:    [['spin', .6], ['sleep', .2], ['roll', .2]],
            sleep:     [['lookUp', .5], ['spin', .3], ['roll', .2]],
            roll:      [['rollGetUp', 1]],
            rollGetUp: [['lookUp', .7], ['spin', .3]],
            spin:      [['lookUp', .5], ['roll', .3], ['sleep', .2]]
        };

        var timer = null, roaming = false, inDialog = false, summonedMode = false;

        // 5 gif 预加载（进 IIFE 时一次性加载，切换无网络延迟）
        Object.keys(ACTIONS).forEach(function (k) { var im = new Image(); im.src = DIR + ACTIONS[k].gif; });

        function place(nx, ny, fx) {
            x = nx; y = ny; face = fx;
            wrap.style.left = x + '%';
            wrap.style.top = y + '%';
            wrap.style.transform = 'translate(-50%, -50%) scaleX(' + face + ')';

        function setState(name) {

            img.src = DIR + a.gif;
            if (a.move) {
                // 移动类动作：选目标点（spin 远 / rollGetUp 近）
                var range = name === 'spin' ? { x: 80, y: 60 } : { x: 25, y: 15 };
                var nx = Math.max(8, Math.min(92, x + (Math.random() * 2 - 1) * range.x));
                var ny = Math.max(18, Math.min(78, y + (Math.random() * 2 - 1) * range.y));

                wrap.style.transform = 'translate(-50%, -50%) scaleX(' + (Math.random() < .5 ? -1 : 1) + ')';

            timer = setTimeout(next, d);

            if (inDialog || !roaming) return;
            var opts = TRANS[cur] || TRANS.lookUp;

        function playSeq(list, ms, loop) {

            timer = setInterval(function () {
                dsFire.src = list[idx];
                idx++;

        // —— 像素场景绘制：低分辨率 canvas 台阶轮廓 → dataURL，CSS pixelated 拉伸 ——
        // LCG 确定性伪随机：每次进入场景轮廓完全一致
        function lcg(seed) {
            var v = seed;
            return function () {
                v = (v * 1103515245 + 12345) % 2147483648;
                return v / 2147483648;
            };
        }
        function mkRidge(n, base, amp, seed, runMax) {
            var r = lcg(seed), a = [], v = base;
            // 台阶随机游走：相邻列高度接近 + 分块平台化，轮廓连贯（山脊/雪台），不是梳齿
            while (a.length < n) {
                v = Math.max(2, Math.min(base + amp, v + (r() * 2 - 1) * amp * 0.45));
                var run = 2 + ((r() * (runMax || 6)) | 0);
                for (var j = 0; j < run && a.length < n; j++) a.push(v | 0);
            }
            return a;
        }
        // 极光垂幕 v6：连片大幕 —— 宽褶皱段 + 窄暗缝 + 段底块状锯齿 + 段内细竖纹（参照实机大幕布）
        function mkFolds(n, seed, depthBase, depthAmp) {
            var r = lcg(seed), bots = [], tones = [];
            var x = 0, base = depthBase;
            while (x < n) {
                var gap = 2 + ((r() * 3) | 0);                          // 窄暗缝：褶皱间折痕
                for (var i = 0; i < gap && x < n; i++) { bots.push(0); tones.push(0); x++; }
                base = Math.max(depthBase - depthAmp, Math.min(depthBase + depthAmp, base + (r() * 2 - 1) * depthAmp * 0.5));
                var fd = Math.max(24, Math.min(54, (base + (r() * 2 - 1) * 4) | 0));
                var fw = 14 + ((r() * 17) | 0);                         // 褶皱段宽
                var tone = 1 + ((r() * 2) | 0);                         // 段基准明暗
                for (var i2 = 0; i2 < fw && x < n; i2++) {
                    var d = fd;
                    if (i2 < 2 || i2 >= fw - 2) d -= 3 + ((r() * 3) | 0);   // 段端收短（褶皱间 V 形谷）
                    else if (i2 % 5 === 0) d -= 2;                          // 段底块状锯齿台阶
                    bots.push(Math.max(10, d));
                    tones.push((r() < 0.15) ? 0 : tone);                // 段内偶发暗纹（细竖纹）
                    x++;
                }
            }
            return { bots: bots, tones: tones };
        }
        // 褶皱幕填充：bots[x]=0 为缝隙透明；底缘 4px 流苏逐级提亮（幕布下垂亮边）
        function pixCurtain(w, h, bots, tones, P) {
            var cv = document.createElement('canvas');
            cv.width = w; cv.height = h;
            var g = cv.getContext('2d');
            for (var x = 0; x < w; x++) {
                var b = bots[x % bots.length] | 0;
                if (b <= 0) continue;
                var t = tones[x % tones.length] | 0;
                g.fillStyle = P[t];
                g.fillRect(x, 0, 1, Math.max(1, b - 4));
                g.fillStyle = P[t + 1];
                g.fillRect(x, Math.max(0, b - 4), 1, 3);
                g.fillStyle = P[t + 2];
                g.fillRect(x, b - 1, 1, 1);
            }
            return cv.toDataURL();
        }
        // 按列填充台阶轮廓：heights 为每列高度，colFn 返回该列颜色
        function pixCols(w, h, heights, colFn) {
            var cv = document.createElement('canvas');
            cv.width = w; cv.height = h;
            var g = cv.getContext('2d');
            for (var x = 0; x < w; x++) {
                var hh = heights[x % heights.length] | 0;
                if (hh <= 0) continue;
                g.fillStyle = colFn(x, hh);
                g.fillRect(x, h - hh, 1, hh);
            }
            return cv.toDataURL();
        }
        function setBg(sel, url) {
            var el = scene.querySelector(sel);
            if (el) el.style.backgroundImage = 'url("' + url + '")';
        }
        // 极光改为截图素材层（celeste-gui/dream/aurora.png，见 CSS .ds-aurora.a1），不再生成像素幕布
        // 远山两层剪影（far 层 CSS 隐藏：截图极光层已含山脊；near 深紫作雪台后景）
        setBg('.ds-mtn.far', pixCols(160, 40, mkRidge(160, 10, 26, 5, 14), function () { return '#2a2060' }));
        setBg('.ds-mtn.near', pixCols(160, 40, mkRidge(160, 6, 22, 77, 12), function () { return '#170e38'; }));
        // 雪台：暗紫岩层 + 紫晶簇 + 白雪台面垂雪圆缘（参照实机长雪台）
        (function () {
            var w = 160, h = 40, cv = document.createElement('canvas');
            cv.width = w; cv.height = h;
            var g = cv.getContext('2d');
            g.fillStyle = '#6a3fa8'; g.fillRect(0, 12, w, 8);      // 岩层三段（上亮下暗，雪缘下亮紫近实机）
            g.fillStyle = '#432578'; g.fillRect(0, 20, w, 9);
            g.fillStyle = '#20113e'; g.fillRect(0, 29, w, 11);
            var rr = lcg(57);
            for (var c = 0; c < 16; c++) {                          // 岩面紫晶簇
                var cx = (rr() * w) | 0, cy = 13 + ((rr() * 16) | 0), s = 1 + ((rr() * 3) | 0);

                g.fillRect(cx, cy, s, s + 1);
                g.fillStyle = '#efc9ff';
                g.fillRect(cx, cy, 1, 1);
            }
            var r = lcg(31);
            for (var x = 0; x < w; x++) {                           // 雪柱：顶微起伏 + 底部垂雪
                var top = (r() * 3) | 0;
                var drip = 2 + ((r() * 5) | 0) + ((r() < 0.2) ? 3 : 0);
                g.fillStyle = (x % 5 < 2) ? '#ffffff' : '#eef0ff';

        })();
        // 两侧晶岩柱：块状叠岩（石板错台堆叠，外缘贴屏幕边、内缘台阶）+ 斑驳紫晶 + 板顶积雪
        (function () {

                cv.width = w; cv.height = h;
                var g = cv.getContext('2d'), r = lcg(seed);

                while (y > 0) {

                    g.fillStyle = '#b87ae8';                        // 亮斑
                    for (var k2 = 0; k2 < cw / 2; k2++) g.fillRect(x0 + ((r() * cw) | 0), y0 + ((r() * (y - y0)) | 0), 1, 1 + ((r() * 2) | 0));
                    g.fillStyle = '#c9a0ee'; g.fillRect(x0, y0, cw, 1);     // 板顶亮棱

                    y -= slab;

            clearInterval(replyTimer);

                { dreamId: ntDreamId, message: v, history: JSON.stringify(ntHist.slice(-10)) }, 20000)
                .then(function (res) {

                        ntHist.push({ role: 'assistant', content: res.data.message });
