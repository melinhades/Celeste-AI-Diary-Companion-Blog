<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="icon/OIP.webp" type="image/webp">
    <title>消息 · Celeste Blog</title>
    <link rel="stylesheet" href="css/common.css?v=20261003f">
    <link rel="stylesheet" href="css/messages.css?v=20261015a">
</head>
<body>
    <div class="bg-aurora" aria-hidden="true"><span></span><span></span><span></span></div>
    <canvas id="snowCanvas" style="position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:1;"></canvas>

    <header class="header">
        <div class="container header-inner">
            <a href="index.html" class="logo"><img src="celeste-gui/logo.webp" alt="Celeste" loading="lazy" decoding="async"></a>
            <nav class="nav">
                <a href="index.html" class="nav-link">Home</a>
                <a href="archives.html" class="nav-link">Archives</a>
                <a href="diary.html" class="nav-link nav-diary-btn" title="Diary with Madeline">
                    <img src="celeste-gui/journal.png" alt="Diary" loading="lazy" decoding="async">
                </a>
                <a href="shop.html" class="nav-link nav-diary-btn" title="Celeste Resort · Oshiro">
                    <img src="Atlases/Gui/menu/play.png" alt="Shop" loading="lazy" decoding="async">
                </a>
                <a href="roundtable.html" class="nav-link nav-chair" title="AI 圆桌会议">🪑</a>
            </nav>
            <div class="header-right" id="headerRight"></div>
        </div>
    </header>

    <div id="chatContainer">
        <div class="chat-login-tip" v-if="!loggedIn">
            请先<a href="login.html" style="color:#ffe36d">登录</a>，才能进入实时聊天。
        </div>
        <div class="chat-wrap" v-else>
            <div class="msg-layout">
                <aside class="msg-side">
                    <div class="msg-side-title">消息</div>
                    <div class="msg-side-item" :class="{active: pane === 'chat'}" @click="pane = 'chat'"><span class="rail-ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 18.5l6.2-9.5 3.3 5.2 2.3-3.2L21 18.5z"/><circle cx="16.4" cy="6" r="1.1" fill="currentColor" stroke="none"/></svg></span>山间聊天</div>
                    <div class="msg-side-item" :class="{active: pane === 'notify'}" @click="pane = 'notify'"><span class="rail-ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8a6 6 0 10-12 0c0 7-3 8.5-3 8.5h18S18 15 18 8z"/><path d="M13.7 20a2 2 0 01-3.4 0"/></svg></span>notify<span class="side-badge" v-if="unread > 0">{{ badgeText }}</span></div>
                </aside>
                <div class="msg-main">
                    <div id="chatPane" v-show="pane === 'chat'">
                        <div class="chat-head">
                            <div class="head-id">
                                <div class="group-av"><svg viewBox="0 0 24 24" fill="none" stroke="#8fc4ff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 18.5l6.2-9.5 3.3 5.2 2.3-3.2L21 18.5z"/><circle cx="16.4" cy="6" r="1.1" fill="#fff3a3" stroke="none"/></svg></div>
                                <div class="chat-title">山间聊天</div>
                            </div>
                            <div class="chat-status" :class="statusState"><span class="dot"></span><span>{{ statusText }}</span></div>
                        </div>
                        <div id="chatLog">
                            <div v-if="logStatus === 'loading'" class="chat-empty">正在拉取聊天记录…</div>
                            <div v-else-if="logStatus === 'empty'" class="chat-empty">还没有人说话，发第一条消息试试～</div>
                            <div v-else-if="logStatus === 'error'" class="chat-empty">历史记录加载失败。</div>
                            <template v-else>
                                <template v-for="it in items" :key="it.key">
                                    <div v-if="it.t === 'time'" class="chat-time"><span>{{ it.label }}</span></div>
                                    <div v-else-if="it.t === 'sys'" class="chat-sys">{{ it.text }}</div>
                                    <div v-else-if="it.t === 'msg'" class="chat-msg" :class="it.mine ? 'me' : 'other'" :data-key="it.ik">
                                        <template v-if="it.mine">
                                            <div class="body">
                                                <div v-if="!it.chain" class="nm">{{ it.name }}</div>
                                                <div class="bubble" :title="it.title" v-html="it.html"></div>
                                            </div>
                                            <div v-if="it.chain" class="av placeholder"></div>
                                            <div v-else class="av" :style="{background: 'hsl(' + it.hue + ' 52% 55%)'}">{{ it.initial }}</div>
                                        </template>
                                        <template v-else>
                                            <div v-if="it.chain" class="av placeholder"></div>
                                            <div v-else-if="it.isBird" class="av bird"><img src="Atlases/WaveDashing/Bird%20Clip%20Art.png" alt="bird"></div>
                                            <div v-else class="av" :style="{background: 'hsl(' + it.hue + ' 52% 55%)'}">{{ it.initial }}</div>
                                            <div class="body">
                                                <div v-if="!it.chain" class="nm">{{ it.name }}</div>
                                                <div class="bubble" :title="it.title" v-html="it.html"></div>
                                            </div>
                                        </template>
                                    </div>
                                </template>
                                <div v-if="typingName" class="chat-msg other typing-row">
                                    <div class="av placeholder"></div>
                                    <div class="body"><div class="nm typing-name">{{ typingName }} 正在输入</div>
                                    <div class="bubble typing-bubble"><i></i><i></i><i></i></div></div>
                                </div>
                            </template>
                        </div>
                        <div class="chat-input-row" id="chatInputRow" v-show="pane === 'chat'">
                            <div class="emoji-wrap">
                                <button type="button" id="emojiBtn" class="emoji-btn" title="插入表情" aria-label="插入表情" @click.stop="emojiOpen = !emojiOpen">
                                    <img src="Atlases/Portraits/madeline/peaceful00.png" alt="表情" decoding="async">
                                </button>
                                <div id="emojiPanel" class="emoji-panel" :class="{open: emojiOpen}" @click.stop>
                                    <div class="emoji-tabs">
                                        <button type="button" class="emoji-tab" v-for="s in seriesList" :key="s.key"
                                            :class="{active: emojiSeries === s.key}" @click="emojiSeries = s.key">{{ s.label }}</button>
                                    </div>
                                    <div class="emoji-grid" id="emojiGrid">
                                        <button type="button" class="emoji-cell" v-for="e in currentEmojis" :key="e.n"
                                            :title="e.n" @click="insertEmoji(e.mark)">
                                            <img loading="lazy" :src="e.src" :alt="e.n" :data-series="emojiSeries" :data-emo="e.n" decoding="async">
                                        </button>
                                    </div>
                                </div>
                            </div>
                            <input type="text" id="chatInput" maxlength="500" placeholder="说点什么…（Enter 发送）" autocomplete="off"
                                v-model="draft" @keydown="onInputKey" @input="onTypeInput">
                            <button id="chatSend" title="发送" aria-label="发送" :disabled="sending" @click="doSend">↑</button>
                        </div>
                    </div>
                    <div id="notifyPane" v-show="pane === 'notify'">
                        <div class="chat-head">
                            <div class="head-id">
                                <div class="bell-av"><svg viewBox="0 0 24 24" fill="none" stroke="#ff9dbb" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8a6 6 0 10-12 0c0 7-3 8.5-3 8.5h18S18 15 18 8z"/><path d="M13.7 20a2 2 0 01-3.4 0"/></svg></div>
                                <div class="chat-title">notify</div>
                            </div>
                            <div class="chat-status online"><span class="dot"></span><span>点赞 / 评论通知</span></div>
                        </div>
                        <div id="notifList">
                            <div v-if="notifStatus === 'loading'" class="chat-empty">正在拉取通知…</div>
                            <div v-else-if="notifStatus === 'empty'" class="chat-empty">还没有通知，去写篇文章试试～</div>
                            <div v-else-if="notifStatus === 'error'" class="chat-empty">通知加载失败。</div>
                            <template v-else>
                                <div v-for="n in notifItems" :key="n.key" class="notif-item"
                                    :class="{unread: n.unread}" @click="openArticle(n.id)">
                                    <div class="av" :style="{background: 'hsl(' + n.hue + ' 52% 55%)'}">{{ n.initial }}</div>
                                    <div class="tx"><b>{{ n.name }}</b> {{ n.act }}<span class="ttl">《{{ n.title }}》</span></div>
                                    <div class="tm">{{ n.tm }}</div>
                                    <div v-if="n.unread" class="un"></div>
                                </div>
                            </template>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

<script src="js/api.js?v=20261002"></script>
<script src="js/auth.js?v=20261003b"></script>
<script src="js/felt-piano.js?v=20261003"></script>
<script src="js/vue.global.prod.js?v=20261008a"></script>
<script src="js/messages.js?v=20261015a"></script>
<script src="js/seed.js?v=20261028b"></script>
</body>
</html>
