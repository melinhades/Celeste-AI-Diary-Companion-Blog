<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="icon/OIP.webp" type="image/webp">
    <title>消息 · Celeste Blog</title>
    <link rel="stylesheet" href="css/common.css">
    <style>
    /* ============================================================
       Midnight Summit —— Instagram 风格消息中心
       午夜雪山 + 极光光晕 + 玻璃层；冰川蓝为单一强调色
       ============================================================ */
    :root {
        --ink: #f2f6ff;
        --ink-2: rgba(226,235,255,.58);
        --ink-3: rgba(226,235,255,.38);
        --glass: rgba(255,255,255,.055);
        --glass-2: rgba(255,255,255,.09);
        --line: rgba(255,255,255,.09);
        --line-2: rgba(140,190,255,.28);
        --ice: #3aa0ff;
        --ice-deep: #1677e5;
        --ice-glow: rgba(64,164,255,.4);
        --mint: #5eead4;
        --rose: #ff5d8f;
        --green: #46d686;
        --font: 'Renogare','CelesteZH','PingFang SC','Microsoft YaHei',-apple-system,sans-serif;
        --font-en: 'Renogare',var(--font);
    }
    html { background: #070b16; }
    body {
        background: #070b16;
        color: var(--ink);
        font-family: var(--font);
        overflow-x: hidden;
    }
    ::selection { background: rgba(64,164,255,.35); }

    /* 导航图标按钮（与 index 一致：日记本 / 播放键） */
    .nav-diary-btn { display:inline-block; cursor:pointer; vertical-align:middle; transition:transform .2s, filter .2s; }
    .nav-diary-btn:hover { transform:scale(1.15); }
    .nav-diary-btn img { height:36px; width:auto; display:block; filter:drop-shadow(0 0 10px rgba(255,235,59,.7)); }

    /* 雪山实景层（素材底部自带白条，下移遮掉） */
    body::after {
        content:''; position:fixed; left:0; right:0; top:0; bottom:-12%;
        background:url('celeste-areas/ForsakenCity01.webp') center/cover no-repeat;
        opacity:.46; pointer-events:none; z-index:0;
    }
    /* 极光光晕层 */
    .bg-aurora { position:fixed; inset:0; z-index:0; pointer-events:none; filter:blur(80px); }
    .bg-aurora span { position:absolute; border-radius:50%; }
    .bg-aurora span:nth-child(1) {
        width:520px; height:520px; left:-14%; top:-16%;
        background:radial-gradient(circle, rgba(94,234,212,.16), transparent 68%);
    }
    .bg-aurora span:nth-child(2) {
        width:600px; height:600px; right:-16%; top:6%;
        background:radial-gradient(circle, rgba(86,132,255,.20), transparent 68%);
    }
    .bg-aurora span:nth-child(3) {
        width:640px; height:560px; left:24%; bottom:-30%;
        background:radial-gradient(circle, rgba(244,114,182,.09), transparent 70%);
    }
    /* 可读性 scrim：上下压暗 */
    #chatContainer::before {
        content:''; position:fixed; inset:0; z-index:1; pointer-events:none;
        background:
            linear-gradient(180deg, rgba(7,11,22,.52) 0%, rgba(7,11,22,.16) 22%, rgba(7,11,22,.22) 62%, rgba(7,11,22,.64) 100%);
    }

    /* ===== 主布局：左 rail / 右内容 ===== */
    .chat-wrap { position:relative; z-index:3; max-width:960px; margin:0 auto; padding:8px 20px 40px; }
    .msg-layout { display:flex; gap:22px; align-items:flex-start; }
    .msg-main { flex:1; min-width:0; }

    /* ===== 左侧 rail ===== */
    .msg-side {
        width:250px; flex-shrink:0; position:sticky; top:112px;
        background:var(--glass); border:1px solid var(--line);
        border-radius:20px; padding:10px;
        backdrop-filter:blur(18px) saturate(1.2); -webkit-backdrop-filter:blur(18px) saturate(1.2);
        box-shadow:0 18px 50px rgba(0,0,0,.35);
        animation:riseIn .6s cubic-bezier(.2,.8,.25,1) both;
    }
    .msg-side-title {
        font-family:var(--font-en); font-size:10px; letter-spacing:3px;
        color:var(--ink-3); padding:10px 12px 10px;
    }
    .msg-side-item {
        position:relative; display:flex; align-items:center; gap:11px;
        padding:9px 12px; border-radius:14px; margin-top:2px;
        font-size:14px; color:var(--ink-2); cursor:pointer; user-select:none;
        transition:background .2s, color .2s, transform .2s;
    }
    .msg-side-item:hover { background:var(--glass-2); color:var(--ink); transform:translateX(2px); }
    .msg-side-item.active { background:rgba(64,164,255,.14); color:#fff; }
    .msg-side-item.active::before {
        content:''; position:absolute; left:-10px; top:50%; translate:0 -50%;
        width:3px; height:22px; border-radius:3px;
        background:linear-gradient(180deg,#6fc3ff,#1f87e8);
        box-shadow:0 0 10px var(--ice-glow);
    }
    .rail-ic {
        width:40px; height:40px; border-radius:50%; flex-shrink:0;
        display:flex; align-items:center; justify-content:center;
        background:var(--glass-2); border:1px solid var(--line);
    }
    .rail-ic svg { width:19px; height:19px; }
    #sideChat.active .rail-ic {
        background:linear-gradient(135deg,rgba(94,234,212,.25),rgba(64,164,255,.3));
        border-color:rgba(120,200,255,.4);
    }
    #sideNotify.active .rail-ic {
        background:rgba(255,93,143,.18); border-color:rgba(255,120,160,.4);
    }
    .side-badge {
        margin-left:auto; background:linear-gradient(135deg,#ff7aa8,#f03370);
        color:#fff; font-size:10px; min-width:18px; height:18px; line-height:18px;
        border-radius:9px; text-align:center; padding:0 5px;
        box-shadow:0 2px 8px rgba(240,51,112,.4);
    }

    /* ===== 内容头部 hero ===== */
    .chat-head {
        display:flex; align-items:center; justify-content:space-between;
        margin:6px 2px 18px;
        animation:riseIn .6s .08s cubic-bezier(.2,.8,.25,1) both;
    }
    .head-id { display:flex; align-items:center; gap:13px; }
    .group-av {
        position:relative; width:52px; height:52px; border-radius:50%;
        background:conic-gradient(from 200deg,#feda75,#fa7e1e,#d62976,#962fbf,#4f5bd5,#feda75);
        padding:2px; flex-shrink:0;
    }
    .group-av::after {
        content:''; position:absolute; inset:2px; border-radius:50%;
        background:#0b1326;
    }
    .group-av svg { position:relative; z-index:1; width:100%; height:100%; padding:11px; }
    .head-id .bell-av {
        width:52px; height:52px; border-radius:50%; flex-shrink:0;
        display:flex; align-items:center; justify-content:center;
        background:rgba(255,93,143,.14); border:1px solid rgba(255,120,160,.35);
    }
    .bell-av svg { width:23px; height:23px; }
    .chat-title { font-size:17px; font-weight:600; color:var(--ink); letter-spacing:.3px; }
    .chat-status {
        display:inline-flex; align-items:center; gap:7px;
        font-size:12px; color:var(--ink-2);
        background:var(--glass); border:1px solid var(--line);
        padding:6px 12px; border-radius:20px;
        backdrop-filter:blur(10px);
    }
    .chat-status .dot { width:7px; height:7px; border-radius:50%; background:#7a869e; }
    .chat-status.online { color:#c9f7dd; border-color:rgba(70,214,134,.3); background:rgba(70,214,134,.08); }
    .chat-status.online .dot { background:var(--green); box-shadow:0 0 8px var(--green); animation:pulseDot 2s infinite; }
    .chat-status.offline { color:#ffb4b4; border-color:rgba(255,100,100,.3); background:rgba(255,90,90,.07); }
    .chat-status.offline .dot { background:#ff6b6b; }
    @keyframes pulseDot { 0%,100%{opacity:1} 50%{opacity:.45} }

    /* ===== 消息流 ===== */
    #chatLog { min-height:240px; }
    .chat-msg {
        display:flex; align-items:flex-end; gap:10px; margin-bottom:4px;
        animation:msgIn .32s cubic-bezier(.2,.8,.25,1) both;
    }
    @keyframes msgIn { from{opacity:0;transform:translateY(10px)} to{opacity:1;transform:none} }
    @keyframes riseIn { from{opacity:0;transform:translateY(16px)} to{opacity:1;transform:none} }

    .chat-msg.other .av {
        width:32px; height:32px; border-radius:50%; flex-shrink:0;
        display:flex; align-items:center; justify-content:center;
        font-size:13px; font-weight:600; color:#fff;
        text-shadow:0 1px 2px rgba(0,0,0,.35); user-select:none;
    }
    .chat-msg.other .av.placeholder { visibility:hidden; }
    .chat-msg.other .av.bird { background:transparent !important; box-shadow:none; padding:0; }
    .chat-msg.other .av.bird img {
        width:100%; height:100%; object-fit:cover; border-radius:50%;
        background:#0e1c33; border:1.5px solid rgba(130,190,255,.5);
    }
    .chat-msg .body { max-width:72%; display:flex; flex-direction:column; }
    .chat-msg .nm {
        font-size:11px; color:var(--ink-3); margin:0 0 3px 4px;
        display:flex; align-items:center;
    }
    .chat-msg .nm .bird-tag {
        font-family:var(--font-en); font-size:8px; letter-spacing:.5px;
        color:#8fd4ff; border:1px solid rgba(143,212,255,.45);
        border-radius:4px; padding:1px 5px; margin-left:6px;
    }
    .chat-msg .bubble {
        padding:9px 15px; border-radius:22px 22px 22px 7px;
        font-size:14.5px; line-height:1.5; color:var(--ink);
        word-break:break-word; white-space:pre-wrap;
        background:rgba(255,255,255,.045); border:1px solid rgba(255,255,255,.075);
        backdrop-filter:blur(15px) saturate(1.15); -webkit-backdrop-filter:blur(15px) saturate(1.15);
        box-shadow:0 3px 14px rgba(0,0,0,.16), inset 0 1px 0 rgba(255,255,255,.08);
        transition:border-color .2s;
    }
    .chat-msg .bubble:hover { border-color:var(--line-2); }
    .chat-msg.me { justify-content:flex-end; }
    .chat-msg.me .bubble {
        color:#fff; border:0; border-radius:22px 22px 7px 22px;
        background:linear-gradient(135deg,rgba(72,169,255,.92) 0%,rgba(26,130,236,.92) 100%);
        box-shadow:0 4px 16px rgba(32,128,236,.36), inset 0 1px 0 rgba(255,255,255,.22);
    }
    .chat-msg.me .bubble:hover { border:0; }

    /* 正在输入指示器 */
    .chat-msg.typing-row .typing-bubble { padding:13px 17px 11px; }
    .chat-msg.typing-row .typing-bubble i {
        display:inline-block; width:7px; height:7px; margin:0 2.5px;
        border-radius:50%; background:rgba(220,232,255,.6);
        animation:typingBlink 1.2s infinite ease-in-out;
    }
    .chat-msg.typing-row .typing-bubble i:nth-child(2){animation-delay:.2s}
    .chat-msg.typing-row .typing-bubble i:nth-child(3){animation-delay:.4s}
    @keyframes typingBlink {
        0%,60%,100%{opacity:.3;transform:translateY(0)}
        30%{opacity:1;transform:translateY(-4px)}
    }

    /* 时间分隔 / 系统消息 / 空状态 */
    .chat-time { text-align:center; margin:22px 0 14px; animation:msgIn .3s both; }
    .chat-time span {
        font-size:11px; color:rgba(236,243,255,.82);
        background:rgba(255,255,255,.09); border:1px solid var(--line);
        padding:4px 14px; border-radius:13px; backdrop-filter:blur(10px);
    }
    .chat-sys { text-align:center; font-size:12px; color:var(--ink-3); margin:10px 0; }
    .chat-empty {
        text-align:center; color:var(--ink-3); padding:72px 20px; font-size:13.5px;
        animation:riseIn .5s both;
    }
    .chat-login-tip {
        position:relative; z-index:3; text-align:center;
        color:var(--ink-2); padding:110px 20px; font-size:15px;
        animation:riseIn .5s both;
    }

    /* ===== 输入区：玻璃胶囊（消息流末尾内嵌，不悬浮） ===== */
    .chat-input-row {
        display:flex; align-items:center; gap:8px; margin-top:20px;
        background:rgba(12,18,34,.66); border:1px solid var(--line);
        border-radius:30px; padding:6px 7px;
        backdrop-filter:blur(18px) saturate(1.3); -webkit-backdrop-filter:blur(18px) saturate(1.3);
        box-shadow:0 10px 34px rgba(0,0,0,.35);
        transition:border-color .25s, box-shadow .25s;
        animation:riseIn .6s .16s cubic-bezier(.2,.8,.25,1) both;
    }
    .chat-input-row:focus-within {
        border-color:rgba(100,180,255,.55);
        box-shadow:0 10px 34px rgba(0,0,0,.35), 0 0 0 4px rgba(64,164,255,.1);
    }
    #chatInput {
        flex:1; min-width:0; background:transparent; border:0;
        padding:10px 6px; color:var(--ink); font-size:14.5px;
        outline:none; font-family:inherit;
    }
    #chatInput::placeholder { color:var(--ink-3); }
    #chatSend {
        width:42px; height:42px; border:0; border-radius:50%; flex-shrink:0;
        background:linear-gradient(135deg,#48a9ff,#1a82ec);
        color:#fff; font-size:19px; line-height:1; cursor:pointer;
        box-shadow:0 3px 10px rgba(32,128,236,.45);
        transition:transform .15s, filter .15s;
    }
    #chatSend:hover:not(:disabled) { transform:scale(1.07); filter:brightness(1.08); }
    #chatSend:active:not(:disabled) { transform:scale(.95); }
    #chatSend:disabled { opacity:.45; cursor:not-allowed; }

    /* ===== 表情包面板（五系列） ===== */
    .emoji-wrap { position:relative; flex-shrink:0; }
    .emoji-btn {
        width:42px; height:42px; border:1px solid var(--line);
        border-radius:50%; background:var(--glass-2); cursor:pointer;
        display:flex; align-items:center; justify-content:center; padding:0;
        transition:all .2s;
    }
    .emoji-btn:hover { border-color:var(--line-2); background:rgba(100,170,255,.16); }
    .emoji-btn img { height:25px; width:auto; image-rendering:pixelated; }
    .emoji-panel {
        display:none; position:absolute; bottom:calc(100% + 12px); left:0;
        width:308px; max-width:82vw;
        background:rgba(13,20,38,.92); border:1px solid var(--line);
        border-radius:18px; padding:11px; z-index:50;
        backdrop-filter:blur(24px); -webkit-backdrop-filter:blur(24px);
        box-shadow:0 16px 50px rgba(0,0,0,.6);
    }
    .emoji-panel.open { display:block; animation:emojiIn .2s cubic-bezier(.2,.8,.25,1); }
    @keyframes emojiIn { from{opacity:0;transform:translateY(8px) scale(.97)} to{opacity:1;transform:none} }
    .emoji-tabs { display:flex; gap:5px; margin-bottom:9px; }
    .emoji-tab {
        flex:1; border:1px solid var(--line); background:transparent;
        color:var(--ink-2); font-size:10.5px; padding:5px 2px;
        border-radius:8px; cursor:pointer; transition:all .2s; white-space:nowrap;
    }
    .emoji-tab:hover { color:var(--ink); border-color:var(--line-2); }
    .emoji-tab.active {
        background:linear-gradient(135deg,#48a9ff,#1a82ec);
        color:#fff; border-color:transparent;
    }
    .emoji-grid {
        display:grid; grid-template-columns:repeat(6,1fr); gap:3px;
        max-height:184px; overflow-y:auto; padding:2px;
    }
    .emoji-cell {
        border:none; background:transparent; padding:4px; cursor:pointer;
        border-radius:9px; transition:background .15s;
        display:flex; align-items:center; justify-content:center;
    }
    .emoji-cell:hover { background:rgba(100,170,255,.18); }
    .emoji-cell img { height:34px; width:auto; image-rendering:pixelated; }
    .chat-emoji {
        height:34px; width:auto; vertical-align:middle;
        image-rendering:pixelated; margin:0 2px; border-radius:5px;
    }

    /* ===== 通知列表 ===== */
    #notifList { animation:riseIn .5s .05s both; }
    .notif-item {
        display:flex; align-items:center; gap:12px; padding:12px 14px;
        border-radius:16px; cursor:pointer; margin-bottom:5px;
        transition:background .2s, transform .2s;
    }
    .notif-item:hover { background:var(--glass-2); transform:translateX(3px); }
    .notif-item.unread { background:rgba(64,164,255,.10); }
    .notif-item .av {
        width:44px; height:44px; border-radius:50%; flex-shrink:0;
        display:flex; align-items:center; justify-content:center;
        font-size:16px; font-weight:600; color:#fff;
        text-shadow:0 1px 2px rgba(0,0,0,.35);
    }
    .notif-item .tx { flex:1; min-width:0; font-size:13.5px; color:var(--ink); line-height:1.55; word-break:break-word; }
    .notif-item .tx b { font-weight:600; }
    .notif-item .tx .ttl { color:#8fc4ff; }
    .notif-item .tm { font-size:11px; color:var(--ink-3); flex-shrink:0; }
    .notif-item .un { width:8px; height:8px; border-radius:50%; background:var(--ice); box-shadow:0 0 8px var(--ice-glow); flex-shrink:0; }

    /* 滚动条 */
    .emoji-grid::-webkit-scrollbar { width:6px; }
    .emoji-grid::-webkit-scrollbar-thumb {
        background:rgba(150,190,255,.25); border-radius:3px;
    }

    /* ===== 响应式 ===== */
    @media (max-width:760px) {
        .chat-wrap { padding:6px 12px 28px; }
        .msg-layout { flex-direction:column; gap:12px; }
        .msg-side {
            width:100%; position:static; display:flex; gap:4px; padding:6px;
            border-radius:16px; overflow-x:auto;
        }
        .msg-side-title { display:none; }
        .msg-side-item { flex:1; justify-content:center; min-width:130px; }
        .msg-side-item.active::before { display:none; }
        .msg-side-item .rail-ic { width:34px; height:34px; }
        .chat-msg .body { max-width:82%; }
        .chat-status { padding:5px 10px; }
        .chat-status span:not(.dot) { max-width:120px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    }
    </style>
</head>
<body>
    <div class="bg-aurora" aria-hidden="true"><span></span><span></span><span></span></div>
    <canvas id="snowCanvas" style="position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:1;"></canvas>

    <header class="header">
        <div class="container header-inner">
            <a href="index.html" class="logo"><img src="celeste-gui/logo.webp" alt="Celeste" loading="lazy" decoding="async"></a>
            <nav class="nav">
                <a href="index.html" class="nav-link">Home</a>
                <a href="archives.html" class="nav-link">Archives</a>
                <a href="diary.html" class="nav-link nav-diary-btn" title="Diary with Madeline">
                    <img src="celeste-gui/journal.png" alt="Diary" loading="lazy" decoding="async">
                </a>
                <a href="shop.html" class="nav-link nav-diary-btn" title="Celeste Resort · Oshiro">
                    <img src="Atlases/Gui/menu/play.png" alt="Shop" loading="lazy" decoding="async">
                </a>
            </nav>
            <div class="header-right" id="headerRight"></div>
        </div>
    </header>

    <div id="chatContainer">
        <div class="chat-login-tip" id="loginTip" style="display:none;">
            请先<a href="login.html" style="color:#ffe36d">登录</a>，才能进入实时聊天。
        </div>
        <div class="chat-wrap" id="chatWrap" style="display:none;">
            <div class="msg-layout">
                <aside class="msg-side">
                    <div class="msg-side-title">消息</div>
                    <div class="msg-side-item active" id="sideChat"><span class="rail-ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 18.5l6.2-9.5 3.3 5.2 2.3-3.2L21 18.5z"/><circle cx="16.4" cy="6" r="1.1" fill="currentColor" stroke="none"/></svg></span>山间聊天</div>
                    <div class="msg-side-item" id="sideNotify"><span class="rail-ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8a6 6 0 10-12 0c0 7-3 8.5-3 8.5h18S18 15 18 8z"/><path d="M13.7 20a2 2 0 01-3.4 0"/></svg></span>notify<span class="side-badge" id="notifBadge" style="display:none"></span></div>
                </aside>
                <div class="msg-main">
                    <div id="chatPane">
                        <div class="chat-head">
                            <div class="head-id">
                                <div class="group-av"><svg viewBox="0 0 24 24" fill="none" stroke="#8fc4ff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 18.5l6.2-9.5 3.3 5.2 2.3-3.2L21 18.5z"/><circle cx="16.4" cy="6" r="1.1" fill="#fff3a3" stroke="none"/></svg></div>
                                <div class="chat-title">山间聊天</div>
                            </div>
                            <div class="chat-status" id="chatStatus"><span class="dot"></span><span id="chatStatusText">连接中…</span></div>
                        </div>
                        <div id="chatLog"><div class="chat-empty">正在拉取聊天记录…</div></div>
                        <div class="chat-input-row" id="chatInputRow">
                            <div class="emoji-wrap">
                                <button type="button" id="emojiBtn" class="emoji-btn" title="插入表情" aria-label="插入表情">
                                    <img src="Atlases/Portraits/madeline/peaceful00.png" alt="表情" decoding="async">
                                </button>
                                <div id="emojiPanel" class="emoji-panel">
                                    <div class="emoji-tabs">
                                        <button type="button" class="emoji-tab active" data-series="mad">Madeline</button>
                                        <button type="button" class="emoji-tab" data-series="bade">Badeline</button>
                                        <button type="button" class="emoji-tab" data-series="granny">Granny</button>
                                        <button type="button" class="emoji-tab" data-series="theo">Theo</button>
                                        <button type="button" class="emoji-tab" data-series="oshiro">Oshiro</button>
                                    </div>
                                    <div class="emoji-grid" id="emojiGrid"></div>
                                </div>
                            </div>
                            <input type="text" id="chatInput" maxlength="500" placeholder="说点什么…（Enter 发送）" autocomplete="off">
                            <button id="chatSend" title="发送" aria-label="发送">↑</button>
                        </div>
                    </div>
                    <div id="notifyPane" style="display:none;">
                        <div class="chat-head">
                            <div class="head-id">
                                <div class="bell-av"><svg viewBox="0 0 24 24" fill="none" stroke="#ff9dbb" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8a6 6 0 10-12 0c0 7-3 8.5-3 8.5h18S18 15 18 8z"/><path d="M13.7 20a2 2 0 01-3.4 0"/></svg></div>
                                <div class="chat-title">notify</div>
                            </div>
                            <div class="chat-status online"><span class="dot"></span><span>点赞 / 评论通知</span></div>
                        </div>
                        <div id="notifList"><div class="chat-empty">正在拉取通知…</div></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

<script src="js/api.js?v=20261002"></script>
<script src="js/auth.js?v=20261002b"></script>
<script>
    initHeader();

    // ===== 实时聊天 demo（SSE 订阅 + POST 发送，历史/消息均存服务端内存） =====
    (function () {
        const token = localStorage.getItem('token');
        const loginTip = document.getElementById('loginTip');
        const chatWrap = document.getElementById('chatWrap');
        if (!token) {
            loginTip.style.display = '';
            return;
        }
        chatWrap.style.display = '';

        const logEl = document.getElementById('chatLog');
        const inputEl = document.getElementById('chatInput');
        const sendBtn = document.getElementById('chatSend');
        const statusEl = document.getElementById('chatStatus');
        const statusText = document.getElementById('chatStatusText');

        let myUserId = null;
        let loadedHistory = false;
        const seenIds = {};   // 简单去重（历史和实时推送可能重叠）
        let lastTs = 0, lastSender = null;   // 时间分组 + 连续消息合并

        function pad(n) { return String(n).padStart(2, '0'); }
        function fmtClock(ts) {
            const d = new Date(Number(ts));
            return pad(d.getHours()) + ':' + pad(d.getMinutes());
        }
        function fmtFull(ts) {
            const d = new Date(Number(ts));
            return (d.getMonth() + 1) + '月' + d.getDate() + '日 ' + fmtClock(ts);
        }
        // 时间分组标签：今天 / 昨天 / M月D日（IG 风格居中分隔）
        function fmtDivider(ts) {
            const d = new Date(Number(ts));
            const today = new Date();
            const yest = new Date(); yest.setDate(today.getDate() - 1);
            if (d.toDateString() === today.toDateString()) return '今天 ' + fmtClock(ts);
            if (d.toDateString() === yest.toDateString()) return '昨天 ' + fmtClock(ts);
            return (d.getMonth() + 1) + '月' + d.getDate() + '日';
        }

        // 消息流为页面级滚动（不再有独立滚动容器）
        function atBottom() {
            return innerHeight + scrollY >= document.documentElement.scrollHeight - 90;
        }
        function scrollToBottom() { scrollTo(0, document.documentElement.scrollHeight); }

        // “XX 正在输入…”指示器（只显示最近一个人，3s 无续报自动消失）
        let typingRow = null, typingHideTimer = null;
        function clearTyping() {
            if (typingRow && typingRow.parentNode) typingRow.remove();
            typingRow = null;
        }
        function showTyping(name) {
            if (!typingRow) {
                typingRow = document.createElement('div');
                typingRow.className = 'chat-msg other typing-row';
                typingRow.innerHTML =
                    '<div class="av placeholder"></div>' +
                    '<div class="body"><div class="nm typing-name"></div>' +
                    '<div class="bubble typing-bubble"><i></i><i></i><i></i></div></div>';
                logEl.appendChild(typingRow);
            }
            typingRow.querySelector('.typing-name').textContent = name + ' 正在输入';
            logEl.appendChild(typingRow);   // 始终钉在消息流最底
            if (atBottom()) scrollToBottom();
            clearTimeout(typingHideTimer);
            typingHideTimer = setTimeout(clearTyping, 3000);
        }

        function setStatus(state, text) {
            statusEl.className = 'chat-status ' + state;
            statusText.textContent = text;
        }

        // 字母头像：按用户 id 哈希出稳定色相（消息数据无头像字段）
        function hashHue(seed) {
            var s = String(seed), h = 0;
            for (var i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) >>> 0;
            return h % 360;
        }
        function appendTime(ts) {
            var div = document.createElement('div');
            div.className = 'chat-time';
            div.innerHTML = '<span>' + escHtml(fmtDivider(ts)) + '</span>';
            logEl.appendChild(div);
        }

        function appendMsg(m) {
            if (seenIds[m.id]) return;
            seenIds[m.id] = true;
            const empty = logEl.querySelector('.chat-empty');
            if (empty) empty.remove();

            const stick = atBottom();
            const ts = Number(m.ts) || Date.now();
            const mine = String(m.userId) === String(myUserId);
            const sender = mine ? '__me__' : String(m.userId);

            // 距上一条 >10 分钟 → 插入时间分隔（同时打断连续消息合并）
            let divided = false;
            if (!lastTs || ts - lastTs > 10 * 60 * 1000) { appendTime(ts); divided = true; }
            const sameChain = !divided && lastSender === sender;
            lastTs = ts;
            lastSender = sender;

            const div = document.createElement('div');
            if (mine) {
                div.className = 'chat-msg me';
                div.innerHTML =
                    '<div class="bubble" title="' + escHtml(fmtFull(ts)) + '">' +
                    renderChatContent(m.content || '') + '</div>';
            } else {
                div.className = 'chat-msg other';
                const name = m.name || '匿名';
                const isBird = String(m.userId) === BIRD_ID;
                const initial = (name[0] || '?').toUpperCase();
                const hue = hashHue(m.userId);
                const av = sameChain
                    ? '<div class="av placeholder"></div>'
                    : (isBird
                        ? '<div class="av bird"><img src="Atlases/WaveDashing/Bird%20Clip%20Art.png" alt="bird"></div>'
                        : '<div class="av" style="background:hsl(' + hue + ' 52% 55%)">' + escHtml(initial) + '</div>');
                const nm = sameChain ? '' : '<div class="nm">' + escHtml(name) +
                    (isBird ? '<span class="bird-tag">吉祥物</span>' : '') + '</div>';
                div.innerHTML = av +
                    '<div class="body">' + nm +
                    '<div class="bubble" title="' + escHtml(fmtFull(ts)) + '">' +
                    renderChatContent(m.content || '') + '</div></div>';
            }
            logEl.appendChild(div);
            if (typingRow && typingRow.parentNode === logEl) logEl.appendChild(typingRow);
            if (stick) scrollToBottom();
        }

        function appendSys(text) {
            const stick = atBottom();
            const div = document.createElement('div');
            div.className = 'chat-sys';
            div.textContent = text;
            logEl.appendChild(div);
            if (typingRow && typingRow.parentNode === logEl) logEl.appendChild(typingRow);
            if (stick) scrollToBottom();
        }

        /* ===== 表情包：与评论区同款五系列（Atlases/Portraits 各情绪 00 帧；暗面琳素材目录为 ghost） ===== */
        const EMOJI_PACKS = {
            mad: { dir: 'madeline', names: ['normal', 'peaceful', 'determined', 'distracted', 'panic', 'sad', 'sadder', 'surprised', 'angry', 'deadpan', 'upset', 'together'] },
            bade: { dir: 'ghost', names: ['normal', 'angry', 'angryAlt', 'concerned', 'freakA', 'freakB', 'freakC', 'sad', 'scoff', 'serious', 'sigh', 'upset', 'worried', 'worriedAlt', 'yell'] },
            granny: { dir: 'granny', names: ['normal', 'creepA', 'creepB', 'laugh', 'mock'] },
            theo: { dir: 'theo', names: ['normal', 'excited', 'nailedit', 'serious', 'thinking', 'worried', 'wtf', 'yolo'] },
            oshiro: { dir: 'oshiro', names: ['normal', 'nervous', 'serious', 'sidehappy', 'sideworried', 'sidesuspicious', 'drama', 'lostcontrol', 'worried'] }
        };
        let emojiSeries = 'mad';
        const emojiBtn = document.getElementById('emojiBtn');
        const emojiPanel = document.getElementById('emojiPanel');
        const emojiGrid = document.getElementById('emojiGrid');

        function renderEmojiGrid() {
            const pack = EMOJI_PACKS[emojiSeries];
            emojiGrid.innerHTML = pack.names.map(n =>
                `<button type="button" class="emoji-cell" data-mark="[${emojiSeries}:${n}]" title="${n}"><img loading="lazy" src="Atlases/Portraits/${pack.dir}/${n}00.png" alt="${n}" decoding="async"></button>`
            ).join('');
        }
        renderEmojiGrid();

        emojiBtn.addEventListener('click', e => {
            e.stopPropagation();
            emojiPanel.classList.toggle('open');
        });
        emojiPanel.addEventListener('click', e => e.stopPropagation());
        document.addEventListener('click', e => {
            if (!e.target.closest('.emoji-wrap')) emojiPanel.classList.remove('open');
        });
        emojiPanel.querySelectorAll('.emoji-tab').forEach(tab => {
            tab.addEventListener('click', () => {
                emojiPanel.querySelectorAll('.emoji-tab').forEach(t => t.classList.remove('active'));
                tab.classList.add('active');
                emojiSeries = tab.dataset.series;
                renderEmojiGrid();
            });
        });
        emojiGrid.addEventListener('click', e => {
            const cell = e.target.closest('.emoji-cell');
            if (!cell) return;
            const start = typeof inputEl.selectionStart === 'number' ? inputEl.selectionStart : inputEl.value.length;
            const end = typeof inputEl.selectionEnd === 'number' ? inputEl.selectionEnd : inputEl.value.length;
            inputEl.setRangeText(cell.dataset.mark, start, end, 'end');
            inputEl.focus();
        });

        // 渲染消息内容：先整体转义，再把白名单内的表情标记替换为图片（防 XSS）
        function renderChatContent(text) {
            let s = escHtml(text);
            s = s.replace(/\[(mad|bade|granny|theo|oshiro):([a-zA-Z]+)\]/g, (m, series, name) => {
                const pack = EMOJI_PACKS[series];
                return (pack && pack.names.includes(name))
                    ? `<img class="chat-emoji" loading="lazy" src="Atlases/Portraits/${pack.dir}/${name}00.png" alt="${series}:${name}" decoding="async">`
                    : m;
            });
            return s;
        }

        // 当前用户 id（区分自己/他人气泡）
        api('/users/currentUser', 'GET').then(res => {
            if (res.success && res.data) myUserId = res.data.id;
        });

        /* ===== birdAI：群聊吉祥物小鸟 =====
           触发：对每条新消息做确定性哈希（消息 id），全端一致判定"回不回"，
           约 30% 概率、2~6 秒延迟冒泡 —— 不定时、不必回；
           回复：调后端裸 AI（/chat/generate-article，不写聊天历史），
           提示词按 QQ 群 AI 助手风格写；失败回落本地语料。
           bird 的消息只本地渲染（不广播），userId 固定 __bird__。 */
        const BIRD_ID = '__bird__';
        const BIRD_NAME = 'bird';
        let lastBirdAt = 0;
        function birdHash(s) {
            s = String(s); let h = 5381;
            for (let i = 0; i < s.length; i++) h = ((h << 5) + h + s.charCodeAt(i)) >>> 0;
            return h;
        }
        const BIRD_FALLBACK = [
            '啾？有人在叫我吗',
            '说得好，赏你一颗草莓 🍓',
            '本鸟已阅，继续继续',
            '爬山累了就歇会儿，群我盯着',
            '啾啾，这个我熟！',
            '在？看看风景（扇翅）'
        ];
        const BIRD_PROMPT =
            '你是 Celeste 登山群聊的吉祥物小鸟"bird"，一只会打字的北美金翅雀，兼任群 AI 助手（类似 QQ 群机器人）。' +
            '性格：活泼嘴碎、热心肠、偶尔懒洋洋，喜欢在句子里偶尔带"啾"。\n' +
            '规则：像群友一样自然接话，一两句短口语；可以鼓励、吐槽、玩梗、给登山上的人文关怀；' +
            '禁止长篇大论、禁止说教、禁止自称 AI 或语言模型；不超过 50 字。\n' +
            '群友「%NAME%」说：「%MSG%」\n你的接话：';
        function maybeBird(m) {
            if (!m || !m.content) return;
            if (String(m.userId) === BIRD_ID || m.name === BIRD_NAME) return;   // 不理自己
            const h = birdHash(m.id || (m.content + m.ts));
            // @bird（或句子里直呼 bird）→ 必定接话，无视概率与冷却
            const called = /(^|[^a-z])@?bird([^a-z]|$)/i.test(String(m.content));
            if (!called && h % 100 >= 30) return;                               // 平时 30% 触发
            const now = Date.now();
            if (!called && now - lastBirdAt < 45000) return;                    // 普通触发冷却 45s
            lastBirdAt = now;
            const delay = called ? (800 + h % 2200) : (2000 + (h % 4000));      // @ 时更快：0.8~3s
            setTimeout(() => birdReply(m), delay);
        }
        function birdSay(text) {
            appendMsg({
                id: 'bird' + Date.now(), userId: BIRD_ID, name: BIRD_NAME,
                content: text, ts: Date.now()
            });
        }
        function birdReply(m) {
            const prompt = BIRD_PROMPT
                .replace('%NAME%', m.name || '群友')
                .replace('%MSG%', String(m.content).slice(0, 200));
            api('/chat/generate-article', 'POST', { content: prompt }).then(res => {
                if (res.success && res.data && res.data.content) {
                    let t = String(res.data.content).trim().replace(/\s+/g, ' ');
                    if (t.length > 60) t = t.slice(0, 60) + '…';
                    birdSay(t);
                } else {
                    birdSay(BIRD_FALLBACK[birdHash(m.content) % BIRD_FALLBACK.length]);
                }
            }).catch(() => {
                birdSay(BIRD_FALLBACK[birdHash(m.content) % BIRD_FALLBACK.length]);
            });
        }

        // 历史消息（早 -> 晚）
        api('/realtime-chat/history', 'GET').then(res => {
            if (res.success && Array.isArray(res.data)) {
                logEl.innerHTML = '';
                lastTs = 0; lastSender = null;
                if (res.data.length === 0) {
                    logEl.innerHTML = '<div class="chat-empty">还没有人说话，发第一条消息试试～</div>';
                } else {
                    res.data.forEach(appendMsg);
                    scrollToBottom();
                }
            } else {
                logEl.innerHTML = '<div class="chat-empty">历史记录加载失败。</div>';
            }
            loadedHistory = true;
        });

        // SSE 订阅（EventSource 无法加 Header，token 走 query）
        let es = null;
        function connect() {
            setStatus('', '连接中…');
            es = new EventSource(BASE_URL + '/realtime-chat/stream?token=' + encodeURIComponent(token));
            es.addEventListener('chat', e => {
                try {
                    const m = JSON.parse(e.data);
                    appendMsg(m);
                    maybeBird(m);
                } catch (err) {}
            });
            es.addEventListener('typing', e => {
                try {
                    const p = JSON.parse(e.data);
                    if (String(p.userId) !== String(myUserId)) showTyping(p.name || '有人');
                } catch (err) {}
            });
            es.addEventListener('presence', e => {
                try {
                    const p = JSON.parse(e.data);
                    setStatus('online', '在线 ' + p.online + ' 人');
                } catch (err) { setStatus('online', '已连接'); }
            });
            es.onopen = () => setStatus('online', '已连接');
            es.onerror = () => {
                // EventSource 浏览器内置自动重连，这里只更新状态
                setStatus('offline', '连接断开，重连中…');
            };
        }
        connect();

        // 发送
        let sending = false;
        function doSend() {
            const content = inputEl.value.trim();
            if (!content || sending) return;
            sending = true;
            sendBtn.disabled = true;
            // 自己发的消息不本地插入，等服务端广播回来（保证单一口径 + 多标签页同步）
            api('/realtime-chat/send', 'POST', { content }).then(res => {
                if (!res.success) appendSys('发送失败：' + (res.msg || '未知错误'));
                inputEl.value = '';
            }).catch(() => {
                appendSys('发送失败，网络异常');
            }).finally(() => {
                sending = false;
                sendBtn.disabled = false;
                inputEl.focus();
            });
        }
        sendBtn.addEventListener('click', doSend);
        inputEl.addEventListener('keydown', e => {
            if (e.key === 'Enter') { e.preventDefault(); doSend(); }
        });
        // 输入中上报：防抖 2s 一次，有内容才发
        let lastTypeReport = 0;
        inputEl.addEventListener('input', () => {
            const now = Date.now();
            if (inputEl.value.trim() && now - lastTypeReport > 2000) {
                lastTypeReport = now;
                api('/realtime-chat/typing', 'POST');
            }
        });

        window.addEventListener('beforeunload', () => { if (es) es.close(); });
    })();

    // ===== 左侧列表：聊天 / 消息notify 面板切换 + 通知拉取（点赞/评论你的文章） =====
    (function () {
        const token = localStorage.getItem('token');
        if (!token) return;
        const sideChat = document.getElementById('sideChat');
        const sideNotify = document.getElementById('sideNotify');
        const chatPane = document.getElementById('chatPane');
        const notifyPane = document.getElementById('notifyPane');
        const inputRow = document.getElementById('chatInputRow');
        const notifList = document.getElementById('notifList');
        const badge = document.getElementById('notifBadge');

        function hashHue(seed) {
            var s = String(seed), h = 0;
            for (var i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) >>> 0;
            return h % 360;
        }
        function fmtNotifTime(ts) {
            const d = new Date(Number(ts)), t = new Date();
            const hm = String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0');
            if (d.toDateString() === t.toDateString()) return hm;
            return (d.getMonth() + 1) + '月' + d.getDate() + '日';
        }

        function switchPane(which) {
            const isChat = which === 'chat';
            sideChat.classList.toggle('active', isChat);
            sideNotify.classList.toggle('active', !isChat);
            chatPane.style.display = isChat ? '' : 'none';
            notifyPane.style.display = isChat ? 'none' : '';
            inputRow.style.display = isChat ? '' : 'none';   // 通知面板不需要输入栏
            if (!isChat) loadNotify();
        }
        sideChat.addEventListener('click', () => switchPane('chat'));
        sideNotify.addEventListener('click', () => switchPane('notify'));

        const TYPE_TEXT = { like: '赞了你的文章', comment: '评论了你的文章' };
        function renderNotify(list) {
            if (!list.length) {
                notifList.innerHTML = '<div class="chat-empty">还没有通知，去写篇文章试试～</div>';
                return;
            }
            notifList.innerHTML = list.map(n => {
                const name = n.fromName || '有人';
                const initial = (name[0] || '?').toUpperCase();
                const hue = hashHue(name);
                const act = TYPE_TEXT[n.type] || '互动了你的文章';
                const unread = Number(n.isRead) === 0;
                return '<div class="notif-item' + (unread ? ' unread' : '') + '" data-id="' + escHtml(n.articleId || '') + '">' +
                    '<div class="av" style="background:hsl(' + hue + ' 52% 55%)">' + escHtml(initial) + '</div>' +
                    '<div class="tx"><b>' + escHtml(name) + '</b> ' + act +
                    '<span class="ttl">《' + escHtml(n.articleTitle || '') + '》</span></div>' +
                    '<div class="tm">' + fmtNotifTime(n.createDate) + '</div>' +
                    (unread ? '<div class="un"></div>' : '') +
                    '</div>';
            }).join('');
            notifList.querySelectorAll('.notif-item').forEach(el => {
                el.addEventListener('click', () => {
                    if (el.dataset.id) location.href = 'article.html?id=' + encodeURIComponent(el.dataset.id);
                });
            });
        }

        function loadNotify() {
            api('/notifications/list', 'GET').then(res => {
                if (res.success && Array.isArray(res.data)) renderNotify(res.data);
                else notifList.innerHTML = '<div class="chat-empty">通知加载失败。</div>';
            });
            // 打开即全部已读，同步清掉头部铃铛徽标
            api('/notifications/readAll', 'POST').then(() => {
                setBadge(0);
                if (typeof refreshBell === 'function') refreshBell();
            });
        }

        function setBadge(n) {
            badge.textContent = n > 99 ? '99+' : String(n);
            badge.style.display = n > 0 ? 'inline-block' : 'none';
        }

        // 未读数统一由 auth.js 轮询（refreshBell），这里只监听广播，不重复请求
        window.addEventListener('notify:unread', e => {
            const n = Number(e.detail.unread || 0);
            setBadge(n);
            // 正停留在 notify 面板时来了新通知 → 刷新列表
            if (n > 0 && notifyPane.style.display !== 'none') loadNotify();
        });
    })();

    // ===== 雪花（与首页同款，精简） =====
    (function () {
        const cv = document.getElementById('snowCanvas');
        const c = cv.getContext('2d');
        function resize() { cv.width = innerWidth; cv.height = innerHeight; }
        resize(); addEventListener('resize', resize);
        const fs = [];
        for (let i = 0; i < 70; i++) fs.push({
            x: Math.random() * innerWidth, y: Math.random() * innerHeight,
            r: Math.random() * 3 + 1, sp: Math.random() * 1.5 + 0.5,
            w: Math.random() * 0.5 - 0.25, o: Math.random() * 0.6 + 0.2,
            sw: Math.random() * Math.PI * 2, sws: Math.random() * 0.02 + 0.01
        });
        (function loop() {
            c.clearRect(0, 0, cv.width, cv.height);
            for (const f of fs) {
                f.y += f.sp; f.sw += f.sws;
                f.x += Math.sin(f.sw) * 0.5 + f.w;
                if (f.y > cv.height + 10) { f.y = -10; f.x = Math.random() * cv.width; }
                if (f.x > cv.width + 10) f.x = -10;
                if (f.x < -10) f.x = cv.width + 10;
                c.beginPath(); c.arc(f.x, f.y, f.r, 0, Math.PI * 2);
                c.fillStyle = 'rgba(255,255,255,' + f.o + ')'; c.fill();
            }
            requestAnimationFrame(loop);
        })();
    })();
</script>
