<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="icon/OIP.webp" type="image/webp">
    <title>Madeline - 写日记</title>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Patrick+Hand&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/diary.css">

</head>
<body>
    <!-- 情绪场景背景 -->
    <div id="emotion-bg"></div>
    <div id="bg-snow-back"></div>
    <div id="bg-snow-front"></div>
    <button id="homePosterBtn" title="回到主页 · My Mountain" onclick="location.href='index.html'">
        <img src="celeste-gui/mymountain_icon.png" alt="My Mountain">
    </button>
    <button id="journalBackBtn" onclick="location.href='index.html'"><span class="x">✕</span>返回</button>
    <!-- 金羽毛游戏入口（右上角） -->
    <img id="pixelMadeline" src="celeste-gui/bounceline.gif" alt="Madeline" title="点我聊天">
    <div id="gameDialog">
        <div id="gameDialogPortrait"><img id="gameDialogPortraitImg" src="celeste-portraits/madeline/normal00.png" alt="Madeline"></div>
        <div id="gameDialogBody">
            <div id="gameDialogName">Madeline</div>
            <div id="gameDialogText"></div>
        </div>
    </div>
    <button id="featherGameBtn" title="金羽毛" style="position:fixed; top:14px; right:16px; z-index:900; width:64px; height:64px; padding:0; background:transparent; border:none; cursor:pointer; transition:transform .3s ease, filter .3s ease; filter:drop-shadow(0 4px 12px rgba(255,170,60,.6));">
        <img src="celeste-gui/loop.gif" alt="金羽毛" style="width:100%; height:100%; object-fit:contain; display:block;">
    </button>
    <!-- 羽毛随笔弹框 -->
    <div id="featherNoteBox" style="display:none; position:fixed; top:90px; right:16px; z-index:901; width:260px; background:rgba(22,34,60,.95); border:2px solid rgba(255,230,109,.4); border-radius:10px; padding:16px; box-shadow:0 8px 24px rgba(0,0,0,.4);">
        <div style="color:#ffe36d; font-size:13px; margin-bottom:8px; font-family:'Renogare','CelesteZH',sans-serif;">🪶 写一根羽毛</div>
        <input id="featherInput" type="text" maxlength="100" placeholder="一句话，轻轻放下..." style="width:100%; padding:8px 10px; border:1px solid rgba(255,230,109,.4); border-radius:6px; background:rgba(255,255,255,.08); color:#fff; font-size:13px; outline:none; font-family:inherit;">
        <div style="display:flex; justify-content:flex-end; gap:8px; margin-top:10px;">
            <button id="featherCancel" style="padding:4px 12px; border:1px solid rgba(255,255,255,.3); border-radius:4px; background:transparent; color:rgba(255,255,255,.6); cursor:pointer; font-size:12px;">取消</button>
            <button id="featherSave" style="padding:4px 12px; border:none; border-radius:4px; background:#ffe36d; color:#222; cursor:pointer; font-size:12px; font-weight:bold;">放下</button>
        </div>
        <div id="featherToast" style="display:none; color:#ffe36d; font-size:12px; text-align:center; margin-top:8px;">羽毛已飘走～</div>
    </div>
    <!-- BGM 播放器（隐藏，自动播放） -->
    <audio id="bgmPlayer" loop autoplay>
        <source src="bgm/exhale.mp3" type="audio/mpeg">
    </audio>

    <!-- 每日明信片开场动画 -->
    <div id="postcard-overlay">
        <canvas id="snowCanvas"></canvas>
        <div id="postcard-container">
            <img id="postcard-bg" src="celeste-gui/postcard.png" alt="Postcard">
            <div id="postcard-to"><span class="name" id="postcardName"></span></div>
            <div id="postcard-message"></div>
            <button id="postcard-close">Keep ♥</button>
        </div>
    </div>

    <!-- Madeline 浮动按钮 + 聊天 -->
    <div id="madeline-wrapper">
        <div id="madeline-float-button">
            <div class="avatar-wrap">
                <img id="floatAvatar" src="celeste-portraits/madeline/normal00.png" alt="Madeline">
            </div>
        </div>
        <div class="quick-input-container" id="quickInputBox">
            <input type="text" id="quickInput" placeholder="想对 Madeline 说...">
        </div>
        <div id="madeline-chat-dialog">
            <div class="chat-header">
                <div id="chat-madeline-avatar-wrap">
                    <img id="chatAvatar" src="celeste-portraits/madeline/normal00.png" alt="Madeline">
                </div>
                <span class="chat-title">Madeline</span>
                <button class="close-btn" id="closeChatBtn">✕</button>
            </div>
            <div class="chat-messages" id="chatMessages"></div>
            <div class="chat-input">
                <input type="text" id="chatInput" placeholder="跟 Madeline 说点什么...">
                <button id="chatSendBtn">Send</button>
            </div>
        </div>
    </div>

    <!-- 日记编辑区 -->
    <div class="editor-wrapper">
        <img src="celeste-gui/journal.png" alt="Journal" style="display:block; margin:0 auto 6px auto; height:72px; filter:drop-shadow(0 0 6px rgba(255,235,59,0.4));">
        <div id="emotion-wave"><canvas id="waveCanvas"></canvas></div>
        <div id="emotion-analysis-bar">
            <span class="emotion-label">Madeline 感知到</span>
            <div class="emotion-track"><div class="emotion-fill" id="emotionFill"></div></div>
            <div class="emotion-tags" id="emotionTags"></div>
            <span class="emotion-intensity" id="emotionIntensity"></span>
        </div>
        <div id="journalStage">
            <div id="journalBook"></div>
            <div class="book-dots" id="bookDots"></div>
        </div>
    </div>

    <div id="madeline-peeking">
        <span>Madeline 正在看...</span>
        <div class="peeking-dots"><span></span><span></span><span></span></div>
    </div>

    <script src="js/api.js"></script>
    <script src="js/feather-game.js"></script>
    <script src="js/diary.js"></script>
    <script>
    (function() {
        const btn = document.getElementById('featherGameBtn');
        const box = document.getElementById('featherNoteBox');
        const input = document.getElementById('featherInput');
        const toast = document.getElementById('featherToast');

        btn.addEventListener('click', function() {
            if (box.style.display === 'none') {
                box.style.display = 'block';
                input.value = '';
                toast.style.display = 'none';
                input.focus();
            } else {
                box.style.display = 'none';
            }
        });

        document.getElementById('featherCancel').addEventListener('click', function() {
            box.style.display = 'none';
        });

        document.getElementById('featherSave').addEventListener('click', saveFeather);
        input.addEventListener('keydown', function(e) {
            if (e.key === 'Enter') saveFeather();
        });

        function saveFeather() {
            const val = input.value.trim();
            if (!val) return;
            api('/feather', 'POST', { content: val }).then(function(res) {
                if (res.success) {
                    toast.style.display = 'block';
                    input.value = '';
                    setTimeout(function() {
                        box.style.display = 'none';
                    }, 1200);
                }
            });
        }
    })();
    </script>
</body>
</html>
