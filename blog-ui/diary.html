<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="icon/OIP.webp" type="image/webp">
    <title>Madeline - 写日记</title>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Patrick+Hand&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/diary.css?v=20261005a">
    <link rel="stylesheet" href="css/text-fx.css?v=20261004a">
    <style>
        /* TextFx：Madeline 对话框内动画词的默认专属色（普通文字仍为原色） */
        #gameDialogText, .chat-messages .msg-bubble { --c:#F94A4A; }
        /* 输入框文字透明后，placeholder 保持独立可见（不被 -webkit-text-fill-color 带走） */
        .book-page textarea::placeholder, .book-page input::placeholder { -webkit-text-fill-color:rgba(64,58,66,.3); }
    </style>
    <style>
        /* ===== 羽毛随笔弹框：poempage 纸页 + 登录页同款滑入动画 ===== */
        #featherNoteBox {
            background:url('celeste-gui/poempage.webp') center/100% 100% no-repeat;
            border:none;
            border-radius:0;
            filter:drop-shadow(0 8px 32px rgba(0,0,0,.6));
            opacity:0;
            transform:translateX(calc(-100vw - 100%)) rotate(-8deg);
            transition:opacity .8s ease, transform 1s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        #featherNoteBox.slide-in { opacity:1; transform:translateX(0) rotate(0deg); }
        #featherSave:hover { background:#c4a882 !important; color:#fff !important; }
        #featherCancel:hover { background:rgba(180,160,140,.25) !important; border-color:#a89080 !important; }
        #featherInput:focus { border-color:#c4a882 !important; box-shadow:inset 0 1px 3px rgba(90,62,54,.15), 0 0 0 2px rgba(196,168,130,.2) !important; }
    </style>

</head>
<body>
    <!-- 情绪场景背景 -->
    <div id="emotion-bg"></div>
    <div id="bg-snow-back"></div>
    <div id="bg-snow-front"></div>
    <button id="homePosterBtn" title="回到主页 · My Mountain" onclick="location.href='index.html'">
        <img src="celeste-gui/mymountain_icon.png" alt="My Mountain" loading="lazy" decoding="async">
    </button>
    <!-- 金羽毛游戏入口（右上角） -->
    <img id="pixelMadeline" src="celeste-gui/bounceline.gif" alt="Madeline" title="点我聊天" loading="lazy" decoding="async">
    <div id="gameDialog">
        <div id="gameDialogPortrait"><img id="gameDialogPortraitImg" src="celeste-portraits/madeline/normal00.png" alt="Madeline" loading="lazy" decoding="async"></div>
        <div id="gameDialogBody">
            <div id="gameDialogName">Madeline</div>
            <div id="gameDialogText"></div>
        </div>
    </div>
    <div id="featherApp" style="display:contents">
    <button id="featherGameBtn" title="金羽毛" style="position:fixed; top:14px; right:16px; z-index:900; width:64px; height:64px; padding:0; background:transparent; border:none; cursor:pointer; transition:transform .3s ease, filter .3s ease; filter:drop-shadow(0 4px 12px rgba(255,170,60,.6));" @click="onFeatherBtn">
        <img src="celeste-gui/loop.gif" alt="金羽毛" style="width:100%; height:100%; object-fit:contain; display:block;" loading="lazy" decoding="async">
    </button>
    <!-- 羽毛随笔弹框 -->
    <div id="featherNoteBox" v-show="boxOpen" :class="{'slide-in': slideIn}" style="position:fixed; top:84px; right:12px; z-index:901; width:280px; padding:22px 20px 18px;">
        <div style="display:flex; align-items:center; gap:8px; margin-bottom:12px;">
            <span style="font-size:18px; filter:drop-shadow(0 1px 2px rgba(0,0,0,.15));">🪶</span>
            <span style="color:#5a3e36; font-size:13px; font-family:'Renogare','CelesteZH',sans-serif; letter-spacing:.06em;">Leave a feather</span>
        </div>
        <input id="featherInput" type="text" maxlength="100" placeholder="一句话，轻轻放下..." v-model="featherText" @keydown="onFeatherKey" style="width:100%; padding:9px 12px; border:1px solid #b8a08a; border-radius:4px; background:rgba(255,252,245,.88); color:#3a2018; font-size:13px; outline:none; font-family:'Renogare','CelesteZH',sans-serif; box-shadow:inset 0 1px 3px rgba(90,62,54,.15); transition:border-color .2s, box-shadow .2s;">
        <div id="featherChar" style="color:#8a6f5c; font-size:11px; text-align:right; margin-top:4px; font-family:'Renogare','CelesteZH',sans-serif;">{{ featherText.length }} / 100</div>
        <div style="display:flex; justify-content:space-between; align-items:center; margin-top:10px;">
            <div style="color:#8a6f5c; font-size:11px; font-family:'Renogare','CelesteZH',sans-serif; opacity:.7;">每根羽毛都是一念</div>
            <div style="display:flex; gap:8px;">
                <button id="featherCancel" style="padding:5px 14px; border:1px solid #b8a08a; border-radius:4px; background:rgba(255,248,240,.5); color:#7a5e4c; cursor:pointer; font-size:12px; font-family:'Renogare','CelesteZH',sans-serif; transition:all .15s;" @click="closeBox">取消</button>
                <button id="featherSave" style="padding:5px 16px; border:2px solid #c4a882; border-radius:4px; background:rgba(255,248,240,.9); color:#5a3e36; cursor:pointer; font-size:12px; font-weight:bold; font-family:'Renogare','CelesteZH',sans-serif; transition:all .15s;" :disabled="saving" @click="saveFeather">放下 ✨</button>
            </div>
        </div>
        <div id="featherToast" v-if="toast" :style="{color: toastError ? '#c0392b' : '#5a3e36'}" style="font-size:12px; text-align:center; margin-top:10px; font-family:'Renogare','CelesteZH',sans-serif;">{{ toast }}</div>
    </div>
    </div>
    <!-- BGM 播放器（隐藏，自动播放） -->
    <audio id="bgmPlayer" loop autoplay>
        <source src="bgm/exhale.mp3" type="audio/mpeg">
    </audio>

    <!-- 每日明信片开场动画 -->
    <div id="postcard-overlay">
        <canvas id="snowCanvas"></canvas>
        <div id="postcard-container">
            <img id="postcard-bg" src="celeste-gui/postcard.webp" alt="Postcard" loading="lazy" decoding="async">
            <div id="postcard-to"><span class="name" id="postcardName"></span></div>
            <div id="postcard-message"></div>
            <button id="postcard-close">Keep ♥</button>
        </div>
    </div>

    <!-- Madeline 浮动按钮 + 聊天 -->
    <div id="madeline-wrapper">
        <div id="madeline-float-button">
            <div class="avatar-wrap">
                <img id="floatAvatar" src="celeste-portraits/madeline/normal00.png" alt="Madeline" loading="lazy" decoding="async">
            </div>
        </div>
        <div class="quick-input-container" id="quickInputBox">
            <input type="text" id="quickInput" placeholder="想对 Madeline 说...">
        </div>
        <div id="madeline-chat-dialog">
            <div class="chat-header">
                <div id="chat-madeline-avatar-wrap">
                    <img id="chatAvatar" src="celeste-portraits/madeline/normal00.png" alt="Madeline" loading="lazy" decoding="async">
                </div>
                <span class="chat-title">Madeline</span>
                <button class="close-btn" id="closeChatBtn">✕</button>
            </div>
            <div class="chat-messages" id="chatMessages"></div>
            <div class="chat-input">
                <input type="text" id="chatInput" placeholder="跟 Madeline 说点什么...">
                <button id="chatSendBtn">Send</button>
            </div>
        </div>
    </div>

    <!-- 日记编辑区 -->
    <div class="editor-wrapper">
        <img src="celeste-gui/journal.png" alt="Journal" style="display:block; margin:0 auto 6px auto; height:72px; filter:drop-shadow(0 0 6px rgba(255,235,59,0.4));" loading="lazy" decoding="async">
        <div id="journalStage">
            <div id="journalBook"></div>
            <div class="book-dots" id="bookDots"></div>
        </div>
    </div>

    <script src="js/api.js?v=20261002"></script>
    <script src="js/text-fx.js?v=20261005b"></script>
    <script src="js/feather-game.js"></script>
    <script src="js/feather-trigger.js"></script>
    <script src="js/madeline-core.js?v=20261002"></script>
    <script src="js/madeline-mood.js?v=20261009a"></script>
    <script src="js/diary.js?v=20261009a"></script>
    <script src="js/detect.js"></script>
    <script>
    // TextFx：日记本输入框里命中的情绪关键词 → 波浪动画 + 情绪色（仅第一种效果）
    (function () {
        function boot() {
            if (!window.TextFx || !window.__DIARY_EMOTION_WORDS) return;
            var words = window.__DIARY_EMOTION_WORDS, colors = window.__DIARY_EMOTION_COLORS || {};
            var palette = {}, wordArr = [];
            Object.keys(words).forEach(function (emo) {
                words[emo].forEach(function (w) {
                    if (w.length < 2) return;            // 单字（恨/甜/哭）太容易误伤，跳过
                    palette[w] = colors[emo] || '#FF6B6B';
                    wordArr.push(w);
                });
            });
            TextFx.setPalette(palette);
            document.querySelectorAll('#journalBook textarea, #titleInput').forEach(function (el) {
                TextFx.attachTextarea(el, wordArr);
            });
        }
        if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
        else boot();
    })();
    </script>
    <script src="js/pptgen.js"></script>
<script src="js/vue.global.prod.js?v=20261008a"></script>
<script>
    // 羽毛随笔弹框：开合/字数/保存状态交 Vue；FeatherGame 全局流程保持不变
    (function() {
        const { createApp, ref, nextTick } = Vue;

        function currentMood() {
            return localStorage.getItem('lastEmotion') || '默认';
        }
        function isBadMood(emo) {
            return ['悲伤', '孤独', '不开心', '不安', '愤怒', '怨恨'].indexOf(emo) !== -1;
        }

        createApp({
            setup() {
                const boxOpen = ref(false);
                const slideIn = ref(false);
                const featherText = ref('');
                const toast = ref('');
                const toastError = ref(false);
                const saving = ref(false);

                function openBox() {
                    boxOpen.value = true;
                    slideIn.value = false;
                    featherText.value = '';
                    toast.value = '';
                    // 与原实现一致：先显示无 slide-in 态，强制重排后再加 class 重放滑入
                    nextTick(() => requestAnimationFrame(() => requestAnimationFrame(() => {
                        slideIn.value = true;
                        const inp = document.getElementById('featherInput');
                        if (inp) inp.focus();
                    })));
                }
                function closeBox() {
                    slideIn.value = false;
                    boxOpen.value = false;
                }
                // diary.js 在坏心情金羽毛落地后会调 window.showFeatherNote
                window.showFeatherNote = openBox;

                function onFeatherBtn() {
                    const emo = currentMood();
                    if (isBadMood(emo)) {
                        // 情绪不好：Madeline 先说一句羽毛建议，再淡入金羽毛游戏（过渡自然）
                        window._featherBadMood = true;
                        if (window.FeatherGame) {
                            if (window.FeatherGame.suggestThenOpen) window.FeatherGame.suggestThenOpen(emo);
                            else window.FeatherGame.open(emo);
                        }
                    } else {
                        // 情绪好：先随笔，右下角羽毛按钮点击才游戏
                        if (boxOpen.value) closeBox();
                        else openBox();
                    }
                }

                function onFeatherKey(e) {
                    if (e.key === 'Enter') saveFeather();
                }

                function saveFeather() {
                    const val = featherText.value.trim();
                    if (!val) return;
                    saving.value = true;
                    api('/feather', 'POST', { content: val }).then(function(res) {
                        saving.value = false;
                        if (res && res.success) {
                            toastError.value = false;
                            toast.value = '羽毛已飘走～';
                            featherText.value = '';
                            setTimeout(function() {
                                closeBox();
                                toast.value = '';
                            }, 1200);
                            // 情绪好时：随笔写完 → 开游戏（Madeline 在游戏内陪伴）
                            if (!isBadMood(currentMood())) {
                                setTimeout(function() {
                                    if (window.FeatherGame) window.FeatherGame.open();
                                }, 800);
                            }
                        } else {
                            toastError.value = true;
                            toast.value = (res && res.msg) ? res.msg : '没存上，再试一次吧';
                        }
                    }).catch(function() {
                        saving.value = false;
                        toastError.value = true;
                        toast.value = '网络不太顺，再试一次吧';
                    });
                }

                return {
                    boxOpen, slideIn, featherText, toast, toastError, saving,
                    onFeatherBtn, closeBox, onFeatherKey, saveFeather
                };
            }
        }).mount('#featherApp');
    })();
</script>
<script src="js/seed.js?v=20261005a"></script>
</body>
</html>
