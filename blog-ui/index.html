<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="icon/OIP.webp" type="image/webp">
    <title>Celeste Blog</title>
    <link rel="stylesheet" href="css/common.css">
    <link rel="stylesheet" href="css/index.css">
    <style>
    body::after {
        content:'';
        position:fixed; inset:0;
        background:url('celeste-areas/ForsakenCity01.png') center/cover no-repeat;
        opacity:0.3;
        pointer-events:none;
        z-index:0;
    }
    .snow-strip {
        position:fixed; left:0; right:0; bottom:0;
        height:80px;
        background:url('celeste-areas/snow-front.png') repeat-x bottom/220px auto;
        animation:snowDrift 45s linear infinite;
        pointer-events:none;
        z-index:2;
        opacity:.5;
    }
    @keyframes snowDrift { from{background-position-x:0} to{background-position-x:-440px} }
    .nav-diary-btn {
        display:inline-block;
        cursor:pointer;
        transition:transform .2s, filter .2s;
        vertical-align:middle;
    }
    .nav-diary-btn:hover {
        transform:scale(1.15);
    }
    .nav-diary-btn img {
        height:36px;
        width:auto;
        display:block;
        filter:drop-shadow(0 0 10px rgba(255,235,59,0.7));
    }
    .meta-icon { height:14px; width:auto; vertical-align:-2px; margin-right:4px; opacity:.9; filter:drop-shadow(0 0 3px rgba(255,235,59,.35)); }
    .meta-author-img { width:18px; height:18px; border-radius:50%; vertical-align:-4px; margin-right:5px; border:1px solid rgba(255,235,59,.6); }
    .hot-rank { display:inline-flex; align-items:center; justify-content:center; flex-shrink:0; }
    .hot-rank img { width:22px; height:22px; object-fit:contain; filter:drop-shadow(0 0 4px rgba(255,235,59,.5)); }
    </style>
</head>
<body>
    <!-- BGM 播放器 -->
    <audio id="bgmPlayer" loop autoplay>
        <source src="bgm/postcard.mp3" type="audio/mpeg">
    </audio>

    <!-- 雪花粒子系统 -->
    <canvas id="snowCanvas" style="position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:0;"></canvas>
    <div class="snow-strip"></div>

<!-- 顶部导航 -->
<header class="header">
    <div class="container header-inner">
        <a href="index.html" class="logo"><img src="celeste-gui/logo.png" alt="Celeste"></a>
        <nav class="nav">
            <a href="index.html" class="nav-link active">Home</a>
            <a href="archives.html" class="nav-link">Archives</a>
            <a href="diary.html" class="nav-link nav-diary-btn" title="Diary with Madeline">
                <img src="celeste-gui/journal.png" alt="Diary">
            </a>
        </nav>
        <div class="header-right" id="headerRight">
            <a href="login.html" class="btn btn-outline">Login</a>
            <a href="register.html" class="btn btn-primary">Register</a>
        </div>
    </div>
</header>

<div class="container main-layout">
    <!-- 左侧文章列表 -->
    <main class="content">
        <!-- 分类筛选 -->
        <div class="filter-bar" id="categoryBar">
            <span class="filter-item active" data-id="">All</span>
        </div>

        <div id="articleList"><div class="loading">Loading...</div></div>

        <div class="pagination" id="pagination"></div>
    </main>

    <!-- 右侧边栏 -->
    <aside class="sidebar">
        <!-- 热门文章 -->
        <div class="widget">
            <div class="widget-title"> Popular</div>
            <div id="hotList"><div class="loading">Loading...</div></div>
        </div>
        <!-- 热门标签 -->
        <div class="widget">
            <div class="widget-title">🏷️ Tags</div>
            <div class="tag-cloud" id="tagCloud"><div class="loading">Loading...</div></div>
        </div>
    </aside>
</div>

<footer class="footer">
    <div class="container">© 2024 Celeste Blog · Explore the stars</div>
</footer>

<script src="js/api.js"></script>
<script src="js/auth.js"></script>
<script>
    // ===== 雪花粒子系统 =====
    const snowCanvas = document.getElementById('snowCanvas');
    const snowCtx = snowCanvas.getContext('2d');
    let snowflakes = [];
    let snowAnimFrame = null;

    function resizeSnowCanvas() {
        snowCanvas.width = window.innerWidth;
        snowCanvas.height = window.innerHeight;
    }

    function createSnowflake() {
        return {
            x: Math.random() * snowCanvas.width,
            y: -10,
            r: Math.random() * 3 + 1,
            speed: Math.random() * 1.5 + 0.5,
            wind: Math.random() * 0.5 - 0.25,
            opacity: Math.random() * 0.6 + 0.2,
            swing: Math.random() * Math.PI * 2,
            swingSpeed: Math.random() * 0.02 + 0.01
        };
    }

    function initSnowflakes() {
        snowflakes = [];
        for (let i = 0; i < 80; i++) {
            const f = createSnowflake();
            f.y = Math.random() * snowCanvas.height;
            snowflakes.push(f);
        }
    }

    function drawSnowflakes() {
        snowCtx.clearRect(0, 0, snowCanvas.width, snowCanvas.height);
        for (const f of snowflakes) {
            f.y += f.speed;
            f.swing += f.swingSpeed;
            f.x += Math.sin(f.swing) * 0.5 + f.wind;
            if (f.y > snowCanvas.height + 10) { f.y = -10; f.x = Math.random() * snowCanvas.width; }
            if (f.x > snowCanvas.width + 10) f.x = -10;
            if (f.x < -10) f.x = snowCanvas.width + 10;
            snowCtx.beginPath();
            snowCtx.arc(f.x, f.y, f.r, 0, Math.PI * 2);
            snowCtx.fillStyle = `rgba(255,255,255,${f.opacity})`;
            snowCtx.fill();
        }
        snowAnimFrame = requestAnimationFrame(drawSnowflakes);
    }

    function startSnow() { resizeSnowCanvas(); initSnowflakes(); drawSnowflakes(); }
    window.addEventListener('resize', resizeSnowCanvas);
    startSnow();

    // BGM
    const bgmPlayer = document.getElementById('bgmPlayer');
    const savedTime = parseFloat(localStorage.getItem('bgmTime') || '0');
    if (savedTime > 0) bgmPlayer.currentTime = savedTime;
    bgmPlayer.volume = 0.25;
    bgmPlayer.play().catch(() => {});
    setInterval(() => { localStorage.setItem('bgmTime', bgmPlayer.currentTime); }, 2000);
    function tryPlayBGM() { bgmPlayer.play().then(() => { document.removeEventListener('click', tryPlayBGM); document.removeEventListener('keydown', tryPlayBGM); }).catch(() => {}); }
    document.addEventListener('click', tryPlayBGM);
    document.addEventListener('keydown', tryPlayBGM);

    const PAGE_SIZE = 10;
    let currentPage = 1;
    let currentCategory = '';

    // 初始化
    initHeader();
    loadCategories();
    loadArticles(1);
    loadHotArticles();
    loadHotTags();

    function loadCategories() {
        api('/categorys', 'GET').then(res => {
            if (!res.success) return;
            const bar = document.getElementById('categoryBar');
            res.data.forEach(c => {
                const span = document.createElement('span');
                span.className = 'filter-item';
                span.dataset.id = c.id;
                span.textContent = c.categoryName || c.name;
                span.onclick = () => {
                    document.querySelectorAll('.filter-item').forEach(el => el.classList.remove('active'));
                    span.classList.add('active');
                    currentCategory = c.id;
                    loadArticles(1);
                };
                bar.appendChild(span);
            });
        });
    }

    function loadArticles(page) {
        currentPage = page;
        document.getElementById('articleList').innerHTML = '<div class="loading">加载中...</div>';
        const body = { page: page, pageSize: PAGE_SIZE };
        if (currentCategory) body.categoryId = currentCategory;
        api('/articles', 'POST', body).then(res => {
            if (!res.success) { document.getElementById('articleList').innerHTML = '<div class="empty">加载失败</div>'; return; }
            renderArticles(res.data.records || res.data);
            renderPagination(res.data.total || 0, page);
        });
    }

    function renderArticles(list) {
        if (!list || list.length === 0) {
            document.getElementById('articleList').innerHTML = '<div class="empty">暂无文章</div>';
            return;
        }
        const html = list.map(a => `
            <article class="article-card" onclick="location.href='article.html?id=${a.id}'">
                <div class="article-meta">
                    <span class="meta-author"><img class="meta-author-img" src="${(a.author?.nickname || a.author?.username) ? 'celeste-portraits/madeline/normal00.png' : 'celeste-icons/beat.png'}" alt="">${escHtml(a.author?.nickname || a.author?.username || '匿名')}</span>
                    <span class="meta-date"><img class="meta-icon" src="celeste-icons/cs_variantmode.png" alt="">${formatDate(a.createDate)}</span>
                    <span class="meta-views"><img class="meta-icon" src="celeste-icons/time.png" alt="">${a.viewCounts || 0}</span>
                    ${a.category ? `<span class="meta-category">${escHtml(a.category.categoryName || a.category.name)}</span>` : ''}
                </div>
                <h2 class="article-title">${escHtml(a.title)}</h2>
                <p class="article-summary">${escHtml(a.summary || '')}</p>
                <div class="article-tags">
                    ${(a.tags || []).map(t => `<span class="tag">${escHtml(t.tagName || t.name)}</span>`).join('')}
                </div>
            </article>
        `).join('');
        document.getElementById('articleList').innerHTML = html;
    }

    function loadHotArticles() {
        api('/articles/hot', 'POST').then(res => {
            if (!res.success) return;
            const RANK_ICONS = [
                'celeste-collectables/goldberry.png',
                'celeste-collectables/strawberry.png',
                'celeste-icons/heartgem1.png',
                'celeste-icons/heartgem0.png',
                'celeste-icons/fullclear.png'
            ];
            const html = (res.data || []).map((a, i) => `
                <div class="hot-item" onclick="location.href='article.html?id=${a.id}'">
                    <span class="hot-rank rank-${i+1}">${RANK_ICONS[i] ? `<img src="${RANK_ICONS[i]}" alt="${i+1}">` : (i+1)}</span>
                    <span class="hot-title">${escHtml(a.title)}</span>
                </div>
            `).join('');
            document.getElementById('hotList').innerHTML = html || '<div class="empty">暂无数据</div>';
        });
    }

    function loadHotTags() {
        api('/tags/hot', 'GET').then(res => {
            if (!res.success) return;
            const html = (res.data || []).map(t =>
                `<span class="tag tag-link" onclick="filterByTag(${t.id})">${escHtml(t.tagName || t.name)}</span>`
            ).join('');
            document.getElementById('tagCloud').innerHTML = html || '<div class="empty">暂无标签</div>';
        });
    }

    function filterByTag(tagId) {
        // 按标签筛选（传给文章列表）
        currentCategory = '';
        document.querySelectorAll('.filter-item').forEach(el => el.classList.remove('active'));
        document.querySelector('.filter-item[data-id=""]').classList.add('active');
        loadArticles(1);
    }

    function renderPagination(total, page) {
        const totalPages = Math.ceil(total / PAGE_SIZE) || 1;
        const el = document.getElementById('pagination');
        if (totalPages <= 1) { el.innerHTML = ''; return; }
        let html = '';
        if (page > 1) html += `<button class="page-btn" onclick="loadArticles(${page-1})">‹ 上一页</button>`;
        html += `<span class="page-info">第 ${page} / ${totalPages} 页</span>`;
        if (page < totalPages) html += `<button class="page-btn" onclick="loadArticles(${page+1})">下一页 ›</button>`;
        el.innerHTML = html;
    }
</script>
</body>
</html>
