<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="icon/OIP.webp" type="image/webp">
    <title>Register - Celeste Blog</title>
    <link rel="stylesheet" href="css/common.css">
    <style>
        body { display:flex; align-items:center; justify-content:center; min-height:100vh; }
        body::after {
            content:''; position:fixed; inset:0;
            background:url('celeste-areas/ForsakenCity01.png') center/cover no-repeat;
            opacity:.25; pointer-events:none; z-index:0;
        }
        .register-box {
            background:rgba(22,34,60,.92);
            border:2px solid #ffe36d;
            border-radius:10px;
            padding:36px;
            width:400px;
            box-shadow:0 8px 40px rgba(0,0,0,.6), 0 0 24px rgba(255,227,109,.15);
            position:relative; z-index:1;
        }
        .register-box h2 {
            text-align:center; font-size:20px; color:#ffe36d;
            font-family:'Courier New', monospace; letter-spacing:2px; margin-bottom:6px;
        }
        .register-box .sub { text-align:center; color:#7788aa; font-size:13px; margin-bottom:22px; }
        .register-madeline { display:block; width:64px; height:64px; border-radius:50%; margin:0 auto 14px; border:2px solid #ffe36d; box-shadow:0 0 14px rgba(255,227,109,.4); }
        .register-box .form-group { margin-bottom:14px; }
        .register-box .form-group label { color:#aab8d0; font-size:13px; }
        .register-box .form-control { background:#0f1830; border:1px solid #3a4a6a; color:#e8e8f0; }
        .register-box .form-control:focus { border-color:#ffe36d; box-shadow:0 0 10px rgba(255,227,109,.3); background:#141f3a; }
        .register-box .btn-primary {
            width:100%; padding:13px; font-size:15px; margin-top:6px;
            background:#ffe36d; color:#111; font-weight:bold;
            border-radius:6px; box-shadow:inset 0 -3px #c9a93f;
            font-family:'Courier New', monospace; letter-spacing:4px;
        }
        .register-box .btn-primary:hover { background:#ffeb85; transform:none; box-shadow:inset 0 -3px #c9a93f, 0 0 14px rgba(255,227,109,.5); }
        .register-footer { text-align:center; margin-top:16px; font-size:13px; color:#7788aa; }
        .register-footer a { color:#ffe36d; }
        .register-footer a:hover { text-shadow:0 0 8px rgba(255,227,109,.6); }
        .snow-strip {
            position:fixed; left:0; right:0; bottom:0;
            height:80px;
            background:url('celeste-areas/snow-front.png') repeat-x bottom/220px auto;
            animation:snowDrift 45s linear infinite;
            pointer-events:none;
            z-index:2;
            opacity:.5;
        }
        @keyframes snowDrift { from{background-position-x:0} to{background-position-x:-440px} }
    </style>
</head>
<body>
    <!-- BGM 播放器（index 同款，进度接续） -->
    <audio id="bgmPlayer" loop autoplay>
        <source src="bgm/postcard.mp3" type="audio/mpeg">
    </audio>
    <!-- 雪花粒子系统（index 同款） -->
    <canvas id="snowCanvas" style="position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:0;"></canvas>
    <div class="snow-strip"></div>
<div class="register-box">
    <img class="register-madeline" src="celeste-portraits/madeline/peaceful00.png" alt="Madeline">
    <h2>NEW TRAVELER</h2>
    <p class="sub">Start your climb up the mountain.</p>
    <div class="form-group">
        <label>账号</label>
        <input class="form-control" type="text" id="account" placeholder="请输入账号（字母/数字）" autofocus>
    </div>
    <div class="form-group">
        <label>昵称</label>
        <input class="form-control" type="text" id="nickname" placeholder="请输入昵称">
    </div>
    <div class="form-group">
        <label>密码</label>
        <input class="form-control" type="password" id="password" placeholder="请输入密码（至少6位）">
    </div>
    <div class="form-group">
        <label>确认密码</label>
        <input class="form-control" type="password" id="password2" placeholder="再次输入密码" onkeyup="if(event.key==='Enter')doRegister()">
    </div>
    <div class="form-error" id="errMsg"></div>
    <button class="btn btn-primary" onclick="doRegister()" id="regBtn">注 册</button>
    <div class="register-footer">已有账号？<a href="login.html">立即登录</a></div>
</div>
<script src="js/api.js"></script>
<script>
    if (localStorage.getItem('token')) location.href = 'index.html';

    // ===== 雪花粒子系统（index 同款） =====
    const snowCanvas = document.getElementById('snowCanvas');
    const snowCtx = snowCanvas.getContext('2d');
    let snowflakes = [];
    let snowAnimFrame = null;

    function resizeSnowCanvas() {
        snowCanvas.width = window.innerWidth;
        snowCanvas.height = window.innerHeight;
    }

    function createSnowflake() {
        return {
            x: Math.random() * snowCanvas.width,
            y: -10,
            r: Math.random() * 3 + 1,
            speed: Math.random() * 1.5 + 0.5,
            wind: Math.random() * 0.5 - 0.25,
            opacity: Math.random() * 0.6 + 0.2,
            swing: Math.random() * Math.PI * 2,
            swingSpeed: Math.random() * 0.02 + 0.01
        };
    }

    function initSnowflakes() {
        snowflakes = [];
        for (let i = 0; i < 80; i++) {
            const f = createSnowflake();
            f.y = Math.random() * snowCanvas.height;
            snowflakes.push(f);
        }
    }

    function drawSnowflakes() {
        snowCtx.clearRect(0, 0, snowCanvas.width, snowCanvas.height);
        for (const f of snowflakes) {
            f.y += f.speed;
            f.swing += f.swingSpeed;
            f.x += Math.sin(f.swing) * 0.5 + f.wind;
            if (f.y > snowCanvas.height + 10) { f.y = -10; f.x = Math.random() * snowCanvas.width; }
            if (f.x > snowCanvas.width + 10) f.x = -10;
            if (f.x < -10) f.x = snowCanvas.width + 10;
            snowCtx.beginPath();
            snowCtx.arc(f.x, f.y, f.r, 0, Math.PI * 2);
            snowCtx.fillStyle = `rgba(255,255,255,${f.opacity})`;
            snowCtx.fill();
        }
        snowAnimFrame = requestAnimationFrame(drawSnowflakes);
    }

    function startSnow() { resizeSnowCanvas(); initSnowflakes(); drawSnowflakes(); }
    window.addEventListener('resize', resizeSnowCanvas);
    startSnow();

    // ===== BGM（index 同款：进度接续 + 自动播放兜底） =====
    const bgmPlayer = document.getElementById('bgmPlayer');
    const savedTime = parseFloat(localStorage.getItem('bgmTime') || '0');
    if (savedTime > 0) bgmPlayer.currentTime = savedTime;
    bgmPlayer.volume = 0.25;
    bgmPlayer.play().catch(() => {});
    setInterval(() => { localStorage.setItem('bgmTime', bgmPlayer.currentTime); }, 2000);
    function tryPlayBGM() { bgmPlayer.play().then(() => { document.removeEventListener('click', tryPlayBGM); document.removeEventListener('keydown', tryPlayBGM); }).catch(() => {}); }
    document.addEventListener('click', tryPlayBGM);
    document.addEventListener('keydown', tryPlayBGM);

    // ===== 音效 =====
    function playSfx(name) {
        try {
            const a = new Audio('celeste-sounds/' + name);
            a.volume = 0.8;
            a.currentTime = 0;
            a.play().catch(() => {});
        } catch (e) { /* 无声降级 */ }
    }

    // 点击"立即登录"音效，播完主体再跳页（登录页会识别标记，不重复播进入音效）
    document.querySelector('.register-footer a').addEventListener('click', e => {
        e.preventDefault();
        playSfx('ui_main_assistmode_whistle_page1.wav');
        try { sessionStorage.setItem('sfxNavAt', String(Date.now())); } catch (err) {}
        setTimeout(() => location.href = 'login.html', 700);
    });

    function doRegister() {
        playSfx('ui_main_assistmode_whistle_page2.wav');
        const account = document.getElementById('account').value.trim();
        const nickname = document.getElementById('nickname').value.trim();
        const password = document.getElementById('password').value.trim();
        const password2 = document.getElementById('password2').value.trim();
        document.getElementById('errMsg').style.display = 'none';

        if (!account) { showErr('请输入账号'); return; }
        if (account.length < 3) { showErr('账号至少3个字符'); return; }
        if (!nickname) { showErr('请输入昵称'); return; }
        if (!password) { showErr('请输入密码'); return; }
        if (password.length < 6) { showErr('密码至少6位'); return; }
        if (password !== password2) { showErr('两次密码不一致'); return; }

        const btn = document.getElementById('regBtn');
        btn.disabled = true; btn.textContent = '注册中...';
        document.querySelector('.register-madeline').src = 'celeste-portraits/madeline/determined00.png';

        api('/register', 'POST', { account, password, nickname }).then(res => {
            btn.disabled = false; btn.textContent = '注 册';
            if (res.success) {
                playSfx('ui_main_assistmode_whistle_page3.wav');
                showToast('注册成功，请登录', 'success');
                setTimeout(() => location.href = 'login.html', 1500);
            } else {
                showErr(res.msg || '注册失败，账号可能已存在');
            }
        });
    }

    function showErr(msg) {
        const el = document.getElementById('errMsg');
        el.textContent = msg; el.style.display = 'block';
        document.querySelector('.register-madeline').src = 'celeste-portraits/madeline/sad00.png';
    }
</script>
</body>
</html>
