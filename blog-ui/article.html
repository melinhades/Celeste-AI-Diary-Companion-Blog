<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>文章详情 - mszlu博客</title>
    <link rel="stylesheet" href="css/common.css">
    <style>
        .main-layout { display: flex; gap: 24px; padding: 24px 20px; align-items: flex-start; }
        .content { flex: 1; min-width: 0; }
        .sidebar { width: 280px; flex-shrink: 0; display: flex; flex-direction: column; gap: 20px; }

        /* 文章头部 */
        .article-header { background: #fff; border-radius: 10px; padding: 32px; margin-bottom: 20px; box-shadow: 0 2px 8px rgba(0,0,0,0.06); }
        .article-header h1 { font-size: 26px; font-weight: 700; color: #222; line-height: 1.4; margin-bottom: 16px; }
        .article-meta { display: flex; flex-wrap: wrap; gap: 14px; font-size: 13px; color: #aaa; margin-bottom: 14px; }
        .article-tags { display: flex; flex-wrap: wrap; gap: 6px; }

        /* 文章正文 */
        .article-body { background: #fff; border-radius: 10px; padding: 32px; margin-bottom: 20px; box-shadow: 0 2px 8px rgba(0,0,0,0.06); line-height: 1.9; font-size: 15px; color: #444; }
        .article-body h1,.article-body h2,.article-body h3 { margin: 24px 0 12px; color: #222; }
        .article-body p { margin-bottom: 14px; }
        .article-body pre { background: #f8f8f8; border-radius: 8px; padding: 16px; overflow-x: auto; margin: 16px 0; font-size: 13px; }
        .article-body code { background: #f0f0f0; padding: 2px 6px; border-radius: 4px; font-size: 13px; }
        .article-body pre code { background: none; padding: 0; }
        .article-body blockquote { border-left: 4px solid #4f46e5; padding: 8px 16px; background: #f8f7ff; margin: 16px 0; color: #666; border-radius: 0 6px 6px 0; }
        .article-body img { max-width: 100%; border-radius: 8px; }
        .article-body ul,.article-body ol { padding-left: 24px; margin-bottom: 14px; }
        .article-body li { margin-bottom: 6px; }

        /* 评论区 */
        .comments-section { background: #fff; border-radius: 10px; padding: 28px 32px; box-shadow: 0 2px 8px rgba(0,0,0,0.06); }
        .comments-title { font-size: 17px; font-weight: 600; margin-bottom: 20px; padding-bottom: 12px; border-bottom: 2px solid #f0f0ff; }
        .comment-form { margin-bottom: 28px; }
        .comment-form textarea { width: 100%; padding: 12px 14px; border: 1px solid #ddd; border-radius: 8px; font-size: 14px; outline: none; resize: vertical; min-height: 90px; font-family: inherit; transition: border-color 0.2s; }
        .comment-form textarea:focus { border-color: #4f46e5; }
        .comment-form-footer { display: flex; justify-content: flex-end; margin-top: 10px; }
        .comment-item { padding: 16px 0; border-bottom: 1px solid #f5f5f5; }
        .comment-item:last-child { border-bottom: none; }
        .comment-author { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; }
        .comment-avatar { width: 34px; height: 34px; border-radius: 50%; background: #4f46e5; color: #fff; display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 600; flex-shrink: 0; }
        .comment-name { font-size: 14px; font-weight: 500; color: #333; }
        .comment-date { font-size: 12px; color: #bbb; }
        .comment-content { font-size: 14px; color: #555; line-height: 1.7; padding-left: 44px; }

        /* 侧边栏 */
        .widget { background: #fff; border-radius: 10px; padding: 18px 20px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); }
        .widget-title { font-size: 15px; font-weight: 600; color: #333; margin-bottom: 14px; padding-bottom: 10px; border-bottom: 2px solid #f0f0ff; }
        .toc-item { display: block; padding: 5px 0; font-size: 13px; color: #666; cursor: pointer; border-left: 2px solid transparent; padding-left: 10px; transition: all 0.2s; }
        .toc-item:hover { color: #4f46e5; border-left-color: #4f46e5; }
        .hot-item { display: flex; align-items: center; gap: 10px; padding: 8px 0; cursor: pointer; border-bottom: 1px solid #f5f5f5; }
        .hot-item:last-child { border-bottom: none; }
        .hot-item:hover .hot-title { color: #4f46e5; }
        .hot-rank { width: 22px; height: 22px; border-radius: 50%; background: #ddd; color: #fff; font-size: 12px; font-weight: 700; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
        .hot-rank.rank-1 { background: #e74c3c; }
        .hot-rank.rank-2 { background: #e67e22; }
        .hot-rank.rank-3 { background: #f1c40f; color: #333; }
        .hot-title { font-size: 13px; color: #555; line-height: 1.4; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    </style>
</head>
<body>
<header class="header">
    <div class="container header-inner">
        <a href="index.html" class="logo">📝 mszlu博客</a>
        <nav class="nav">
            <a href="index.html" class="nav-link">首页</a>
            <a href="archives.html" class="nav-link">归档</a>
        </nav>
        <div class="header-right" id="headerRight"></div>
    </div>
</header>

<div class="container main-layout">
    <main class="content">
        <div id="articleHeader"><div class="loading">加载中...</div></div>
        <div id="articleBody"></div>
        <div class="comments-section" id="commentsSection" style="display:none">
            <div class="comments-title">💬 评论</div>
            <div class="comment-form" id="commentForm">
                <textarea id="commentContent" placeholder="写下你的评论..."></textarea>
                <div class="comment-form-footer">
                    <button class="btn btn-primary btn-sm" onclick="submitComment()">发表评论</button>
                </div>
            </div>
            <div id="commentList"><div class="loading">加载中...</div></div>
        </div>
    </main>

    <aside class="sidebar">
        <div class="widget" id="tocWidget" style="display:none">
            <div class="widget-title">📋 目录</div>
            <div id="tocList"></div>
        </div>
        <div class="widget">
            <div class="widget-title">🔥 热门文章</div>
            <div id="hotList"><div class="loading">加载中...</div></div>
        </div>
    </aside>
</div>

<footer class="footer">
    <div class="container">© 2024 mszlu博客 · Powered by Spring Boot</div>
</footer>

<script src="js/api.js"></script>
<script src="js/auth.js"></script>
<script>
    const articleId = new URLSearchParams(location.search).get('id');
    if (!articleId) location.href = 'index.html';

    initHeader();
    loadArticle();
    loadHotArticles();

    function loadArticle() {
        api(`/articles/article/view/${articleId}`, 'POST').then(res => {
            if (!res.success) {
                document.getElementById('articleHeader').innerHTML = '<div class="empty">文章不存在</div>';
                return;
            }
            const a = res.data;
            document.title = `${a.title} - mszlu博客`;

            // 头部
            document.getElementById('articleHeader').innerHTML = `
                <div class="article-header">
                    <h1>${escHtml(a.title)}</h1>
                    <div class="article-meta">
                        <span>✍️ ${escHtml(a.author?.nickname || a.author?.username || '匿名')}</span>
                        <span>📅 ${formatDate(a.createDate)}</span>
                        <span>👁 ${a.viewCounts || 0} 阅读</span>
                        ${a.category ? `<span>📁 ${escHtml(a.category.categoryName || a.category.name)}</span>` : ''}
                    </div>
                    <div class="article-tags">
                        ${(a.tags || []).map(t => `<span class="tag">${escHtml(t.tagName || t.name)}</span>`).join('')}
                    </div>
                </div>`;

            // 正文
            const body = a.body?.content || a.body?.contentHtml || '';
            document.getElementById('articleBody').innerHTML = `<div class="article-body">${body}</div>`;

            // 生成目录
            buildToc();

            // 评论区
            document.getElementById('commentsSection').style.display = 'block';
            if (!localStorage.getItem('token')) {
                document.getElementById('commentForm').innerHTML = '<p style="color:#aaa;font-size:14px;margin-bottom:16px"><a href="login.html" style="color:#4f46e5">登录</a> 后才能发表评论</p>';
            }
            loadComments();
        });
    }

    function buildToc() {
        const headings = document.querySelectorAll('.article-body h1,.article-body h2,.article-body h3');
        if (headings.length < 2) return;
        const toc = document.getElementById('tocList');
        headings.forEach((h, i) => {
            h.id = `heading-${i}`;
            const indent = h.tagName === 'H1' ? 0 : h.tagName === 'H2' ? 10 : 20;
            const item = document.createElement('a');
            item.className = 'toc-item';
            item.style.paddingLeft = `${10 + indent}px`;
            item.textContent = h.textContent;
            item.onclick = () => h.scrollIntoView({ behavior: 'smooth', block: 'start' });
            toc.appendChild(item);
        });
        document.getElementById('tocWidget').style.display = 'block';
    }

    function loadComments() {
        api(`/comments/article/${articleId}`, 'GET').then(res => {
            if (!res.success) { document.getElementById('commentList').innerHTML = '<div class="empty">暂无评论</div>'; return; }
            const list = res.data || [];
            if (list.length === 0) { document.getElementById('commentList').innerHTML = '<div class="empty">暂无评论，快来抢沙发吧</div>'; return; }
            document.getElementById('commentList').innerHTML = list.map(c => `
                <div class="comment-item">
                    <div class="comment-author">
                        <div class="comment-avatar">${escHtml((c.author?.nickname || c.author?.username || '?').charAt(0).toUpperCase())}</div>
                        <div>
                            <div class="comment-name">${escHtml(c.author?.nickname || c.author?.username || '匿名')}</div>
                            <div class="comment-date">${formatDate(c.createDate)}</div>
                        </div>
                    </div>
                    <div class="comment-content">${escHtml(c.content)}</div>
                </div>
            `).join('');
        });
    }

    function submitComment() {
        if (!requireLogin()) return;
        const content = document.getElementById('commentContent').value.trim();
        if (!content) { showToast('请输入评论内容', 'error'); return; }
        api('/comments/create/change', 'POST', { articleId, content }).then(res => {
            if (res.success) {
                document.getElementById('commentContent').value = '';
                showToast('评论成功', 'success');
                loadComments();
            } else {
                showToast(res.msg || '评论失败', 'error');
            }
        });
    }

    function loadHotArticles() {
        api('/articles/hot', 'POST').then(res => {
            if (!res.success) return;
            document.getElementById('hotList').innerHTML = (res.data || []).map((a, i) => `
                <div class="hot-item" onclick="location.href='article.html?id=${a.id}'">
                    <span class="hot-rank rank-${i+1}">${i+1}</span>
                    <span class="hot-title">${escHtml(a.title)}</span>
                </div>
            `).join('') || '<div class="empty">暂无数据</div>';
        });
    }
</script>
</body>
</html>
