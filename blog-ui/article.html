<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="icon/OIP.webp" type="image/webp">
    <title>Article - Celeste Blog</title>
    <link rel="stylesheet" href="css/common.css">
    <style>
    body::after {
        content:'';
        position:fixed; inset:0;
        background:url('celeste-areas/bg_calm.png') center bottom/cover no-repeat;
        opacity:0.15;
        pointer-events:none;
        z-index:0;
    }
    .nav-diary-btn {
        display:inline-block;
        cursor:pointer;
        transition:transform .2s, filter .2s;
        vertical-align:middle;
    }
    .nav-diary-btn:hover {
        transform:scale(1.15);
    }
    .nav-diary-btn img {
        height:36px;
        width:auto;
        display:block;
        filter:drop-shadow(0 0 10px rgba(255,235,59,0.7));
    }
    .main-layout { display: flex; gap: 24px; padding: 24px 20px; align-items: flex-start; }
        .content { flex: 1; min-width: 0; }
        .sidebar { width: 280px; flex-shrink: 0; display: flex; flex-direction: column; gap: 20px; }

        /* 文章头部 */
        .article-header { background: rgba(30, 27, 75, 0.6); backdrop-filter: blur(10px); border: 1px solid rgba(138,43,226,0.2); border-radius: 10px; padding: 32px; margin-bottom: 20px; box-shadow: 0 4px 20px rgba(0,0,0,0.3); }
        .article-header h1 { font-size: 26px; font-weight: 700; color: #e8e8f0; line-height: 1.4; margin-bottom: 16px; text-shadow: 0 0 20px rgba(138,43,226,0.3); }
        .article-meta { display: flex; flex-wrap: wrap; gap: 14px; font-size: 13px; color: #8b8ba0; margin-bottom: 14px; }
        .article-tags { display: flex; flex-wrap: wrap; gap: 6px; }

        /* 文章正文 */
        .article-body { background: rgba(30, 27, 75, 0.6); backdrop-filter: blur(10px); border: 1px solid rgba(138,43,226,0.2); border-radius: 10px; padding: 32px; margin-bottom: 20px; box-shadow: 0 4px 20px rgba(0,0,0,0.3); line-height: 1.9; font-size: 15px; color: #c9c9dd; }
        .article-body h1,.article-body h2,.article-body h3 { margin: 24px 0 12px; color: #e8e8f0; }
        .article-body a { color: #a78bfa; }
        .article-body p { margin-bottom: 14px; }
        .article-body pre { background: rgba(15, 12, 41, 0.8); border: 1px solid rgba(138,43,226,0.25); border-radius: 8px; padding: 16px; overflow-x: auto; margin: 16px 0; font-size: 13px; color: #d8d8ea; }
        .article-body code { background: rgba(138,43,226,0.18); color: #c4b5fd; padding: 2px 6px; border-radius: 4px; font-size: 13px; }
        .article-body pre code { background: none; padding: 0; color: inherit; }
        .article-body blockquote { border-left: 4px solid #a78bfa; padding: 8px 16px; background: rgba(138,43,226,0.08); margin: 16px 0; color: #a8a8c0; border-radius: 0 6px 6px 0; }
        .article-body img { max-width: 100%; border-radius: 8px; }
        .article-body ul,.article-body ol { padding-left: 24px; margin-bottom: 14px; }
        .article-body li { margin-bottom: 6px; }

        /* 评论区 */
        .comments-section { background: rgba(30, 27, 75, 0.6); backdrop-filter: blur(10px); border: 1px solid rgba(138,43,226,0.2); border-radius: 10px; padding: 28px 32px; box-shadow: 0 4px 20px rgba(0,0,0,0.3); }
        .comments-title { font-size: 17px; font-weight: 600; margin-bottom: 20px; padding-bottom: 12px; border-bottom: 2px solid rgba(138,43,226,0.25); color: #e8e8f0; }
        .comment-form { margin-bottom: 28px; }
        .comment-form textarea { width: 100%; padding: 12px 14px; border: 1px solid rgba(138,43,226,0.3); border-radius: 8px; font-size: 14px; outline: none; resize: vertical; min-height: 90px; font-family: inherit; transition: all 0.3s; background: rgba(15, 12, 41, 0.5); color: #e8e8f0; }
        .comment-form textarea:focus { border-color: #a78bfa; box-shadow: 0 0 15px rgba(138,43,226,0.3); }
        .comment-form-footer { display: flex; justify-content: flex-end; margin-top: 10px; }
        .comment-item { padding: 16px 0; border-bottom: 1px solid rgba(138,43,226,0.12); }
        .comment-item:last-child { border-bottom: none; }
        .comment-author { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; }
        .comment-avatar { width: 34px; height: 34px; border-radius: 50%; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: #fff; display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 600; flex-shrink: 0; box-shadow: 0 0 12px rgba(138,43,226,0.4); }
        .comment-name { font-size: 14px; font-weight: 500; color: #e8e8f0; }
        .comment-date { font-size: 12px; color: #8b8ba0; }
        .comment-content { font-size: 14px; color: #c9c9dd; line-height: 1.7; padding-left: 44px; }
        .hot-title { font-size: 13px; color: #c9c9dd; line-height: 1.4; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
        .comment-avatar img { width: 100%; height: 100%; object-fit: cover; image-rendering: pixelated; border-radius: 50%; }

    /* 阅读进度条 */
    #readProgress { position: fixed; top: 0; left: 0; height: 3px; width: 0; z-index: 999; background: linear-gradient(90deg, #667eea, #a78bfa, #ffe36d); box-shadow: 0 0 10px rgba(167,139,250,0.8); transition: width 0.1s linear; }
    /* 羽毛回顶 */
    #backToTop { position: fixed; right: 28px; bottom: 36px; width: 46px; height: 46px; z-index: 99; cursor: pointer; opacity: 0; pointer-events: none; transition: opacity 0.4s, transform 0.2s; }
    #backToTop.show { opacity: 1; pointer-events: auto; }
    #backToTop:hover { transform: translateY(-4px); }
    #backToTop img { width: 100%; height: 100%; image-rendering: pixelated; filter: drop-shadow(0 0 8px rgba(167,139,250,0.7)); }

    #articleLoadingOverlay {
        position: fixed; inset: 0; z-index: 9999;
        background: rgba(10, 10, 30, 0.92);
        display: flex; flex-direction: column;
        align-items: center; justify-content: center;
        transition: opacity 0.6s ease;
    }
    #articleLoadingOverlay.fade-out { opacity: 0; pointer-events: none; }
    #articleLoadingOverlay .loading-madeline {
        width: 120px; height: 120px;
        background-size: contain; background-repeat: no-repeat; background-position: center;
        animation: loadingRun 0.72s steps(9) infinite;
    }
    @keyframes loadingRun {
        0%   { background-image: url('celeste-gui/loading/00.png'); }
        11%  { background-image: url('celeste-gui/loading/01.png'); }
        22%  { background-image: url('celeste-gui/loading/02.png'); }
        33%  { background-image: url('celeste-gui/loading/03.png'); }
        44%  { background-image: url('celeste-gui/loading/04.png'); }
        55%  { background-image: url('celeste-gui/loading/05.png'); }
        66%  { background-image: url('celeste-gui/loading/06.png'); }
        77%  { background-image: url('celeste-gui/loading/07.png'); }
        88%  { background-image: url('celeste-gui/loading/08.png'); }
    }
    #articleLoadingOverlay .loading-text {
        margin-top: 20px; color: #ffe36d;
        font-family: 'Press Start 2P', monospace; font-size: 13px;
        letter-spacing: 2px;
    }
    #articleLoadingOverlay .loading-dots::after {
        content: ''; animation: dots 1.5s steps(4, end) infinite;
    }
    @keyframes dots {
        0%   { content: ''; }
        25%  { content: '.'; }
        50%  { content: '..'; }
        75%  { content: '...'; }
    }
    </style>
</head>
<body>
    <!-- BGM 播放器 -->
    <audio id="bgmPlayer" loop autoplay>
        <source src="bgm/postcard.mp3" type="audio/mpeg">
    </audio>

    <!-- 加载动画 -->
    <div id="articleLoadingOverlay">
        <div class="loading-madeline"></div>
        <div class="loading-text">Climbing<span class="loading-dots"></span></div>
    </div>

    <!-- 雪花粒子系统 -->
    <canvas id="snowCanvas" style="position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:0;"></canvas>

    <!-- 阅读进度条 + 回顶羽毛 -->
    <div id="readProgress"></div>
    <div id="backToTop" title="Back to top"><img src="celeste-feather/feather0.png" alt=""></div>

<header class="header">
    <div class="container header-inner">
        <a href="index.html" class="logo"><img src="celeste-gui/logo.png" alt="Celeste"></a>
        <nav class="nav">
            <a href="index.html" class="nav-link">Home</a>
            <a href="archives.html" class="nav-link">Archives</a>
            <a href="diary.html" class="nav-link nav-diary-btn" title="Diary with Madeline">
                <img src="celeste-gui/journal.png" alt="Diary">
            </a>
        </nav>
        <div class="header-right" id="headerRight"></div>
    </div>
</header>

<div class="container main-layout">
    <main class="content">
        <div id="articleHeader"><div class="loading">Loading...</div></div>
        <div id="articleBody"></div>
        <div class="comments-section" id="commentsSection" style="display:none">
            <div class="comments-title">💬 Comments</div>
            <div class="comment-form" id="commentForm">
                <textarea id="commentContent" placeholder="Write a comment..."></textarea>
                <div class="comment-form-footer">
                    <button class="btn btn-primary btn-sm" onclick="submitComment()">Post Comment</button>
                </div>
            </div>
            <div id="commentList"><div class="loading">Loading...</div></div>
        </div>
    </main>

    <aside class="sidebar">
        <div class="widget" id="tocWidget" style="display:none">
            <div class="widget-title"> Contents</div>
            <div id="tocList"></div>
        </div>
        <div class="widget">
            <div class="widget-title">🔥 Popular</div>
            <div id="hotList"><div class="loading">Loading...</div></div>
        </div>
    </aside>
</div>

<footer class="footer">
    <div class="container">© 2026 Celeste Blog · Explore the stars</div>
</footer>

<script src="js/api.js"></script>
<script src="js/auth.js"></script>
<script>
    // ===== 雪花粒子系统 =====
    const snowCanvas = document.getElementById('snowCanvas');
    const snowCtx = snowCanvas.getContext('2d');
    let snowflakes = [];
    let snowAnimFrame = null;

    function resizeSnowCanvas() {
        snowCanvas.width = window.innerWidth;
        snowCanvas.height = window.innerHeight;
    }

    function createSnowflake() {
        return {
            x: Math.random() * snowCanvas.width,
            y: -10,
            r: Math.random() * 3 + 1,
            speed: Math.random() * 1.5 + 0.5,
            wind: Math.random() * 0.5 - 0.25,
            opacity: Math.random() * 0.6 + 0.2,
            swing: Math.random() * Math.PI * 2,
            swingSpeed: Math.random() * 0.02 + 0.01
        };
    }

    function initSnowflakes() {
        snowflakes = [];
        for (let i = 0; i < 80; i++) {
            const f = createSnowflake();
            f.y = Math.random() * snowCanvas.height;
            snowflakes.push(f);
        }
    }

    function drawSnowflakes() {
        snowCtx.clearRect(0, 0, snowCanvas.width, snowCanvas.height);
        for (const f of snowflakes) {
            f.y += f.speed;
            f.swing += f.swingSpeed;
            f.x += Math.sin(f.swing) * 0.5 + f.wind;
            if (f.y > snowCanvas.height + 10) { f.y = -10; f.x = Math.random() * snowCanvas.width; }
            if (f.x > snowCanvas.width + 10) f.x = -10;
            if (f.x < -10) f.x = snowCanvas.width + 10;
            snowCtx.beginPath();
            snowCtx.arc(f.x, f.y, f.r, 0, Math.PI * 2);
            snowCtx.fillStyle = `rgba(255,255,255,${f.opacity})`;
            snowCtx.fill();
        }
        snowAnimFrame = requestAnimationFrame(drawSnowflakes);
    }

    function startSnow() { resizeSnowCanvas(); initSnowflakes(); drawSnowflakes(); }
    window.addEventListener('resize', resizeSnowCanvas);
    startSnow();

    // BGM
    const bgmPlayer = document.getElementById('bgmPlayer');
    const savedTime = parseFloat(localStorage.getItem('bgmTime') || '0');
    if (savedTime > 0) bgmPlayer.currentTime = savedTime;
    bgmPlayer.volume = 0.25;
    bgmPlayer.play().catch(() => {});
    setInterval(() => { localStorage.setItem('bgmTime', bgmPlayer.currentTime); }, 2000);
    function tryPlayBGM() { bgmPlayer.play().then(() => { document.removeEventListener('click', tryPlayBGM); document.removeEventListener('keydown', tryPlayBGM); }).catch(() => {}); }
    document.addEventListener('click', tryPlayBGM);
    document.addEventListener('keydown', tryPlayBGM);

    // 阅读进度条 + 回顶
    const readProgress = document.getElementById('readProgress');
    const backToTop = document.getElementById('backToTop');
    window.addEventListener('scroll', () => {
        const h = document.documentElement;
        const max = h.scrollHeight - h.clientHeight;
        readProgress.style.width = (max > 0 ? (h.scrollTop / max) * 100 : 0) + '%';
        backToTop.classList.toggle('show', h.scrollTop > 400);
    });
    backToTop.onclick = () => window.scrollTo({ top: 0, behavior: 'smooth' });

    const articleId = new URLSearchParams(location.search).get('id');
    if (!articleId) location.href = 'index.html';

    initHeader();
    loadArticle();
    loadHotArticles();

    function loadArticle() {
        api(`/articles/article/view/${articleId}`, 'POST').then(res => {
            const overlay = document.getElementById('articleLoadingOverlay');
            if (overlay) { overlay.classList.add('fade-out'); setTimeout(() => overlay.remove(), 700); }
            if (!res.success) {
                document.getElementById('articleHeader').innerHTML = '<div class="empty">Article not found</div>';
                return;
            }
            const a = res.data;
            document.title = `${a.title} - Celeste Blog`;

            const plain = (a.body?.contentHtml || a.body?.content || '').replace(/<[^>]+>/g, '');
            const readMin = Math.max(1, Math.ceil(plain.length / 400));

            // 头部
            document.getElementById('articleHeader').innerHTML = `
                <div class="article-header">
                    <h1>${escHtml(a.title)}</h1>
                    <div class="article-meta">
                        <span>✍️ ${escHtml(a.author?.nickname || a.author?.username || 'Anonymous')}</span>
                        <span>📅 ${formatDate(a.createDate)}</span>
                        <span>👁 ${a.viewCounts || 0} Reads</span>
                        <span>⏳ ~${readMin} min read</span>
                        ${a.category ? `<span>📁 ${escHtml(a.category.categoryName || a.category.name)}</span>` : ''}
                    </div>
                    <div class="article-tags">
                        ${(a.tags || []).map(t => `<span class="tag">${escHtml(t.tagName || t.name)}</span>`).join('')}
                    </div>
                </div>`;

            // 正文
            const body = a.body?.content || a.body?.contentHtml || '';
            document.getElementById('articleBody').innerHTML = `<div class="article-body">${body}</div>`;

            // 生成目录
            buildToc();

            // 评论区
            document.getElementById('commentsSection').style.display = 'block';
            if (!localStorage.getItem('token')) {
                document.getElementById('commentForm').innerHTML = '<p style="color:#aaa;font-size:14px;margin-bottom:16px"><a href="login.html" style="color:#a78bfa">Login</a> to comment</p>';
            }
            loadComments();
        });
    }

    function buildToc() {
        const headings = document.querySelectorAll('.article-body h1,.article-body h2,.article-body h3');
        if (headings.length < 2) return;
        const toc = document.getElementById('tocList');
        headings.forEach((h, i) => {
            h.id = `heading-${i}`;
            const indent = h.tagName === 'H1' ? 0 : h.tagName === 'H2' ? 10 : 20;
            const item = document.createElement('a');
            item.className = 'toc-item';
            item.style.paddingLeft = `${10 + indent}px`;
            item.textContent = h.textContent;
            item.onclick = () => h.scrollIntoView({ behavior: 'smooth', block: 'start' });
            toc.appendChild(item);
        });
        document.getElementById('tocWidget').style.display = 'block';
    }

    const MAD_PORTRAITS = ['normal00.png', 'peaceful00.png', 'determined00.png', 'distracted00.png'];

    function loadComments() {
        api(`/comments/article/${articleId}`, 'GET').then(res => {
            if (!res.success) { document.getElementById('commentList').innerHTML = '<div class="empty">No comments yet</div>'; return; }
            const list = res.data || [];
            if (list.length === 0) { document.getElementById('commentList').innerHTML = '<div class="empty">Be the first to comment!</div>'; return; }
            document.getElementById('commentList').innerHTML = list.map((c, i) => `
                <div class="comment-item">
                    <div class="comment-author">
                        <div class="comment-avatar"><img src="celeste-portraits/madeline/${MAD_PORTRAITS[i % MAD_PORTRAITS.length]}" alt=""></div>
                        <div>
                            <div class="comment-name">${escHtml(c.author?.nickname || c.author?.username || 'Anonymous')}</div>
                            <div class="comment-date">${formatDate(c.createDate)}</div>
                        </div>
                    </div>
                    <div class="comment-content">${escHtml(c.content)}</div>
                </div>
            `).join('');
        });
    }

    function submitComment() {
        if (!requireLogin()) return;
        const content = document.getElementById('commentContent').value.trim();
        if (!content) { showToast('Please enter a comment', 'error'); return; }
        api('/comments/create/change', 'POST', { articleId, content }).then(res => {
            if (res.success) {
                document.getElementById('commentContent').value = '';
                showToast('Comment posted', 'success');
                loadComments();
            } else {
                showToast(res.msg || 'Failed to post comment', 'error');
            }
        });
    }

    function loadHotArticles() {
        api('/articles/hot', 'POST').then(res => {
            if (!res.success) return;
            const RANK_ICONS = [
                'celeste-collectables/goldberry.png',
                'celeste-collectables/strawberry.png',
                'celeste-icons/heartgem1.png',
                'celeste-icons/heartgem0.png',
                'celeste-icons/fullclear.png'
            ];
            document.getElementById('hotList').innerHTML = (res.data || []).map((a, i) => `
                <div class="hot-item" onclick="location.href='article.html?id=${a.id}'">
                    <span class="hot-rank rank-${i+1}">${RANK_ICONS[i] ? `<img src="${RANK_ICONS[i]}" alt="${i+1}">` : (i+1)}</span>
                    <span class="hot-title">${escHtml(a.title)}</span>
                </div>
            `).join('') || '<div class="empty">No data</div>';
        });
    }
</script>
</body>
</html>
