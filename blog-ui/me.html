<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<title>我的空间 · Celeste Blog</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="icon/OIP.webp" type="image/webp">
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<link rel="preload" href="celeste-font-en/Renogare-Regular.otf" as="font" type="font/otf" crossorigin>
<link rel="preload" href="fonts/NotoSansCJKsc-Medium.otf" as="font" type="font/otf" crossorigin>
<style>
* { box-sizing:border-box; margin:0; padding:0; }
@font-face { font-family:'Renogare'; src:url('celeste-font-en/Renogare-Regular.otf') format('opentype'); font-display:swap; }
@font-face { font-family:'CelesteZH'; src:url('fonts/NotoSansCJKsc-Medium.otf') format('opentype'); font-display:swap; }
body { min-height:100vh; background:url('celeste-gui/me-bg.webp') center/cover no-repeat fixed; font-family:'Renogare','CelesteZH','Microsoft YaHei',sans-serif; }
/* 冰山返回主页按钮（同 diary/shop 的 #homePosterBtn） */
#homePosterBtn { position:fixed; top:16px; left:16px; z-index:900; width:96px; height:96px; padding:0; border:none; background:transparent; cursor:pointer; filter:drop-shadow(1px 0 0 #10101c) drop-shadow(-1px 0 0 #10101c) drop-shadow(0 1px 0 #10101c) drop-shadow(0 -1px 0 #10101c); transition:transform .2s, filter .2s; }
#homePosterBtn img { width:100%; height:100%; object-fit:contain; display:block; }
#homePosterBtn:hover { transform:translateY(-2px) scale(1.05); filter:drop-shadow(1px 0 0 #10101c) drop-shadow(-1px 0 0 #10101c) drop-shadow(0 1px 0 #10101c) drop-shadow(0 -1px 0 #10101c) drop-shadow(0 0 10px rgba(200,235,255,1)) drop-shadow(0 0 24px rgba(120,190,255,.8)); }
.wrap { max-width:680px; margin:0 auto; padding:118px 20px 40px; }
.empty { color:rgba(255,255,255,.45); text-align:center; padding:20px; }

/* ===== Celeste 存档卡 + 票根：同尺寸，票根在卡片下方，两侧圆弧露出 ===== */
.meCombo { position:relative; max-width:560px; margin:0 auto 24px; cursor:pointer; user-select:none; }
.meCombo .meCard { position:relative; z-index:2; transition:transform .4s cubic-bezier(.2,.85,.3,1.15); }
.meCombo .meCard img.cardBase, .meCombo .meCard img.cardShine { display:block; width:100%; height:auto; }
.meCombo .meCard img.cardShine { position:absolute; left:0; top:0; opacity:0; pointer-events:none; }
.cePortraitWrap { position:absolute; left:4%; top:50%; transform:translateY(-50%); width:33%; aspect-ratio:1/1; z-index:1; }
.ceAvatar { position:absolute; left:50%; top:50%; transform:translate(-50%,-50%); width:70%; height:70%; object-fit:cover; image-rendering:pixelated; }
.cePortrait { position:absolute; left:0; top:0; width:100%; height:100%; image-rendering:pixelated; pointer-events:none; }
.ceStamps { position:absolute; left:0; top:0; width:100%; height:100%; pointer-events:none; z-index:2; }
.ceStamps img { position:absolute; left:0; top:0; width:100%; height:100%; }
.ceTicketInfo { position:absolute; left:10%; top:25%; width:80%; z-index:3; text-align:center; }
.ceTicketName { font-family:'Renogare','CelesteZH',sans-serif; font-size:26px; color:#35312a; margin-bottom:6px; letter-spacing:1px; }
.ceTicketBerry { display:flex; align-items:center; justify-content:center; gap:6px; }
.ceTicketBerry img { width:24px; height:24px; image-rendering:pixelated; }
.ceCassetteWrap { position:relative; display:inline-block; width:24px; height:24px; }
.ceCassetteWrap img { width:24px; height:24px; image-rendering:pixelated; }
.ceCassetteOutline { position:absolute; left:0; top:0; }
.ceTicketBerry span { font-family:'renogare',monospace; font-size:22px; color:#35312a; }
.meCombo:hover .meCard, .meCombo.open .meCard { transform:translateX(-50%); }
.meCombo .meTicket { position:absolute; left:50%; top:0; transform:translateX(-50%); width:110%; z-index:1; transition:transform .4s cubic-bezier(.2,.85,.3,1.15); }
.meCombo .meTicket img.ticketBase, .meCombo .meTicket img.ticketShine { display:block; width:100%; height:auto; }
.meCombo .meTicket img.ticketShine { position:absolute; left:0; top:0; opacity:0; pointer-events:none; }
.meCombo:hover .meTicket, .meCombo.open .meTicket { transform:translateX(-50%) translateX(50%); }
.cePoemPage { position:relative; max-width:520px; margin:0 auto 24px; text-align:center; cursor:pointer; }
.cePoemPage img { display:block; width:100%; height:auto; }
.cePoemPage span { position:absolute; left:50%; top:50%; transform:translate(-50%,-50%); font-size:15px; color:#35312a; max-width:75%; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.cePoemPage input { position:absolute; left:50%; top:50%; transform:translate(-50%,-50%); font-size:15px; color:#35312a; background:transparent; border:none; border-bottom:1px dashed rgba(53,49,42,.4); text-align:center; width:75%; outline:none; font-family:'Renogare','CelesteZH','Microsoft YaHei',sans-serif; }

/* ===== 情绪图谱 ===== */
.emoChart { position:relative; max-width:520px; margin:0 auto 32px; padding:20px 24px 24px; background:linear-gradient(135deg, rgba(20,28,52,.92), rgba(14,18,36,.95)); border:1px solid rgba(120,160,220,.18); border-radius:6px; box-shadow:0 4px 24px rgba(0,0,0,.4), inset 0 1px 0 rgba(120,160,220,.08); }
.emoChart .emoHeader { display:flex; align-items:center; gap:8px; margin-bottom:14px; }
.emoChart .emoHeader img { width:22px; height:22px; image-rendering:pixelated; }
.emoChart .emoTitle { font-size:13px; color:rgba(220,230,255,.9); letter-spacing:1px; text-transform:uppercase; }
.emoChart .emoSub { font-size:11px; color:rgba(150,170,200,.6); margin-left:auto; }
.emoChart .emoBars { display:flex; flex-direction:column; gap:6px; }
.emoChart .emoBar { display:flex; align-items:center; gap:8px; }
.emoChart .emoBar .emoLabel { width:44px; flex-shrink:0; font-size:12px; color:rgba(200,215,235,.8); text-align:right; }
.emoChart .emoBar .emoTrack { flex:1; height:14px; background:rgba(255,255,255,.06); border-radius:3px; overflow:hidden; position:relative; }
.emoChart .emoBar .emoFill { height:100%; border-radius:3px; transition:width .5s cubic-bezier(.2,.85,.3,1); image-rendering:pixelated; }
.emoChart .emoBar .emoCount { width:28px; flex-shrink:0; font-size:12px; color:rgba(180,200,220,.7); text-align:left; }
.emoChart .emoEmpty { text-align:center; padding:24px 0; color:rgba(150,170,200,.4); font-size:13px; }
.emoChart .emoMonthRow { margin-top:14px; padding-top:12px; border-top:1px solid rgba(120,160,220,.1); }
.emoChart .emoMonthLabel { font-size:11px; color:rgba(150,170,200,.5); margin-bottom:6px; }
.emoChart .emoDots { display:flex; flex-wrap:wrap; gap:3px; }
.emoChart .emoDot { width:12px; height:12px; border-radius:2px; image-rendering:pixelated; cursor:default; }
</style>
</head>
<body>
<audio id="meBgm" loop autoplay>
    <source src="bgm/madeline-and-theo.mp3" type="audio/mpeg">
</audio>
<button id="homePosterBtn" title="回到主页 · My Mountain" onclick="location.href='index.html'">
    <img src="celeste-gui/mymountain_icon.png" alt="My Mountain" loading="lazy" decoding="async">
</button>

<div class="wrap" id="meApp">

    <!-- Celeste 存档卡 + 收集品票根 -->
    <div class="meCombo" id="meCombo">
        <div class="meCard" id="meCard">
            <img class="cardBase" src="namespace/card.png" alt="" loading="lazy" decoding="async">
            <div class="cePortraitWrap">
                <img class="ceAvatar" :src="avatarUrl" alt="" loading="lazy" decoding="async">
                <img class="cePortrait" :src="portraitSrc" alt="" loading="lazy" decoding="async" @error="onPortraitError">
            </div>
            <div class="ceStamps" id="cardStamps">
                <img v-for="s in stamps" :key="s" :src="'celeste-journal/' + s + '.png'" :alt="s">
            </div>
            <img class="cardShine" id="cardShine" src="" alt="" loading="lazy" decoding="async">
        </div>
        <div class="meTicket" id="meTicket">
            <img class="ticketBase" src="namespace/ticket.png" alt="" loading="lazy" decoding="async">
            <div class="ceTicketInfo">
                <div class="ceTicketName">{{ nickname }}</div>
                <div class="ceTicketBerry">
                    <img src="celeste-collectables/strawberry.png" alt="" loading="lazy" decoding="async">
                    <span>× {{ berryCount }}</span>
                    <span class="ceCassetteWrap" style="margin-left:10px;">
                        <img src="namespace/cassette_outline.png" alt="" loading="lazy" decoding="async">
                        <img src="namespace/cassette.png" class="ceCassetteOutline" alt="" loading="lazy" decoding="async">
                    </span>
                    <span style="margin-left:4px;">× {{ diaryCount }}</span>
                    <img src="celeste-feather/feather0.png" alt="" style="width:24px; height:24px; image-rendering:pixelated; margin-left:10px;" loading="lazy" decoding="async">
                    <span style="margin-left:4px;">× {{ featherCount }}</span>
                </div>
            </div>
            <img class="ticketShine" id="ticketShine" src="" alt="" loading="lazy" decoding="async">
        </div>
    </div>

    <div class="cePoemPage" id="cePoemPage" @click="startEdit">
        <img src="namespace/poempage.png" alt="" loading="lazy" decoding="async">
        <span v-if="!editing" id="ticketSig">{{ serverSignature || '点击编辑个性签名' }}</span>
        <input v-else ref="sigInput" type="text" v-model="sigDraft" placeholder="输入个性签名..."
               maxlength="30" @blur="saveSig" @keydown.enter.prevent="($event.target.blur())"
               @click.stop>
    </div>

    <!-- 情绪图谱 -->
    <div class="emoChart" v-if="emoLoaded">
        <div class="emoHeader">
            <img src="celeste-collectables/strawberry.png" alt="" loading="lazy" decoding="async">
            <span class="emoTitle">Emotion Spectrum</span>
            <span class="emoSub">{{ emoTotal }} 篇日记</span>
        </div>
        <div v-if="emoTotal === 0" class="emoEmpty">还没有情绪数据，写一篇日记试试吧</div>
        <template v-else>
            <div class="emoBars">
                <div class="emoBar" v-for="e in emoBars" :key="e.name">
                    <span class="emoLabel">{{ e.name }}</span>
                    <div class="emoTrack">
                        <div class="emoFill" :style="{ width: e.pct + '%', background: e.color }"></div>
                    </div>
                    <span class="emoCount">{{ e.count }}</span>
                </div>
            </div>
            <div class="emoMonthRow" v-if="emoTimeline.length">
                <div class="emoMonthLabel">月度趋势</div>
                <div class="emoDots">
                    <span v-for="(d, i) in emoTimelineDots" :key="i"
                          class="emoDot"
                          :style="{ background: d.color }"
                          :title="d.month + ' · ' + d.name"></span>
                </div>
            </div>
        </template>
    </div>

</div>

<script src="js/api.js?v=20261002"></script>
<script src="js/vue.global.prod.js?v=20261008a"></script>
<script>
    // 字体就绪后强制刷新，让 input 立即切到 Renogare（不需要点击）
    if (document.fonts && document.fonts.ready) {
        document.fonts.ready.then(function() {
            document.body.style.visibility = 'hidden';
            void document.body.offsetHeight;
            document.body.style.visibility = '';
        });
    }

    // ===== BGM（vanilla 保留）=====
    const meBgm = document.getElementById('meBgm');
    const meBgmTime = parseFloat(localStorage.getItem('bgmTimeMe') || '0');
    if (meBgmTime > 0) meBgm.currentTime = meBgmTime;
    meBgm.volume = 0.25;
    meBgm.play().catch(() => {});
    setInterval(() => { localStorage.setItem('bgmTimeMe', meBgm.currentTime); }, 2000);
    function tryPlayMeBgm() { meBgm.play().then(() => { document.removeEventListener('click', tryPlayMeBgm); document.removeEventListener('keydown', tryPlayMeBgm); }).catch(() => {}); }
    document.addEventListener('click', tryPlayMeBgm);
    document.addEventListener('keydown', tryPlayMeBgm);

    // ===== Vue 应用：接管存档卡数据展示与签名编辑 =====
    const { createApp, ref, computed, watch, onMounted, nextTick } = Vue;

    const CARD_STAMPS = ['farewell', 'flag', 'goldberry', 'goldheart', 'heart', 'cassettes'];
    const SIG_PLACEHOLDER = '点击编辑个性签名';

    // shine 帧动画（vanilla，按 ID 操作静态 img，不纳入响应式）
    function createShine(elId, prefix) {
        const el = document.getElementById(elId);
        const frames = [];
        for (let i = 0; i <= 5; i++) frames.push('namespace/' + prefix + '00' + i + '.png');
        frames.forEach(s => { const im = new Image(); im.src = s; });
        let timer = null;
        return function () {
            let i = 0;
            el.src = frames[0];
            el.style.opacity = '1';
            clearInterval(timer);
            timer = setInterval(() => {
                i++;
                if (i >= frames.length) {
                    clearInterval(timer);
                    timer = null;
                    el.style.opacity = '0';
                    return;
                }
                el.src = frames[i];
            }, 90);
        };
    }

    createApp({
        setup() {
            // ===== 状态 =====
            const nickname = ref('--');
            const avatarUrl = ref('celeste-gui/user-avatar.webp');
            const portraitSrc = ref('');
            const berryCount = ref(0);
            const diaryCount = ref(parseInt(localStorage.getItem('diarySaveCount') || '0'));
            const featherCount = ref(0);
            const serverSignature = ref('');
            const editing = ref(false);
            const sigDraft = ref('');
            const sigInput = ref(null);

            // ===== 情绪图谱 =====
            const EMO_COLORS = {
                '开心': '#ffd966', '平静': '#7ec0ee', '期待': '#ff9a3c', '满足': '#a8d8a8',
                '不安': '#b48cff', '悲伤': '#5a8dc4', '孤独': '#8ca0c4', '愤怒': '#ff5a5a',
                '惊讶': '#ffe36d', '疲惫': '#9a9a9a'
            };
            const emoLoaded = ref(false);
            const emoTotal = ref(0);
            const emoDist = ref({});
            const emoTimeline = ref([]);

            // ===== 印章：每写一篇解锁一枚，最多 6 枚 =====
            const stamps = computed(() => CARD_STAMPS.slice(0, Math.min(diaryCount.value, CARD_STAMPS.length)));

            // 情绪图谱：按出现次数降序，带百分比和颜色
            const emoBars = computed(() => {
                const entries = Object.entries(emoDist.value);
                if (!entries.length) return [];
                const max = Math.max(...entries.map(e => e[1]));
                return entries
                    .sort((a, b) => b[1] - a[1])
                    .map(([name, count]) => ({
                        name, count,
                        pct: max > 0 ? Math.round(count / max * 100) : 0,
                        color: EMO_COLORS[name] || '#888'
                    }));
            });

            // 月度趋势点：把 timeline 展平为 [month, name, color] 数组
            const emoTimelineDots = computed(() => {
                const dots = [];
                for (const t of emoTimeline.value) {
                    const emotions = t.emotions || {};
                    for (const [name, count] of Object.entries(emotions)) {
                        for (let i = 0; i < count; i++) {
                            dots.push({
                                month: t.month,
                                name,
                                color: EMO_COLORS[name] || '#888'
                            });
                        }
                    }
                }
                return dots;
            });

            // 头像框：日记<10 普通，≥10 金色
            watch(diaryCount, (n) => {
                portraitSrc.value = n >= 10 ? 'namespace/portraitOverlayGold.png' : 'namespace/portraitOverlay.png';
            }, { immediate: true });

            function onPortraitError(e) { e.target.style.display = 'none'; }

            // ===== 签名编辑 =====
            function startEdit() {
                if (editing.value) return;
                sigDraft.value = serverSignature.value || '';
                editing.value = true;
                nextTick(() => {
                    if (sigInput.value) { sigInput.value.focus(); sigInput.value.select(); }
                });
            }
            function saveSig() {
                if (!editing.value) return;
                editing.value = false;
                const val = sigDraft.value.trim();
                const oldVal = serverSignature.value;
                // 乐观展示，保存失败再回退
                serverSignature.value = val;
                api('/users/signature', 'PUT', { signature: val }).then(r => {
                    if (r.success) {
                        serverSignature.value = (r.data && r.data.signature) || '';
                    } else {
                        serverSignature.value = oldVal;
                        showToast('签名保存失败，请重试', 'error');
                    }
                }).catch(() => {
                    serverSignature.value = oldVal;
                    showToast('签名保存失败，请重试', 'error');
                });
            }

            // ===== 草莓数事件实时同步 =====
            function onBerriesChange(e) { berryCount.value = e.detail.balance; }

            onMounted(() => {
                // 草莓：先本地缓存，再 sync 权威值
                berryCount.value = berryBalance();
                window.addEventListener('berries:change', onBerriesChange);
                syncBerryBalance();

                // 日记数：后端 /diary/count 权威值（跨设备一致）
                api('/diary/count', 'GET').then(res => {
                    if (res.success && res.data && typeof res.data.count === 'number') {
                        diaryCount.value = res.data.count;
                        localStorage.setItem('diarySaveCount', String(res.data.count));
                        // 日记 ≥10 启动周期性 shine 特效
                        if (res.data.count >= 10) {
                            const playCardShine = createShine('cardShine', 'cardShine');
                            const playTicketShine = createShine('ticketShine', 'ticketShine');
                            (function playShineLoop() {
                                playCardShine();
                                setTimeout(playTicketShine, 92);
                                setTimeout(playShineLoop, 2800);
                            })();
                        }
                    }
                });

                // 用户头像 / 昵称 / 个性签名
                api('/users/currentUser', 'GET').then(res => {
                    if (!res.success || !res.data) return;
                    if (res.data.avatar) {
                        const avatarUrl0 = res.data.avatar.startsWith('http')
                            ? res.data.avatar
                            : BASE_URL + res.data.avatar;
                        const img = new Image();
                        img.onload = function() { avatarUrl.value = avatarUrl0; };
                        img.onerror = function() { console.log('头像加载失败，使用默认头像'); };
                        img.src = avatarUrl0;
                    }
                    nickname.value = res.data.nickname || res.data.account || '未命名';
                    serverSignature.value = res.data.signature || '';
                });

                // 羽毛数
                api('/feather/count', 'GET').then(res => {
                    if (res.success && res.data != null) featherCount.value = res.data.count;
                });

                // 情绪图谱
                api('/diary/emotion-stats', 'GET').then(res => {
                    emoLoaded.value = true;
                    if (res.success && res.data) {
                        emoTotal.value = res.data.total || 0;
                        emoDist.value = res.data.distribution || {};
                        emoTimeline.value = res.data.timeline || [];
                    }
                }).catch(() => { emoLoaded.value = true; });
            });

            return {
                nickname, avatarUrl, portraitSrc, berryCount, diaryCount, featherCount,
                serverSignature, editing, sigDraft, sigInput, stamps,
                emoLoaded, emoTotal, emoBars, emoTimeline, emoTimelineDots,
                onPortraitError, startEdit, saveSig
            };
        }
    }).mount('#meApp');
</script>
<script src="js/seed.js?v=20261005a"></script>
</body>
</html>
