<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<title>我的空间 · Celeste Blog</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="icon/OIP.webp" type="image/webp">
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
* { box-sizing:border-box; margin:0; padding:0; }
body { min-height:100vh; background:url('celeste-gui/me-bg.webp') center/cover no-repeat fixed; font-family:'Renogare','Microsoft YaHei',sans-serif; }
.topbar { position:fixed; top:14px; left:16px; z-index:20; }
.topbar a { display:inline-block; padding:8px 14px; background:rgba(22,34,60,.88); color:#ffe36d; border:2px solid #ffe36d; border-radius:6px; text-decoration:none; font-size:13px; }
h1 { position:fixed; top:14px; left:50%; transform:translateX(-50%); font-family:'Press Start 2P',monospace; font-size:15px; color:#ffe36d; text-shadow:0 2px 0 rgba(0,0,0,.6); letter-spacing:2px; z-index:20; }
.wrap { max-width:680px; margin:0 auto; padding:86px 20px 40px; }
.profile { display:flex; align-items:center; gap:18px; background:rgba(22,34,60,.88); border:2px solid rgba(255,230,109,.4); border-radius:8px; padding:20px; margin-bottom:16px; }
.profile img { width:72px; height:72px; border-radius:50%; object-fit:cover; border:3px solid #ffe36d; image-rendering:pixelated; }
.profile .name { color:#fff; font-size:20px; margin-bottom:6px; }
.profile .sub { color:rgba(255,255,255,.5); font-size:12px; }
.stats { display:grid; grid-template-columns:repeat(4,1fr); gap:12px; margin-bottom:16px; }
.stat { background:rgba(22,34,60,.88); border:2px solid rgba(255,230,109,.4); border-radius:8px; padding:14px 8px; text-align:center; }
.stat .num { font-family:'Press Start 2P',monospace; font-size:18px; color:#ff6b8a; margin-bottom:6px; }
.stat .lbl { color:rgba(255,255,255,.55); font-size:12px; }
.stat img.heart { width:34px; height:34px; image-rendering:pixelated; margin-bottom:6px; }
h2 { font-family:'Press Start 2P',monospace; font-size:12px; color:#ffe36d; margin:22px 0 12px; }
.art { display:flex; justify-content:space-between; align-items:center; gap:12px; background:rgba(22,34,60,.88); border:2px solid rgba(255,230,109,.25); border-radius:8px; padding:12px 16px; margin-bottom:8px; cursor:pointer; transition:border-color .15s, transform .15s; }
.art:hover { border-color:#ffe36d; transform:translateX(4px); }
.art .t { color:#fff; font-size:14px; flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.art .d { color:rgba(255,255,255,.45); font-size:12px; flex-shrink:0; }
.links { display:flex; gap:10px; margin-top:22px; flex-wrap:wrap; }
.links a { padding:8px 14px; background:rgba(22,34,60,.88); color:#ffe36d; border:2px solid rgba(255,230,109,.4); border-radius:6px; text-decoration:none; font-size:13px; }
.links a:hover { border-color:#ffe36d; background:rgba(255,227,109,.15); }
.empty { color:rgba(255,255,255,.45); text-align:center; padding:20px; }
</style>
</head>
<body>
<audio id="meBgm" loop autoplay>
    <source src="bgm/madeline-and-theo.mp3" type="audio/mpeg">
</audio>
<h1>MY SPACE</h1>
<div class="topbar"><a href="index.html">← 回首页</a></div>

<div class="wrap">
    <div class="profile">
        <img id="meAvatar" src="celeste-gui/user-avatar.png" alt="">
        <div>
            <div class="name" id="meName">--</div>
            <div class="sub" id="meAccount">--</div>
        </div>
    </div>

    <div class="stats">
        <div class="stat"><div class="num" id="stArticles">0</div><div class="lbl">文章</div></div>
        <div class="stat"><div class="num" id="stDiaries">0</div><div class="lbl">日记</div></div>
        <div class="stat"><div class="num" id="stBerries">0</div><div class="lbl">草莓</div></div>
        <div class="stat"><img class="heart" id="stHeart" src="celeste-icons/heartgem0.png" alt=""><div class="lbl" id="stHeartLbl">心之宝石</div></div>
    </div>

    <h2>MY ARTICLES</h2>
    <div id="artList"><div class="empty">加载中...</div></div>

    <div class="links">
        <a href="write.html">写新文章</a>
        <a href="diary.html">日记本</a>
        <a href="shelf.html">书架</a>
        <a href="shop.html">草莓商店</a>
    </div>
</div>

<script src="js/api.js"></script>
<script>
    const meBgm = document.getElementById('meBgm');
    const meBgmTime = parseFloat(localStorage.getItem('bgmTimeMe') || '0');
    if (meBgmTime > 0) meBgm.currentTime = meBgmTime;
    meBgm.volume = 0.25;
    meBgm.play().catch(() => {});
    setInterval(() => { localStorage.setItem('bgmTimeMe', meBgm.currentTime); }, 2000);
    function tryPlayMeBgm() { meBgm.play().then(() => { document.removeEventListener('click', tryPlayMeBgm); document.removeEventListener('keydown', tryPlayMeBgm); }).catch(() => {}); }
    document.addEventListener('click', tryPlayMeBgm);
    document.addEventListener('keydown', tryPlayMeBgm);

    document.getElementById('meName').textContent = localStorage.getItem('nickname') || '未登录';
    document.getElementById('meAccount').textContent = '去写，去攀登。';

    api('/users/currentUser', 'GET').then(res => {
        if (res.success && res.data) {
            document.getElementById('meName').textContent = res.data.nickname || res.data.account;
            document.getElementById('meAccount').textContent = '@' + (res.data.account || '');
        }
    });

    const diaries = parseInt(localStorage.getItem('diarySaveCount') || '0');
    document.getElementById('stDiaries').textContent = diaries;
    document.getElementById('stBerries').textContent = berryBalance();

    const tier = diaries >= 100 ? 3 : diaries >= 60 ? 2 : diaries >= 30 ? 1 : 0;
    document.getElementById('stHeart').src = tier >= 1 ? 'celeste-icons/heartgem1.png' : 'celeste-icons/heartgem0.png';
    document.getElementById('stHeartLbl').textContent = '心之宝石 Lv.' + tier;

    api('/articles', 'POST', { page: 1, pageSize: 50 }).then(res => {
        const list = res.success ? (res.data.records || res.data || []) : [];
        document.getElementById('stArticles').textContent = res.success ? (res.data.total || list.length) : 0;
        if (!list.length) {
            document.getElementById('artList').innerHTML = '<div class="empty">还没有文章，去写一篇吧～</div>';
            return;
        }
        document.getElementById('artList').innerHTML = list.map(a =>
            '<div class="art" onclick="location.href=\'article.html?id=' + a.id + '\'">' +
            '<span class="t">' + escHtml(a.title) + '</span>' +
            '<span class="d">' + formatDate(a.createDate) + '</span></div>'
        ).join('');
    });
</script>
</body>
</html>
