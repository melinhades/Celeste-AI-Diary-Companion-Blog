<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="icon/OIP.webp" type="image/webp">
    <title>实时聊天室 · Celeste Blog</title>
    <link rel="stylesheet" href="css/common.css">
    <style>
    html, body { height: 100%; margin: 0; }
    body {
        font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
        color: #1a1a2e;
        overflow: hidden;
    }
    body::before {
        content: '';
        position: fixed; inset: 0;
        background: url('Atlases/Gameplay/bgs/10/skybrighter.png') center/cover no-repeat;
        z-index: 0;
    }
    body::after {
        content: '';
        position: fixed; inset: 0;
        background: linear-gradient(180deg, rgba(255,255,255,0.25) 0%, rgba(255,255,255,0.45) 100%);
        z-index: 1;
        pointer-events: none;
    }

    .chat-wrap {
        position: relative; z-index: 3;
        max-width: 1100px; height: 100vh;
        margin: 0 auto;
        display: flex; flex-direction: column;
        padding: 16px;
        box-sizing: border-box;
    }
    .main-grid {
        flex: 1; min-height: 0;
        display: grid;
        grid-template-columns: 1fr 300px;
        gap: 12px;
    }
    .chat-col { display: flex; flex-direction: column; min-height: 0; }

    .chat-header {
        display: flex; align-items: center; justify-content: space-between;
        background: rgba(255,255,255,0.78);
        backdrop-filter: blur(10px);
        border: 1px solid rgba(255,255,255,0.6);
        border-radius: 12px;
        padding: 12px 18px;
        margin-bottom: 12px;
        box-shadow: 0 4px 20px rgba(100,140,200,0.18);
    }
    .chat-title {
        font-size: 18px; font-weight: 700;
        color: #2a3a5c;
        letter-spacing: 0.5px;
    }
    .chat-title::before {
        content: '🐦'; margin-right: 6px;
    }
    .online-badge {
        font-size: 12px;
        color: #3a7d44;
        background: rgba(120,220,140,0.25);
        border: 1px solid rgba(120,220,140,0.5);
        padding: 3px 10px;
        border-radius: 12px;
        font-weight: 600;
    }
    .online-badge .dot {
        display: inline-block;
        width: 7px; height: 7px;
        background: #4caf50;
        border-radius: 50%;
        margin-right: 5px;
        animation: pulse 1.6s infinite;
    }
    @keyframes pulse {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.4; }
    }

    .msg-list {
        flex: 1;
        overflow-y: auto;
        padding: 16px 12px;
        background: rgba(255,255,255,0.55);
        backdrop-filter: blur(8px);
        border: 1px solid rgba(255,255,255,0.5);
        border-radius: 12px;
        display: flex; flex-direction: column;
        gap: 10px;
        scroll-behavior: smooth;
    }
    .msg-list::-webkit-scrollbar { width: 6px; }
    .msg-list::-webkit-scrollbar-thumb { background: rgba(100,140,200,0.3); border-radius: 3px; }

    .msg {
        display: flex; flex-direction: column;
        max-width: 75%;
        animation: msgIn 0.25s ease-out;
    }
    @keyframes msgIn {
        from { opacity: 0; transform: translateY(8px); }
        to { opacity: 1; transform: translateY(0); }
    }
    .msg.self { align-self: flex-end; align-items: flex-end; }
    .msg.other { align-self: flex-start; align-items: flex-start; }

    .msg-name {
        font-size: 11px;
        color: #5a6a8c;
        margin: 0 8px 3px;
        font-weight: 600;
    }
    .msg-bubble {
        padding: 9px 14px;
        border-radius: 16px;
        font-size: 14px;
        line-height: 1.5;
        word-break: break-word;
        box-shadow: 0 2px 8px rgba(100,140,200,0.12);
    }
    .msg.self .msg-bubble {
        background: #4a90d9;
        color: #fff;
        border-bottom-right-radius: 4px;
    }
    .msg.other .msg-bubble {
        background: rgba(255,255,255,0.92);
        color: #1a1a2e;
        border-bottom-left-radius: 4px;
    }
    .msg.pending .msg-bubble { opacity: 0.6; }
    .msg.pending .msg-bubble::after {
        content: ' …';
        animation: dots 1.2s infinite;
    }
    @keyframes dots {
        0%, 20% { content: ' …'; }
        40% { content: ' ……'; }
        60%, 100% { content: ' …'; }
    }

    .sys-msg {
        align-self: center;
        font-size: 12px;
        color: rgba(90,106,140,0.7);
        background: rgba(255,255,255,0.5);
        padding: 4px 12px;
        border-radius: 10px;
        margin: 4px 0;
    }

    .input-row {
        display: flex; gap: 10px;
        margin-top: 12px;
        background: rgba(255,255,255,0.78);
        backdrop-filter: blur(10px);
        border: 1px solid rgba(255,255,255,0.6);
        border-radius: 12px;
        padding: 10px;
        box-shadow: 0 4px 20px rgba(100,140,200,0.18);
    }
    #msgInput {
        flex: 1;
        border: 1px solid rgba(100,140,200,0.25);
        border-radius: 8px;
        padding: 10px 14px;
        font-size: 14px;
        outline: none;
        background: rgba(255,255,255,0.9);
        color: #1a1a2e;
        font-family: inherit;
    }
    #msgInput:focus { border-color: #4a90d9; }
    #sendBtn {
        background: #4a90d9;
        color: #fff;
        border: none;
        border-radius: 8px;
        padding: 0 22px;
        font-size: 14px;
        font-weight: 600;
        cursor: pointer;
        transition: background 0.15s;
    }
    #sendBtn:hover { background: #3a7bc8; }
    #sendBtn:disabled { background: #a0b8d0; cursor: not-allowed; }

    .back-link {
        display: inline-block;
        color: #2a3a5c;
        text-decoration: none;
        font-size: 13px;
        margin-bottom: 10px;
        opacity: 0.8;
    }
    .back-link:hover { opacity: 1; text-decoration: underline; }

    /* ===== 表情包（与评论区同款五系列） ===== */
    .emoji-wrap { position: relative; }
    .emoji-btn { display: inline-flex; align-items: center; gap: 5px; border: 1px solid rgba(74,144,217,.35); background: rgba(255,255,255,.8); border-radius: 8px; padding: 6px 10px; cursor: pointer; transition: all .2s; color: #2a3a5c; font-size: 13px; }
    .emoji-btn:hover { border-color: #4a90d9; box-shadow: 0 0 10px rgba(74,144,217,.3); }
    .emoji-btn img { height: 24px; width: auto; image-rendering: pixelated; }
    .emoji-panel { display: none; position: absolute; bottom: calc(100% + 10px); left: 0; width: 300px; max-width: 78vw; background: rgba(255,255,255,.97); border: 1px solid rgba(74,144,217,.35); border-radius: 10px; padding: 10px; z-index: 50; box-shadow: 0 8px 24px rgba(100,140,200,.35); }
    .emoji-panel.open { display: block; animation: emojiIn .18s ease; }
    @keyframes emojiIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
    .emoji-tabs { display: flex; gap: 6px; margin-bottom: 8px; }
    .emoji-tab { flex: 1; border: 1px solid rgba(74,144,217,.3); background: transparent; color: #5a6a8c; font-size: 11px; padding: 4px 2px; border-radius: 6px; cursor: pointer; transition: all .2s; white-space: nowrap; }
    .emoji-tab.active { background: #4a90d9; color: #fff; border-color: transparent; }
    .emoji-grid { display: grid; grid-template-columns: repeat(6, 1fr); gap: 4px; max-height: 180px; overflow-y: auto; }
    .emoji-cell { border: none; background: transparent; padding: 3px; cursor: pointer; border-radius: 6px; transition: all .15s; display: flex; align-items: center; justify-content: center; }
    .emoji-cell:hover { background: rgba(74,144,217,.18); }
    .emoji-cell img { height: 34px; width: auto; image-rendering: pixelated; }
    .chat-emoji { height: 34px; width: auto; vertical-align: middle; image-rendering: pixelated; margin: 0 3px; border-radius: 5px; }

    /* ===== 消息通知栏（合并自旧版 messages 页） ===== */
    .notif-col {
        display: flex; flex-direction: column; min-height: 0;
        background: rgba(255,255,255,0.78);
        backdrop-filter: blur(10px);
        border: 1px solid rgba(255,255,255,0.6);
        border-radius: 12px;
        box-shadow: 0 4px 20px rgba(100,140,200,0.18);
        overflow: hidden;
    }
    .notif-head {
        padding: 12px 14px 8px;
        font-size: 14px; font-weight: 700; color: #2a3a5c;
    }
    .notif-head .notif-sub { display: block; font-size: 11px; font-weight: 400; color: #8a99b8; margin-top: 2px; }
    .notif-list { flex: 1; overflow-y: auto; padding: 4px 10px 12px; }
    .notif-list::-webkit-scrollbar { width: 6px; }
    .notif-list::-webkit-scrollbar-thumb { background: rgba(100,140,200,0.3); border-radius: 3px; }
    .notif-item {
        display: flex; align-items: center; gap: 10px;
        padding: 10px 12px; margin-bottom: 8px;
        background: rgba(255,255,255,0.65);
        border: 1px solid rgba(74,144,217,0.12);
        border-radius: 10px; cursor: pointer;
        transition: transform .15s, border-color .15s, box-shadow .15s;
        animation: msgIn .35s ease both;
    }
    .notif-item:hover { transform: translateX(4px); border-color: rgba(74,144,217,0.5); box-shadow: 0 3px 12px rgba(100,140,200,0.25); }
    .notif-item.unread { border-left: 3px solid #4a90d9; background: rgba(74,144,217,0.08); }
    .notif-icon { font-size: 18px; flex-shrink: 0; }
    .notif-body { flex: 1; min-width: 0; }
    .notif-line1 { font-size: 13px; color: #1a1a2e; margin-bottom: 2px; }
    .notif-line1 b { color: #2a6fc2; font-weight: 600; }
    .notif-line2 { font-size: 12px; color: #5a6a8c; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .notif-time { font-size: 11px; color: #8a99b8; flex-shrink: 0; }
    .notif-empty { text-align: center; color: #8a99b8; padding: 40px 10px; font-size: 13px; line-height: 2; }

    @media (max-width: 900px) {
        body { overflow-y: auto; }
        .chat-wrap { height: auto; min-height: 100vh; }
        .main-grid { grid-template-columns: 1fr; }
        .chat-col .msg-list { flex: none; height: 52vh; min-height: 300px; }
        .notif-col { max-height: 340px; }
    }
    </style>
</head>
<body>

<div class="chat-wrap">
    <a href="index.html" class="back-link">‹ 返回首页</a>
    <div class="main-grid">
        <div class="chat-col">
            <div class="chat-header">
                <div class="chat-title">实时聊天室</div>
                <div class="online-badge"><span class="dot"></span><span id="onlineCount">在线 1</span></div>
            </div>

            <div id="msgList" class="msg-list"></div>

            <div class="input-row">
                <div class="emoji-wrap">
                    <button type="button" id="emojiBtn" class="emoji-btn" title="插入表情">
                        <img src="Atlases/Portraits/madeline/peaceful00.png" alt="表情" decoding="async">表情
                    </button>
                    <div id="emojiPanel" class="emoji-panel">
                        <div class="emoji-tabs">
                            <button type="button" class="emoji-tab active" data-series="mad">Madeline</button>
                            <button type="button" class="emoji-tab" data-series="bade">Badeline</button>
                            <button type="button" class="emoji-tab" data-series="granny">Granny</button>
                            <button type="button" class="emoji-tab" data-series="theo">Theo</button>
                            <button type="button" class="emoji-tab" data-series="oshiro">Oshiro</button>
                        </div>
                        <div class="emoji-grid" id="emojiGrid"></div>
                    </div>
                </div>
                <input type="text" id="msgInput" maxlength="500" placeholder="说点什么吧…（Enter 发送）" autocomplete="off">
                <button id="sendBtn">发送</button>
            </div>
        </div>

        <aside class="notif-col">
            <div class="notif-head">🔔 消息通知<span class="notif-sub">谁给你的文字点了赞、留了言，都会飘到这里。</span></div>
            <div id="notifList" class="notif-list"><div class="notif-empty">正在收信…</div></div>
        </aside>
    </div>
</div>

<script src="js/api.js?v=20261002"></script>
<script>
const token = localStorage.getItem('token');
if (!token) { location.href = 'login.html'; throw new Error('not logged in'); }

const $ = id => document.getElementById(id);
const msgList = $('msgList');
const input = $('msgInput');
const sendBtn = $('sendBtn');
const onlineCountEl = $('onlineCount');

// 当前登录用户 id（从 token 解析不了，用 history 里自己的消息匹配；简化：用昵称匹配自己发的）
let myName = '';

// 已渲染消息 id 集合，用于去重（自己发的消息会通过 SSE 再推一次）
const seenIds = new Set();
// clientMsgId -> DOM 元素，发送成功后替换
const pendingMap = new Map();
let clientSeq = 0;

function escHtml(s) {
    return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

// ===== 表情包：与评论区同款五系列（Atlases/Portraits 各情绪 00 帧；暗面琳素材目录为 ghost） =====
const EMOJI_PACKS = {
    mad: { dir: 'madeline', names: ['normal', 'peaceful', 'determined', 'distracted', 'panic', 'sad', 'sadder', 'surprised', 'angry', 'deadpan', 'upset', 'together'] },
    bade: { dir: 'ghost', names: ['normal', 'angry', 'angryAlt', 'concerned', 'freakA', 'freakB', 'freakC', 'sad', 'scoff', 'serious', 'sigh', 'upset', 'worried', 'worriedAlt', 'yell'] },
    granny: { dir: 'granny', names: ['normal', 'creepA', 'creepB', 'laugh', 'mock'] },
    theo: { dir: 'theo', names: ['normal', 'excited', 'nailedit', 'serious', 'thinking', 'worried', 'wtf', 'yolo'] },
    oshiro: { dir: 'oshiro', names: ['normal', 'nervous', 'serious', 'sidehappy', 'sideworried', 'sidesuspicious', 'drama', 'lostcontrol', 'worried'] }
};
let emojiSeries = 'mad';
const emojiBtn = document.getElementById('emojiBtn');
const emojiPanel = document.getElementById('emojiPanel');
const emojiGrid = document.getElementById('emojiGrid');

function renderEmojiGrid() {
    const pack = EMOJI_PACKS[emojiSeries];
    emojiGrid.innerHTML = pack.names.map(n =>
        `<button type="button" class="emoji-cell" data-mark="[${emojiSeries}:${n}]" title="${n}"><img loading="lazy" src="Atlases/Portraits/${pack.dir}/${n}00.png" alt="${n}" decoding="async"></button>`
    ).join('');
}
renderEmojiGrid();

emojiBtn.addEventListener('click', e => {
    e.stopPropagation();
    emojiPanel.classList.toggle('open');
});
emojiPanel.addEventListener('click', e => e.stopPropagation());
document.addEventListener('click', e => {
    if (!e.target.closest('.emoji-wrap')) emojiPanel.classList.remove('open');
});
document.querySelectorAll('.emoji-tab').forEach(tab => {
    tab.addEventListener('click', () => {
        document.querySelectorAll('.emoji-tab').forEach(t => t.classList.remove('active'));
        tab.classList.add('active');
        emojiSeries = tab.dataset.series;
        renderEmojiGrid();
    });
});
emojiGrid.addEventListener('click', e => {
    const cell = e.target.closest('.emoji-cell');
    if (!cell) return;
    insertEmojiMark(cell.dataset.mark);
});

function insertEmojiMark(mark) {
    const start = typeof input.selectionStart === 'number' ? input.selectionStart : input.value.length;
    const end = typeof input.selectionEnd === 'number' ? input.selectionEnd : input.value.length;
    input.setRangeText(mark, start, end, 'end');
    input.focus();
}

// 渲染消息内容：先整体转义，再把白名单内的表情标记替换为图片（防 XSS）
function renderChatContent(text) {
    let s = escHtml(text);
    s = s.replace(/\[(mad|bade|granny|theo|oshiro):([a-zA-Z]+)\]/g, (m, series, name) => {
        const pack = EMOJI_PACKS[series];
        return (pack && pack.names.includes(name))
            ? `<img class="chat-emoji" loading="lazy" src="Atlases/Portraits/${pack.dir}/${name}00.png" alt="${series}:${name}" decoding="async">`
            : m;
    });
    return s;
}

function fmtTime(ts) {
    const d = new Date(ts);
    return String(d.getHours()).padStart(2,'0') + ':' + String(d.getMinutes()).padStart(2,'0');
}

// ===== 消息通知栏（合并自旧版 messages 页：/notifications/list） =====
function fmtNotifTime(ts) {
    if (!ts) return '';
    const d = new Date(Number(ts));
    const diff = Date.now() - d.getTime();
    if (diff < 60000) return '刚刚';
    if (diff < 3600000) return Math.floor(diff / 60000) + ' 分钟前';
    if (diff < 86400000) return Math.floor(diff / 3600000) + ' 小时前';
    return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
}

function loadNotifications() {
    api('/notifications/list', 'GET').then(res => {
        const box = document.getElementById('notifList');
        if (!res.success || !res.data || res.data.length === 0) {
            box.innerHTML = '<div class="notif-empty">山顶很安静，还没有消息。<br>去写点什么，或者给别人点个赞吧～</div>';
            return;
        }
        box.innerHTML = res.data.map((n, i) => {
            const isLike = n.type === 'like';
            const verb = isLike ? '赞了' : '评论了';
            const icon = isLike ? '❤️' : '💬';
            return '<div class="notif-item' + (Number(n.isRead) === 0 ? ' unread' : '') + '" data-article="' + n.articleId + '" style="animation-delay:' + (i * 0.05) + 's">' +
                '<span class="notif-icon">' + icon + '</span>' +
                '<div class="notif-body">' +
                    '<div class="notif-line1"><b>' + escHtml(n.fromName || '有人') + '</b> ' + verb + '你的文章</div>' +
                    '<div class="notif-line2">《' + escHtml(n.articleTitle || '已删除的文章') + '》</div>' +
                '</div>' +
                '<span class="notif-time">' + fmtNotifTime(n.createDate) + '</span>' +
            '</div>';
        }).join('');
        // 展示后全部标记已读，顶部铃铛角标清零（与旧版 messages 页行为一致）
        setTimeout(() => {
            api('/notifications/readAll', 'POST').then(() => { if (typeof refreshBell === 'function') refreshBell(); });
        }, 1200);
    }).catch(() => {
        document.getElementById('notifList').innerHTML = '<div class="notif-empty">收信失败了，稍后再试试…</div>';
    });
}

// 点击通知跳转对应文章
document.getElementById('notifList').addEventListener('click', e => {
    const item = e.target.closest('.notif-item');
    if (item && item.dataset.article) {
        location.href = 'article.html?id=' + item.dataset.article;
    }
});
loadNotifications();

function addMsg(msg, isPending) {
    // 去重：服务端消息带 id
    if (msg.id != null && seenIds.has(msg.id)) return null;
    if (msg.id != null) seenIds.add(msg.id);

    const isSelf = msg.name === myName;
    const div = document.createElement('div');
    div.className = 'msg ' + (isSelf ? 'self' : 'other') + (isPending ? ' pending' : '');
    div.dataset.clientId = msg.clientId || '';

    if (!isSelf) {
        const nameEl = document.createElement('div');
        nameEl.className = 'msg-name';
        nameEl.textContent = msg.name || '匿名';
        div.appendChild(nameEl);
    }

    const bubble = document.createElement('div');
    bubble.className = 'msg-bubble';
    bubble.innerHTML = renderChatContent(msg.content || '');
    div.appendChild(bubble);

    msgList.appendChild(div);
    msgList.scrollTop = msgList.scrollHeight;
    return div;
}

function addSys(text) {
    const div = document.createElement('div');
    div.className = 'sys-msg';
    div.textContent = text;
    msgList.appendChild(div);
    msgList.scrollTop = msgList.scrollHeight;
}

// ===== 发送消息 =====
function send() {
    const content = input.value.trim();
    if (!content) return;
    input.value = '';
    sendBtn.disabled = true;

    const clientId = 'c' + (++clientSeq);
    // 乐观插入 pending
    const pendingEl = addMsg({ name: myName, content, clientId }, true);
    pendingMap.set(clientId, pendingEl);

    api('/realtime-chat/send', 'POST', { content }).then(res => {
        sendBtn.disabled = false;
        input.focus();
        if (res.success && res.data) {
            // 用服务端返回的真实消息收敛 pending
            const el = pendingMap.get(clientId);
            if (res.data.id != null) seenIds.add(res.data.id);
            if (el) {
                // pending 还在：替换内容、去掉 pending 态
                pendingMap.delete(clientId);
                el.classList.remove('pending');
                el.querySelector('.msg-bubble').innerHTML = renderChatContent(res.data.content);
            }
            // 如果 pending 已被 SSE 替换掉，这里只标记 seenIds 即可，不重复渲染
        } else {
            // 发送失败：保留 pending 并标红，用户可重发
            const el = pendingMap.get(clientId);
            if (el) {
                el.classList.add('send-fail');
                el.querySelector('.msg-bubble').textContent = content + '（发送失败，点击重试）';
                el.onclick = () => {
                    pendingMap.delete(clientId);
                    el.remove();
                    input.value = content;
                    input.focus();
                };
            }
            showToast(res.msg || '发送失败', 'error');
        }
    }).catch(() => {
        sendBtn.disabled = false;
    });
}

sendBtn.addEventListener('click', send);
input.addEventListener('keydown', e => { if (e.key === 'Enter') send(); });

// ===== 拉历史消息 =====
api('/realtime-chat/history', 'GET').then(res => {
    if (res.success && Array.isArray(res.data)) {
        res.data.forEach(m => addMsg(m, false));
        if (res.data.length) addSys('以上是最近的聊天记录');
    }
});

// ===== SSE 订阅实时消息 =====
let es = null;
function connectSSE() {
    es = new EventSource(BASE_URL + '/realtime-chat/stream?token=' + encodeURIComponent(token));

    es.addEventListener('chat', e => {
        const msg = JSON.parse(e.data);
        // 自己发的消息：优先替换 pending（可能 SSE 比 API 回包先到），避免重复
        if (msg.name === myName && pendingMap.size > 0) {
            const firstKey = pendingMap.keys().next().value;
            const el = pendingMap.get(firstKey);
            if (el) {
                pendingMap.delete(firstKey);
                if (msg.id != null) seenIds.add(msg.id);
                el.classList.remove('pending');
                el.querySelector('.msg-bubble').innerHTML = renderChatContent(msg.content);
                return;
            }
        }
        addMsg(msg, false);
    });

    es.addEventListener('presence', e => {
        const d = JSON.parse(e.data);
        onlineCountEl.textContent = '在线 ' + (d.online || 1);
    });

    es.addEventListener('error', () => {
        // EventSource 会自动重连，这里只做提示
        if (es.readyState === EventSource.CLOSED) {
            addSys('连接已断开，正在重连…');
        }
    });
}

// 获取自己的昵称
api('/users/currentUser', 'GET').then(res => {
    if (res.success && res.data) {
        myName = res.data.nickname || res.data.account || '';
    }
    connectSSE();
}).catch(() => {
    connectSSE();
});

// 页面卸载关闭 SSE
window.addEventListener('beforeunload', () => { if (es) es.close(); });
</script>
