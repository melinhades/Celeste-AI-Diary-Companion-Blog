#server
server.port= 8888
spring.application.name=mszlu_blog
spring.profiles.active=dev
# datasource
spring.datasource.url=jdbc:mysql://localhost:3306/blog?useUnicode=true&characterEncoding=UTF-8&serverTimeZone=UTC
spring.datasource.username=root
spring.datasource.password=your_password
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

#mybatis-plus
mybatis-plus.configuration.log-impl=org.apache.ibatis.logging.stdout.StdOutImpl
mybatis-plus.global-config.db-config.table-prefix=ms_
mybatis-plus.mapper-locations=classpath*:com.mszlu.blog.dao.mapper/**/*.xml
## ?????????
spring.servlet.multipart.max-request-size=20MB
## ????????
spring.servlet.multipart.max-file-size=8MB
## ?????
qiniu.accessKey=your-access-key
qiniu.accessSecretKey=your-secret-key

# SiliconFlow 大模型/OpenAI 兼容接口配置
ai.base-url=https://api.siliconflow.cn/v1
ai.api-key=your-api-key
ai.model=THUDM/GLM-4-9B-0414
ai.embedding-model=BAAI/bge-m3

# JWT 配置
jwt.secret=${JWT_SECRET:123456Mszlu!@###$$}
jwt.expiration=2592000000

# Actuator & Prometheus 监控
management.endpoints.web.exposure.include=health,info,prometheus,metrics
management.endpoint.health.show-details=always
management.prometheus.metrics.export.enabled=true