#server
server.port= 8888
spring.application.name=mszlu_blog
spring.profiles.active=dev
# datasource
spring.datasource.url=jdbc:mysql://localhost:3306/blog?useUnicode=true&characterEncoding=UTF-8&serverTimeZone=UTC
spring.datasource.username=root
spring.datasource.password=1234
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

#mybatis-plus
mybatis-plus.configuration.log-impl=org.apache.ibatis.logging.stdout.StdOutImpl
mybatis-plus.global-config.db-config.table-prefix=ms_
mybatis-plus.mapper-locations=classpath*:com.mszlu.blog.dao.mapper/**/*.xml
## ?????????
spring.servlet.multipart.max-request-size=20MB
## ????????
spring.servlet.multipart.max-file-size=8MB
# Cloudflare R2 图片存储（S3 兼容）；默认关闭，关闭或配置不全时图片自动回退存数据库
# 本地开发无需配置；启用：设 R2_ENABLED=true 并填齐下面四项（在 R2 API 令牌页获取）
r2.enabled=${R2_ENABLED:false}
r2.endpoint=${R2_ENDPOINT:}
r2.bucket=${R2_BUCKET:}
r2.access-key-id=${R2_ACCESS_KEY_ID:}
r2.secret-access-key=${R2_SECRET_ACCESS_KEY:}
r2.region=${R2_REGION:auto}
r2.key-prefix=${R2_KEY_PREFIX:images/}

# AI 配置（OpenAI 兼容协议）
# 切模型的最小变量集：
#   主对话：ai.base-url / ai.api-key / ai.model
#   快模型：ai.fast-model / ai.fast-base-url / ai.fast-api-key（情绪抽取、意图分类等前处理）
#   向量：ai.embed-base-url / ai.embed-api-key / ai.embedding-model
# 说明：ai.embed-base-url 为空时回落 ai.base-url；ai.embed-api-key 为空时保持原逻辑
#       （用户自带 Key 优先，DeepSeek 用户无 embeddings 时回落系统 Key）
#       ai.fast-base-url 为空时快模型走原主对话逻辑；非空时只有 model == ai.fast-model 才走
#       fast base + fast Key（BYOK 用户 Key 不能用于快模型服务商，fast Key 为空则回落系统主 Key）
# 切到 智谱 GLM-4.7-Flash + 硅基流动 bge-m3 时，只需改：
#   ai.base-url=https://open.bigmodel.cn/api/paas/v4  ai.model=glm-4.7-flash
#   快模型用硅基流动千问：ai.fast-model=Qwen/Qwen2.5-7B-Instruct
#     + ai.fast-base-url=https://api.siliconflow.cn/v1 + ai.fast-api-key=<硅基流动 Key>
#   ai.embed-base-url=https://api.siliconflow.cn/v1
#   ai.embed-api-key=<硅基流动 Key>  ai.embedding-model=BAAI/bge-m3
ai.base-url=https://api.siliconflow.cn/v1
ai.api-key=your-api-key
ai.model=Qwen/Qwen2.5-7B-Instruct
ai.fast-model=Qwen/Qwen2.5-7B-Instruct
ai.fast-base-url=${AI_FAST_BASE_URL:}
ai.fast-api-key=${AI_FAST_API_KEY:}
ai.embedding-model=BAAI/bge-m3
ai.embed-base-url=${AI_EMBED_BASE_URL:}
ai.embed-api-key=${AI_EMBED_API_KEY:}
# AI 调用超时/重试/熔断
ai.connect-timeout=10000
ai.read-timeout=30000
ai.max-retries=1
ai.circuit.failure-threshold=5
ai.circuit.open-duration=30000
# 两次上游请求的最小间隔（毫秒）：仅用于削峰，过高会直接叠加到每轮对话的首字延迟
ai.min-interval-ms=${AI_MIN_INTERVAL_MS:100}

# PPT 配图：默认 Pollinations 新 API（吃参考图，人物跨页一致，按张扣 pollen）。
# 切回免费替代：改 PptImageService 里的 IMAGE_PROVIDER 一处（KOLORS / BIGMODEL 代码保留）。
# 留空即由 service 按 provider 选默认 endpoint / model；需要覆盖再用环境变量。
ai.image-base-url=${AI_IMAGE_BASE_URL:}
ai.image-api-key=${AI_IMAGE_API_KEY:}
ai.image-model=${AI_IMAGE_MODEL:}
ai.image-size=${AI_IMAGE_SIZE:1344x768}
ai.image-read-timeout=${AI_IMAGE_READ_TIMEOUT:60000}
# 参考图：公网 URL 优先；否则读本地文件转 base64（两者都没配就走纯文生图）
ai.image-reference-url=${AI_IMAGE_REFERENCE_URL:}
ai.image-reference-path=${AI_IMAGE_REFERENCE_PATH:}
# 同课件多页共用种子，配合参考图进一步压低漂移；0 = 随机
ai.image-seed=${AI_IMAGE_SEED:0}

# JWT ??
jwt.secret=${JWT_SECRET:CHANGE_ME_JWT_SECRET_32_BYTES_MINIMUM}
jwt.expiration=2592000000

# Actuator & Prometheus ??
management.endpoints.web.exposure.include=health,info,prometheus,metrics
management.endpoint.health.show-details=always
management.prometheus.metrics.export.enabled=true

# RAG \u68c0\u7d22\u53c2\u6570\uff08P2 \u65b0\u589e\uff09
# \u76f8\u4f3c\u5ea6\u9608\u503c\uff1a\u4f4e\u4e8e\u8be5\u503c\u7684\u8bb0\u5fc6\u4e0d\u53c2\u4e0e\u6392\u5e8f\uff08\u9ed8\u8ba4 0.3\uff09
rag.similarity-threshold=0.3
# \u65f6\u95f4\u8870\u51cf\u53c2\u6570 \u03c4\uff08\u5929\uff09\uff1aexp(-\u0394t/\u03c4)\uff08\u9ed8\u8ba4 30 \u5929\uff09
rag.decay-tau-days=30
# \u5206\u6e90\u914d\u989d\uff1amemory / diary / lore \u5360\u6bd4\uff08\u9ed8\u8ba4 0.4 / 0.4 / 0.2\uff09
rag.quota.memory=0.4
rag.quota.diary=0.4
rag.quota.lore=0.2
# RAG recall candidate limits (previously hard-coded; defaults keep legacy behavior)
rag.recall.memory=200
rag.recall.diary=300
rag.recall.lore=500

# 文章读缓存 fail-open（Redis 故障时回源数据库；仅用于读缓存，鉴权/限流不适用）
blog.cache.enabled=${BLOG_CACHE_ENABLED:true}
blog.cache.redis-timeout-ms=${BLOG_CACHE_REDIS_TIMEOUT_MS:300}
blog.cache.failure-threshold=${BLOG_CACHE_FAILURE_THRESHOLD:3}
blog.cache.open-duration-ms=${BLOG_CACHE_OPEN_DURATION_MS:30000}
