#server
server.port= 8888
spring.application.name=mszlu_blog
spring.profiles.active=dev
# datasource
spring.datasource.url=jdbc:mysql://localhost:3306/blog?useUnicode=true&characterEncoding=UTF-8&serverTimeZone=UTC
spring.datasource.username=root
spring.datasource.password=1234
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

#mybatis-plus
mybatis-plus.configuration.log-impl=org.apache.ibatis.logging.stdout.StdOutImpl
mybatis-plus.global-config.db-config.table-prefix=ms_
mybatis-plus.mapper-locations=classpath*:com.mszlu.blog.dao.mapper/**/*.xml
## ?????????
spring.servlet.multipart.max-request-size=20MB
## ????????
spring.servlet.multipart.max-file-size=8MB
## ?????
qiniu.accessKey=your-access-key
qiniu.accessSecretKey=your-secret-key

# SiliconFlow ???/OpenAI ??????
ai.base-url=https://api.siliconflow.cn/v1
ai.api-key=your-api-key
ai.model=Qwen/Qwen2.5-7B-Instruct
ai.embedding-model=BAAI/bge-m3
# AI 调用超时/重试/熔断
ai.connect-timeout=10000
ai.read-timeout=30000
ai.max-retries=1
ai.circuit.failure-threshold=5
ai.circuit.open-duration=30000

# JWT ??
jwt.secret=${JWT_SECRET:MszluBlogJwtSecretKey2026AbcXyz789}
jwt.expiration=2592000000

# Actuator & Prometheus ??
management.endpoints.web.exposure.include=health,info,prometheus,metrics
management.endpoint.health.show-details=always
management.prometheus.metrics.export.enabled=true

# RAG \u68c0\u7d22\u53c2\u6570\uff08P2 \u65b0\u589e\uff09
# \u76f8\u4f3c\u5ea6\u9608\u503c\uff1a\u4f4e\u4e8e\u8be5\u503c\u7684\u8bb0\u5fc6\u4e0d\u53c2\u4e0e\u6392\u5e8f\uff08\u9ed8\u8ba4 0.3\uff09
rag.similarity-threshold=0.3
# \u65f6\u95f4\u8870\u51cf\u53c2\u6570 \u03c4\uff08\u5929\uff09\uff1aexp(-\u0394t/\u03c4)\uff08\u9ed8\u8ba4 30 \u5929\uff09
rag.decay-tau-days=30
# \u5206\u6e90\u914d\u989d\uff1amemory / diary / lore \u5360\u6bd4\uff08\u9ed8\u8ba4 0.4 / 0.4 / 0.2\uff09
rag.quota.memory=0.4
rag.quota.diary=0.4
rag.quota.lore=0.2

# 文章读缓存 fail-open（Redis 故障时回源数据库；仅用于读缓存，鉴权/限流不适用）
blog.cache.enabled=${BLOG_CACHE_ENABLED:true}
blog.cache.redis-timeout-ms=${BLOG_CACHE_REDIS_TIMEOUT_MS:300}
blog.cache.failure-threshold=${BLOG_CACHE_FAILURE_THRESHOLD:3}
blog.cache.open-duration-ms=${BLOG_CACHE_OPEN_DURATION_MS:30000}
