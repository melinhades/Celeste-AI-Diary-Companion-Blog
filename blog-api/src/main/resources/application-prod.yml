server:
  port: 8888
  servlet:
    context-path: /
  # 安全头配置
  headers:
    x-content-type-options: nosniff
    x-frame-options: DENY
    x-xss-protection: "1; mode=block"

spring:
  application:
    name: mszlu_blog
  profiles:
    active: prod
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/blog?useUnicode=true&characterEncoding=UTF-8&serverTimezone=UTC&useSSL=false&allowPublicKeyRetrieval=true
    username: ${MYSQL_USERNAME:root}
    password: ${MYSQL_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
    # HikariCP 连接池调优（生产环境建议值）
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      idle-timeout: 300000
      max-lifetime: 1200000
      connection-timeout: 30000
      pool-name: BlogHikariCP
  servlet:
    multipart:
      max-request-size: 20MB
      max-file-size: 8MB
  redis:
    host: ${REDIS_HOST:localhost}
    port: ${REDIS_PORT:6379}
    password: ${REDIS_PASSWORD:}
    database: 0
    lettuce:
      pool:
        max-active: 20
        max-idle: 10
        min-idle: 2
        max-wait: 2000ms
    timeout: 3000ms
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: GMT+8

mybatis-plus:
  configuration:
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl  # 生产环境用 SLF4J 而非 StdOut
    map-underscore-to-camel-case: true
    cache-enabled: true
  global-config:
    db-config:
      table-prefix: ms_
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0
  mapper-locations: classpath*:com/mszlu/blog/dao/mapper/**/*.xml

# JWT 配置 - 生产环境必须通过环境变量注入强密钥
jwt:
  secret: ${JWT_SECRET:}
  expiration: 2592000000  # 30天，单位毫秒

# 七牛云配置
qiniu:
  accessKey: ${QINIU_ACCESS_KEY:}
  accessSecretKey: ${QINIU_SECRET_KEY:}

# SiliconFlow 大模型配置
ai:
  base-url: ${AI_BASE_URL:https://api.siliconflow.cn/v1}
  api-key: ${AI_API_KEY:}
  model: ${AI_MODEL:THUDM/GLM-4-9B-0414}
  embedding-model: ${AI_EMBEDDING_MODEL:BAAI/bge-m3}

# Actuator & Prometheus 监控
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
      base-path: /actuator
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
  prometheus:
    metrics:
      export:
        enabled: true
  health:
    db:
      enabled: true
    redis:
      enabled: true

# 日志配置
logging:
  level:
    root: INFO
    com.mszlu.blog: INFO
    org.springframework.web: WARN
    org.hibernate.SQL: WARN
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"
  file:
    name: logs/blog-api.log
    max-size: 100MB
    max-history: 30

# 关闭 Swagger/OpenAPI 文档（生产环境安全考虑）
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false