server:
  port: 8888
  servlet:
    context-path: /
  # 安全头配置
  headers:
    x-content-type-options: nosniff
    x-frame-options: DENY
    x-xss-protection: "1; mode=block"

spring:
  application:
    name: mszlu_blog
  # 注意：profile 专属文件（application-prod.yml）里禁止声明 spring.profiles.active，
  # 否则启动抛 InvalidConfigDataPropertyException；prod 由环境变量 SPRING_PROFILES_ACTIVE 激活
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/blog?useUnicode=true&characterEncoding=UTF-8&serverTimezone=UTC&useSSL=false&allowPublicKeyRetrieval=true
    username: ${MYSQL_USERNAME:root}
    password: ${MYSQL_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
    # HikariCP 连接池调优（生产环境建议值）
    # TiDB Cloud Serverless 会在连接空闲 60s 后强制断开，
    # 用 keepalive-time 30s 主动探活避免取到死连接（否则每次请求要重连，接口慢 3s+）
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      keepalive-time: 30000
      idle-timeout: 60000
      max-lifetime: 600000
      connection-timeout: 30000
      pool-name: BlogHikariCP
  servlet:
    multipart:
      max-request-size: 20MB
      max-file-size: 8MB
  # Boot 3 起 Redis 配置从 spring.redis 迁移到 spring.data.redis
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      # Upstash 的 6379 强制 TLS，明文连接会被服务端直接断开；自建 Redis 可用 REDIS_SSL=false 关闭
      ssl:
        enabled: ${REDIS_SSL:true}
      database: 0
      lettuce:
        pool:
          max-active: 20
          max-idle: 10
          min-idle: 2
          max-wait: 2000ms
      timeout: 3000ms
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: GMT+8

mybatis-plus:
  configuration:
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl  # 生产环境用 SLF4J 而非 StdOut
    map-underscore-to-camel-case: true
    cache-enabled: true
  global-config:
    db-config:
      table-prefix: ms_
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0
  mapper-locations: classpath*:com/mszlu/blog/dao/mapper/**/*.xml

# JWT 配置 - 生产环境建议通过环境变量注入强密钥；此处给非空默认值兜底，
# 避免 JWT_SECRET 未配置时空密钥导致 hmacShaKeyFor 抛 WeakKeyException（登录报“系统异常”）
jwt:
  secret: ${JWT_SECRET:CHANGE_ME_JWT_SECRET_32_BYTES_MINIMUM}
  expiration: 2592000000  # 30天，单位毫秒

# Cloudflare R2 图片存储（S3 兼容）；默认关闭，关闭或配置不全时图片自动回退存数据库
# 启用：部署时设 R2_ENABLED=true 并注入 R2_ENDPOINT / R2_BUCKET / R2_ACCESS_KEY_ID / R2_SECRET_ACCESS_KEY
r2:
  enabled: ${R2_ENABLED:false}
  endpoint: ${R2_ENDPOINT:}
  bucket: ${R2_BUCKET:}
  access-key-id: ${R2_ACCESS_KEY_ID:}
  secret-access-key: ${R2_SECRET_ACCESS_KEY:}
  region: ${R2_REGION:auto}
  key-prefix: ${R2_KEY_PREFIX:images/}

# 大模型配置（OpenAI 兼容协议）
# 切模型的最小变量集（只需改环境变量，不用改代码）：
#   主对话：AI_BASE_URL / AI_API_KEY / AI_MODEL
#   快模型：AI_FAST_MODEL / AI_FAST_BASE_URL / AI_FAST_API_KEY（情绪抽取、意图分类等前处理）
#   向量：AI_EMBED_BASE_URL / AI_EMBED_API_KEY / AI_EMBEDDING_MODEL
# 说明：AI_EMBED_BASE_URL 为空时回落 AI_BASE_URL；AI_EMBED_API_KEY 为空时保持原逻辑
#       （用户自带 Key 优先，DeepSeek 用户无 embeddings 时回落系统 Key）
#       AI_FAST_BASE_URL 为空时快模型走原主对话逻辑；非空时只有 model == ai.fast-model 才走
#       fast base + fast Key（BYOK 用户 Key 不能用于快模型服务商，fast Key 为空则回落系统主 Key）
# 切到 智谱 GLM-4.7-Flash + 硅基流动 bge-m3 时，只需设：
#   AI_BASE_URL=https://open.bigmodel.cn/api/paas/v4  AI_MODEL=glm-4.7-flash
#   快模型用硅基流动千问：AI_FAST_MODEL=Qwen/Qwen2.5-7B-Instruct
#     + AI_FAST_BASE_URL=https://api.siliconflow.cn/v1 + AI_FAST_API_KEY=<硅基流动 Key>
#   AI_EMBED_BASE_URL=https://api.siliconflow.cn/v1
#   AI_EMBED_API_KEY=<硅基流动 Key>  AI_EMBEDDING_MODEL=BAAI/bge-m3
ai:
  base-url: ${AI_BASE_URL:https://api.siliconflow.cn/v1}
  api-key: ${AI_API_KEY:}
  model: ${AI_MODEL:Qwen/Qwen2.5-7B-Instruct}
  fast-model: ${AI_FAST_MODEL:Qwen/Qwen2.5-7B-Instruct}
  fast-base-url: ${AI_FAST_BASE_URL:}
  fast-api-key: ${AI_FAST_API_KEY:}
  embedding-model: ${AI_EMBEDDING_MODEL:BAAI/bge-m3}
  embed-base-url: ${AI_EMBED_BASE_URL:}
  embed-api-key: ${AI_EMBED_API_KEY:}
  # PPT 配图：默认硅基流动 Kolors；Key 复用 AI_FAST_API_KEY（硅基流动），也可用 AI_IMAGE_API_KEY 显式覆盖
  image-base-url: ${AI_IMAGE_BASE_URL:https://api.siliconflow.cn/v1}
  image-api-key: ${AI_IMAGE_API_KEY:}
  image-model: ${AI_IMAGE_MODEL:Kwai-Kolors/Kolors}
  image-size: ${AI_IMAGE_SIZE:1344x768}
  image-read-timeout: ${AI_IMAGE_READ_TIMEOUT:60000}

# Madeline 情绪分析 v2 — 消融实验开关（全部默认为 true，置 false 即关闭对应子模块）
# 消融实验流程：依次把每个开关置 false，跑相同 100 条输入，记录 Judge 评分变化
emotion:
  ablation:
    disable-embed: false       # 关闭 AiClient.embed 交叉验证
    disable-trajectory: false  # 关闭打字轨迹侧分析
    disable-trend: false       # 关闭跨日记趋势
    disable-fusion: false      # 关闭自适应融合（退回 0.7/0.3 固定权重）
    disable-text: false        # 关闭 Plutchik AI 分析（退回关键词兜底）

# Actuator & Prometheus 监控
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
      base-path: /actuator
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
  prometheus:
    metrics:
      export:
        enabled: true
  health:
    db:
      enabled: true
    redis:
      enabled: true

# 日志配置
logging:
  level:
    root: INFO
    com.mszlu.blog: INFO
    org.springframework.web: WARN
    org.hibernate.SQL: WARN
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"
  file:
    name: logs/blog-api.log
    max-size: 100MB
    max-history: 30

# 关闭 Swagger/OpenAPI 文档（生产环境安全考虑）
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false